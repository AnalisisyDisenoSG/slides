<h2 id="%C2%BFpor-qu%C3%A9-empezar-por-la-visi%C3%B3n">¿Por qué empezar por la visión?</h2>
<steps>
<step>
<ul>
<li>Todo proyecto arranca con una <strong>idea difusa</strong>: alguien cree que hace falta un sistema</li>
<li>Si esa idea no se escribe, cada persona del equipo construye <strong>su propia versión</strong> del proyecto en la cabeza</li>
<li>La <strong>visión</strong> es el acuerdo explícito sobre <em>qué vamos a construir y por qué</em></li>
</ul>
</step>
<step>
<h3 id="la-visi%C3%B3n-responde-tres-preguntas">La visión responde tres preguntas</h3>

<h2 id="el-documento-visi%C3%B3n">El documento Visión</h2>
<ul>
<li>Artefacto que <strong>recolecta, analiza y define</strong> las necesidades y características de <strong>alto nivel</strong> del sistema</li>
<li>Se ubica en el nivel de abstracción <strong>Problema del Negocio</strong> → es la entrada de la especificación</li>
</ul>
<split-slide style="--left: 52%; --right: 48%;">
<div>
<h3 id="%E2%9C%85-qu%C3%A9-s%C3%AD-lleva"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Qué sí lleva</h3>
<ul>
<li>El <strong>por qué</strong> existen esas necesidades</li>
<li>Capacidades <strong>generales</strong>, sin entrar en diseño</li>
<li><strong>Prioridad</strong> de cada necesidad</li>
<li>Restricciones y atributos de calidad</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%9A%AB-qu%C3%A9-no-lleva"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Qué no lleva</h3>
<ul>
<li><strong>Diseño</strong>: pantallas, tablas, clases, endpoints</li>
<li>El <strong>cómo</strong> se implementa cada característica</li>
<li>Requerimientos detallados → esos van en los <strong>casos de uso</strong> y la especificación suplementaria</li>
</ul>
</div>
</split-slide>
<blockquote>
<p>Regla de oro: si al leer una línea sabes <em>cómo</em> se programa, esa línea no va en la visión</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">

<div class="grid">
<div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="sentencia-del-problema">Sentencia del problema</h2>

<li>Formato de la plantilla → obliga a separar <strong>problema</strong>, <strong>afectados</strong>, <strong>impacto</strong> y <strong>beneficio</strong></li>

<table>
<thead>

<th style="text-align:left">Componente</th>

<td style="text-align:left"><em>[personas interesadas afectadas]</em></td>

<tr>
<td style="text-align:left"><strong>el impacto del cual es</strong></td>

</table>
<ul>

</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="declaraci%C3%B3n-de-posici%C3%B3n-del-producto">Declaración de posición del producto</h2>

<split-slide style="--left: 48%; --right: 52%;">
<div>
<h3 id="plantilla">Plantilla</h3>

<li><strong>el</strong> <em>[nombre del producto]</em></li>
<li><strong>es un</strong> <em>[categoría de producto]</em></li>
<li><strong>que</strong> <em>[beneficio clave]</em></li>
<li><strong>A diferencia de</strong> <em>[alternativa actual]</em></li>

</blockquote>
</div>
</split-slide>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="restricciones-y-atributos-de-calidad">Restricciones y atributos de calidad</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%94%92-restricciones"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f512.svg" data-marp-twemoji=""/> Restricciones</h3>
<p>Factores que <strong>limitan</strong> las características, no se negocian</p>
<ul>
<li>De <strong>diseño</strong>: debe integrarse con el sistema institucional existente</li>
<li><strong>Externas</strong>: normativa de protección de datos personales</li>
<li>De <strong>plataforma</strong>: la infraestructura la define el Centro de Informática</li>
<li>De <strong>dependencias</strong>: requiere el padrón oficial de estudiantes</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%93%8A-atributos-de-calidad"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4ca.svg" data-marp-twemoji=""/> Atributos de calidad</h3>
<p>Los <strong>requerimientos no funcionales</strong> que ya conoces</p>
<ul>
<li><strong>Performance</strong>: respuesta &lt; 2 s en horas pico de matrícula</li>
<li><strong>Disponibilidad</strong>: 99,5 % durante la semana de matrícula</li>
<li><strong>Seguridad</strong>: solo la persona docente titular modifica su lista</li>
<li><strong>Escalabilidad</strong>: soportar 3 000 estudiantes concurrentes</li>
</ul>
</div>
</split-slide>
<blockquote>
<p>Un atributo de calidad sin <strong>número</strong> no es verificable: «debe ser rápido» no es un requerimiento</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="errores-comunes-al-escribir-la-visi%C3%B3n">Errores comunes al escribir la visión</h2>
<steps>
<step>
<h3 id="%F0%9F%9A%AB-errores-de-contenido"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Errores de contenido</h3>
<ul>
<li><strong>Colar diseño</strong>: «la pantalla tendrá tres pestañas» → eso es diseño, no visión</li>
<li>Confundir <strong>necesidad</strong> con <strong>característica</strong>: la necesidad es del negocio, la característica es del producto</li>
<li>Listar <strong>todo como prioridad Alta</strong> → si todo es prioritario, nada lo es</li>
<li>Atributos de calidad <strong>sin métrica</strong></li>
</ul>
</step>
<step>
<h3 id="%F0%9F%9A%AB-errores-de-proceso"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Errores de proceso</h3>
<ul>
<li>Escribirla <strong>una sola vez</strong> y no volver a tocarla → la visión es un documento <strong>vivo</strong></li>
<li>Redactarla <strong>sin las personas interesadas</strong>, solo con el equipo técnico</li>
<li>Olvidar a quien <strong>paga</strong> o <strong>aprueba</strong> el proyecto</li>
<li>No dejar <strong>trazabilidad</strong> hacia los casos de uso → luego nadie sabe de dónde salió un requerimiento</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="actividad-1-escribe-una-visi%C3%B3n">Actividad 1: escribe una visión</h2>
<ul>
<li>En grupos, tomen un sistema que conozcan (Ematrícula, la soda de la U, la biblioteca...) y redacten:</li>
</ul>
<div class="grid">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-posicionamiento"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Posicionamiento</h3>
<ul>
<li>Oportunidad de negocio (cuantificada)</li>
<li>Sentencia del problema con el formato de la plantilla</li>
</ul>
</div>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-personas-interesadas"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Personas interesadas</h3>
<ul>
<li>Al menos <strong>4</strong>, distinguiendo <em>Usuario</em> de <em>Stakeholder</em></li>
</ul>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-necesidades"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Necesidades</h3>
<ul>
<li><strong>3 necesidades</strong> (STR) con prioridad</li>
<li><strong>1 o 2 características</strong> (FEA) por necesidad</li>
</ul>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/23f1.svg" data-marp-twemoji=""/> 20 minutos · Al final, intercambien con otro grupo y busquen <strong>diseño colado</strong> en la visión ajena</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-YXtQCUjy="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="16" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="67">
<h1 id="an%C3%A1lisis-de-sistemas">Análisis de sistemas</h1>
<h2 id="contenidos-2">Contenidos</h2>
<ul>
<li>¿Qué es analizar un sistema?</li>
<li>Análisis vs. diseño</li>
<li>El diagrama de contexto del sistema</li>
<li>Notación informal y ejemplos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="%C2%BFqu%C3%A9-es-el-an%C3%A1lisis-de-sistemas">¿Qué es el análisis de sistemas?</h2>
<ul>
<li>Técnica de <strong>resolución de problemas</strong> que <em>descompone</em> un sistema en sus partes, con el propósito de estudiar <strong>qué tan bien funcionan e interactúan</strong> esas partes para cumplir su propósito</li>
</ul>
<steps>
<step>
<ul>
<li>Es un estudio del <strong>dominio del problema</strong> que produce:
<ul>
<li><strong>Recomendaciones</strong> de mejora</li>
<li>Los <strong>requerimientos</strong> y sus <strong>prioridades</strong> para una solución</li>
</ul>
</li>
<li>La palabra clave es <strong>descomponer</strong> → el mismo concepto que ya viste: dividir para poder entender</li>
</ul>
</step>
<step>
<h3 id="el-par-an%C3%A1lisis%E2%80%93s%C3%ADntesis">El par análisis–síntesis</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%94%AC-an%C3%A1lisis"><img class="emoji" draggable="false" alt="🔬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f52c.svg" data-marp-twemoji=""/> Análisis</h3>
<p><strong>Descompone</strong> el problema en partes para entenderlo</p>
<p>Dominio del <strong>problema</strong></p>
</div>
<div>
<h3 id="%F0%9F%8F%97%EF%B8%8F-s%C3%ADntesis-dise%C3%B1o"><img class="emoji" draggable="false" alt="🏗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3d7.svg" data-marp-twemoji=""/> Síntesis (diseño)</h3>
<p><strong>Ensambla</strong> las partes en una solución que funciona</p>
<p>Dominio de la <strong>solución</strong></p>
</div>
</div>
<ul>
<li>No se puede sintetizar bien lo que no se analizó bien</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="an%C3%A1lisis-vs-dise%C3%B1o">Análisis vs. diseño</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%94%8D-an%C3%A1lisis-%E2%86%92-el-qu%C3%A9"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50d.svg" data-marp-twemoji=""/> Análisis → el <strong>QUÉ</strong></h3>
<ul>
<li>¿Qué problema hay que resolver?</li>
<li>¿Qué debe <strong>hacer</strong> el sistema?</li>
<li>¿Cuáles son sus <strong>límites</strong>?</li>
<li>¿Quién interactúa con él?</li>
<li>Modelos <strong>lógicos</strong>, independientes de la tecnología</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8F%97%EF%B8%8F-dise%C3%B1o-%E2%86%92-el-c%C3%B3mo"><img class="emoji" draggable="false" alt="🏗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3d7.svg" data-marp-twemoji=""/> Diseño → el <strong>CÓMO</strong></h3>
<ul>
<li>¿Cómo se estructura la solución?</li>
<li>¿Qué componentes, clases y tablas?</li>
<li>¿Qué tecnología, plataforma y despliegue?</li>
<li>Modelos <strong>físicos</strong>, atados a la tecnología</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> El error clásico: <strong>saltar al cómo</strong> antes de haber acordado el qué</li>
<li>Síntoma típico: el equipo discute el <em>framework</em> antes de saber quién usa el sistema</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="%C2%BFqu%C3%A9-produce-el-an%C3%A1lisis">¿Qué produce el análisis?</h2>
<ul>
<li>El análisis no produce código: produce <strong>modelos y acuerdos</strong></li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Pregunta</th>
<th style="text-align:left">Modelo / artefacto</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">¿Dónde están los <strong>límites</strong> del sistema?</td>
<td style="text-align:left"><strong>Diagrama de contexto</strong></td>
</tr>
<tr>
<td style="text-align:left">¿Qué <strong>hace</strong> el sistema y para quién?</td>
<td style="text-align:left">Casos de uso · Diagrama de casos de uso</td>
</tr>
<tr>
<td style="text-align:left">¿Qué <strong>procesos</strong> transforman la información?</td>
<td style="text-align:left">Diagramas de flujo de datos (DFD)</td>
</tr>
<tr>
<td style="text-align:left">¿Qué <strong>información</strong> maneja el negocio?</td>
<td style="text-align:left">Modelo de dominio · Diagrama entidad-relación</td>
</tr>
<tr>
<td style="text-align:left">¿Cómo <strong>fluye</strong> el trabajo entre las personas?</td>
<td style="text-align:left">Diagrama de actividades</td>
</tr>
<tr>
<td style="text-align:left">¿Qué <strong>reglas</strong> aplican?</td>
<td style="text-align:left">Modelado de lógica · Reglas de negocio</td>
</tr>
<tr>
<td style="text-align:left">¿Cuál alternativa <strong>conviene</strong>?</td>
<td style="text-align:left">Análisis de factibilidad · Propuesta de sistema</td>
</tr>
</tbody>
</table>
<ul>
<li>Todos son <strong>niveles de abstracción</strong> del mismo problema, y entre ellos hay <strong>trazabilidad</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-ID4h8miX="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="20" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="67">
<h1 id="diagrama-de-contexto-del-sistema">Diagrama de contexto del sistema</h1>
<h2 id="contenidos-3">Contenidos</h2>
<ul>
<li>¿Qué es y qué contiene?</li>
<li>Notación informal</li>
<li>Ejemplos y errores comunes</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="diagrama-de-contexto-del-sistema-dcs">Diagrama de Contexto del Sistema (DCS)</h2>
<ul>
<li>De acuerdo con Clements et al. (2011) y Valacich &amp; George (2017):</li>
</ul>
<blockquote>
<p>El diagrama de contexto define el <strong>límite</strong> (<em>boundary</em>) entre un sistema —o la parte del sistema bajo consideración— y su <strong>ambiente</strong>, al mostrar las <strong>entidades</strong> con las cuales interactúa y los <strong>flujos principales de información</strong> entre el sistema y esas entidades</p>
</blockquote>
<div class="grid">
<div>
<h3 id="%F0%9F%8E%AF-es-un-artefacto-fundamental"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> Es un artefacto fundamental</h3>
<p>Forma parte de la <strong>arquitectura de software</strong> del sistema</p>
</div>
<div>
<h3 id="%F0%9F%93%A6-el-sistema-es-una-caja-negra"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4e6.svg" data-marp-twemoji=""/> El sistema es una caja negra</h3>
<p>En el DCS <strong>no</strong> nos interesa lo que hay dentro, sino qué entra y qué sale</p>
</div>
</div>
<ul>
<li>Es la respuesta gráfica a la pregunta: <strong>¿qué es parte de mi sistema y qué no lo es?</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="ejemplo-sistema-de-toma-de-%C3%B3rdenes">Ejemplo: sistema de toma de órdenes</h2>
<p><a href="../assets/ads-dcs-hoosier.png"><img src="../assets/ads-dcs-hoosier.png" alt="" style="height:400px;" /></a></p>
<blockquote>
<p>Diagrama de contexto del sistema de toma de órdenes de comida de <em>Hoosier Burger's</em>. Tomado de Valacich &amp; George (2017)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="contenidos-de-un-diagrama-de-contexto">Contenidos de un diagrama de contexto</h2>
<div class="grid">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-el-sistema-de-inter%C3%A9s"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> El sistema de interés</h3>
<p>El sistema —o la parte de interés— representado como una <strong>caja negra</strong>, con un nombre claro</p>
</div>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-entidades-externas"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Entidades externas</h3>
<p><strong>Personas</strong>, otros <strong>sistemas</strong> o aplicaciones, y <strong>objetos físicos</strong> como sensores o dispositivos de control</p>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-relaciones"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Relaciones</h3>
<p>Los <strong>flujos</strong> entre el sistema y cada entidad externa, <strong>etiquetados</strong> con la información que viaja</p>
</div>
<div>
<h3 id="4%EF%B8%8F%E2%83%A3-notaci%C3%B3n"><img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/34-20e3.svg" data-marp-twemoji=""/> Notación</h3>
<p>El <strong>detalle de la notación gráfica</strong> utilizada → una leyenda, si la notación no es estándar</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Un solo nivel, una sola página: si necesitas más, ya estás <strong>descomponiendo</strong> (eso es un DFD nivel 0)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="%C2%BFpara-qu%C3%A9-sirve-un-diagrama-de-contexto">¿Para qué sirve un diagrama de contexto?</h2>
<steps>
<step>
<ul>
<li>El beneficio central: <strong>clarifica qué partes de la solución total serán desarrolladas</strong> por el equipo</li>
<li>Todo lo que queda <strong>fuera</strong> de la caja es algo que hay que <strong>integrar</strong>, no construir</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> ¿Qué otras ventajas o beneficios se te ocurren?</li>
</ul>
</step>
<step>
<h3 id="otros-beneficios">Otros beneficios</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%A4%9D-alinea-al-equipo"><img class="emoji" draggable="false" alt="🤝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f91d.svg" data-marp-twemoji=""/> Alinea al equipo</h3>
<p>Una sola figura que <strong>todo el mundo</strong> entiende, técnicos y no técnicos</p>
</div>
<div>
<h3 id="%F0%9F%94%97-revela-integraciones"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f517.svg" data-marp-twemoji=""/> Revela integraciones</h3>
<p>Cada entidad externa es una <strong>interfaz</strong> que hay que negociar y probar</p>
</div>
<div>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-controla-el-alcance"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6e1.svg" data-marp-twemoji=""/> Controla el alcance</h3>
<p>Sirve de referencia contra el <em><strong>scope creep</strong></em>: «eso está fuera de la caja»</p>
</div>
<div>
<h3 id="%F0%9F%92%B0-alimenta-la-factibilidad"><img class="emoji" draggable="false" alt="💰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4b0.svg" data-marp-twemoji=""/> Alimenta la factibilidad</h3>
<p>Cuantas más entidades externas, mayor el <strong>riesgo técnico</strong> del proyecto</p>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="notaci%C3%B3n-informal-1-de-4-control-automotor">Notación informal (1 de 4): control automotor</h2>
<p><a href="../assets/ads-dcs-informal-auto.png"><img src="../assets/ads-dcs-informal-auto.png" alt="" style="height:420px;" /></a></p>
<blockquote>
<p>El sistema de software cuyo contexto se define reside en <strong>«el ECU»</strong>, la caja etiquetada del lado izquierdo</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="notaci%C3%B3n-informal-2-de-4-sistema-de-compras-home">Notación informal (2 de 4): sistema de compras HOME</h2>
<p><a href="../assets/ads-dcs-informal-home.png"><img src="../assets/ads-dcs-informal-home.png" alt="" style="height:400px;" /></a></p>
<ul>
<li>Aquí las entidades externas son de <strong>tres tipos</strong>: personas, sistemas y dispositivos (el kiosco en tienda)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="notaci%C3%B3n-informal-3-de-4-aplicaci%C3%B3n-bancaria">Notación informal (3 de 4): aplicación bancaria</h2>
<p><a href="../assets/ads-dcs-informal-banco.png"><img src="../assets/ads-dcs-informal-banco.png" alt="" style="height:430px;" /></a></p>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> ¿Cuántas <strong>integraciones</strong> tendría que construir el equipo de este sistema?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="notaci%C3%B3n-informal-4-de-4-notaci%C3%B3n-gane-sarson">Notación informal (4 de 4): notación Gane-Sarson</h2>
<p><a href="../assets/ads-dcs-clements-cc.png"><img src="../assets/ads-dcs-clements-cc.png" alt="" style="height:420px;" /></a></p>
<blockquote>
<p>Diagrama de contexto de C&amp;C. Tomado de Clements et al. (2011) — nótese la <strong>leyenda de notación</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="errores-comunes-en-un-diagrama-de-contexto">Errores comunes en un diagrama de contexto</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%9A%AB-abrir-la-caja-negra"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Abrir la caja negra</h3>
<p>Dibujar módulos internos, capas o tablas → eso es <strong>diseño</strong>, no contexto</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-flujos-sin-etiqueta"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Flujos sin etiqueta</h3>
<p>Una flecha sin nombre no dice <strong>qué información</strong> viaja</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-confundir-entidad-con-funci%C3%B3n"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Confundir entidad con función</h3>
<p>«Reportes» no es una entidad externa; la <strong>Gerencia</strong> sí lo es</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-olvidar-los-sistemas-externos"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Olvidar los sistemas externos</h3>
<p>Las entidades externas <strong>no</strong> son solo personas</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-notaci%C3%B3n-sin-leyenda"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Notación sin leyenda</h3>
<p>Si inventas símbolos, <strong>documéntalos</strong></p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-meter-todo-el-negocio"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Meter todo el negocio</h3>
<p>El límite es el del <strong>sistema</strong>, no el de la organización</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="actividad-2-construye-un-diagrama-de-contexto">Actividad 2: construye un diagrama de contexto</h2>
<ul>
<li>Retomen el sistema de la Actividad 1 y dibujen su diagrama de contexto</li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="pasos">Pasos</h3>
<ol>
<li>Nombren el <strong>sistema</strong> y dibújenlo como una caja</li>
<li>Listen las <strong>entidades externas</strong>: personas, sistemas, dispositivos</li>
<li>Dibujen y <strong>etiqueten</strong> cada flujo de información</li>
<li>Agreguen una <strong>leyenda</strong> de notación</li>
</ol>
</div>
<div>
<h3 id="preguntas-de-control">Preguntas de control</h3>
<ul>
<li>¿Alguna entidad externa es en realidad <strong>parte</strong> del sistema?</li>
<li>¿Hay flujos <strong>sin etiqueta</strong>?</li>
<li>¿Cuántas integraciones implica el diagrama?</li>
<li>¿Qué quedó <strong>fuera</strong> a propósito?</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/23f1.svg" data-marp-twemoji=""/> 15 minutos · Compárenlo con la sentencia del problema: <strong>¿son consistentes?</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-scope-P8U2Eiqd="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="31" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="67">
<h1 id="fases-del-an%C3%A1lisis-de-sistemas">Fases del análisis de sistemas</h1>
<h2 id="contenidos-4">Contenidos</h2>
<ul>
<li>Ubicación del análisis en el ciclo de vida</li>
<li>Las cinco fases del análisis</li>
<li>Otra forma de agruparlas</li>
<li>Técnicas de recolección</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="%C2%BFd%C3%B3nde-vive-el-an%C3%A1lisis-en-el-ciclo-de-vida">¿Dónde vive el análisis en el ciclo de vida?</h2>
<split-slide style="--left: 45%; --right: 55%;">
<p><img src="../assets/ads-sdlc-fases.jpg" alt="contain" style="width:520px;" /></p>
<div>
<ul>
<li>Del ciclo de vida que ya conoces (Kendall &amp; Kendall), el <strong>análisis</strong> abarca las fases <strong>1 a 3</strong>:
<ol>
<li>Identificación de problemas, oportunidades y objetivos</li>
<li>Determinación de los requerimientos de información</li>
<li>Análisis de las necesidades del sistema</li>
</ol>
</li>
</ul>
<br />
<ul>
<li>Whitten &amp; Bentley descomponen ese bloque en <strong>cinco fases</strong> más finas, que son las que veremos ahora</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="las-cinco-fases-del-an%C3%A1lisis-de-sistemas">Las cinco fases del análisis de sistemas</h2>
<table>
<thead>
<tr>
<th style="text-align:left">#</th>
<th style="text-align:left">Fase</th>
<th style="text-align:left">Pregunta que responde</th>
<th style="text-align:left">Entregable</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">1</td>
<td style="text-align:left"><strong>Definición del alcance</strong></td>
<td style="text-align:left">¿Vale la pena <strong>mirar</strong> el proyecto?</td>
<td style="text-align:left">Documento de alcance · <strong>Diagrama de contexto</strong></td>
</tr>
<tr>
<td style="text-align:left">2</td>
<td style="text-align:left"><strong>Análisis del problema</strong></td>
<td style="text-align:left">¿Vale la pena <strong>construir</strong> un sistema nuevo?</td>
<td style="text-align:left">Objetivos de mejora del sistema</td>
</tr>
<tr>
<td style="text-align:left">3</td>
<td style="text-align:left"><strong>Análisis de requerimientos</strong></td>
<td style="text-align:left">¿Qué <strong>necesitan y quieren</strong> las personas usuarias?</td>
<td style="text-align:left">Enunciado de requerimientos del negocio</td>
</tr>
<tr>
<td style="text-align:left">4</td>
<td style="text-align:left"><strong>Diseño lógico</strong></td>
<td style="text-align:left">¿Qué <strong>debe hacer</strong> el sistema?</td>
<td style="text-align:left">Modelos lógicos del sistema</td>
</tr>
<tr>
<td style="text-align:left">5</td>
<td style="text-align:left"><strong>Análisis de decisión</strong></td>
<td style="text-align:left">¿Cuál es la <strong>mejor solución</strong>?</td>
<td style="text-align:left"><strong>Propuesta de sistema</strong></td>
</tr>
</tbody>
</table>
<ul>
<li>Cada fase puede <strong>terminar el proyecto</strong>: si el alcance no se justifica, no se sigue</li>
<li><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f501.svg" data-marp-twemoji=""/> No son estrictamente secuenciales: en un proceso iterativo se recorren <strong>varias veces</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="fase-1-definici%C3%B3n-del-alcance">Fase 1: Definición del alcance</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="actividad">Actividad</h3>
<ul>
<li>Investigación <strong>preliminar</strong> y breve</li>
<li>Identificar el <strong>problema o la oportunidad</strong> que originó la solicitud</li>
<li>Establecer los <strong>límites</strong> del sistema → qué queda dentro y qué fuera</li>
<li>Estimar <strong>grueso</strong> de esfuerzo, costo y duración</li>
<li>Negociar el <strong>plan</strong> de las fases siguientes</li>
</ul>
</div>
<div>
<h3 id="salida">Salida</h3>
<ul>
<li><strong>Documento de alcance</strong> o <em>project charter</em></li>
<li>El <strong>diagrama de contexto</strong> inicial</li>
<li>Decisión: ¿<strong>continuamos</strong> o cancelamos?</li>
</ul>
<br />
<blockquote>
<p>Aquí es donde la <strong>visión</strong> del sistema y el <strong>diagrama de contexto</strong> se usan por primera vez</p>
</blockquote>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Es la fase más corta y la que más proyectos salva: cancelar temprano es <strong>barato</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="fase-2-an%C3%A1lisis-del-problema">Fase 2: Análisis del problema</h2>
<steps>
<step>
<h3 id="actividad-1">Actividad</h3>
<ul>
<li>Estudiar el <strong>sistema actual</strong> (manual o computarizado) tal como es hoy</li>
<li>Distinguir <strong>síntomas</strong> de <strong>causas</strong></li>
<li>Analizar problemas y oportunidades, y <strong>cuantificar</strong> su impacto</li>
<li>Definir los <strong>objetivos de mejora</strong> del sistema</li>
</ul>
</step>
<step>
<h3 id="s%C3%ADntoma-vs-causa">Síntoma vs. causa</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%A4%92-s%C3%ADntoma"><img class="emoji" draggable="false" alt="🤒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f912.svg" data-marp-twemoji=""/> Síntoma</h3>
<p>«Los estudiantes se quejan de que la matrícula se cae»</p>
<p>Es lo que <strong>se ve</strong></p>
</div>
<div>
<h3 id="%F0%9F%A6%A0-causa"><img class="emoji" draggable="false" alt="🦠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9a0.svg" data-marp-twemoji=""/> Causa</h3>
<p>«Los cupos se validan al final del proceso, no al asignarlos»</p>
<p>Es lo que hay que <strong>arreglar</strong></p>
</div>
</div>
<ul>
<li>Si diseñas contra el síntoma, el problema <strong>vuelve</strong></li>
<li>Herramientas útiles: <strong>diagrama causa-efecto</strong> (Ishikawa), <strong>cinco por qué</strong></li>
</ul>
</step>
<step>
<h3 id="salida-1">Salida</h3>
<ul>
<li><strong>Objetivos de mejora del sistema</strong>, medibles y priorizados</li>
<li>Decisión: ¿vale la pena <strong>construir</strong> un sistema nuevo?</li>
</ul>
<br />
<ul>
<li>Ejemplos de objetivo bien planteado:
<ul>
<li>Reducir el tiempo de registro de un pedido en un <strong>20 %</strong></li>
<li>Bajar la tasa de errores de fabricación a <strong>0,5 %</strong> del total</li>
</ul>
</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="fase-3-an%C3%A1lisis-de-requerimientos">Fase 3: Análisis de requerimientos</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="actividad-2">Actividad</h3>
<ul>
<li>Identificar y <strong>priorizar</strong> los requerimientos</li>
<li>Separar <strong>funcionales</strong> (qué hace) de <strong>no funcionales</strong> (atributos de calidad)</li>
<li><strong>Validarlos</strong> con las personas usuarias</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Todavía <strong>no</strong> se habla de tecnología</li>
</ul>
</div>
<div>
<h3 id="%C2%BFqu%C3%A9-debemos-aprender">¿Qué debemos aprender?</h3>
<ul>
<li>El <strong>quién</strong> → personas involucradas</li>
<li>El <strong>qué</strong> → procesos de negocio</li>
<li>El <strong>dónde</strong> → el ambiente de trabajo</li>
<li>El <strong>cuándo</strong> → los tiempos</li>
<li>El <strong>cómo</strong> → los procedimientos actuales</li>
<li>El <strong>porqué</strong> → por qué se hace así hoy</li>
</ul>
</div>
</split-slide>
<ul>
<li><strong>Salida</strong> → enunciado de requerimientos del negocio, con prioridades</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="t%C3%A9cnicas-de-recolecci%C3%B3n-de-requerimientos">Técnicas de recolección de requerimientos</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%97%A3%EF%B8%8F-entrevista"><img class="emoji" draggable="false" alt="🗣️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5e3.svg" data-marp-twemoji=""/> Entrevista</h3>
<p>Profunda y flexible, pero <strong>costosa</strong> en tiempo</p>
</div>
<div>
<h3 id="%F0%9F%93%9D-cuestionario"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4dd.svg" data-marp-twemoji=""/> Cuestionario</h3>
<p>Llega a <strong>muchas</strong> personas, pero no permite profundizar</p>
</div>
<div>
<h3 id="%F0%9F%91%80-observaci%C3%B3n"><img class="emoji" draggable="false" alt="👀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f440.svg" data-marp-twemoji=""/> Observación</h3>
<p>Revela lo que la gente <strong>hace</strong>, no lo que <strong>dice</strong> que hace</p>
</div>
<div>
<h3 id="%F0%9F%93%84-an%C3%A1lisis-de-documentos"><img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c4.svg" data-marp-twemoji=""/> Análisis de documentos</h3>
<p>Formularios, reportes y manuales muestran el proceso <strong>real</strong></p>
</div>
<div>
<h3 id="%F0%9F%8E%B2-muestreo"><img class="emoji" draggable="false" alt="🎲" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3b2.svg" data-marp-twemoji=""/> Muestreo</h3>
<p>Cuando el volumen de datos o de personas es <strong>inmanejable</strong></p>
</div>
<div>
<h3 id="%F0%9F%A7%AA-prototipado"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Prototipado</h3>
<p>Convierte una idea abstracta en algo <strong>criticable</strong></p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Ninguna técnica basta sola: se <strong>combinan</strong> y se <strong>triangulan</strong> los resultados</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="fase-4-dise%C3%B1o-l%C3%B3gico">Fase 4: Diseño lógico</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="actividad-3">Actividad</h3>
<ul>
<li><strong>Modelar</strong> y documentar los requerimientos para validar que están completos y correctos</li>
<li>Es diseño <strong>lógico</strong>, no físico: <strong>independiente</strong> de plataforma y tecnología</li>
<li>Modelos típicos:
<ul>
<li><strong>Casos de uso</strong> y sus diagramas</li>
<li><strong>Diagramas de flujo de datos</strong> (procesos)</li>
<li><strong>Modelo de dominio</strong> / ER (datos)</li>
<li><strong>Diagramas de actividades</strong> (flujo de trabajo)</li>
</ul>
</li>
</ul>
</div>
<div>
<h3 id="%C2%BFpor-qu%C3%A9-modelar">¿Por qué modelar?</h3>
<ul>
<li>Un modelo <strong>encuentra huecos</strong> que el texto esconde</li>
<li>Permite <strong>conversar</strong> con la persona usuaria sobre algo concreto</li>
<li>Da <strong>trazabilidad</strong> hacia el diseño físico</li>
</ul>
<br />
<blockquote>
<p><em>A logical model shows <strong>what</strong> the system must do, regardless of how it will be implemented physically</em></p>
</blockquote>
</div>
</split-slide>
<ul>
<li><strong>Salida</strong> → modelos lógicos del sistema</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="fase-5-an%C3%A1lisis-de-decisi%C3%B3n">Fase 5: Análisis de decisión</h2>
<steps>
<step>
<h3 id="actividad-4">Actividad</h3>
<ul>
<li><strong>Identificar</strong> soluciones candidatas → normalmente hay más de una</li>
<li><strong>Analizar la factibilidad</strong> de cada candidata</li>
<li><strong>Comparar</strong> las candidatas contra criterios explícitos</li>
<li><strong>Recomendar</strong> una, con su justificación</li>
</ul>
</step>
<step>
<h3 id="soluciones-candidatas-t%C3%ADpicas">Soluciones candidatas típicas</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%9B%A0%EF%B8%8F-construir-a-la-medida"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Construir a la medida</h3>
<p>Máximo ajuste, máximo costo y riesgo</p>
</div>
<div>
<h3 id="%F0%9F%93%A6-comprar-un-producto"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Comprar un producto</h3>
<p>Rápido, pero hay que <strong>adaptar el negocio</strong> al producto</p>
</div>
<div>
<h3 id="%F0%9F%94%A7-mejorar-lo-existente"><img class="emoji" draggable="false" alt="🔧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f527.svg" data-marp-twemoji=""/> Mejorar lo existente</h3>
<p>Bajo costo, pero arrastra las <strong>limitaciones</strong> actuales</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-no-hacer-nada"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6ab.svg" data-marp-twemoji=""/> No hacer nada</h3>
<p>Siempre es una candidata válida → es la <strong>línea base</strong> de comparación</p>
</div>
</div>
<ul>
<li><strong>Salida</strong> → <strong>propuesta de sistema</strong> con la recomendación</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="otra-forma-de-agrupar-las-fases">Otra forma de agrupar las fases</h2>
<ul>
<li>Valacich &amp; George agrupan el análisis en <strong>tres sub-fases</strong>; es la misma historia contada más grueso</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Sub-fase</th>
<th style="text-align:left">Qué incluye</th>
<th style="text-align:left">Fases equivalentes</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Determinación de requerimientos</strong></td>
<td style="text-align:left">Recolectar información sobre el sistema actual y las necesidades</td>
<td style="text-align:left">1 · 2 · 3</td>
</tr>
<tr>
<td style="text-align:left"><strong>Estructuración de requerimientos</strong></td>
<td style="text-align:left">Modelar procesos, datos y lógica</td>
<td style="text-align:left">4</td>
</tr>
<tr>
<td style="text-align:left"><strong>Generación y selección de alternativas</strong></td>
<td style="text-align:left">Definir alternativas de diseño y escoger la mejor</td>
<td style="text-align:left">5</td>
</tr>
</tbody>
</table>
<div class="grid">
<div>
<h3 id="%F0%9F%94%91-lo-que-no-cambia"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f511.svg" data-marp-twemoji=""/> Lo que no cambia</h3>
<p>Se <strong>entiende</strong> antes de <strong>modelar</strong>, y se <strong>modela</strong> antes de <strong>decidir</strong></p>
</div>
<div>
<h3 id="%F0%9F%94%81-lo-que-s%C3%AD-cambia"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f501.svg" data-marp-twemoji=""/> Lo que sí cambia</h3>
<p>Cuántas veces recorres el ciclo → en cascada <strong>una</strong>, en RUP o Scrum <strong>muchas</strong></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-marpit-scope-m7FDThpW="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="41" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="67">
<h1 id="factibilidad-del-sistema">Factibilidad del sistema</h1>
<h2 id="contenidos-5">Contenidos</h2>
<ul>
<li>¿Qué es la factibilidad?</li>
<li>Los seis tipos de factibilidad</li>
<li>Análisis costo-beneficio</li>
<li>El reporte de factibilidad</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="%C2%BFqu%C3%A9-es-la-factibilidad">¿Qué es la factibilidad?</h2>
<ul>
<li>Medida de qué tan <strong>beneficioso</strong> o <strong>práctico</strong> resulta desarrollar un sistema de información para la organización</li>
</ul>
<steps>
<step>
<h3 id="se-eval%C3%BAa-de-forma-continua">Se evalúa de forma continua</h3>
<ul>
<li>No es un trámite de una sola vez al inicio del proyecto</li>
<li>Se <strong>reevalúa</strong> en cada punto de decisión → <em><strong>creeping commitment</strong></em>: el compromiso de recursos crece por etapas, y en cada etapa se puede <strong>cancelar</strong></li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%92%A1-la-pregunta-no-es"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> La pregunta no es</h3>
<p>«¿Se puede hacer?»</p>
<p>Casi todo se puede hacer</p>
</div>
<div>
<h3 id="%E2%9C%85-la-pregunta-es"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> La pregunta es</h3>
<p>«¿<strong>Conviene</strong> hacerlo, con <strong>estos</strong> recursos, en <strong>este</strong> plazo, en <strong>esta</strong> organización?»</p>
</div>
</div>
</step>
<step>
<h3 id="%C2%BFcu%C3%A1ndo-se-hace">¿Cuándo se hace?</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Momento</th>
<th style="text-align:left">Profundidad</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Fase 1 — Definición del alcance</td>
<td style="text-align:left">Factibilidad <strong>preliminar</strong>, con estimaciones gruesas</td>
</tr>
<tr>
<td style="text-align:left">Fase 5 — Análisis de decisión</td>
<td style="text-align:left">Factibilidad <strong>detallada</strong>, una por solución candidata</td>
</tr>
<tr>
<td style="text-align:left">Cada hito o fin de iteración</td>
<td style="text-align:left"><strong>Revalidación</strong> contra lo que ya sabemos</td>
</tr>
</tbody>
</table>
<ul>
<li>Cuanto más avanza el proyecto, <strong>más caro</strong> es cancelarlo → por eso se evalúa temprano y seguido</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="los-seis-tipos-de-factibilidad">Los seis tipos de factibilidad</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%92%B0-econ%C3%B3mica"><img class="emoji" draggable="false" alt="💰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4b0.svg" data-marp-twemoji=""/> Económica</h3>
<p>¿Los <strong>beneficios</strong> superan los <strong>costos</strong>?</p>
</div>
<div>
<h3 id="%E2%9A%99%EF%B8%8F-operacional"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2699.svg" data-marp-twemoji=""/> Operacional</h3>
<p>¿La organización <strong>va a usar</strong> el sistema y puede <strong>operarlo</strong>?</p>
</div>
<div>
<h3 id="%F0%9F%94%A7-t%C3%A9cnica"><img class="emoji" draggable="false" alt="🔧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f527.svg" data-marp-twemoji=""/> Técnica</h3>
<p>¿Tenemos la <strong>tecnología</strong> y la <strong>experiencia</strong> para construirlo?</p>
</div>
<div>
<h3 id="%F0%9F%93%85-de-calendario"><img class="emoji" draggable="false" alt="📅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c5.svg" data-marp-twemoji=""/> De calendario</h3>
<p>¿Se puede terminar <strong>en el plazo</strong> requerido?</p>
</div>
<div>
<h3 id="%E2%9A%96%EF%B8%8F-legal-y-contractual"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2696.svg" data-marp-twemoji=""/> Legal y contractual</h3>
<p>¿Hay <strong>normativa</strong>, licencias o contratos que lo impidan?</p>
</div>
<div>
<h3 id="%F0%9F%8F%9B%EF%B8%8F-pol%C3%ADtica"><img class="emoji" draggable="false" alt="🏛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3db.svg" data-marp-twemoji=""/> Política</h3>
<p>¿Cómo lo perciben los <strong>grupos de poder</strong> de la organización?</p>
</div>
</div>
<blockquote>
<p>Valacich &amp; George (2017). Kendall &amp; Kendall trabajan con las tres primeras: <strong>técnica, económica y operacional</strong></p>
</blockquote>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Un proyecto puede ser <strong>técnicamente perfecto</strong> y fracasar por factibilidad <strong>política</strong> u <strong>operacional</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="factibilidad-econ%C3%B3mica-los-costos">Factibilidad económica: los costos</h2>
<ul>
<li>Se hace un <strong>análisis costo-beneficio</strong>. Primero, identificar y clasificar los costos</li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="por-su-naturaleza">Por su naturaleza</h3>
<ul>
<li><strong>Tangibles</strong>: se pueden medir en dinero con certeza razonable
<ul>
<li>Licencias, hardware, salarios, capacitación</li>
</ul>
</li>
<li><strong>Intangibles</strong>: reales pero difíciles de cuantificar
<ul>
<li>Pérdida de productividad durante la transición</li>
<li>Desgaste del personal, resistencia al cambio</li>
</ul>
</li>
</ul>
</div>
<div>
<h3 id="por-su-recurrencia">Por su recurrencia</h3>
<ul>
<li><strong>Únicos</strong> (<em>one-time</em>): se pagan una vez
<ul>
<li>Desarrollo, compra de equipo, migración de datos, capacitación inicial</li>
</ul>
</li>
<li><strong>Recurrentes</strong>: se repiten mientras el sistema viva
<ul>
<li>Soporte, licencias anuales, infraestructura, mantenimiento</li>
</ul>
</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> El error más común: estimar solo el <strong>desarrollo</strong> y olvidar los costos <strong>recurrentes</strong>, que suelen ser mayores en el ciclo de vida completo</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="factibilidad-econ%C3%B3mica-los-beneficios">Factibilidad económica: los beneficios</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%92%B5-tangibles"><img class="emoji" draggable="false" alt="💵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4b5.svg" data-marp-twemoji=""/> Tangibles</h3>
<p>Se pueden <strong>cuantificar</strong> en dinero</p>
<ul>
<li>Reducción de personal o de horas extra</li>
<li>Menor tasa de error → menos reprocesamiento</li>
<li>Menor inventario o menor costo de insumos</li>
<li>Mayor volumen de ventas o de trámites atendidos</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8C%9F-intangibles"><img class="emoji" draggable="false" alt="🌟" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f31f.svg" data-marp-twemoji=""/> Intangibles</h3>
<p>Reales, pero <strong>difíciles de poner en colones</strong></p>
<ul>
<li>Mejor servicio y satisfacción de la persona usuaria</li>
<li>Mejor información para <strong>tomar decisiones</strong></li>
<li>Mejor imagen institucional</li>
<li>Mayor moral del personal</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Truco: convierte lo intangible en tangible buscando su <strong>proxy</strong> medible
<ul>
<li>«Mejor servicio» → <em>tiempo promedio de atención</em> · <em>número de quejas por mes</em></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="t%C3%A9cnicas-de-evaluaci%C3%B3n-econ%C3%B3mica">Técnicas de evaluación económica</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Técnica</th>
<th style="text-align:left">Qué mide</th>
<th style="text-align:left">Regla de decisión</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Periodo de recuperación</strong> (<em>payback</em>)</td>
<td style="text-align:left">En cuánto tiempo el proyecto devuelve la inversión</td>
<td style="text-align:left">Menor es mejor</td>
</tr>
<tr>
<td style="text-align:left"><strong>Retorno de la inversión</strong> (ROI)</td>
<td style="text-align:left">Beneficio neto como % de la inversión</td>
<td style="text-align:left">Mayor es mejor</td>
</tr>
<tr>
<td style="text-align:left"><strong>Valor actual neto</strong> (VAN / <em>NPV</em>)</td>
<td style="text-align:left">Valor presente de los flujos futuros, menos la inversión</td>
<td style="text-align:left"><strong>VAN &gt; 0</strong> → conviene</td>
</tr>
<tr>
<td style="text-align:left"><strong>Tasa interna de retorno</strong> (TIR / <em>IRR</em>)</td>
<td style="text-align:left">Rendimiento porcentual del proyecto</td>
<td style="text-align:left">TIR &gt; costo de capital</td>
</tr>
</tbody>
</table>
<div class="grid">
<div>
<h3 id="%E2%8F%B3-por-qu%C3%A9-descontar"><img class="emoji" draggable="false" alt="⏳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/23f3.svg" data-marp-twemoji=""/> Por qué descontar</h3>
<p>Mil colones hoy <strong>valen más</strong> que mil colones en tres años</p>
</div>
<div>
<h3 id="%F0%9F%8E%AF-cu%C3%A1l-usar"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> Cuál usar</h3>
<p>El <strong>VAN</strong> es la más defendible; el <em><strong>payback</strong></em> es la más fácil de explicar a la gerencia</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="factibilidad-t%C3%A9cnica-es-an%C3%A1lisis-de-riesgo">Factibilidad técnica: es análisis de riesgo</h2>
<ul>
<li>La pregunta real no es «¿existe la tecnología?» sino «¿qué tan <strong>riesgoso</strong> es que <em>nosotros</em> lo construyamos?»</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Factor de riesgo</th>
<th style="text-align:left">Menor riesgo</th>
<th style="text-align:left">Mayor riesgo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Tamaño</strong> del proyecto</td>
<td style="text-align:left">Equipo pequeño, pocas áreas afectadas</td>
<td style="text-align:left">Muchas personas, varias unidades, muchos sistemas externos</td>
</tr>
<tr>
<td style="text-align:left"><strong>Estructura</strong> del proyecto</td>
<td style="text-align:left">Requerimientos claros y estables</td>
<td style="text-align:left">Requerimientos difusos, procesos que cambiarán</td>
</tr>
<tr>
<td style="text-align:left">Familiaridad del grupo con la <strong>tecnología</strong></td>
<td style="text-align:left">Plataforma ya usada en la organización</td>
<td style="text-align:left">Tecnología nueva o sin experiencia interna</td>
</tr>
<tr>
<td style="text-align:left">Familiaridad del grupo con el <strong>área de aplicación</strong></td>
<td style="text-align:left">Dominio conocido</td>
<td style="text-align:left">Negocio nuevo para el equipo</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Alto riesgo <strong>no</strong> significa cancelar: significa <strong>gestionarlo</strong> → prototipos, iteraciones cortas, capacitación, consultoría externa</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="operacional-de-calendario-legal-y-pol%C3%ADtica">Operacional, de calendario, legal y política</h2>
<steps>
<step>
<div class="grid">
<div>
<h3 id="%E2%9A%99%EF%B8%8F-operacional-1"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2699.svg" data-marp-twemoji=""/> Operacional</h3>
<ul>
<li>¿El sistema <strong>resuelve</strong> el problema tal como se planteó?</li>
<li>¿Las personas usuarias lo <strong>van a usar</strong>?</li>
<li>¿Encaja con los procesos y la cultura de la organización?</li>
<li>¿Hay capacidad de <strong>operarlo y mantenerlo</strong> después del despliegue?</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%93%85-de-calendario-1"><img class="emoji" draggable="false" alt="📅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c5.svg" data-marp-twemoji=""/> De calendario</h3>
<ul>
<li>¿El plazo requerido es <strong>alcanzable</strong>?</li>
<li>¿Hay fechas <strong>inamovibles</strong> por normativa o por el negocio? (p. ej. la semana de matrícula)</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Un plazo imposible es un proyecto <strong>infactible</strong>, aunque todo lo demás cierre</li>
</ul>
</div>
</div>
</step>
<step>
<div class="grid">
<div>
<h3 id="%E2%9A%96%EF%B8%8F-legal-y-contractual-1"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2696.svg" data-marp-twemoji=""/> Legal y contractual</h3>
<ul>
<li><strong>Normativa</strong> aplicable: protección de datos personales, accesibilidad, retención de información</li>
<li><strong>Licenciamiento</strong> del software y de las dependencias</li>
<li><strong>Contratos</strong> vigentes con proveedores</li>
<li>Propiedad <strong>intelectual</strong> de lo que se desarrolle</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8F%9B%EF%B8%8F-pol%C3%ADtica-1"><img class="emoji" draggable="false" alt="🏛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3db.svg" data-marp-twemoji=""/> Política</h3>
<ul>
<li>¿Cómo perciben el sistema los <strong>grupos de poder</strong> de la organización?</li>
<li>¿Quién <strong>gana</strong> y quién <strong>pierde</strong> control o influencia?</li>
<li>¿Hay un <em><strong>sponsor</strong></em> con autoridad real que lo respalde?</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Es la factibilidad menos documentada y la que <strong>hunde más proyectos</strong></li>
</ul>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="el-reporte-de-factibilidad">El reporte de factibilidad</h2>
<ul>
<li>Es la <strong>salida</strong> del análisis y la base de la decisión gerencial de <strong>proceder o no</strong></li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="contenido-t%C3%ADpico">Contenido típico</h3>
<ol>
<li><strong>Definición del problema</strong> y del alcance</li>
<li><strong>Objetivos</strong> del sistema propuesto</li>
<li>Soluciones <strong>candidatas</strong> consideradas</li>
<li>Análisis de las <strong>seis factibilidades</strong> por candidata</li>
<li><strong>Costos y beneficios</strong> estimados</li>
<li><strong>Riesgos</strong> identificados y su mitigación</li>
<li><strong>Recomendación</strong> y justificación</li>
</ol>
</div>
<div>
<h3 id="matriz-de-candidatas">Matriz de candidatas</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Criterio</th>
<th style="text-align:left">A: construir</th>
<th style="text-align:left">B: comprar</th>
<th style="text-align:left">C: no hacer nada</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Económica</td>
<td style="text-align:left">Media</td>
<td style="text-align:left">Alta</td>
<td style="text-align:left">—</td>
</tr>
<tr>
<td style="text-align:left">Técnica</td>

<li>Con el sistema de las actividades anteriores, y en <strong>10 minutos</strong> por punto:</li>
</ul>
<div class="grid">
<div>

<h2 id="%C2%BFqu%C3%A9-es-un-proceso-de-negocio">¿Qué es un proceso de negocio?</h2>
<steps>
<step>
<blockquote>
<p><strong>Davenport</strong>: «un proceso es un orden específico de actividades a través del tiempo y lugar, con un comienzo y fin, <em>inputs</em> y <em>outputs</em>: una <strong>estructura para la acción</strong>»</p>
</blockquote>
<br />
<blockquote>
<p><strong>Hammer &amp; Champy</strong>: «un proceso de negocio es un conjunto de actividades que toman uno o más tipos de <em>inputs</em> y crean un <em>output</em> que es el <strong>valor para un cliente</strong>»</p>
</blockquote>
</step>
<step>
<h3 id="lo-que-ambas-definiciones-comparten">Lo que ambas definiciones comparten</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%94%84-actividades-ordenadas"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f504.svg" data-marp-twemoji=""/> Actividades ordenadas</h3>
<p>Hay una <strong>secuencia</strong>, no un conjunto suelto de tareas</p>
</div>
<div>
<h3 id="%F0%9F%9A%A6-inicio-y-fin"><img class="emoji" draggable="false" alt="🚦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6a6.svg" data-marp-twemoji=""/> Inicio y fin</h3>
<p>El proceso tiene <strong>límites</strong> identificables</p>
</div>
<div>
<h3 id="%E2%AC%85%EF%B8%8F%E2%9E%A1%EF%B8%8F-entradas-y-salidas"><img class="emoji" draggable="false" alt="⬅️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2b05.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/27a1.svg" data-marp-twemoji=""/> Entradas y salidas</h3>
<p>Transforma algo en algo → igual que un <strong>sistema</strong></p>
</div>
<div>
<h3 id="%F0%9F%8E%AF-valor-para-un-cliente"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> Valor para un cliente</h3>
<p>Existe para <strong>alguien</strong>, dentro o fuera de la organización</p>
</div>
</div>
</step>
</steps>
</section>
