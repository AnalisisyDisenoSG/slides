<h2 id="clases-de-procesos-de-negocio">Clases de procesos de negocio</h2>
<div class="grid">
<div>
<h3 id="%E2%AD%90-procesos-principales"><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2b50.svg" data-marp-twemoji=""/> Procesos principales</h3>
<p>Generan <strong>valor directo</strong> para el cliente externo</p>
<p><em>Ejemplo:</em> vender producto, atender un pedido</p>
</div>
<div>
<h3 id="%F0%9F%9B%A0%EF%B8%8F-procesos-de-soporte"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Procesos de soporte</h3>
<p>Habilitan a los principales; su cliente es <strong>interno</strong></p>
<p><em>Ejemplo:</em> desarrollo de personal, compras, TI</p>
</div>
<div>
<h3 id="%F0%9F%A7%AD-procesos-de-gesti%C3%B3n"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ed.svg" data-marp-twemoji=""/> Procesos de gestión</h3>
<p><strong>Planifican, controlan y deciden</strong> sobre los demás</p>
<p><em>Ejemplo:</em> planificación, presupuesto, auditoría</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Para el análisis importa la distinción: los procesos <strong>principales</strong> son los que justifican el sistema, y los de <strong>gestión</strong> los que definen qué reportes hacen falta</li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> En tu sistema de las actividades anteriores, ¿cuál proceso principal atiende?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="modelado-del-negocio">Modelado del negocio</h2>
<ul>
<li>Es una <strong>técnica</strong> para representar los procesos del negocio</li>
<li>Permite asegurar que se construirá el sistema <strong>en el contexto de las necesidades de la empresa</strong></li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="el-contexto-est%C3%A1-dado-por">El contexto está dado por</h3>
<ul>
<li>El <strong>ambiente</strong> en que el sistema trabajará</li>
<li>Los <strong>roles y responsabilidades</strong> de los empleados que usarán el sistema</li>
<li>Las <strong>«cosas»</strong> que son manejadas en el negocio</li>
</ul>
</div>
<div>
<h3 id="%C2%BFpor-qu%C3%A9-hacerlo-antes-del-sistema">¿Por qué hacerlo antes del sistema?</h3>
<ul>
<li>El sistema <strong>no</strong> reemplaza el proceso: lo <strong>soporta</strong></li>
<li>Si no entiendes el proceso, automatizas el <strong>desorden</strong> existente</li>
<li>Los actores y entidades del negocio se convierten después en los <strong>actores</strong> y el <strong>modelo de dominio</strong> del sistema</li>
</ul>
</div>
</split-slide>
<blockquote>
<p>Un sistema que ignora el proceso de negocio se usa una semana y se abandona</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="dos-perspectivas-del-modelado-del-negocio">Dos perspectivas del modelado del negocio</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%8C%8D-perspectiva-externa"><img class="emoji" draggable="false" alt="🌍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f30d.svg" data-marp-twemoji=""/> Perspectiva externa</h3>
<h3 id="modelo-de-casos-de-uso-del-negocio">Modelo de <strong>casos de uso del negocio</strong></h3>
<p>Qué hace la empresa <strong>vista desde afuera</strong></p>
<ul>
<li><strong>Actores</strong> del negocio</li>
<li><strong>Casos de uso</strong> del negocio (los procesos)</li>
<li>Metas del negocio</li>
</ul>
<p><em>«¿Qué le ofrece la empresa a su entorno?»</em></p>
</div>
<div>
<h3 id="%F0%9F%8F%A0-perspectiva-interna"><img class="emoji" draggable="false" alt="🏠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3e0.svg" data-marp-twemoji=""/> Perspectiva interna</h3>
<h3 id="modelo-de-an%C3%A1lisis-del-negocio">Modelo de <strong>análisis del negocio</strong></h3>
<p><strong>Cómo</strong> lo logra por dentro</p>
<ul>
<li><strong>Trabajadores</strong> del negocio</li>
<li><strong>Entidades</strong> del negocio</li>
<li><strong>Realizaciones</strong> de los casos de uso</li>
</ul>
<p><em>«¿Cómo hace la empresa lo que ofrece?»</em></p>
</div>
</div>
<ul>
<li>Es la misma distinción <strong>caja negra / caja blanca</strong> del diagrama de contexto, aplicada al <strong>negocio</strong> en vez del sistema</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="modelo-de-casos-de-uso-del-negocio-1">Modelo de casos de uso del negocio</h2>
<ul>
<li>Es una <strong>representación de la forma en que la empresa interactúa con su entorno</strong></li>
<li>Provee una <strong>visión general</strong> de lo que la empresa hace: incluye metas, actores y casos de uso de negocio</li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%A7%91-actor-de-negocio"><img class="emoji" draggable="false" alt="🧑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9d1.svg" data-marp-twemoji=""/> Actor de negocio</h3>
<p>Representa un <strong>rol</strong> que desempeña alguien o algo <strong>en relación</strong> al negocio</p>
<p>→ Es <strong>externo</strong> al negocio</p>
<p><em>Ejemplos:</em> Cliente, Proveedor, Banco, Ministerio</p>
</div>
<div>
<h3 id="%F0%9F%A5%9A-caso-de-uso-de-negocio"><img class="emoji" draggable="false" alt="🥚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f95a.svg" data-marp-twemoji=""/> Caso de uso de negocio</h3>
<p><strong>Acciones o actividades</strong> para producir un resultado</p>
<p>→ Es un <strong>proceso de negocio</strong></p>
<p><em>Ejemplos:</em> Registrar pedido, Fabricar producto, Comprar materia prima</p>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Un empleado <strong>no</strong> es actor de negocio: está <strong>dentro</strong> del negocio → es un <strong>trabajador</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="modelo-de-casos-de-uso-del-negocio-ejemplo">Modelo de casos de uso del negocio: ejemplo</h2>
<p><a href="../assets/ads-cun-ejemplo.png"><img src="../assets/ads-cun-ejemplo.png" alt="" style="height:430px;" /></a></p>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> ¿Por qué <em>Facturación</em> aparece <strong>sin conexión</strong> al actor Cliente? ¿Está bien o falta algo?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="modelo-de-an%C3%A1lisis-del-negocio-1">Modelo de análisis del negocio</h2>
<ul>
<li>Describe la <strong>realización</strong> de los casos de uso del negocio, mediante la <strong>interacción</strong> de los trabajadores del negocio (empleados) y las <strong>entidades</strong> (información) del negocio</li>
<li>Es una <strong>abstracción</strong> de <strong>cómo</strong> los trabajadores hacen las actividades</li>
</ul>
<steps>
<step>
<h3 id="elementos">Elementos</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%91%B7-trabajador-de-negocio"><img class="emoji" draggable="false" alt="👷" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f477.svg" data-marp-twemoji=""/> Trabajador de negocio</h3>
<p>Abstracción de una <strong>persona o sistema</strong> que representa un rol <strong>dentro</strong> de la realización de un CUN</p>
<p><em>Roles internos:</em> Empleado de ventas, Jefe técnico</p>
</div>
<div>
<h3 id="%F0%9F%93%84-entidad-de-negocio"><img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c4.svg" data-marp-twemoji=""/> Entidad de negocio</h3>
<p>Pieza de información <strong>persistente</strong>, manipulada por actores y trabajadores</p>
<p><em>Ejemplos:</em> Factura, Proforma, Pedido, Catálogo</p>
</div>
<div>
<h3 id="%F0%9F%94%97-realizaci%C3%B3n-de-cun"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f517.svg" data-marp-twemoji=""/> Realización de CUN</h3>
<p>La representación de <strong>cómo</strong> se va a detallar el caso de uso del negocio</p>
<p><em>Se documenta con:</em> diagrama de actividades, de secuencia o de colaboración</p>
</div>
</div>
</step>
<step>
<h3 id="c%C3%B3mo-se-conectan-con-el-sistema">Cómo se conectan con el sistema</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Elemento del negocio</th>
<th style="text-align:left">Se convierte en...</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Actor</strong> de negocio</td>
<td style="text-align:left">Actor del sistema (si interactúa con él)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Trabajador</strong> de negocio</td>
<td style="text-align:left">Actor del sistema · Rol de seguridad</td>
</tr>
<tr>
<td style="text-align:left"><strong>Entidad</strong> de negocio</td>
<td style="text-align:left">Clase del <strong>modelo de dominio</strong> · Entidad de datos</td>
</tr>
<tr>
<td style="text-align:left"><strong>Caso de uso</strong> de negocio</td>
<td style="text-align:left">Uno o varios <strong>casos de uso del sistema</strong></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Aquí se ve la <strong>trazabilidad</strong>: el modelo de negocio no es un ejercicio decorativo, es la <strong>entrada</strong> del análisis del sistema</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="realizaci%C3%B3n-con-un-diagrama-de-actividades">Realización con un diagrama de actividades</h2>
<p><a href="../assets/ads-man-actividades.png"><img src="../assets/ads-man-actividades.png" alt="" style="height:390px;" /></a></p>
<ul>
<li>Las <strong>calles</strong> (<em>swimlanes</em>) son los <strong>trabajadores de negocio</strong>; las cajas son las <strong>actividades</strong></li>
<li>La flecha que cruza de una calle a otra es un <strong>traspaso</strong> → donde vive el riesgo del proceso</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="ejemplo-%C2%ABvende-barato-sa%C2%BB">Ejemplo: «Vende Barato S.A»</h2>
<steps>
<step>
<h3 id="el-enunciado">El enunciado</h3>
<ul>
<li>La empresa <strong>«Vende Barato S.A»</strong> se dedica a la <strong>fabricación de productos bajo demanda</strong></li>
<li>El <strong>gerente general</strong> está interesado en satisfacer de la mejor manera los pedidos de los clientes, estableciéndose el objetivo de <strong>disminuir el tiempo</strong> de todo el proceso de atención del pedido</li>
<li>Para cumplir el objetivo es necesario: <strong>registrar</strong> el pedido del cliente, <strong>fabricar</strong> el producto pedido, llevar el <strong>control del almacén</strong> de materias primas y, en caso necesario, realizar la <strong>compra de materia prima</strong> a proveedores</li>
</ul>
</step>
<step>
<h3 id="las-metas-del-gerente-general">Las metas del gerente general</h3>
<ul>
<li>Reducir el tiempo de <strong>registro</strong> de un pedido a un <strong>20 %</strong> del tiempo actual</li>
<li>Reducir la tasa de <strong>errores de fabricación</strong> a <strong>0,5 %</strong> del total</li>
<li>Mantener el <strong>stock adecuado</strong> de las materias primas</li>
<li>Reducir el tiempo de <strong>generación de la orden de compra</strong> a proveedores en un <strong>20 %</strong> del actual</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Fíjate: las metas están <strong>cuantificadas</strong> → son los <em>objetivos de mejora del sistema</em> de la Fase 2</li>
</ul>
</step>
<step>
<h3 id="identificaci%C3%B3n-de-elementos">Identificación de elementos</h3>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%A7%91-actores"><img class="emoji" draggable="false" alt="🧑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9d1.svg" data-marp-twemoji=""/> Actores</h3>
<ul>
<li><strong>Cliente</strong></li>
<li><strong>Proveedor</strong></li>
</ul>
<br />
<blockquote>
<p>Están <strong>fuera</strong> del negocio</p>
</blockquote>
</div>
<div>
<h3 id="%F0%9F%A5%9A-casos-de-uso-de-negocio"><img class="emoji" draggable="false" alt="🥚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f95a.svg" data-marp-twemoji=""/> Casos de uso de negocio</h3>
<ul>
<li>Registrar pedido</li>
<li>Fabricar producto</li>
<li>Controlar almacén</li>
<li>Comprar materia prima</li>
</ul>
<blockquote>
<p>Cada uno es un <strong>proceso</strong></p>
</blockquote>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> ¿Y el <strong>gerente general</strong>? ¿Es actor o trabajador? → <spoiler>trabajador: está dentro del negocio</spoiler></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="actividad-4-construye-el-diagrama-de-casos-de-uso-del-negocio">Actividad 4: construye el diagrama de casos de uso del negocio</h2>
<ul>
<li>Con los actores y casos de uso de «Vende Barato S.A», dibujen el <strong>diagrama de CUN</strong></li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="pasos-1">Pasos</h3>
<ol>
<li>Dibujen el <strong>límite del negocio</strong></li>
<li>Coloquen los <strong>actores</strong> fuera</li>
<li>Coloquen los <strong>casos de uso</strong> dentro</li>
<li>Conecten cada actor con los casos de uso en los que <strong>participa</strong></li>
</ol>
</div>
<div>
<h3 id="preguntas-de-control-1">Preguntas de control</h3>
<ul>
<li>¿Hay casos de uso <strong>sin ningún actor</strong>? ¿Se justifica?</li>
<li>¿Algún «actor» que pusieron es en realidad un <strong>trabajador</strong>?</li>
<li>¿Los nombres siguen el patrón <strong>verbo + objeto</strong>?</li>
<li>¿Cada meta del gerente se puede <strong>rastrear</strong> a un caso de uso?</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/23f1.svg" data-marp-twemoji=""/> 15 minutos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="64" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="realizaci%C3%B3n-del-cun-%C2%ABregistrar-pedido%C2%BB">Realización del CUN «Registrar pedido»</h2>
<steps>
<step>
<h3 id="la-narrativa-1-de-2">La narrativa (1 de 2)</h3>
<ol>
<li>El <strong>cliente</strong> envía una orden de pedido —por teléfono, fax o correo— al <strong>Dpto. de ventas</strong>. El pedido debe incluir la fecha de solicitud, los datos del cliente y los productos solicitados</li>
<li>Un <strong>empleado del Dpto. de ventas</strong> revisa el pedido, completándolo si es necesario. Comienza su procesamiento enviándolo al <strong>jefe técnico</strong>, encargado de su análisis</li>
<li>El <strong>jefe técnico</strong> analiza la viabilidad de cada producto del pedido por separado:
<ul>
<li>Si el producto está <strong>en el catálogo</strong> → su fabricación es aceptada</li>
<li>Si no está, es un <strong>producto especial</strong>: el jefe técnico estudia su fabricación y la acepta o la rechaza</li>
</ul>
</li>
</ol>
</step>
<step>
<h3 id="la-narrativa-2-de-2">La narrativa (2 de 2)</h3>
<ol start="4">
<li>Una vez estudiado el pedido completo, el <strong>jefe técnico</strong> informa al Dpto. de ventas de la <strong>aceptación o rechazo</strong> de cada producto. Si todos los productos fueron aceptados, se crea una <strong>orden de trabajo</strong> para cada producto, a partir de una <strong>plantilla de fabricación</strong>:
<ul>
<li>La <strong>estándar</strong>, si el producto estaba catalogado</li>
<li>Una <strong>nueva</strong>, diseñada específicamente, si no estaba en el catálogo</li>
</ul>
</li>
<li>Cada orden de trabajo es enviada al <strong>jefe de producción</strong> y queda pendiente de fabricación</li>
<li>El <strong>empleado del Dpto. de ventas</strong> comunica al cliente el resultado final del análisis de su pedido</li>
</ol>
</step>
<step>
<h3 id="elementos-identificados">Elementos identificados</h3>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%91%B7-trabajadores-de-negocio"><img class="emoji" draggable="false" alt="👷" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f477.svg" data-marp-twemoji=""/> Trabajadores de negocio</h3>
<ul>
<li><strong>Empleado de ventas</strong></li>
<li><strong>Jefe técnico</strong></li>
<li><strong>Jefe de producción</strong></li>
</ul>
<blockquote>
<p>Roles <strong>internos</strong> al negocio</p>
</blockquote>
</div>
<div>
<h3 id="%F0%9F%93%84-entidades-de-negocio"><img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c4.svg" data-marp-twemoji=""/> Entidades de negocio</h3>
<ul>
<li><strong>Pedido</strong></li>
<li><strong>Catálogo</strong></li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> ¿Faltan entidades? → <spoiler>Orden de trabajo y Plantilla de fabricación</spoiler></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Método práctico: los <strong>sustantivos persistentes</strong> de la narrativa son candidatos a <strong>entidad</strong>; los <strong>roles que actúan</strong> son candidatos a <strong>trabajador</strong></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="65" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="actividad-5-modela-%C2%ABregistrar-pedido%C2%BB">Actividad 5: modela «Registrar pedido»</h2>
<div class="grid">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-diagrama-de-actividades"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Diagrama de actividades</h3>
<p>Modelen la narrativa de «Registrar pedido» con <strong>una calle por trabajador</strong> de negocio</p>
<p>Incluyan la <strong>decisión</strong> del jefe técnico: ¿está en el catálogo?</p>
</div>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-marquen-los-traspasos"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Marquen los traspasos</h3>
<p>Señalen cada flecha que <strong>cruza</strong> de una calle a otra</p>
<p>¿Cuál traspaso creen que causa el <strong>mayor retraso</strong>?</p>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-conecten-con-el-sistema"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Conecten con el sistema</h3>
<p>¿Qué <strong>entidades</strong> del negocio se vuelven clases del modelo de dominio?</p>
<p>¿Qué <strong>trabajadores</strong> se vuelven actores del sistema?</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/23f1.svg" data-marp-twemoji=""/> 25 minutos · Contrasten el resultado con la meta del gerente: <strong>reducir el tiempo de registro a un 20 %</strong></li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> ¿El diagrama les muestra <strong>dónde</strong> recortar ese tiempo?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="66" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="67">
<h2 id="c%C3%B3mo-se-conecta-todo">Cómo se conecta todo</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Tema</th>
<th style="text-align:left">Pregunta</th>
<th style="text-align:left">Artefacto principal</th>
<th style="text-align:left">Alimenta a...</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Visión</strong></td>
<td style="text-align:left">¿Qué problema y para quién?</td>
<td style="text-align:left">Documento Visión</td>
<td style="text-align:left">Alcance · Casos de uso</td>
</tr>
<tr>
<td style="text-align:left"><strong>Modelado de negocio</strong></td>
<td style="text-align:left">¿En qué contexto vive?</td>
<td style="text-align:left">Modelos de CUN y de análisis del negocio</td>
<td style="text-align:left">Actores · Modelo de dominio</td>
</tr>
<tr>
<td style="text-align:left"><strong>Análisis</strong></td>
<td style="text-align:left">¿Qué debe hacer y dónde termina?</td>
<td style="text-align:left"><strong>Diagrama de contexto</strong> · Modelos lógicos</td>
<td style="text-align:left">Diseño</td>
</tr>
<tr>
<td style="text-align:left"><strong>Fases del análisis</strong></td>
<td style="text-align:left">¿En qué orden lo averiguo?</td>
<td style="text-align:left">Entregable de cada fase</td>
<td style="text-align:left">La fase siguiente</td>
</tr>
<tr>
<td style="text-align:left"><strong>Factibilidad</strong></td>
<td style="text-align:left">¿Conviene y es posible?</td>
<td style="text-align:left">Reporte de factibilidad</td>
<td style="text-align:left">Decisión de <strong>seguir o no</strong></td>
</tr>
</tbody>
</table>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%B5-el-hilo-conductor"><img class="emoji" draggable="false" alt="🧵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9f5.svg" data-marp-twemoji=""/> El hilo conductor</h3>
<p><strong>Trazabilidad</strong>: cada artefacto se justifica en el anterior</p>
</div>
<div>
<h3 id="%E2%9A%A0%EF%B8%8F-si-se-rompe-el-hilo"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Si se rompe el hilo</h3>
<p>Aparecen requerimientos <strong>sin dueño</strong> y decisiones que nadie puede explicar</p>
</div>
</div>
</section>
