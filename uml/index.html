<td style="text-align:left"><strong>Bola</strong> <em>(lollipop)</em></td>
<td style="text-align:left">Círculo con línea</td>
<td style="text-align:left">Interfaz <strong>provista</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Zócalo</strong> <em>(socket)</em></td>
<td style="text-align:left">Media luna con línea</td>
<td style="text-align:left">Interfaz <strong>requerida</strong></td>
</tr>
</tbody>
</table>
</step>
<step>
<h3 id="el-efecto-en-el-dise%C3%B1o">El efecto en el diseño</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%94%8C-sustituibilidad"><img class="emoji" draggable="false" alt="🔌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50c.svg" data-marp-twemoji=""/> Sustituibilidad</h3>
<p>Agregar <code>PagoConSINPE</code> no obliga a tocar <code>Checkout</code>: basta con que realice <code>MedioDePago</code></p>
</div>
<div>
<h3 id="%F0%9F%A7%AA-comprobabilidad"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Comprobabilidad</h3>
<p>En las pruebas se sustituye la implementación real por una falsa que cumple el mismo contrato</p>
</div>
<div>
<h3 id="%F0%9F%A7%AD-inversi%C3%B3n-de-dependencias"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> Inversión de dependencias</h3>
<p>El paquete de arriba define la interfaz; el de abajo la implementa. La flecha de dependencia <strong>se invierte</strong></p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Es el mecanismo que permite que el <strong>dominio no dependa de la infraestructura</strong> (recuerden el diagrama de paquetes)</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="agregaci%C3%B3n-simple">Agregación simple</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<ul>
<li>Relación entre unas <strong>clases componentes</strong> y una clase <strong>ensamble completo</strong></li>
<li>Notación: <strong>rombo hueco</strong> en el extremo del todo</li>
<li>La existencia de las partes es <strong>independiente</strong> de la existencia del todo <em>(vínculo débil)</em></li>
</ul>
<blockquote>
<p>Una computadora está compuesta por un monitor, la caja del sistema, uno o ningún ratón y un teclado</p>
</blockquote>
<ul>
<li>Si desarmo la PC, el monitor <strong>sigue existiendo</strong> y puedo conectarlo a otra</li>
</ul>
</div>
<div>
<p><a href="../assets/ads-uml-agregacion.png"><img src="../assets/ads-uml-agregacion.png" alt="" style="height:330px;" /></a></p>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="composici%C3%B3n">Composición</h2>
<split-slide style="--left: 58%; --right: 42%;">
<div>
<ul>
<li>Es una agregación <strong>fuerte</strong>: la existencia de las partes <strong>depende</strong> de la existencia del todo</li>
<li>Notación: <strong>rombo relleno</strong> en el extremo del todo</li>
<li>La parte pertenece a <strong>un solo</strong> todo a la vez, y muere con él</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Regla</th>
<th style="text-align:left">Agregación</th>
<th style="text-align:left">Composición</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Rombo</strong></td>
<td style="text-align:left">Hueco ◇</td>
<td style="text-align:left">Relleno ◆</td>
</tr>
<tr>
<td style="text-align:left"><strong>Vínculo</strong></td>
<td style="text-align:left">Débil</td>
<td style="text-align:left">Fuerte</td>
</tr>
<tr>
<td style="text-align:left"><strong>Si muere el todo</strong></td>
<td style="text-align:left">La parte sobrevive</td>
<td style="text-align:left">La parte <strong>se elimina</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>¿Se puede compartir?</strong></td>
<td style="text-align:left">Sí</td>
<td style="text-align:left">No</td>
</tr>
<tr>
<td style="text-align:left"><strong>Ejemplo</strong></td>
<td style="text-align:left"><code>Equipo</code> ◇— <code>Jugador</code></td>
<td style="text-align:left"><code>Factura</code> ◆— <code>Linea</code></td>
</tr>
</tbody>
</table>
</div>
<div>
<p><a href="../assets/ads-uml-composicion.png"><img src="../assets/ads-uml-composicion.png" alt="" style="height:320px;" /></a></p>
<ul>
<li>Un <code>Canton</code> no existe fuera de su <code>Provincia</code></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> ¿<code>Pedido</code> y <code>LineaDePedido</code>? <spoiler>composición</spoiler> · ¿<code>Curso</code> y <code>Estudiante</code>? <spoiler>asociación simple: el estudiante existe sin el curso</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="resumen-de-relaciones">Resumen de relaciones</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Relación</th>
<th style="text-align:left">Notación</th>
<th style="text-align:left">Se lee</th>
<th style="text-align:left">Fuerza</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Asociación</strong></td>
<td style="text-align:left">Línea continua</td>
<td style="text-align:left">«se relaciona con»</td>
<td style="text-align:left">Estructural</td>
</tr>
<tr>
<td style="text-align:left"><strong>Agregación</strong></td>
<td style="text-align:left">Línea + rombo <strong>hueco</strong> ◇</td>
<td style="text-align:left">«tiene» / «es parte de»</td>
<td style="text-align:left">Débil</td>
</tr>
<tr>
<td style="text-align:left"><strong>Composición</strong></td>
<td style="text-align:left">Línea + rombo <strong>relleno</strong> ◆</td>
<td style="text-align:left">«se compone de»</td>
<td style="text-align:left">Fuerte</td>
</tr>
<tr>
<td style="text-align:left"><strong>Generalización</strong></td>
<td style="text-align:left">Línea continua + triángulo hueco △</td>
<td style="text-align:left">«es un tipo de»</td>
<td style="text-align:left">Herencia</td>
</tr>
<tr>
<td style="text-align:left"><strong>Realización</strong></td>
<td style="text-align:left">Línea <strong>discontinua</strong> + triángulo hueco △</td>
<td style="text-align:left">«cumple el contrato de»</td>
<td style="text-align:left">Contrato</td>
</tr>
<tr>
<td style="text-align:left"><strong>Dependencia</strong></td>
<td style="text-align:left">Línea <strong>discontinua</strong> + flecha abierta ➤</td>
<td style="text-align:left">«usa» / «necesita»</td>
<td style="text-align:left">Muy débil, puntual</td>
</tr>
</tbody>
</table>
<div class="grid">
<div>
<h3 id="%F0%9F%93%8F-de-m%C3%A1s-a-menos-acoplamiento"><img class="emoji" draggable="false" alt="📏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cf.svg" data-marp-twemoji=""/> De más a menos acoplamiento</h3>
<p>Composición → Agregación → Asociación → Dependencia</p>
</div>
<div>
<h3 id="%F0%9F%92%A1-en-caso-de-duda"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> En caso de duda</h3>
<p>Usen <strong>asociación simple</strong>. Agregación y composición son decisiones que hay que poder justificar</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="54" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="c%C3%B3mo-se-construye-un-diagrama-de-clases">Cómo se construye un diagrama de clases</h2>
<steps>
<step>
<h3 id="los-cinco-pasos">Los cinco pasos</h3>
<div class="grid">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-identificar-las-clases"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Identificar las clases</h3>
<p>Los <strong>sustantivos</strong> del enunciado y de los casos de uso</p>
</div>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-identificar-asociaciones"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Identificar asociaciones</h3>
<p>Los <strong>verbos</strong> que conectan esos sustantivos</p>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-identificar-atributos"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Identificar atributos</h3>
<p>Los sustantivos que <strong>describen</strong> a otra clase en lugar de tener vida propia</p>
</div>
<div>
<h3 id="4%EF%B8%8F%E2%83%A3-organizar-usando-herencia"><img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/34-20e3.svg" data-marp-twemoji=""/> Organizar usando herencia</h3>
<p>Buscar lo <strong>común</strong> entre clases y extraerlo</p>
</div>
<div>
<h3 id="5%EF%B8%8F%E2%83%A3-verificar-el-modelo"><img class="emoji" draggable="false" alt="5️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/35-20e3.svg" data-marp-twemoji=""/> Verificar el modelo</h3>
<p>Leerlo en voz alta con el usuario y recorrer los casos de uso</p>
</div>
</div>
</step>
<step>
<h3 id="el-m%C3%A9todo-de-sustantivos-y-verbos">El método de sustantivos y verbos</h3>
<table>
<thead>
<tr>
<th style="text-align:left">En el texto</th>
<th style="text-align:left">Candidato a...</th>
<th style="text-align:left">Ejemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Sustantivo con <strong>identidad e historia</strong></td>
<td style="text-align:left"><strong>Clase</strong></td>
<td style="text-align:left"><em>«un <strong>pedido</strong> tiene una fecha»</em></td>
</tr>
<tr>
<td style="text-align:left">Sustantivo que <strong>describe</strong> a otro</td>
<td style="text-align:left"><strong>Atributo</strong></td>
<td style="text-align:left"><em>«un pedido tiene una <strong>fecha</strong>»</em></td>
</tr>
<tr>
<td style="text-align:left"><strong>Verbo</strong> entre dos sustantivos</td>
<td style="text-align:left"><strong>Asociación</strong></td>
<td style="text-align:left"><em>«un vendedor <strong>realiza</strong> una venta»</em></td>
</tr>
<tr>
<td style="text-align:left">Verbo con un <strong>actor</strong> como sujeto</td>
<td style="text-align:left"><strong>Operación</strong> o caso de uso</td>
<td style="text-align:left"><em>«el cajero <strong>cobra</strong> la factura»</em></td>
</tr>
<tr>
<td style="text-align:left">Adjetivo que crea <strong>subtipos</strong></td>
<td style="text-align:left"><strong>Generalización</strong></td>
<td style="text-align:left"><em>«clientes <strong>minoristas</strong> y <strong>mayoristas</strong>»</em></td>
</tr>
<tr>
<td style="text-align:left">Frase «<strong>está formado por</strong>»</td>
<td style="text-align:left">Agregación / composición</td>
<td style="text-align:left"><em>«un producto <strong>se forma con</strong> partes»</em></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Es un método de <strong>arranque</strong>, no un algoritmo: el resultado siempre se depura con el usuario</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="errores-frecuentes-en-diagramas-de-clases">Errores frecuentes en diagramas de clases</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%9A%AB-modelar-la-base-de-datos"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Modelar la base de datos</h3>
<p>Llaves foráneas, tablas intermedias e <code>id</code> por todos lados. Eso es un <strong>modelo relacional</strong>, no un modelo de dominio</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-clases-con-nombre-de-verbo"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Clases con nombre de verbo</h3>
<p><code>GestionarPedido</code>, <code>ProcesarPago</code>. Son <strong>casos de uso</strong> o servicios, no conceptos del dominio</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-herencia-por-%C2%ABreutilizar-c%C3%B3digo%C2%BB"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Herencia por «reutilizar código»</h3>
<p>Si no pasa la prueba del «es un», es composición</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-el-diagrama-de-80-clases"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> El diagrama de 80 clases</h3>
<p>Ilegible = inservible. Partir por <strong>paquetes</strong> y mostrar una vista por tema</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-asociaciones-sin-multiplicidad"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Asociaciones sin multiplicidad</h3>
<p>La multiplicidad es donde vive la <strong>regla de negocio</strong>. Sin ella el diagrama dice muy poco</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-clase-%C2%ABsistema%C2%BB-o-%C2%ABdatos%C2%BB"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Clase «Sistema» o «Datos»</h3>
<p>Nombres que no significan nada suelen esconder que no se entendió el dominio</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="caso-de-estudio-empresa-de-fabricaci%C3%B3n">Caso de estudio: empresa de fabricación</h2>
<steps>
<step>
<h3 id="el-enunciado-1-de-2">El enunciado (1 de 2)</h3>
<ul>
<li>Un <strong>producto</strong> tiene un nombre y un precio base. Un producto <strong>se forma con</strong> muchas <strong>partes</strong> y cada parte puede formar muchos productos. La <strong>definición</strong> de cada producto especifica <strong>qué cantidad</strong> de cada parte forma a un producto dado</li>
<li>Un <strong>vendedor</strong> tiene un apellido, nombre y un porcentual de comisión</li>
<li>Tanto un <strong>cliente</strong> como un <strong>proveedor</strong> tienen los datos de todo <strong>agente comercial</strong>: cédula, razón social, email, teléfono y dirección. Además un proveedor tiene un <strong>plazo de pago</strong> y un cliente un <strong>porcentual de descuento</strong></li>
</ul>
</step>
<step>
<h3 id="el-enunciado-2-de-2">El enunciado (2 de 2)</h3>
<ul>
<li>Una <strong>parte</strong> puede ser <strong>comprada</strong> a muchos proveedores y un proveedor puede proveer muchas partes. Cada <strong>compra</strong> de una parte tiene una <strong>fecha</strong> y una <strong>cantidad</strong></li>
<li>Una <strong>venta</strong> se realiza entre cualquier vendedor y cualquier cliente, y este puede comprar cualquier producto. De una venta se quiere saber su <strong>fecha</strong></li>
<li><strong>No se pueden vender productos que están formados por una única parte</strong>, esto es, no se permite vender productos sin elaborar</li>
</ul>
</step>
<step>
<h3 id="pistas-para-resolverlo">Pistas para resolverlo</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%AC-herencia-1"><img class="emoji" draggable="false" alt="🧬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ec.svg" data-marp-twemoji=""/> Herencia</h3>
<p>¿Qué comparten <code>Cliente</code> y <code>Proveedor</code>? → ahí está <code>AgenteComercial</code></p>
</div>
<div>
<h3 id="%F0%9F%94%97-clases-asociaci%C3%B3n"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Clases asociación</h3>
<p>Tres relaciones muchos-a-muchos necesitan datos propios: <code>Definicion</code>, <code>Compra</code> y la venta de productos</p>
</div>
<div>
<h3 id="%F0%9F%93%8F-restricci%C3%B3n"><img class="emoji" draggable="false" alt="📏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cf.svg" data-marp-twemoji=""/> Restricción</h3>
<p>La última frase <strong>no se dibuja</strong>: es una restricción <code>{...}</code> o una nota</p>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="actividad-4-modela-la-empresa-de-fabricaci%C3%B3n">Actividad 4: modela la empresa de fabricación</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="qu%C3%A9-entregar">Qué entregar</h3>
<ol>
<li>El <strong>diagrama de clases</strong> del dominio, con atributos</li>
<li>Todas las <strong>multiplicidades</strong></li>
<li>Las <strong>clases asociación</strong> que hagan falta</li>
<li>La restricción del último párrafo, como nota</li>
</ol>
</div>
<div>
<h3 id="preguntas-de-control-2">Preguntas de control</h3>
<ul>
<li>¿<code>Definicion</code> es una clase asociación o una clase normal? ¿Por qué?</li>
<li>¿La relación <code>Producto</code>—<code>Parte</code> es asociación, agregación o composición?</li>
<li>¿<code>Venta</code> conecta dos clases o tres?</li>
<li>¿Quedó algún atributo repetido en dos clases? Si es así, falta una generalización</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 25 minutos · en grupos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="caso-de-fabricaci%C3%B3n-una-soluci%C3%B3n-posible">Caso de fabricación: una solución posible</h2>
<hidden label="Solución">
<p><a href="../assets/ads-uml-caso-fabricacion.png"><img src="../assets/ads-uml-caso-fabricacion.png" alt="" style="height:450px;" /></a></p>
</hidden>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-marpit-scope-D5WkC4ap="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="59" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="86">
<h1 id="diagramas-de-interacci%C3%B3n">Diagramas de interacción</h1>
<h2 id="contenidos-6">Contenidos</h2>
<ul>
<li>Qué modelan y cuándo se usan</li>
<li>Diagrama de secuencia</li>
<li>Fragmentos combinados</li>
<li>Diagrama de comunicación</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="%C2%BFqu%C3%A9-son-los-diagramas-de-interacci%C3%B3n">¿Qué son los diagramas de interacción?</h2>
<split-slide style="--left: 52%; --right: 48%;">
<div>
<ul>
<li>Modelan <strong>cómo colaboran los objetos</strong> para lograr algo: qué mensajes se envían y en qué orden</li>
<li>Son la <strong>realización</strong> de un caso de uso: el paso del <em>qué</em> al <em>cómo</em></li>
<li>UML define cuatro: <strong>secuencia</strong>, <strong>comunicación</strong>, visión general de interacción y tiempos. Los dos primeros son los que se usan a diario</li>
</ul>
</div>
<div>
<h3 id="de-d%C3%B3nde-salen">De dónde salen</h3>
<ol>
<li>Se toma <strong>un escenario</strong> de un caso de uso (el flujo básico, o una alternativa concreta)</li>
<li>Se identifican los <strong>objetos</strong> que participan</li>
<li>Se reparte la responsabilidad: <strong>quién sabe qué</strong> y <strong>quién hace qué</strong></li>
<li>El resultado alimenta el <strong>diagrama de clases de diseño</strong>: cada mensaje recibido es una <strong>operación</strong> de la clase receptora</li>
</ol>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Un diagrama de interacción muestra <strong>un escenario</strong>, no todos los caminos posibles del caso de uso</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="diagrama-de-secuencia">Diagrama de secuencia</h2>
<p><a href="../assets/ads-uml-secuencia.svg"><img src="../assets/ads-uml-secuencia.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="elementos-del-diagrama-de-secuencia">Elementos del diagrama de secuencia</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Elemento</th>
<th style="text-align:left">Notación</th>
<th style="text-align:left">Qué significa</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Línea de vida</strong> <em>(lifeline)</em></td>
<td style="text-align:left">Caja arriba + línea discontinua vertical</td>
<td style="text-align:left">Un participante: objeto, actor o sistema externo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Barra de activación</strong></td>
<td style="text-align:left">Rectángulo delgado sobre la línea de vida</td>
<td style="text-align:left">El participante <strong>tiene el control</strong> en ese lapso</td>
</tr>
<tr>
<td style="text-align:left"><strong>Mensaje síncrono</strong></td>
<td style="text-align:left">Flecha con punta <strong>rellena</strong></td>
<td style="text-align:left">Quien envía <strong>espera</strong> la respuesta antes de seguir</td>
</tr>
<tr>
<td style="text-align:left"><strong>Mensaje asíncrono</strong></td>
<td style="text-align:left">Flecha con punta <strong>abierta</strong></td>
<td style="text-align:left">Quien envía <strong>continúa</strong> sin esperar</td>
</tr>
<tr>
<td style="text-align:left"><strong>Retorno</strong></td>
<td style="text-align:left">Flecha <strong>discontinua</strong> abierta</td>
<td style="text-align:left">La respuesta. Se dibuja solo si aporta información</td>
</tr>
<tr>
<td style="text-align:left"><strong>Creación</strong></td>
<td style="text-align:left">Flecha discontinua <code>«create»</code> hacia la caja</td>
<td style="text-align:left">El objeto <strong>nace</strong> en ese punto; su caja se dibuja más abajo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Destrucción</strong></td>
<td style="text-align:left">✕ al final de la línea de vida</td>
<td style="text-align:left">El objeto <strong>deja de existir</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Auto-mensaje</strong></td>
<td style="text-align:left">Flecha que sale y vuelve al mismo participante</td>
<td style="text-align:left">El objeto se llama a sí mismo</td>
</tr>
</tbody>
</table>
<ul>
<li>El eje <strong>vertical</strong> es el tiempo (importa el <strong>orden</strong>, no la escala); el <strong>horizontal</strong>, los participantes</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="fragmentos-combinados">Fragmentos combinados</h2>
<p><a href="../assets/ads-uml-fragmentos.svg"><img src="../assets/ads-uml-fragmentos.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="64" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="diagrama-de-comunicaci%C3%B3n">Diagrama de comunicación</h2>
<p><a href="../assets/ads-uml-comunicacion.svg"><img src="../assets/ads-uml-comunicacion.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="65" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="secuencia-vs-comunicaci%C3%B3n">Secuencia vs. comunicación</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%E2%8F%B1%EF%B8%8F-secuencia"><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> Secuencia</h3>
<p><strong>Resalta el tiempo</strong></p>
<ul>
<li>El orden se lee de arriba abajo, sin esfuerzo</li>
<li>Ideal para explicar <strong>un escenario complejo</strong> con condiciones y ciclos</li>
<li>Soporta fragmentos combinados (<code>alt</code>, <code>loop</code>, <code>par</code>)</li>
<li>Se vuelve inmanejable con muchos participantes</li>
<li><strong>Es el que se usa el 90 % de las veces</strong></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%95%B8%EF%B8%8F-comunicaci%C3%B3n"><img class="emoji" draggable="false" alt="🕸️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f578.svg" data-marp-twemoji=""/> Comunicación</h3>
<p><strong>Resalta la estructura</strong></p>
<ul>
<li>Muestra <strong>quién está conectado con quién</strong>: los enlaces</li>
<li>Bueno para detectar objetos con <strong>demasiadas conexiones</strong> (mal diseño)</li>
<li>El orden se lee en la <strong>numeración jerárquica</strong> (<code>1</code>, <code>1.1</code>, <code>1.1.1</code>)</li>
<li>Se satura rápido si hay muchos mensajes</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> <strong>Son semánticamente equivalentes</strong>: una herramienta puede convertir uno en otro sin perder información</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Elige por la pregunta: <em>¿en qué orden pasa?</em> → secuencia · <em>¿quién habla con quién?</em> → comunicación</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-marpit-scope-mF5I5kkJ="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="66" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="86">
<h1 id="despliegue-y-componentes">Despliegue y componentes</h1>
<h2 id="contenidos-7">Contenidos</h2>
<ul>
<li>Diagrama de despliegue: la arquitectura física</li>
<li>Diagrama de componentes: las piezas lógicas</li>
<li>Cuándo vale la pena dibujarlos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="67" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="diagrama-de-despliegue">Diagrama de despliegue</h2>
<p><a href="../assets/ads-uml-despliegue.svg"><img src="../assets/ads-uml-despliegue.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="68" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="cu%C3%A1ndo-vale-la-pena-un-diagrama-de-despliegue">Cuándo vale la pena un diagrama de despliegue</h2>
<div class="grid">
<div>
<h3 id="%E2%9C%85-s%C3%AD-cuando"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Sí, cuando…</h3>
<ul>
<li>El sistema es <strong>distribuido</strong>: varias máquinas, varios servicios</li>
<li>Hay <strong>requisitos no funcionales</strong> de disponibilidad, latencia o escalado</li>
<li>Hay que explicarle la topología a <strong>operaciones</strong> o a seguridad</li>
<li>Se está diseñando el <strong>plan de despliegue</strong> o el diagrama de red</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%9A%AB-no-hace-falta-cuando"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> No hace falta cuando…</h3>
<ul>
<li>Todo corre en <strong>una sola máquina</strong> y nadie lo va a discutir</li>
<li>El diagrama solo repetiría lo que ya dice un <code>docker-compose.yml</code></li>
<li>Se dibuja «porque toca», sin que nadie tenga una decisión que tomar</li>
</ul>
</div>
</div>
<table>
<thead>
<tr>
<th style="text-align:left">Pregunta del negocio</th>
<th style="text-align:left">Lo que se ve en el diagrama</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">«¿Aguanta 5 000 usuarios?»</td>
<td style="text-align:left">La multiplicidad <code>1..*</code> en el nodo de aplicación → hay balanceo</td>
</tr>
<tr>
<td style="text-align:left">«¿Y si se cae la base de datos?»</td>
<td style="text-align:left">Un solo nodo de BD sin réplica → punto único de falla</td>
</tr>
<tr>
<td style="text-align:left">«¿Los datos viajan cifrados?»</td>
<td style="text-align:left">El estereotipo de la ruta de comunicación: <code>«HTTPS»</code> vs <code>«HTTP»</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="69" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="diagrama-de-componentes">Diagrama de componentes</h2>
<p><a href="../assets/ads-uml-componentes.svg"><img src="../assets/ads-uml-componentes.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="70" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="componentes-clases-paquetes-y-nodos">Componentes, clases, paquetes y nodos</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Diagrama</th>
<th style="text-align:left">Unidad</th>
<th style="text-align:left">Responde</th>
<th style="text-align:left">Nivel</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Clases</strong></td>
<td style="text-align:left">Clase</td>
<td style="text-align:left">¿Qué conceptos hay y cómo se relacionan?</td>
<td style="text-align:left">Detalle lógico</td>
</tr>
<tr>
<td style="text-align:left"><strong>Paquetes</strong></td>
<td style="text-align:left">Paquete</td>
<td style="text-align:left">¿Cómo se agrupa el modelo y qué depende de qué?</td>
<td style="text-align:left">Organización lógica</td>
</tr>
<tr>
<td style="text-align:left"><strong>Componentes</strong></td>
<td style="text-align:left">Componente</td>
<td style="text-align:left">¿Qué piezas reemplazables hay y qué contratos ofrecen?</td>
<td style="text-align:left">Arquitectura lógica</td>
</tr>
<tr>
<td style="text-align:left"><strong>Despliegue</strong></td>
<td style="text-align:left">Nodo + artefacto</td>
<td style="text-align:left">¿Dónde se instala cada pieza y con qué protocolo se hablan?</td>
<td style="text-align:left">Arquitectura física</td>
</tr>
</tbody>
</table>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%A9-componente-vs-paquete"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Componente vs. paquete</h3>
<p>El <strong>paquete</strong> solo agrupa. El <strong>componente</strong> además <strong>encapsula</strong>: expone interfaces y esconde su interior</p>
</div>
<div>
<h3 id="%F0%9F%93%A6-componente-vs-artefacto"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Componente vs. artefacto</h3>
<p>El componente es la <strong>pieza lógica</strong> (<code>GestionMatricula</code>); el artefacto es el <strong>archivo físico</strong> que la contiene (<code>matricula.war</code>)</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-marpit-scope-kHStEdop="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="71" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="86">
<h1 id="actividad-y-m%C3%A1quinas-de-estado">Actividad y máquinas de estado</h1>
<h2 id="contenidos-8">Contenidos</h2>
<ul>
<li>Diagrama de actividad: el flujo del proceso</li>
<li>Notación y elementos</li>
<li>Casos de estudio</li>
<li>Máquinas de estado: el ciclo de vida de un objeto</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="72" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="diagrama-de-actividad-conceptos">Diagrama de actividad: conceptos</h2>
<split-slide style="--left: 52%; --right: 48%;">
<div>
<ul>
<li>Los diagramas de actividad modelan el <strong>flujo, o proceso</strong>, en un sistema. Por lo tanto, se parecen a los diagramas de flujo</li>
<li>El modelado de un flujo se puede realizar a <strong>tres niveles</strong>:</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%8F%A2-proceso-de-negocio"><img class="emoji" draggable="false" alt="🏢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3e2.svg" data-marp-twemoji=""/> Proceso de negocio</h3>
<p>Cómo trabaja la organización</p>
</div>
<div>
<h3 id="%F0%9F%93%84-dentro-de-un-caso-de-uso"><img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c4.svg" data-marp-twemoji=""/> Dentro de un caso de uso</h3>
<p>El flujo básico y sus alternativas</p>
</div>
<div>
<h3 id="%F0%9F%94%80-entre-casos-de-uso"><img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f500.svg" data-marp-twemoji=""/> Entre casos de uso</h3>
<p>Cómo se encadenan varios</p>
</div>
</div>
</div>
<div>
<h3 id="por-qu%C3%A9-se-usa-tanto">Por qué se usa tanto</h3>
<ul>
<li>Es el <strong>único</strong> diagrama UML que un usuario no técnico entiende sin explicación previa</li>
<li>Hace visibles los <strong>traspasos</strong> entre áreas, que es donde se pierde el tiempo en los procesos reales</li>
<li>Sirve igual para <strong>documentar el proceso actual</strong> que para <strong>proponer el mejorado</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="73" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="notaci%C3%B3n-del-diagrama-de-actividad">Notación del diagrama de actividad</h2>
<p><a href="../assets/ads-uml-act-notacion.png"><img src="../assets/ads-uml-act-notacion.png" alt="" style="height:400px;" /></a></p>
<blockquote>
<p><em>Notación del diagrama de actividades</em>. Unhelkar (2018)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="74" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="elementos-uno-por-uno">Elementos, uno por uno</h2>
<steps>
<step>
<h3 id="actividad--acci%C3%B3n-activity--action-state">Actividad / acción <em>(activity / action state)</em></h3>
<ul>
<li>
<p>Representa algún tipo de <strong>procesamiento</strong>: «Vender producto», «Reservar libro», «Seleccionar tipo de combustible»</p>
</li>
<li>
<p>Una <strong>actividad</strong> es susceptible de descomponerse en varias sub-actividades, que se detallan aparte en otro diagrama de actividad</p>
</li>
<li>
<p>Algunos autores distinguen entre <strong>actividades</strong> y <strong>acciones</strong>: las segundas son <strong>atómicas</strong>, no pueden descomponerse</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Nombre en formato <strong>verbo + objeto</strong>: <code>Registrar pedido</code>, no <code>Pedido</code> ni <code>Registro</code></p>
</li>
</ul>
</step>
<step>
<h3 id="estado-inicial-y-estado-final">Estado inicial y estado final</h3>
<div class="grid">
<div>
<h3 id="%E2%9A%AB-estado-inicial"><img class="emoji" draggable="false" alt="⚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26ab.svg" data-marp-twemoji=""/> Estado inicial</h3>
<p>Identifica el <strong>origen</strong> de las transiciones por las que va a pasar el flujo. Un diagrama de actividades tiene <strong>un solo</strong> estado inicial</p>
</div>
<div>
<h3 id="%E2%A6%BF-estado-final">⦿ Estado final</h3>
<p>Es el <strong>último eslabón</strong> del flujo de transiciones. Puede haber <strong>varios</strong> en un mismo diagrama</p>
</div>
</div>
<h3 id="transici%C3%B3n-control-flow">Transición <em>(control-flow)</em></h3>
<ul>
<li>Refleja el <strong>paso de una actividad a otra</strong>; indica así la <strong>precedencia</strong> entre dos actividades</li>
<li>Se dibuja como una flecha simple. Si sale de una decisión, lleva una <strong>guarda</strong> entre corchetes</li>
</ul>
</step>
<step>
<h3 id="decisi%C3%B3n-if">Decisión <em>(if)</em></h3>
<ul>
<li>En base a una <strong>condición</strong> se procesará una acción u otra</li>
<li>Notación: <strong>rombo</strong>. Cada rama sale etiquetada con su guarda: <code>[hay cupo]</code> / <code>[else]</code></li>
<li>Las guardas deben ser <strong>excluyentes</strong> y <strong>cubrir todos los casos</strong></li>
</ul>
<h3 id="regiones-o-particiones-swimlanes">Regiones o particiones <em>(swimlanes)</em></h3>
<ul>
<li>Permiten identificar las <strong>responsabilidades de los diferentes actores</strong> en un caso de uso</li>
<li>Las actividades y el flujo se van <strong>particionando</strong> de manera que queda claro qué acción debe ejecutar cada actor</li>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Cada flecha que <strong>cruza</strong> de una calle a otra es un <strong>traspaso</strong>: ahí vive el riesgo y el retraso del proceso</li>
</ul>
</step>
<step>
<h3 id="acciones-concurrentes-fork--join">Acciones concurrentes <em>(fork / join)</em></h3>
<ul>
<li>Son actividades que pueden ocurrir <strong>en paralelo</strong></li>
<li>El <strong>fork</strong> (barra gruesa que se abre) divide el flujo; el <strong>join</strong> (barra que se cierra) lo vuelve a unir</li>
</ul>
<blockquote>
<p>En un lavado de autos, una vez lavada la carrocería hay personas encargadas de lustrar el interior y de dar brillo a las ruedas</p>
</blockquote>
<ul>
<li>El <strong>join</strong> implica que las actividades posteriores deben <strong>sincronizar</strong> las tareas ejecutadas en paralelo: lustrar el interior y lavar las ruedas deben <strong>completarse ambas</strong> para que siga la acción siguiente</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Todo lo que se abre con un <code>fork</code> debe cerrarse con un <code>join</code></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="75" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="ejemplo-registro-de-un-paciente">Ejemplo: registro de un paciente</h2>
<p><a href="../assets/ads-uml-act-paciente.png"><img src="../assets/ads-uml-act-paciente.png" alt="" style="height:440px;" /></a></p>
<blockquote>
<p><em>RegistersPatient activity diagram</em>. Unhelkar (2018)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="76" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="caso-de-estudio-cuenta-corriente">Caso de estudio: cuenta corriente</h2>
<steps>
<step>
<h3 id="el-escenario">El escenario</h3>
<ul>
<li>Vamos a modelar el <strong>pago de un cliente</strong> a través de un cajero por mostrador</li>
<li>El cajero <strong>identifica al cliente</strong> en la cuenta corriente del sistema, seleccionando el criterio de búsqueda:</li>
</ul>
<p><a href="../assets/ads-uml-act-cc-pantalla1.png"><img src="../assets/ads-uml-act-cc-pantalla1.png" alt="" style="height:220px;" /></a></p>
</step>
<step>
<h3 id="el-cliente-elige-c%C3%B3mo-pagar">El cliente elige cómo pagar</h3>
<ul>
<li>El cajero le indica los <strong>comprobantes pendientes de pago</strong>; entonces el cliente elige el <strong>medio de pago</strong> y los comprobantes a cancelar:</li>
</ul>
<p><a href="../assets/ads-uml-act-cc-pantalla2.png"><img src="../assets/ads-uml-act-cc-pantalla2.png" alt="" style="height:250px;" /></a></p>
</step>
<step>
<h3 id="lo-que-hace-el-sistema">Lo que hace el sistema</h3>
<ul>
<li>Si el medio de pago es <strong>tarjeta de crédito</strong>, el sistema debe informar al sistema externo <em>«Tarjeting System»</em></li>
<li>Además el sistema:
<ul>
<li><strong>Aplicará los comprobantes pagados</strong> —actualizará los montos pendientes de cada comprobante— generando el <strong>recibo</strong> correspondiente</li>
<li><strong>Actualizará la deuda</strong> del cliente</li>
<li><strong>Notificará a contabilidad</strong> para generar el asiento que refleje el pago en la contabilidad</li>
</ul>
</li>
</ul>
</step>
<step>
<h3 id="el-m%C3%A9todo-para-construirlo">El método para construirlo</h3>
<ol>
<li>Encontrar los <strong>actores</strong> de este caso de uso y qué <strong>responsabilidades</strong> cumplen → serán las <strong>calles</strong></li>
<li>Identificar las <strong>actividades/acciones</strong> que componen el caso de uso: si hay <strong>concurrencia</strong> (forks), <strong>decisiones</strong> (ifs) y cuál es el <strong>orden</strong> que sigue cada una (flujos de control)</li>
<li>Identificar si alguna de las acciones <strong>recibe o produce un objeto</strong></li>
</ol>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Posiblemente <strong>todas</strong> las acciones generan algún tipo de objeto —un recibo, un criterio de selección, un asiento contable— pero solo se muestran los objetos que <strong>sea importante mostrar</strong></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="77" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="actividad-5-construye-el-diagrama-de-cuenta-corriente">Actividad 5: construye el diagrama de cuenta corriente</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="qu%C3%A9-hacer-2">Qué hacer</h3>
<ol>
<li>Definan las <strong>calles</strong>: ¿cuántos actores intervienen?</li>
<li>Coloquen las actividades en la calle de quien las ejecuta</li>
<li>Marquen la <strong>decisión</strong> del medio de pago</li>
<li>Muestren el objeto <strong>Recibo</strong> donde se produce</li>
</ol>
</div>
<div>
<h3 id="preguntas-de-control-3">Preguntas de control</h3>
<ul>
<li>¿El <em>Tarjeting System</em> es una calle o una actividad?</li>
<li>¿Las tres acciones finales del sistema son <strong>secuenciales</strong> o van en un <code>fork</code>?</li>
<li>¿Cuántas flechas <strong>cruzan</strong> de una calle a otra?</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 20 minutos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="78" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="cuenta-corriente-una-soluci%C3%B3n-posible">Cuenta corriente: una solución posible</h2>
<hidden label="Solución">
<p><a href="../assets/da-cuenta-corriente-cajero.png"><img src="../assets/da-cuenta-corriente-cajero.png" alt="" style="height:450px;" /></a></p>
</hidden>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="79" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="concurrencia-el-caso-del-fast-food">Concurrencia: el caso del <em>fast food</em></h2>
<steps>
<step>
<h3 id="el-escenario-1">El escenario</h3>
<ul>
<li>El diagrama de actividades también resulta útil para mostrar <strong>transiciones simultáneas</strong>. Pensemos cómo es la operación de un local de comida rápida:
<ol>
<li>Hacemos el <strong>pedido</strong> al cajero, en base a las 213 promociones posibles de hamburguesas con papas fritas</li>
<li>El cajero hace el pedido por altavoz, o bien se lanza en una carrera meteórica para <strong>llenar la gaseosa</strong>, <strong>recibir la hamburguesa</strong>, <strong>capturar las papas fritas</strong>, <strong>emitir el ticket</strong> y, al mismo tiempo, <strong>cobrarnos</strong> — ¡eso es lo que se dice concurrencia!</li>
<li>Por último, nos pregunta si queremos <strong>agregar aderezos</strong> y nos da la bandeja con sonrisa angelical</li>
</ol>
</li>
</ul>
</step>
<step>
<h3 id="la-soluci%C3%B3n">La solución</h3>
<ul>
<li>Tomaremos como una <strong>acción atómica</strong> la preparación de la comida. Lo que interesa es cómo mostrar las actividades que <strong>se superponen en el tiempo</strong></li>
</ul>
<p><a href="../assets/ads-uml-act-fastfood.png"><img src="../assets/ads-uml-act-fastfood.png" alt="" style="height:330px;" /></a></p>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="80" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="%C2%BFqui%C3%A9n-lo-hace-y-para-qui%C3%A9n">¿Quién lo hace y para quién?</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Pregunta</th>
<th style="text-align:left">Respuesta</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>¿Quién hace</strong> el diagrama de actividad?</td>
<td style="text-align:left">La persona <strong>analista funcional</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>¿Para quién</strong> es?</td>
<td style="text-align:left">Puede servir para el <strong>usuario final</strong>: no estamos explicando técnicamente cómo resolver el problema. Es útil para mostrar los <strong>actores</strong> que intervienen en cada caso de uso y su <strong>responsabilidad</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>¿Y para quien programa?</strong></td>
<td style="text-align:left">Le sirve como <strong>visión general</strong> del proceso, como explicación funcional del código que va a desarrollar — pero no mucho más que eso</td>
</tr>
<tr>
<td style="text-align:left"><strong>¿Cuándo</strong> conviene hacerlo?</td>
<td style="text-align:left">Cuando queramos <strong>analizar un proceso</strong> —para entenderlo o para mejorarlo— sin necesidad de bajar al detalle de cómo implementarlo</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Es el diagrama con mejor relación <strong>esfuerzo / valor</strong> en las primeras reuniones con el usuario</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="81" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="m%C3%A1quina-de-estados">Máquina de estados</h2>
<p><a href="../assets/ads-uml-estados.svg"><img src="../assets/ads-uml-estados.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="82" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="elementos-de-la-m%C3%A1quina-de-estados">Elementos de la máquina de estados</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Elemento</th>
<th style="text-align:left">Notación</th>
<th style="text-align:left">Qué significa</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Estado</strong></td>
<td style="text-align:left">Rectángulo redondeado</td>
<td style="text-align:left">Una <strong>situación</strong> en la vida del objeto en la que satisface una condición o espera un evento</td>
</tr>
<tr>
<td style="text-align:left"><strong>Estado inicial</strong></td>
<td style="text-align:left">Círculo relleno <img class="emoji" draggable="false" alt="⚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26ab.svg" data-marp-twemoji=""/></td>
<td style="text-align:left">Dónde empieza la vida del objeto. Solo uno</td>
</tr>
<tr>
<td style="text-align:left"><strong>Estado final</strong></td>
<td style="text-align:left">Círculo con anillo ⦿</td>
<td style="text-align:left">Fin del ciclo de vida. Puede haber varios</td>
</tr>
<tr>
<td style="text-align:left"><strong>Transición</strong></td>
<td style="text-align:left">Flecha entre estados</td>
<td style="text-align:left">El paso de un estado a otro</td>
</tr>
<tr>
<td style="text-align:left"><strong>Evento</strong></td>
<td style="text-align:left"><code>confirmarPago()</code></td>
<td style="text-align:left">El <strong>disparador</strong> de la transición</td>
</tr>
<tr>
<td style="text-align:left"><strong>Guarda</strong></td>
<td style="text-align:left"><code>[fondos suficientes]</code></td>
<td style="text-align:left"><strong>Condición</strong> que debe cumplirse para que la transición ocurra</td>
</tr>
<tr>
<td style="text-align:left"><strong>Acción</strong></td>
<td style="text-align:left"><code>/ generarFactura()</code></td>
<td style="text-align:left">Lo que se <strong>ejecuta</strong> durante la transición</td>
</tr>
<tr>
<td style="text-align:left"><strong>Actividades internas</strong></td>
<td style="text-align:left"><code>entry</code> · <code>do</code> · <code>exit</code></td>
<td style="text-align:left">Al <strong>entrar</strong>, <strong>mientras permanece</strong> y al <strong>salir</strong> del estado</td>
</tr>
</tbody>
</table>
<ul>
<li>Sintaxis completa de una transición: <code>evento [guarda] / acción</code> — los tres son opcionales, el orden no</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="83" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="estados-compuestos-e-historia">Estados compuestos e historia</h2>
<steps>
<step>
<h3 id="estado-compuesto">Estado compuesto</h3>
<ul>
<li>Un estado puede <strong>contener</strong> su propia máquina de estados</li>
<li>Evita la explosión de transiciones: si desde cualquier subestado se puede <code>cancelar()</code>, se dibuja <strong>una sola</strong> transición desde el borde del estado compuesto</li>
</ul>
<pre><code>┌─ EnProceso ─────────────────────────────┐
│  <img class="emoji" draggable="false" alt="⚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26ab.svg" data-marp-twemoji=""/>→ Pagado ──despachar()──▸ EnTransito  │
└─────────────────────────────────────────┘
        │ cancelar()
        ▼
    Cancelado
</code></pre>
</step>
<step>
<h3 id="otros-elementos-%C3%BAtiles">Otros elementos útiles</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%95%98-pseudoestado-de-historia-h"><img class="emoji" draggable="false" alt="🕘" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f558.svg" data-marp-twemoji=""/> Pseudoestado de historia (H)</h3>
<p>Al volver a entrar en un estado compuesto, <strong>retoma el subestado</strong> donde se quedó</p>
</div>
<div>
<h3 id="%F0%9F%94%80-transici%C3%B3n-autom%C3%A1tica"><img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f500.svg" data-marp-twemoji=""/> Transición automática</h3>
<p>Sin evento: se dispara <strong>al terminar</strong> la actividad <code>do</code> del estado</p>
</div>
<div>
<h3 id="%F0%9F%94%81-auto-transici%C3%B3n"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> Auto-transición</h3>
<p>Sale y vuelve al mismo estado: <strong>sí</strong> ejecuta <code>exit</code> y <code>entry</code> otra vez</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Cuidado con el <strong>estado implícito en un atributo</strong>: si tienen un campo <code>estado</code> de tipo texto con ocho valores posibles y condicionales por todas partes, esa es exactamente la señal de que hacía falta esta máquina de estados</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="84" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="actividad-vs-m%C3%A1quina-de-estados">Actividad vs. máquina de estados</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%94%80-diagrama-de-actividad"><img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f500.svg" data-marp-twemoji=""/> Diagrama de actividad</h3>
<p><strong>El flujo de un proceso</strong></p>
<ul>
<li>El sujeto es <strong>el proceso</strong>: varios actores participan</li>
<li>Los nodos son <strong>acciones</strong> que alguien ejecuta</li>
<li>Las particiones dicen <strong>quién hace qué</strong></li>
<li>Se lee de arriba abajo, como un procedimiento</li>
<li><em>«¿Cómo se tramita una matrícula?»</em></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%94%B5-m%C3%A1quina-de-estados"><img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f535.svg" data-marp-twemoji=""/> Máquina de estados</h3>
<p><strong>El ciclo de vida de un objeto</strong></p>
<ul>
<li>El sujeto es <strong>un solo objeto</strong>: <code>Pedido</code>, <code>Reserva</code>, <code>Sesion</code></li>
<li>Los nodos son <strong>situaciones</strong> en que se encuentra</li>
<li>Las transiciones dicen <strong>qué evento</strong> lo cambia</li>
<li>No hay orden global: hay eventos que llegan</li>
<li><em>«¿Por qué estados pasa un pedido?»</em></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>«Modelar cómo se procesa una devolución, con el almacén y contabilidad»</em> → <spoiler>actividad</spoiler></li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>«Modelar en qué situaciones puede estar una reserva de hotel»</em> → <spoiler>máquina de estados</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="85" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">

<p><strong>Trazabilidad</strong>: cada diagrama se justifica en el anterior. Un diagrama huérfano sobra</p>

<h3 id="%E2%9A%A0%EF%B8%8F-la-prueba-final"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> La prueba final</h3>
