<p>Curso <strong>Análisis y Diseño de Sistemas</strong> <br />II Semestre 2026</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="%C2%BFd%C3%B3nde-estamos">¿Dónde estamos?</h2>
<ul>
<li>Ya sabemos <strong>qué</strong> debe hacer el sistema: visión, requerimientos, casos de uso, modelo de negocio</li>
<li>El problema ahora es otro: <strong>¿cómo comunicamos la estructura y el comportamiento de la solución</strong> sin escribir todavía el código?</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%A0-paradigma"><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e0.svg" data-marp-twemoji=""/> Paradigma</h3>
<p>El <strong>análisis y diseño orientado a objetos</strong>: la forma de pensar el problema</p>
</div>
<div>
<h3 id="%F0%9F%97%A3%EF%B8%8F-lenguaje"><img class="emoji" draggable="false" alt="🗣️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5e3.svg" data-marp-twemoji=""/> Lenguaje</h3>
<p><strong>UML</strong>: la notación estándar para escribir lo que pensamos</p>
</div>
<div>
<h3 id="%F0%9F%93%90-diagramas"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> Diagramas</h3>
<p>Catorce vistas distintas del mismo modelo, cada una para una pregunta distinta</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Ojo con la confusión más común: <strong>UML no es una metodología</strong>, es un <strong>lenguaje</strong>. Dibujar diagramas no es hacer análisis</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-2d0DxgxL="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="3" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="86">
<h1 id="el-an%C3%A1lisis-y-dise%C3%B1o-orientado-a-objetos-y-el-uml">El análisis y diseño orientado a objetos y el UML</h1>
<h2 id="contenidos-1">Contenidos</h2>
<ul>
<li>Por qué orientado a objetos</li>
<li>Conceptos base del paradigma</li>
<li>Análisis OO vs. Diseño OO</li>
<li>Dónde encaja UML</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="%C2%BFpor-qu%C3%A9-orientado-a-objetos">¿Por qué orientado a objetos?</h2>
<steps>
<step>
<h3 id="el-problema-la-brecha-de-abstracci%C3%B3n">El problema: la brecha de abstracción</h3>
<ul>
<li>El mundo real está lleno de <strong>cosas</strong>: un estudiante, un curso, una factura, un préstamo</li>
<li>Los enfoques estructurados clásicos parten esas cosas en dos mitades: <strong>datos</strong> por un lado, <strong>procesos</strong> por otro</li>
<li>Cada cambio del negocio obliga a tocar las dos mitades, en archivos distintos, con criterios distintos</li>
</ul>
</step>
<step>
<h3 id="la-propuesta-oo">La propuesta OO</h3>
<ul>
<li>Un <strong>objeto</strong> mantiene juntos los datos y el comportamiento que los usa</li>
<li>El vocabulario del código se parece al <strong>vocabulario del negocio</strong>: <code>Estudiante</code>, <code>Curso</code>, <code>Matricula</code></li>
<li>La distancia entre <em>lo que dice el usuario</em> y <em>lo que dice el código</em> se acorta</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%A9-continuidad"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Continuidad</h3>
<p>El mismo concepto atraviesa análisis → diseño → código</p>
</div>
<div>
<h3 id="%F0%9F%94%81-localidad-del-cambio"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> Localidad del cambio</h3>
<p>Si cambia la regla de una entidad, cambia <strong>una</strong> clase</p>
</div>
<div>
<h3 id="%E2%99%BB%EF%B8%8F-reutilizaci%C3%B3n"><img class="emoji" draggable="false" alt="♻️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/267b.svg" data-marp-twemoji=""/> Reutilización</h3>
<p>Herencia, interfaces y composición dan piezas intercambiables</p>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="conceptos-base-del-paradigma">Conceptos base del paradigma</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%8E%AD-abstracci%C3%B3n"><img class="emoji" draggable="false" alt="🎭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ad.svg" data-marp-twemoji=""/> Abstracción</h3>
<p>Quedarse solo con los detalles <strong>relevantes para un propósito</strong>. Un <code>Estudiante</code> en matrícula no necesita su tipo de sangre</p>
</div>
<div>
<h3 id="%F0%9F%93%A6-encapsulamiento"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Encapsulamiento</h3>
<p>El objeto <strong>esconde su estado</strong> y lo expone por operaciones. Nadie toca <code>saldo</code> directamente</p>
</div>
<div>
<h3 id="%F0%9F%A7%AC-herencia"><img class="emoji" draggable="false" alt="🧬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ec.svg" data-marp-twemoji=""/> Herencia</h3>
<p>Una clase <strong>especializa</strong> a otra reutilizando su estructura y comportamiento</p>
</div>
<div>
<h3 id="%F0%9F%94%84-polimorfismo"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> Polimorfismo</h3>
<p>El mismo mensaje produce <strong>respuestas distintas</strong> según el tipo real del objeto</p>
</div>
</div>
<table>
<thead>
<tr>
<th style="text-align:left">Término</th>
<th style="text-align:left">Qué es</th>
<th style="text-align:left">Ejemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Clase</strong></td>
<td style="text-align:left">El molde: define atributos y operaciones</td>
<td style="text-align:left"><code>Estudiante</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Objeto</strong></td>
<td style="text-align:left">Una instancia concreta con identidad propia</td>
<td style="text-align:left"><code>e1 : Estudiante</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Atributo</strong></td>
<td style="text-align:left">Propiedad que describe al objeto</td>
<td style="text-align:left"><code>carne = &quot;B12345&quot;</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Operación</strong></td>
<td style="text-align:left">Servicio que el objeto sabe prestar</td>
<td style="text-align:left"><code>matricular(curso)</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Mensaje</strong></td>
<td style="text-align:left">Petición de un objeto a otro</td>
<td style="text-align:left"><code>e1.matricular(c)</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="an%C3%A1lisis-oo-vs-dise%C3%B1o-oo">Análisis OO vs. Diseño OO</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%94%8D-an%C3%A1lisis-orientado-a-objetos"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> Análisis orientado a objetos</h3>
<p>Pregunta: <strong>¿qué hay en el dominio del problema?</strong></p>
<ul>
<li>Identificar <strong>conceptos del negocio</strong>, no clases de software</li>
<li>Sin tecnología, sin pantallas, sin base de datos</li>
<li>Producto: <strong>modelo de dominio</strong> (diagrama de clases conceptual)</li>
<li>Vocabulario del <strong>usuario</strong></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%9B%A0%EF%B8%8F-dise%C3%B1o-orientado-a-objetos"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Diseño orientado a objetos</h3>
<p>Pregunta: <strong>¿cómo lo va a resolver el software?</strong></p>
<ul>
<li>Definir <strong>clases de software</strong>, responsabilidades y colaboraciones</li>
<li>Aparecen controladores, repositorios, servicios, interfaces</li>
<li>Producto: <strong>diagramas de clases de diseño e interacción</strong></li>
<li>Vocabulario de la <strong>solución</strong></li>
</ul>
</div>
</split-slide>
<blockquote>
<p>«La principal tarea del análisis orientado a objetos es identificar los conceptos del dominio del problema y documentar el resultado en un modelo de dominio»</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="la-cadena-de-trazabilidad">La cadena de trazabilidad</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Artefacto</th>
<th style="text-align:left">Nivel de abstracción</th>
<th style="text-align:left">De dónde viene</th>
<th style="text-align:left">UML que se usa</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Casos de uso</strong></td>
<td style="text-align:left">Problema del negocio</td>
<td style="text-align:left">Visión y requerimientos</td>
<td style="text-align:left">Diagrama de casos de uso</td>
</tr>
<tr>
<td style="text-align:left"><strong>Modelo de dominio</strong></td>
<td style="text-align:left">Problema del negocio</td>
<td style="text-align:left">Sustantivos de los casos de uso</td>
<td style="text-align:left">Diagrama de <strong>clases</strong> conceptual</td>
</tr>
<tr>
<td style="text-align:left"><strong>Realización de caso de uso</strong></td>
<td style="text-align:left">Especificación</td>
<td style="text-align:left">Flujo del caso de uso</td>
<td style="text-align:left">Diagramas de <strong>interacción</strong> y <strong>actividad</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Diseño de clases</strong></td>
<td style="text-align:left">Solución lógica</td>
<td style="text-align:left">Modelo de dominio + interacciones</td>
<td style="text-align:left">Diagrama de <strong>clases</strong> de diseño</td>
</tr>
<tr>
<td style="text-align:left"><strong>Arquitectura física</strong></td>
<td style="text-align:left">Solución física</td>
<td style="text-align:left">Diseño lógico</td>
<td style="text-align:left"><strong>Componentes</strong> y <strong>despliegue</strong></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Cada fila <strong>se justifica en la anterior</strong>: si un diagrama no puede rastrearse hacia arriba, sobra</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="uml-no-es-un-m%C3%A9todo">UML no es un método</h2>
<steps>
<step>
<h3 id="lo-que-uml-s%C3%AD-es">Lo que UML <strong>sí</strong> es</h3>
<ul>
<li>Un <strong>lenguaje</strong>: vocabulario (elementos) + gramática (reglas de combinación) + semántica (qué significa cada símbolo)</li>
<li>Un <strong>estándar abierto</strong> del <a href="https://www.omg.org">OMG</a>, independiente de cualquier fabricante</li>
<li><strong>Independiente del proceso</strong>: sirve en RUP, en Scrum, en cascada o sin proceso alguno</li>
</ul>
</step>
<step>
<h3 id="lo-que-uml-no-es">Lo que UML <strong>no</strong> es</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%9A%AB-no-es-una-metodolog%C3%ADa"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> No es una metodología</h3>
<p>No te dice <strong>qué hacer primero</strong> ni cuándo. Eso lo pone el proceso (RUP, OpenUP, Scrum…)</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-no-es-un-lenguaje-de-programaci%C3%B3n"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> No es un lenguaje de programación</h3>
<p>No se ejecuta. Se pueden generar esqueletos de código, pero no es programación visual</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-no-es-%C2%ABdibujar-bonito%C2%BB"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> No es «dibujar bonito»</h3>
<p>Un diagrama sin decisión detrás es decoración. Si no responde una pregunta, no lo dibujes</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> UML rinde más en procesos <strong>dirigidos por casos de uso, centrados en la arquitectura, iterativos e incrementales</strong></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="actividad-1-del-enunciado-a-los-conceptos">Actividad 1: del enunciado a los conceptos</h2>
<blockquote>
<p>«El sistema debe permitir que un estudiante se matricule en los cursos que oferta la Escuela cada semestre. Cada curso tiene un profesor asignado y un cupo máximo. Al matricularse se genera una matrícula con la fecha y el estado. Si el curso está lleno, el estudiante entra en una lista de espera.»</p>
</blockquote>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="qu%C3%A9-hacer">Qué hacer</h3>
<ol>
<li>Subrayen los <strong>sustantivos</strong> del enunciado</li>
<li>Descarten los que son <strong>atributos</strong> (<code>fecha</code>, <code>estado</code>, <code>cupo máximo</code>)</li>
<li>Descarten los que son <strong>sinónimos</strong> o están fuera del alcance</li>
<li>Lo que queda son <strong>clases conceptuales candidatas</strong></li>
</ol>
</div>
<div>
<h3 id="preguntas-de-control">Preguntas de control</h3>
<ul>
<li>¿<code>Semestre</code> es una clase o un atributo de <code>Matricula</code>?</li>
<li>¿<code>Lista de espera</code> es una clase o una asociación con estado?</li>
<li>¿Qué <strong>verbos</strong> conectan a esas clases? → esos serán las <strong>asociaciones</strong></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 15 minutos · lo volveremos a usar cuando veamos diagramas de clases</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-S8R6rG4t="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="10" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="86">
<h1 id="introducci%C3%B3n-a-uml">Introducción a UML</h1>
<h2 id="contenidos-2">Contenidos</h2>
<ul>
<li>Qué es un modelo y para qué sirve</li>
<li>Qué es UML y de dónde viene</li>
<li>Los cinco propósitos de UML</li>
<li>Conceptos de modelado y vistas arquitecturales</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="%C2%BFqu%C3%A9-es-un-modelo">¿Qué es un modelo?</h2>
<split-slide style="--left: 46%; --right: 54%;">
<div>
<ul>
<li>Un <strong>modelo</strong> es una <strong>abstracción</strong> de un sistema o entidad del mundo real</li>
<li>Una <strong>abstracción</strong> es una simplificación que incluye <strong>solo los detalles relevantes</strong> para un propósito determinado</li>
<li>El modelado permite abordar la <strong>complejidad</strong>: nadie entiende un sistema entero de una sola vez</li>
</ul>
</div>
<div>
<p><img src="../assets/ads-uml-modelo-sistema.png" alt="contain" style="width:520px;" /></p>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> <strong>Todo modelo es incompleto a propósito.</strong> La pregunta correcta no es «¿está completo?» sino «¿sirve para lo que lo necesito?»</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="tres-maneras-de-describir-lo-mismo">Tres maneras de describir lo mismo</h2>
<steps>
<step>
<h3 id="1%EF%B8%8F%E2%83%A3-con-c%C3%B3digo"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Con código</h3>
<p><a href="../assets/ads-uml-modelo-codigo.png"><img src="../assets/ads-uml-modelo-codigo.png" alt="" style="height:320px;" /></a></p>
<ul>
<li>Representa <strong>solo la lógica</strong> e ignora el resto · El ser humano lo interpreta <strong>muy lentamente</strong> · No facilita la comunicación</li>
</ul>
</step>
<step>
<h3 id="2%EF%B8%8F%E2%83%A3-con-lenguaje-natural"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Con lenguaje natural</h3>
<p><a href="../assets/ads-uml-modelo-natural.png"><img src="../assets/ads-uml-modelo-natural.png" alt="" style="height:290px;" /></a></p>
<ul>
<li>Es <strong>ambigua y confusa</strong> · Es <strong>lenta</strong> de interpretar · Es <strong>difícil de procesar</strong> por herramientas</li>
</ul>
</step>
<step>
<h3 id="3%EF%B8%8F%E2%83%A3-con-un-modelo-visual"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Con un modelo visual</h3>
<p><a href="../assets/ads-uml-modelo-visual.png"><img src="../assets/ads-uml-modelo-visual.png" alt="" style="height:330px;" /></a></p>
<ul>
<li><strong>No es ambigua</strong> (una vez conocida la semántica) · Es <strong>rápida</strong> de interpretar · Es <strong>fácil de procesar</strong> por herramientas</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="%C2%BFqu%C3%A9-es-uml">¿Qué es UML?</h2>
<ul>
<li><strong>UML</strong> = <em>Unified Modeling Language</em> — Lenguaje Unificado de Modelado</li>
<li>Es un <strong>lenguaje de modelado visual de propósito general</strong>, orientado a objetos</li>
<li>Impulsado y mantenido por el <strong><a href="https://www.omg.org">Object Management Group (OMG)</a></strong></li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%8C%90-est%C3%A1ndar"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> Estándar</h3>
<p>Independiente de cualquier fabricante comercial o herramienta</p>
</div>
<div>
<h3 id="%F0%9F%94%80-unificado"><img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f500.svg" data-marp-twemoji=""/> Unificado</h3>
<p>Agrupa notaciones y conceptos de distintos métodos orientados a objetos previos</p>
</div>
<div>
<h3 id="%F0%9F%A7%AD-de-prop%C3%B3sito-general"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> De propósito general</h3>
<p>No está atado a un dominio: sirve para banca, salud, videojuegos o control industrial</p>
</div>
</div>
<ul>
<li>La versión vigente es <strong>UML 2.5.1</strong> (OMG, diciembre de 2017)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="de-d%C3%B3nde-viene-uml">De dónde viene UML</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Año</th>
<th style="text-align:left">Hito</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>1990-1994</strong></td>
<td style="text-align:left">Tres métodos OO compiten: <strong>Booch</strong>, <strong>OMT</strong> (Rumbaugh) y <strong>OOSE</strong> (Jacobson). Notaciones incompatibles entre sí</td>
</tr>
<tr>
<td style="text-align:left"><strong>1995-1996</strong></td>
<td style="text-align:left">Los «tres amigos» se reúnen en Rational y fusionan sus notaciones</td>
</tr>
<tr>
<td style="text-align:left"><strong>1997</strong></td>
<td style="text-align:left">El <strong>OMG adopta UML 1.1</strong> como estándar</td>
</tr>
<tr>
<td style="text-align:left"><strong>2005</strong></td>
<td style="text-align:left"><strong>UML 2.0</strong>: reescritura mayor, se formaliza la semántica y aparecen los fragmentos combinados</td>
</tr>
<tr>
<td style="text-align:left"><strong>2017</strong></td>
<td style="text-align:left"><strong>UML 2.5.1</strong>, la versión vigente: texto reescrito para eliminar contradicciones internas</td>
</tr>
</tbody>
</table>
<div class="grid">
<div>
<h3 id="%F0%9F%92%A1-por-qu%C3%A9-importa-la-historia"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Por qué importa la historia</h3>
<p>Explica por qué hay <strong>varias formas</strong> de dibujar lo mismo: son herencias de los tres métodos originales</p>
</div>
<div>
<h3 id="%E2%9A%A0%EF%B8%8F-consecuencia-pr%C3%A1ctica"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Consecuencia práctica</h3>
<p>Las herramientas no son idénticas. Acuerden <strong>una convención de equipo</strong> y respétenla</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="los-cinco-prop%C3%B3sitos-de-uml">Los cinco propósitos de UML</h2>
<split-slide style="--left: 44%; --right: 56%;">
<div>
<p><img src="../assets/ads-uml-propositos.png" alt="contain" style="width:400px;" /></p>
<blockquote>
<p>UML sirve para <strong>visualizar, especificar, construir, documentar y mantener</strong> sistemas, independientemente de la metodología, pero siempre con una perspectiva orientada a objetos</p>
</blockquote>
</div>
<div>
<h3 id="%F0%9F%91%81%EF%B8%8F-visualizar"><img class="emoji" draggable="false" alt="👁️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f441.svg" data-marp-twemoji=""/> Visualizar</h3>
<p>Detrás de cada símbolo hay una <strong>semántica bien definida</strong>; trasciende lo que puede expresar un lenguaje de programación</p>
<h3 id="%F0%9F%93%9D-especificar"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> Especificar</h3>
<p>Construir modelos <strong>precisos, no ambiguos y completos</strong> del análisis, diseño e implementación</p>
<h3 id="%F0%9F%8F%97%EF%B8%8F-construir"><img class="emoji" draggable="false" alt="🏗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3d7.svg" data-marp-twemoji=""/> Construir</h3>
<p>Correspondencia con lenguajes (Java, C#) y bases de datos (relacionales, OO)</p>
<h3 id="%F0%9F%93%9A-documentar"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4da.svg" data-marp-twemoji=""/> Documentar</h3>
<p>Arquitectura, requisitos, pruebas, planificación y gestión de versiones</p>
<h3 id="%F0%9F%94%A7-mantener"><img class="emoji" draggable="false" alt="🔧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f527.svg" data-marp-twemoji=""/> Mantener</h3>
<p>Ubicar <strong>dónde</strong> cambiar y entender el <strong>efecto</strong> del cambio en el resto</p>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="construir-ingenier%C3%ADa-directa-e-inversa">Construir: ingeniería directa e inversa</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%E2%9E%A1%EF%B8%8F-ingenier%C3%ADa-directa"><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> Ingeniería directa</h3>
<p><strong>Modelo UML → código</strong></p>
<ul>
<li>La herramienta genera el <strong>esqueleto</strong>: clases, atributos, firmas de operaciones, relaciones</li>
<li>Nunca genera la lógica de negocio</li>
<li>Útil al arrancar un módulo nuevo</li>
</ul>
</div>
<div>
<h3 id="%E2%AC%85%EF%B8%8F-ingenier%C3%ADa-inversa"><img class="emoji" draggable="false" alt="⬅️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b05.svg" data-marp-twemoji=""/> Ingeniería inversa</h3>
<p><strong>Código → modelo UML</strong></p>
<ul>
<li>La herramienta lee el código y <strong>reconstruye</strong> el diagrama de clases</li>
<li>Útil para entender un sistema heredado que nadie documentó</li>
<li>Cuidado: produce diagramas enormes e ilegibles si no se filtra</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> El riesgo del <strong>modelo desincronizado</strong>: si el diagrama y el código divergen, el diagrama miente. O se mantiene, o se borra</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="conceptos-de-modelado">Conceptos de modelado</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Concepto</th>
<th style="text-align:left">Definición</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Sistema</strong></td>
<td style="text-align:left">Colección de elementos, posiblemente divididos en subsistemas, organizados para lograr un propósito. Se describe con un conjunto de modelos</td>
</tr>
<tr>
<td style="text-align:left"><strong>Modelo</strong></td>
<td style="text-align:left">Simplificación completa y autoconsistente de la realidad, creada para comprender mejor un sistema</td>
</tr>
<tr>
<td style="text-align:left"><strong>Vista</strong></td>
<td style="text-align:left">Proyección de la organización y estructura de un modelo, centrada en <strong>un aspecto</strong>. Incluye un subconjunto de los elementos del modelo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Diagrama</strong></td>
<td style="text-align:left">Representación gráfica de un conjunto de elementos del modelo y sus relaciones. Es un <strong>grafo conexo</strong> de nodos (elementos) y arcos (relaciones)</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> La jerarquía es: <strong>sistema → modelos → vistas → diagramas</strong></li>
<li>El <strong>modelo</strong> es el repositorio único; los <strong>diagramas</strong> son ventanas hacia él. Por eso una herramienta UML seria mantiene la consistencia entre diagramas</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="propiedades-de-un-buen-modelo">Propiedades de un buen modelo</h2>
<steps>
<step>
<ul>
<li>Un modelo captura las propiedades <strong>estructurales</strong> (estáticas) y de <strong>comportamiento</strong> (dinámicas) de un sistema</li>
<li>Describe <strong>completamente</strong> los aspectos relevantes al propósito del modelo, y <strong>al nivel de detalle apropiado</strong></li>
<li>Cada modelo es completo <strong>desde un punto de vista</strong>; entre modelos existen relaciones de <strong>trazabilidad</strong></li>
</ul>
</step>
<step>
<h3 id="la-paradoja-del-c%C3%B3digo">La paradoja del código</h3>
<blockquote>
<p>El <strong>código fuente</strong> es el modelo más detallado del sistema — y además es ejecutable. Sin embargo, se requieren otros modelos.</p>
</blockquote>
<div class="grid">
<div>
<h3 id="%E2%9D%93-%C2%BFpor-qu%C3%A9"><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> ¿Por qué?</h3>
<p>Porque el código responde <strong>cómo</strong>, pero no <strong>por qué</strong> ni <strong>con qué arquitectura</strong></p>
</div>
<div>
<h3 id="%F0%9F%94%8D-nivel-de-detalle"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> Nivel de detalle</h3>
<p>Leer 80 000 líneas para saber si dos módulos se hablan es un método pésimo</p>
</div>
<div>
<h3 id="%F0%9F%91%A5-audiencia"><img class="emoji" draggable="false" alt="👥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f465.svg" data-marp-twemoji=""/> Audiencia</h3>
<p>El usuario, el arquitecto y la persona que prueba <strong>no leen código</strong></p>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="vistas-arquitecturales-el-modelo-41">Vistas arquitecturales: el modelo 4+1</h2>
<split-slide style="--left: 52%; --right: 48%;">
<div>
<p><a href="../assets/ads-uml-4mas1.png"><img src="../assets/ads-uml-4mas1.png" alt="" style="height:330px;" /></a></p>
<blockquote>
<p>Kruchten, P. (1995). <em>Architectural Blueprints — The «4+1» View Model of Software Architecture</em></p>
</blockquote>
</div>
<div>
<ul>
<li>
<p>Durante el desarrollo, el sistema debe verse desde <strong>varias perspectivas</strong></p>
</li>
<li>
<p>Diferentes personas lo miran de formas diferentes en momentos diferentes</p>
</li>
<li>
<p>La <strong>arquitectura</strong> se organiza mejor a través de <strong>vistas interrelacionadas</strong></p>
</li>
<li>
<p>Cada vista es una <strong>proyección</strong> del modelo centrada en un aspecto particular</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> El «+1» son los <strong>escenarios</strong> (casos de uso): amarran las otras cuatro vistas y sirven para validarlas</p>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="las-cinco-vistas">Las cinco vistas</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Vista</th>
<th style="text-align:left">Qué captura</th>
<th style="text-align:left">Para quién</th>
<th style="text-align:left">Diagramas estáticos</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Casos de uso</strong></td>
<td style="text-align:left">La funcionalidad <strong>tal como la perciben los usuarios</strong>; no la organización real del software</td>
<td style="text-align:left">Usuarios, analistas, pruebas</td>
<td style="text-align:left">Casos de uso</td>
</tr>
<tr>
<td style="text-align:left"><strong>Diseño</strong> <em>(lógica)</em></td>
<td style="text-align:left">Clases, interfaces y colaboraciones del <strong>dominio del problema y de la solución</strong></td>
<td style="text-align:left">Diseño</td>
<td style="text-align:left">Clases, objetos</td>
</tr>
<tr>
<td style="text-align:left"><strong>Interacción</strong> <em>(procesos)</em></td>
<td style="text-align:left">El <strong>flujo de control</strong>, concurrencia y sincronización. Rendimiento y escalabilidad</td>
<td style="text-align:left">Integradores</td>
<td style="text-align:left">Clases, objetos</td>
</tr>
<tr>
<td style="text-align:left"><strong>Implementación</strong> <em>(desarrollo)</em></td>
<td style="text-align:left">Los <strong>artefactos</strong> que se ensamblan y ponen en producción; correspondencia clase ↔ archivo</td>
<td style="text-align:left">Programación, gestión</td>
<td style="text-align:left">Componentes, estructura compuesta</td>
</tr>
<tr>
<td style="text-align:left"><strong>Despliegue</strong> <em>(física)</em></td>
<td style="text-align:left">Nodos y enlaces de la <strong>topología de hardware</strong> donde se ejecuta el sistema</td>
<td style="text-align:left">Ingeniería de sistemas</td>
<td style="text-align:left">Despliegue</td>
</tr>
</tbody>
</table>
<ul>
<li>En <strong>todas</strong> las vistas, los aspectos <strong>dinámicos</strong> se documentan igual: diagramas de <strong>interacción</strong>, <strong>estados</strong> y <strong>actividades</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="el-modelo-uml-de-un-sistema">El modelo UML de un sistema</h2>
<steps>
<step>
<p>Por tanto, el modelo UML de un sistema consiste en:</p>
<div class="grid">
<div>
<h3 id="%F0%9F%97%84%EF%B8%8F-un-conjunto-de-elementos"><img class="emoji" draggable="false" alt="🗄️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5c4.svg" data-marp-twemoji=""/> Un conjunto de elementos</h3>
<p>Definen estructura, comportamiento y funcionalidad, agrupados en <strong>una base de datos única</strong></p>
</div>
<div>
<h3 id="%F0%9F%96%BC%EF%B8%8F-m%C3%BAltiples-diagramas"><img class="emoji" draggable="false" alt="🖼️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5bc.svg" data-marp-twemoji=""/> Múltiples diagramas</h3>
<p>Presentan esos conceptos para introducirlos, editarlos y hacerlos comprensibles</p>
</div>
<div>
<h3 id="%F0%9F%94%AD-agrupados-en-vistas"><img class="emoji" draggable="false" alt="🔭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f52d.svg" data-marp-twemoji=""/> Agrupados en vistas</h3>
<p>Cada vista enfocada a un <strong>aspecto particular</strong> del sistema</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Gestionar un modelo UML requiere una <strong>herramienta específica</strong> que mantenga la consistencia: si renombras una clase, debe renombrarse en los 12 diagramas donde aparece</li>
</ul>
</step>
<step>
<h3 id="herramientas-de-uso-com%C3%BAn">Herramientas de uso común</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Herramienta</th>
<th style="text-align:left">Nota</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Visual Paradigm</strong></td>
<td style="text-align:left">Muy completa, versión <em>Community</em> gratuita para uso no comercial</td>
</tr>
<tr>
<td style="text-align:left"><strong>StarUML</strong></td>
<td style="text-align:left">Ligera, de escritorio</td>
</tr>
<tr>
<td style="text-align:left"><strong>draw.io / diagrams.net</strong></td>
<td style="text-align:left">Gratuita: dibuja UML, pero <strong>no</strong> mantiene un modelo consistente</td>
</tr>
<tr>
<td style="text-align:left"><strong>PlantUML / Mermaid</strong></td>
<td style="text-align:left">Diagramas <strong>como texto</strong>, versionables en Git</td>
</tr>
<tr>
<td style="text-align:left"><strong>Enterprise Architect</strong></td>
<td style="text-align:left">Estándar en entornos corporativos grandes</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Para el curso: cualquiera sirve, pero valoren las que guardan el <strong>modelo</strong>, no solo el dibujo</li>
</ul>
</step>
</steps>
</section>

<ul>

<h2 id="los-catorce-diagramas-de-uml-251">Los catorce diagramas de UML 2.5.1</h2>
<p><a href="../assets/ads-uml-taxonomia.svg"><img src="../assets/ads-uml-taxonomia.svg" alt="" style="height:430px;" /></a></p>
<ul>
<li>Nadie usa los catorce. En la práctica, <strong>cinco o seis</strong> cubren el 95 % de las necesidades</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="estructura-vs-comportamiento">Estructura vs. comportamiento</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%8F%9B%EF%B8%8F-diagramas-de-estructura"><img class="emoji" draggable="false" alt="🏛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3db.svg" data-marp-twemoji=""/> Diagramas de estructura</h3>
<p>Describen <strong>lo que hay</strong>, en reposo: qué piezas existen y cómo se relacionan.</p>
<ul>
<li><strong>Clases</strong> — conceptos y sus relaciones</li>
<li><strong>Objetos</strong> — una foto de instancias concretas</li>
<li><strong>Paquetes</strong> — agrupación y dependencias</li>
<li><strong>Componentes</strong> — piezas y contratos</li>
<li><strong>Despliegue</strong> — dónde corre cada cosa</li>
<li><strong>Estructura compuesta</strong> — el interior de una clase</li>
<li><strong>Perfiles</strong> — cómo extender el propio UML</li>
</ul>
</div>
<div>
<h3 id="%E2%9A%A1-diagramas-de-comportamiento"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> Diagramas de comportamiento</h3>
<p>Describen <strong>lo que pasa</strong>, en el tiempo: cómo el sistema responde y evoluciona.</p>
<ul>
<li><strong>Casos de uso</strong> — qué se puede hacer</li>
<li><strong>Actividad</strong> — el flujo de un proceso</li>
<li><strong>Máquina de estados</strong> — el ciclo de vida de un objeto</li>
<li><strong>Interacción</strong>:
<ul>
<li><strong>Secuencia</strong> — orden de mensajes en el tiempo</li>
<li><strong>Comunicación</strong> — estructura de los enlaces</li>
<li><strong>Visión general de interacción</strong> · <strong>Tiempos</strong></li>
</ul>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="qu%C3%A9-usaremos-en-el-curso">Qué usaremos en el curso</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Diagrama</th>
<th style="text-align:left">Cuándo</th>
<th style="text-align:left">Pregunta que responde</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Casos de uso</strong></td>
<td style="text-align:left">Requerimientos</td>
<td style="text-align:left">¿Qué puede hacer cada actor?</td>
</tr>
<tr>
<td style="text-align:left"><strong>Actividad</strong></td>
<td style="text-align:left">Análisis del negocio y del caso de uso</td>
<td style="text-align:left">¿Cuál es el flujo del proceso y quién hace qué?</td>
</tr>
<tr>
<td style="text-align:left"><strong>Clases</strong> <em>(dominio)</em></td>
<td style="text-align:left">Análisis</td>
<td style="text-align:left">¿Cuáles son los conceptos del negocio y cómo se relacionan?</td>
</tr>
<tr>
<td style="text-align:left"><strong>Secuencia</strong></td>
<td style="text-align:left">Diseño</td>
<td style="text-align:left">¿En qué orden colaboran los objetos para realizar un caso de uso?</td>
</tr>
<tr>
<td style="text-align:left"><strong>Clases</strong> <em>(diseño)</em></td>
<td style="text-align:left">Diseño</td>
<td style="text-align:left">¿Qué clases de software y con qué responsabilidades?</td>
</tr>
<tr>
<td style="text-align:left"><strong>Paquetes</strong></td>
<td style="text-align:left">Arquitectura</td>
<td style="text-align:left">¿Cómo se organiza el sistema y qué depende de qué?</td>
</tr>
<tr>
<td style="text-align:left"><strong>Componentes / despliegue</strong></td>
<td style="text-align:left">Arquitectura</td>
<td style="text-align:left">¿Qué piezas se instalan y en qué máquinas?</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Regla práctica: <strong>dibuja un diagrama solo si hay una decisión que tomar o comunicar</strong>. Si nadie lo va a leer, no lo dibujes</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-F8quTh26="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="27" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="86">
<h1 id="diagrama-de-paquetes">Diagrama de paquetes</h1>
<h2 id="contenidos-4">Contenidos</h2>
<ul>
<li>Qué es y para qué sirve</li>
<li>Notación y anidamiento</li>
<li>Tipos de dependencia</li>
<li>Arquitectura en capas y ciclos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="%C2%BFqu%C3%A9-es-un-diagrama-de-paquetes">¿Qué es un diagrama de paquetes?</h2>
<split-slide style="--left: 52%; --right: 48%;">
<div>
<ul>
<li>Un <strong>paquete</strong> es un mecanismo de propósito general para <strong>agrupar elementos</strong> del modelo y darles un <strong>espacio de nombres</strong></li>
<li>El diagrama de paquetes muestra esos grupos y las <strong>dependencias</strong> entre ellos</li>
<li>Es el diagrama de más alto nivel: se lee <strong>antes</strong> que cualquier diagrama de clases</li>
</ul>
</div>
<div>
<h3 id="para-qu%C3%A9-sirve">Para qué sirve</h3>
<ul>
<li>Ver la <strong>arquitectura lógica</strong> de un vistazo</li>
<li>Detectar <strong>acoplamiento indeseado</strong> entre partes</li>
<li>Repartir el trabajo del equipo: un paquete, una persona o un grupo</li>
<li>Definir el <strong>orden de construcción</strong>: primero lo que no depende de nadie</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Cualquier elemento UML puede vivir en un paquete: clases, casos de uso, componentes y hasta otros paquetes</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="notaci%C3%B3n-del-diagrama-de-paquetes">Notación del diagrama de paquetes</h2>
<p><a href="../assets/ads-uml-paquetes.svg"><img src="../assets/ads-uml-paquetes.svg" alt="" style="height:430px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="tipos-de-dependencia-entre-paquetes">Tipos de dependencia entre paquetes</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Estereotipo</th>
<th style="text-align:left">Significado</th>
<th style="text-align:left">Efecto en el espacio de nombres</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>«use»</strong></td>
<td style="text-align:left">El paquete origen <strong>usa</strong> elementos del destino. Es la dependencia genérica</td>
<td style="text-align:left">Ninguno: hay que calificar los nombres</td>
</tr>
<tr>
<td style="text-align:left"><strong>«import»</strong></td>
<td style="text-align:left">Importa los elementos <strong>públicos</strong> del destino</td>
<td style="text-align:left">Los nombres quedan disponibles <strong>y públicos</strong> hacia afuera</td>
</tr>
<tr>
<td style="text-align:left"><strong>«access»</strong></td>
<td style="text-align:left">Igual que <em>import</em>, pero lo importado queda <strong>privado</strong></td>
<td style="text-align:left">Los nombres se usan dentro, <strong>no se reexportan</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>«merge»</strong></td>
<td style="text-align:left">Fusiona el contenido del destino en el origen</td>
<td style="text-align:left">Se usa sobre todo al definir <strong>perfiles</strong> y metamodelos</td>
</tr>
</tbody>
</table>
<div class="grid">
<div>
<h3 id="%F0%9F%93%96-c%C3%B3mo-se-lee"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> Cómo se lee</h3>
<p><code>A ---▸ B</code> significa <strong>«A necesita a B»</strong>: si B cambia, A puede romperse. B no sabe que A existe</p>
</div>
<div>
<h3 id="%E2%9A%A0%EF%B8%8F-visibilidad"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Visibilidad</h3>
<p>Los elementos de un paquete pueden ser <code>+</code> públicos o <code>-</code> privados. Solo lo público cruza la frontera</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="arquitectura-en-capas-y-ciclos">Arquitectura en capas y ciclos</h2>
<steps>
<step>
<h3 id="la-regla-de-oro-las-dependencias-apuntan-hacia-abajo">La regla de oro: las dependencias apuntan hacia abajo</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Capa</th>
<th style="text-align:left">Depende de</th>
<th style="text-align:left">Nunca depende de</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Presentación</strong> (<code>ui</code>)</td>
<td style="text-align:left">Aplicación</td>
<td style="text-align:left">Infraestructura directamente</td>
</tr>
<tr>
<td style="text-align:left"><strong>Aplicación</strong></td>
<td style="text-align:left">Dominio, Infraestructura <em>(por interfaz)</em></td>
<td style="text-align:left">Presentación</td>
</tr>
<tr>
<td style="text-align:left"><strong>Dominio</strong></td>
<td style="text-align:left"><strong>Nadie</strong></td>
<td style="text-align:left">Ninguna otra capa</td>
</tr>
<tr>
<td style="text-align:left"><strong>Infraestructura</strong></td>
<td style="text-align:left">Dominio</td>
<td style="text-align:left">Presentación, Aplicación</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> El <strong>dominio no depende de nada</strong>: es la parte que debe sobrevivir al cambio de framework, de base de datos y de interfaz</li>
</ul>
</step>
<step>
<h3 id="el-pecado-capital-la-dependencia-c%C3%ADclica">El pecado capital: la dependencia cíclica</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%9A%AB-ciclo"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Ciclo</h3>
<p><code>facturacion ➜ clientes ➜ facturacion</code></p>
<p>No se puede compilar, probar ni desplegar uno sin el otro. En la práctica son <strong>un solo paquete</strong> mal partido</p>
</div>
<div>
<h3 id="%E2%9C%85-c%C3%B3mo-se-rompe"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Cómo se rompe</h3>
<p>Extraer lo compartido a un <strong>tercer paquete</strong>, o invertir la dependencia con una <strong>interfaz</strong> en el paquete de abajo</p>
</div>
<div>
<h3 id="%F0%9F%94%8D-c%C3%B3mo-se-detecta"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> Cómo se detecta</h3>
<p>Cualquier herramienta lo reporta. En Java: <em>jdeps</em>; en .NET: <em>NDepend</em>; en JS: <em>madge</em></p>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="actividad-3-organiza-en-paquetes">Actividad 3: organiza en paquetes</h2>
<ul>
<li>Un sistema de biblioteca tiene estas clases:</li>
</ul>
<blockquote>
<p><code>PantallaPrestamo</code> · <code>Libro</code> · <code>Ejemplar</code> · <code>Socio</code> · <code>Prestamo</code> · <code>Multa</code> · <code>RepositorioLibros</code> · <code>ConexionBD</code> · <code>ServicioCorreo</code> · <code>GestorPrestamos</code> · <code>ControladorWeb</code> · <code>PoliticaDeMulta</code></p>
</blockquote>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="qu%C3%A9-hacer-1">Qué hacer</h3>
<ol>
<li>Agrupen las clases en los paquetes <code>ui</code>, <code>aplicacion</code>, <code>dominio</code> e <code>infraestructura</code></li>
<li>Dibujen las <strong>dependencias</strong> entre paquetes</li>
<li>Verifiquen que <strong>ninguna flecha sale del dominio</strong></li>
</ol>
</div>
<div>
<h3 id="preguntas-de-control-1">Preguntas de control</h3>
<ul>
<li>¿<code>PoliticaDeMulta</code> es dominio o aplicación? ¿Por qué?</li>
<li>Si <code>GestorPrestamos</code> necesita enviar un correo, ¿cómo evitan que <code>aplicacion</code> dependa de <code>infraestructura</code>?</li>
<li>¿Hay algún ciclo?</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 15 minutos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-scope-fNiy1v3J="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="34" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="86">
<h1 id="diagrama-de-clases">Diagrama de clases</h1>
<h2 id="contenidos-5">Contenidos</h2>
<ul>
<li>Modelo de dominio y clases conceptuales</li>
<li>Notación de clase, atributos y operaciones</li>
<li>Asociación, roles, multiplicidad</li>
<li>Herencia, interfaces, agregación y composición</li>
<li>Cómo se construye · Caso de estudio</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="%C2%BFqu%C3%A9-es-un-diagrama-de-clases">¿Qué es un diagrama de clases?</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<ul>
<li>Un diagrama de clases es un diagrama <strong>estático</strong> que describe la <strong>estructura</strong> de un sistema mostrando sus <strong>clases</strong>, <strong>atributos</strong>, <strong>operaciones</strong> y las <strong>relaciones</strong> entre ellos</li>
<li>Es el diagrama UML más usado, y el único que casi todo equipo mantiene vivo</li>
</ul>
</div>
<div>
<p><a href="../assets/ads-uml-clases-ejemplo.png"><img src="../assets/ads-uml-clases-ejemplo.png" alt="" style="height:280px;" /></a></p>
<blockquote>
<p><em>Class diagram</em>. Unhelkar (2018)</p>
</blockquote>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> El mismo diagrama sirve para <strong>dos cosas muy distintas</strong>: modelar el <strong>dominio del problema</strong> o modelar las <strong>clases de software</strong>. Nunca los mezclen en un mismo dibujo</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="modelo-de-dominio-vs-diagrama-de-clases-de-dise%C3%B1o">Modelo de dominio vs. diagrama de clases de diseño</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%8C%B1-modelo-de-dominio"><img class="emoji" draggable="false" alt="🌱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f331.svg" data-marp-twemoji=""/> Modelo de dominio</h3>
<p><em>Análisis · vocabulario del negocio</em></p>
<ul>
<li>Muestra <strong>clases conceptuales</strong> significativas del dominio del problema</li>
<li><strong>No</strong> muestra componentes de software, ni clases de software, ni responsabilidades</li>
<li>Solo <strong>nombre</strong>, <strong>atributos</strong> y <strong>asociaciones</strong></li>
<li>Sin operaciones, sin tipos de datos, sin visibilidad</li>
</ul>
<blockquote>
<p><em>Gestión académica:</em> <code>Alumno</code>, <code>Docente</code>, <code>Asignatura</code>, <code>Horario</code></p>
</blockquote>
</div>
<div>
<h3 id="%F0%9F%8F%97%EF%B8%8F-diagrama-de-clases-de-dise%C3%B1o"><img class="emoji" draggable="false" alt="🏗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3d7.svg" data-marp-twemoji=""/> Diagrama de clases de diseño</h3>
<p><em>Diseño · vocabulario de la solución</em></p>
<ul>
<li>Muestra <strong>clases de software</strong> que se van a programar</li>
<li>Aparecen operaciones con firma completa, visibilidad, tipos, interfaces</li>
<li>Aparecen clases que <strong>no existen en el negocio</strong>: controladores, repositorios, fábricas</li>
<li>Se ajusta a un lenguaje y a un framework</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> El modelo de dominio es la <strong>entrada</strong> del diseño, no su borrador</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="la-clase-conceptual">La clase conceptual</h2>
<steps>
<step>
<ul>
<li>Informalmente, una clase conceptual es <strong>una idea, cosa u objeto</strong></li>
<li>Formalmente se puede considerar en tres términos:</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%94%A4-s%C3%ADmbolo"><img class="emoji" draggable="false" alt="🔤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f524.svg" data-marp-twemoji=""/> Símbolo</h3>
<p>Las <strong>palabras o imágenes</strong> que representan la clase conceptual</p>
<p><code>Venta</code></p>
</div>
<div>
<h3 id="%F0%9F%93%96-definici%C3%B3n"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> Definición</h3>
<p>El <strong>concepto</strong>: qué significa</p>
<p><em>«Una venta representa el hecho de una transacción de compra; sucede un día y a una hora»</em></p>
</div>
<div>
<h3 id="%F0%9F%93%A6-extensi%C3%B3n"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Extensión</h3>
<p>El <strong>conjunto de objetos</strong> que pertenecen a la clase</p>
<p><code>Venta-1</code>, <code>Venta-2</code>, <code>Venta-3</code></p>
</div>
</div>
</step>
<step>
<h3 id="el-error-m%C3%A1s-caro-del-an%C3%A1lisis">El error más caro del análisis</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%9A%AB-confundir-s%C3%ADmbolo-y-definici%C3%B3n"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Confundir símbolo y definición</h3>
<p>Dos personas dicen «cliente» y piensan cosas distintas. El modelo parece correcto y no lo es</p>
</div>
<div>
<h3 id="%E2%9C%85-la-soluci%C3%B3n"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> La solución</h3>
<p>Un <strong>glosario</strong>: cada clase conceptual con su definición en una frase, acordada con el usuario</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Si el equipo no puede escribir la definición de una clase en una frase, esa clase todavía no se entiende</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="notaci%C3%B3n-de-clase">Notación de clase</h2>
<p><a href="../assets/ads-uml-clase-notacion.svg"><img src="../assets/ads-uml-clase-notacion.svg" alt="" style="height:440px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="notaci%C3%B3n-resumida">Notación resumida</h2>
<split-slide style="--left: 55%; --right: 45%;">
<div>
<p><a href="../assets/ads-uml-clases-notacion.png"><img src="../assets/ads-uml-clases-notacion.png" alt="" style="height:320px;" /></a></p>
<blockquote>
<p><em>Notations diagram</em>. Unhelkar (2018)</p>
</blockquote>
</div>
<div>
<h3 id="los-tres-compartimentos">Los tres compartimentos</h3>
<ol>
<li><strong>Nombre</strong> — sustantivo en singular, en <code>PascalCase</code>. Obligatorio</li>
<li><strong>Atributos</strong> — las propiedades. Opcional</li>
<li><strong>Operaciones</strong> — los servicios. Opcional</li>
</ol>
<ul>
<li>En el <strong>modelo de dominio</strong> se muestran solo los dos primeros</li>
<li>El compartimento vacío no significa «no tiene»: significa «no lo estoy mostrando»</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="clase-y-objeto">Clase y objeto</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="la-clase-el-molde">La clase: el molde</h3>
<pre><code>┌────────────────────┐
│       Cuenta       │
├────────────────────┤
│ numeroCuenta       │
│ saldo              │
│ fechaApertura      │
│ saldoPromedio      │
├────────────────────┤
│ abrir()            │
│ consignar()        │
│ suspender()        │
│ sobregirar()       │
└────────────────────┘
</code></pre>
</div>
<div>
<h3 id="el-objeto-la-instancia">El objeto: la instancia</h3>
<pre><code>┌────────────────────┐
│  miCuenta : Cuenta │
├────────────────────┤
│ numeroCuenta = 881 │
│ saldo = 45000      │
└────────────────────┘
</code></pre>
<ul>
<li>El nombre del objeto va <strong>subrayado</strong> y con el formato <code>nombre : Clase</code></li>
<li>Se puede omitir el nombre (<code>: Cuenta</code>) o la clase (<code>miCuenta</code>)</li>
<li>Los objetos viven en el <strong>diagrama de objetos</strong>: una <strong>foto</strong> del sistema en un instante</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="atributos">Atributos</h2>
<ul>
<li>Un <strong>atributo</strong> es una propiedad de una clase; describe el <strong>rango de valores</strong> que esa propiedad podrá contener en los objetos de la clase</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Elemento de la sintaxis</th>
<th style="text-align:left">Ejemplo</th>
<th style="text-align:left">Cuándo se usa</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Visibilidad</strong></td>
<td style="text-align:left"><code>-</code> <code>+</code> <code>#</code> <code>~</code></td>
<td style="text-align:left">Diseño. En dominio se omite</td>
</tr>
<tr>
<td style="text-align:left"><strong>Nombre</strong></td>
<td style="text-align:left"><code>saldoDisponible</code></td>
<td style="text-align:left">Siempre. <code>camelCase</code>, sustantivo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Tipo</strong></td>
<td style="text-align:left"><code>: Double</code></td>
<td style="text-align:left">Diseño. En dominio, solo si aclara</td>
</tr>
<tr>
<td style="text-align:left"><strong>Multiplicidad</strong></td>
<td style="text-align:left"><code>[0..*]</code></td>
<td style="text-align:left">Cuando el atributo es una colección</td>
</tr>
<tr>
<td style="text-align:left"><strong>Valor inicial</strong></td>
<td style="text-align:left"><code>= 0.0</code></td>
<td style="text-align:left">Cuando hay un valor por omisión con significado</td>
</tr>
<tr>
<td style="text-align:left"><strong>Propiedades</strong></td>
<td style="text-align:left"><code>{readOnly}</code> <code>{id}</code> <code>{unique}</code></td>
<td style="text-align:left">Para restricciones que no se ven en el tipo</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>¿Atributo o clase?</strong> Si la «propiedad» tiene identidad propia, historia o atributos suyos, es una <strong>clase asociada</strong>, no un atributo. <code>direccion</code> como texto es un atributo; <code>Direccion</code> con provincia, cantón y distrito es una clase</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="enlaces-y-asociaciones">Enlaces y asociaciones</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<ul>
<li>Las entidades del mundo real <strong>se relacionan</strong> con otras entidades</li>
<li>A las relaciones entre <strong>objetos</strong> se les llama <strong>enlaces</strong> <em>(links)</em></li>
<li>A las relaciones entre <strong>clases</strong> se les llama <strong>asociaciones</strong></li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Nivel</th>
<th style="text-align:left">Ejemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Clases</td>
<td style="text-align:left"><code>Docente</code> <strong>imparte</strong> <code>Asignatura</code></td>
</tr>
<tr>
<td style="text-align:left">Objetos</td>
<td style="text-align:left"><code>Alonso</code> <strong>imparte</strong> <code>Análisis de Sistemas</code></td>
</tr>
</tbody>
</table>
</div>
<div>
<p><a href="../assets/ads-uml-asociacion.png"><img src="../assets/ads-uml-asociacion.png" alt="" style="height:250px;" /></a></p>
<blockquote>
<p><em>Association relationship</em>. Unhelkar (2018)</p>
</blockquote>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Una asociación es <strong>estructural</strong>: significa que existe un vínculo que persiste, no una llamada puntual entre objetos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="nombre-roles-y-navegabilidad">Nombre, roles y navegabilidad</h2>
<p><a href="../assets/ads-uml-asociacion-roles.svg"><img src="../assets/ads-uml-asociacion-roles.svg" alt="" style="height:430px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="c%C3%B3mo-nombrar-bien-una-asociaci%C3%B3n">Cómo nombrar bien una asociación</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%8F%B7%EF%B8%8F-nombre-de-la-asociaci%C3%B3n"><img class="emoji" draggable="false" alt="🏷️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3f7.svg" data-marp-twemoji=""/> Nombre de la asociación</h3>
<p>Un <strong>verbo</strong> en tercera persona, con el triángulo que indica la dirección de lectura</p>
<p><code>Profesor</code> ▶ <em>imparte</em> ▶ <code>Curso</code></p>
</div>
<div>
<h3 id="%F0%9F%8E%AD-nombre-de-rol"><img class="emoji" draggable="false" alt="🎭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ad.svg" data-marp-twemoji=""/> Nombre de rol</h3>
<p>Un <strong>sustantivo</strong> que dice <strong>qué papel juega</strong> esa clase en la relación</p>
<p><code>Profesor</code> juega el rol de <code>+docente</code></p>
</div>
<div>
<h3 id="%E2%9D%93-cu%C3%A1ndo-usar-cada-uno"><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> Cuándo usar cada uno</h3>
<p>El nombre de asociación aclara <strong>la relación</strong>; el rol aclara <strong>el extremo</strong>. Con uno suele bastar</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Nombres a evitar: <code>tiene</code>, <code>es</code>, <code>asociado con</code>, <code>relacionado con</code>. No aportan nada</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Prueba de calidad: leer el diagrama en voz alta debe producir una <strong>frase del negocio</strong> que el usuario apruebe</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="multiplicidad">Multiplicidad</h2>
<split-slide style="--left: 40%; --right: 60%;">
<div>
<table>
<thead>
<tr>
<th style="text-align:left">Notación</th>
<th style="text-align:left">Significado</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>1</code></td>
<td style="text-align:left">Exactamente uno</td>
</tr>
<tr>
<td style="text-align:left"><code>0..1</code></td>
<td style="text-align:left">Cero o uno <em>(opcional)</em></td>
</tr>
<tr>
<td style="text-align:left"><code>*</code> o <code>0..*</code></td>
<td style="text-align:left">Cero o muchos</td>
</tr>
<tr>
<td style="text-align:left"><code>1..*</code></td>
<td style="text-align:left">Uno o muchos</td>
</tr>
<tr>
<td style="text-align:left"><code>1..4</code></td>
<td style="text-align:left">Entre uno y cuatro</td>
</tr>
<tr>
<td style="text-align:left"><code>2, 5, 8</code></td>
<td style="text-align:left">Exactamente 2, 5 u 8</td>
</tr>
</tbody>
</table>
<ul>
<li>Se lee <strong>cruzado</strong>: la multiplicidad del extremo <code>Curso</code> dice <strong>cuántos cursos</strong> se relacionan con <strong>un</strong> profesor</li>
</ul>
</div>
<div>
<p><a href="../assets/ads-uml-multiplicidad.png"><img src="../assets/ads-uml-multiplicidad.png" alt="" style="height:370px;" /></a></p>
<blockquote>
<p><em>Multiplicities in class diagrams</em>. Unhelkar (2018)</p>
</blockquote>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> La <strong>herencia no lleva multiplicidad</strong>: carece de sentido, porque las clases heredadas siguen resultando en <strong>un solo objeto</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="clase-asociaci%C3%B3n">Clase asociación</h2>
<split-slide style="--left: 48%; --right: 52%;">
<div>
<p><a href="../assets/ads-uml-clase-asociacion.png"><img src="../assets/ads-uml-clase-asociacion.png" alt="" style="height:230px;" /></a></p>
<ul>
<li>Clase que representa <strong>propiedades y operaciones propias de la relación</strong>, no de ninguno de los dos extremos</li>
<li>Se dibuja unida a la asociación con una <strong>línea discontinua</strong></li>
</ul>
</div>
<div>
<h3 id="cu%C3%A1ndo-aparece">Cuándo aparece</h3>
<ul>
<li>Casi siempre en asociaciones <strong>muchos a muchos</strong> que necesitan guardar datos propios</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Asociación</th>
<th style="text-align:left">Clase asociación</th>
<th style="text-align:left">Sus datos</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>Company</code> — <code>Person</code></td>
<td style="text-align:left"><code>Job</code></td>
<td style="text-align:left">salario, puesto</td>
</tr>
<tr>
<td style="text-align:left"><code>Estudiante</code> — <code>Curso</code></td>
<td style="text-align:left"><code>Matricula</code></td>
<td style="text-align:left">fecha, nota</td>
</tr>
<tr>
<td style="text-align:left"><code>Producto</code> — <code>Parte</code></td>
<td style="text-align:left"><code>Definicion</code></td>
<td style="text-align:left">cantidad</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> ¿Dónde pondrías la <strong>nota</strong> de un estudiante en un curso? <spoiler>en la clase asociación <code>Matricula</code>: no es del estudiante ni del curso, es de la relación</spoiler></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="generalizaci%C3%B3n-y-especializaci%C3%B3n">Generalización y especialización</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<ul>
<li>Es una relación entre una clase (<strong>subclase</strong>) que es un <strong>subtipo</strong> de otra clase (<strong>superclase</strong>)</li>
<li>Indica que la subclase <strong>hereda</strong> los atributos y operaciones especificados por la superclase</li>
<li>Notación: línea <strong>continua</strong> con <strong>triángulo hueco</strong> apuntando a la superclase</li>
</ul>
<p><a href="../assets/ads-uml-generalizacion.png"><img src="../assets/ads-uml-generalizacion.png" alt="" style="height:170px;" /></a></p>
<p><em>Generalización: aumento de abstracción</em></p>
</div>
<div>
<p><a href="../assets/ads-uml-herencia.png"><img src="../assets/ads-uml-herencia.png" alt="" style="height:220px;" /></a></p>
<blockquote>
<p><em>The inheritance relationship</em>. Unhelkar (2018)</p>
</blockquote>
<p><a href="../assets/ads-uml-especializacion.png"><img src="../assets/ads-uml-especializacion.png" alt="" style="height:170px;" /></a></p>
<p><em>Especialización: abstracción descendente</em></p>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="dos-caminos-hacia-la-jerarqu%C3%ADa">Dos caminos hacia la jerarquía</h2>
<div class="grid">
<div>
<h3 id="%E2%AC%86%EF%B8%8F-generalizaci%C3%B3n"><img class="emoji" draggable="false" alt="⬆️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b06.svg" data-marp-twemoji=""/> Generalización</h3>
<p><strong>De lo concreto a lo abstracto.</strong> Veo <code>Cliente</code> y <code>Proveedor</code>, noto que comparten cédula, razón social y correo, y <strong>extraigo</strong> <code>AgenteComercial</code></p>
<p><em>Aumento de abstracción</em></p>
</div>
<div>
<h3 id="%E2%AC%87%EF%B8%8F-especializaci%C3%B3n"><img class="emoji" draggable="false" alt="⬇️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b07.svg" data-marp-twemoji=""/> Especialización</h3>
<p><strong>De lo abstracto a lo concreto.</strong> Tengo <code>Cliente</code> y descubro que hay reglas distintas para <code>Minorista</code> y <code>Mayorista</code>, así que <strong>derivo</strong> las subclases</p>
<p><em>Abstracción descendente</em></p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <strong>La prueba del «es un»</strong>: <code>Minorista</code> <strong>es un</strong> <code>Cliente</code> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> · <code>Pedido</code> <strong>es un</strong> <code>Cliente</code> <img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/></li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Si la subclase <strong>no usa</strong> buena parte de lo heredado, o necesita anular operaciones para «desactivarlas», la jerarquía está mal planteada: probablemente sea <strong>composición</strong>, no herencia</li>
<li>La clase <strong>abstracta</strong> se escribe en <em>cursiva</em>: no se instancia, solo define lo común</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="interfaces-y-realizaci%C3%B3n">Interfaces y realización</h2>
<p><a href="../assets/ads-uml-interfaces.svg"><img src="../assets/ads-uml-interfaces.svg" alt="" style="height:440px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="86">
<h2 id="por-qu%C3%A9-importan-las-interfaces">Por qué importan las interfaces</h2>
<steps>
<step>
<h3 id="una-interfaz-es-un-contrato">Una interfaz es un contrato</h3>
<ul>
<li>Declara <strong>qué operaciones</strong> hay que ofrecer, <strong>sin decir cómo</strong></li>
<li>No tiene atributos ni implementación</li>
<li>Una clase puede realizar <strong>varias</strong> interfaces, aunque solo herede de una superclase</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Elemento</th>
<th style="text-align:left">Notación</th>
<th style="text-align:left">Semántica</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Interfaz</strong></td>
<td style="text-align:left">Clase con estereotipo <code>«interface»</code>, nombre en cursiva</td>
<td style="text-align:left">El contrato</td>
</tr>
<tr>
<td style="text-align:left"><strong>Realización</strong></td>
<td style="text-align:left">Línea <strong>discontinua</strong> + triángulo <strong>hueco</strong></td>
<td style="text-align:left">«Cumplo este contrato»</td>
</tr>
<tr>
