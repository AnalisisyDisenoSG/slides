<li>Existe una <strong>brecha</strong> entre la persona usuaria y quien analiza el sistema</li>
<li>El usuario habla de su negocio, el analista habla de tecnología</li>
</ul>
</div>
<div>
<h3 id="la-respuesta">La respuesta</h3>
<ul>
<li><strong>Transformar</strong> en especificaciones, modelos y arquitecturas</li>
<li><strong>Comunicación</strong> efectiva</li>
<li><strong>Involucrar</strong> al usuario en todas las etapas</li>
</ul>
</div>
</div>
<p><a href="../assets/puente.png">El puente</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-1DjHZZls="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="3" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="34">
<h1 id="sistema-y-subsistemas">Sistema y subsistemas</h1>
<h2 id="contenidos-1">Contenidos</h2>
<ul>
<li>¿Qué es un sistema?</li>
<li>Sistema de información</li>
<li>Descomposición y modularidad</li>
<li>Acoplamiento y cohesión</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="%C2%BFqu%C3%A9-es-un-sistema">¿Qué es un sistema?</h2>
<ul>
<li>Conjunto de <strong>elementos o componentes</strong> que interactúan para lograr <strong>objetivos</strong></li>
<li>Los sistemas tienen entradas, mecanismos de procesamiento, salidas y <strong>retroalimentación</strong></li>
</ul>
<p><img src="../assets/ads-sistema-io.png" alt="contain" style="width:900px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="siete-caracter%C3%ADsticas-de-un-sistema">Siete características de un sistema</h2>
<split-slide style="--left: 55%; --right: 45%;">
<p><img src="../assets/ads-sistema-caracteristicas.png" alt="contain" style="width:600px;" /></p>
<div>
<ol>
<li><strong>Componentes</strong> — las partes que lo forman</li>
<li><strong>Interrelaciones</strong> — cómo dependen entre sí</li>
<li><strong>Frontera</strong> (<em>boundary</em>) — qué está dentro y qué fuera</li>
<li><strong>Propósito</strong> — para qué existe</li>
<li><strong>Entorno</strong> — lo que lo rodea y le afecta</li>
<li><strong>Interfaces</strong> — puntos de contacto con el entorno</li>
<li><strong>Restricciones</strong> — límites que debe respetar</li>
</ol>
<blockquote>
<p>Tomado de Valacich, J. (2012, p. 34)</p>
</blockquote>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">

</ul>
<div class="grid">

<ul>
<li>¿Cuál es la <strong>entrada</strong>?</li>
<li>¿Cuál es la <strong>salida</strong>?</li>
<li>¿Cuál es la <strong>frontera</strong>?</li>
<li>¿Cuáles son los <strong>componentes</strong>?</li>
</ul>
</div>
<div>
<ul>
<li>¿Cuáles son sus <strong>interrelaciones</strong>?</li>
<li>¿Cuáles son las <strong>restricciones</strong>?</li>
<li>¿Cuál es el <strong>propósito</strong>?</li>
<li>¿Cuáles son las <strong>interfaces</strong> y el <strong>entorno</strong>?</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="sistema-de-informaci%C3%B3n">Sistema de Información</h2>
<ul>
<li>Según Kurbel (2008, p. 4) son sistemas <strong>basados en computadoras</strong> que:
<ul>
<li>Procesan información o datos de entrada</li>
<li><strong>Almacenan</strong> y <strong>recuperan</strong> información</li>
<li><strong>Producen</strong> nueva información</li>
</ul>
</li>
<li>...para resolver tareas automáticamente o <strong>soportar a los seres humanos</strong> en la operación, control y toma de decisiones de una organización</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="actividad-2">Actividad 2</h2>

<li>Con base en la definición de sistemas de información, identifica en el sistema de <strong>Ematrícula</strong>:</li>

<div class="grid">

<h2 id="conceptos-importantes-descomposici%C3%B3n">Conceptos importantes: Descomposición</h2>
<steps>
<step>
<ul>
<li><strong>Descomposición</strong>: proceso de dividir el sistema en componentes pequeños</li>
<li>Le permite a la persona analista:
<ul>
<li>Dividir un sistema en subsistemas <strong>pequeños, manejables y comprensibles</strong></li>
<li>Concentrarse en <strong>un área a la vez</strong>, sin interferencia de otras áreas</li>
<li>Construir diferentes componentes en <strong>momentos independientes</strong> y con la ayuda de diferentes analistas</li>
</ul>
</li>
</ul>
</step>
<step>
<p><img src="../assets/ads-descomposicion-mp3.png" alt="contain" style="width:850px;" /></p>
</step>
</steps>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="conceptos-importantes-modularidad">Conceptos importantes: Modularidad</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%A9-modularidad"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Modularidad</h3>
<p>Dividir un sistema en módulos de un tamaño <strong>relativamente uniforme</strong></p>
<p>Los módulos <strong>simplifican</strong> el diseño del sistema</p>
</div>
<div>
<h3 id="%F0%9F%94%97-acoplamiento"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Acoplamiento</h3>
<p>Los subsistemas que <strong>dependen uno del otro</strong> están acoplados</p>
<p>→ Buscamos acoplamiento <strong>bajo</strong></p>
</div>
<div>
<h3 id="%F0%9F%8E%AF-cohesi%C3%B3n"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Cohesión</h3>
<p>Grado en el que un subsistema realiza <strong>una sola función</strong></p>
<p>→ Buscamos cohesión <strong>alta</strong></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-scope-XkMmp5Yj="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="12" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="34">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="%C2%BFqu%C3%A9-es-la-ingenier%C3%ADa-de-software">¿Qué es la Ingeniería de Software?</h2>
<ul>
<li>Según la visión de Manassis (2003, p. 1), la ingeniería de software es:</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%94%8D-refinamiento"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> Refinamiento</h3>
<p>Refinamiento del conocimiento a través de <strong>sucesivos niveles de abstracción</strong> y de representación</p>
</div>
<div>
<h3 id="%F0%9F%A7%B5-trazabilidad"><img class="emoji" draggable="false" alt="🧵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f5.svg" data-marp-twemoji=""/> Trazabilidad</h3>
<p><strong>Trazabilidad</strong> de cada ítem de información entre los niveles de abstracción</p>
</div>
</div>
<ul>
<li>Es decir: pasamos del <strong>problema del negocio</strong> al <strong>código</strong>, sin perder el hilo entre uno y otro</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="niveles-de-abstracci%C3%B3n">Niveles de abstracción</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Nivel</th>
<th style="text-align:left">Espacio</th>
<th style="text-align:left">Artefactos</th>

<tr>

</tr>
<tr>
<td style="text-align:left"><strong>Especificación</strong></td>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="trazabilidad">Trazabilidad</h2>
<ul>
<li>La trazabilidad es una <strong>técnica, herramienta y método</strong> que conecta los niveles</li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="especificaci%C3%B3n-%E2%86%92-construcci%C3%B3n">Especificación → Construcción</h3>
<ul>
<li>Problema del negocio</li>
<li>Visión y características del sistema</li>
<li>Especificación → <strong>Casos de uso</strong></li>
<li>Sistema → <strong>Modelo de análisis</strong>, modelo de seguridad</li>
<li>Diseño e integración → <strong>Modelo de diseño</strong></li>
<li>Desarrollo y configuración → <strong>Código</strong></li>
</ul>
</div>
<div>
<h3 id="verificaci%C3%B3n">Verificación</h3>
<ul>
<li>Casos de uso → <strong>Casos de prueba</strong></li>
<li>Modelo de diseño → <strong>Scripts de pruebas</strong></li>
<li>Código → <strong>Resultados de pruebas</strong></li>
</ul>
<br />
<ul>
<li>Si cambia un requerimiento, la trazabilidad nos dice <strong>qué más hay que cambiar</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="proceso-de-ingenier%C3%ADa-de-software">Proceso de Ingeniería de Software</h2>
<split-slide style="--left: 55%; --right: 45%;">
<p><img src="../assets/ads-proceso-ing-software.png" alt="contain" style="width:600px;" /></p>
<div>
<ul>
<li><strong>Metodologías</strong> (<em>guías o enfoques</em>)
<ul>
<li>Cascada, RUP, Scrum, XP...</li>
</ul>
</li>
<li><strong>Técnicas</strong> (<em>métodos</em>)
<ul>
<li>Casos de uso, UML, refactorización...</li>
</ul>
</li>
<li><strong>Herramientas</strong> (<em>aplicaciones</em>)
<ul>
<li>IDEs, control de versiones, CI/CD...</li>
</ul>
</li>
</ul>
<br />
<ul>
<li>Los tres se <strong>retroalimentan</strong> entre sí</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-pFE7U7qM="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="17" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="34">
<h1 id="atributos-de-calidad">Atributos de calidad</h1>
<h2 id="contenidos-3">Contenidos</h2>
<ul>
<li>Mantenibilidad y testeabilidad</li>
<li>Modificabilidad</li>
<li>Performance, seguridad y escalabilidad</li>
<li>Disponibilidad</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="atributos-de-calidad-del-software">Atributos de calidad del software</h2>
<ul>
<li>Según Gomaa, H. (2011, p. 357) se refieren a <strong>requerimientos no funcionales</strong> del software, los cuáles tienen un profundo efecto en la <strong>calidad</strong> de un producto de software</li>
</ul>
<steps>
<step>
<h3 id="%F0%9F%94%A7-mantenibilidad"><img class="emoji" draggable="false" alt="🔧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f527.svg" data-marp-twemoji=""/> Mantenibilidad</h3>
<ul>
<li>Medida en que el software puede ser <strong>cambiado después de su despliegue</strong></li>
<li>El software <strong>debe evolucionar</strong> → los negocios cambian</li>
<li>El software debe ser diseñado para el <strong>cambio y la adaptabilidad</strong></li>
</ul>
</step>
<step>
<h3 id="%F0%9F%94%A7-mantenibilidad-%C2%BFpor-qu%C3%A9-cambia-el-software"><img class="emoji" draggable="false" alt="🔧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f527.svg" data-marp-twemoji=""/> Mantenibilidad: ¿por qué cambia el software?</h3>
<ul>
<li>Arreglar <strong>errores</strong> no detectados en las pruebas</li>
<li>Abordar problemas de <strong>rendimiento</strong> visibles sólo cuando el software está en producción</li>
<li><strong>Cambios</strong> en los requerimientos del software</li>
</ul>
<blockquote>
<p>De naturaleza en el <strong>software</strong></p>
</blockquote>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="mantenibilidad-%C2%BFqu%C3%A9-dise%C3%B1o-es-mejor">Mantenibilidad: ¿qué diseño es mejor?</h2>
<ul>
<li>¿Por qué un diseño puede considerarse <strong>más mantenible</strong> que el otro?</li>
</ul>
<p><img src="../assets/ads-mantenibilidad-uml.png" alt="contain" style="width:750px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="testeabilidad-y-modificabilidad">Testeabilidad y modificabilidad</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%A7%AA-testeabilidad"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Testeabilidad</h3>
<ul>
<li>Grado en que el software puede ser <strong>objeto de pruebas</strong></li>
<li>Se debe desarrollar un <strong>plan de pruebas temprano</strong> en el ciclo de vida</li>
<li>¿Cuáles pueden ser ejemplos de pruebas?</li>
</ul>
</div>
<div>
<h3 id="%E2%9C%8F%EF%B8%8F-modificabilidad"><img class="emoji" draggable="false" alt="✏️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/270f.svg" data-marp-twemoji=""/> Modificabilidad</h3>
<ul>
<li>Grado en que el software puede ser <strong>modificado durante y después</strong> del desarrollo inicial</li>
<li>Un <strong>diseño modular</strong> integrado por módulos con interfaces bien definidas → <strong>encapsulamiento</strong></li>
<li>¿Separación de la lógica en capas?</li>
</ul>
</div>
</split-slide>
<blockquote>
<p>De naturaleza en el <strong>software</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="performance-seguridad-y-escalabilidad">Performance, seguridad y escalabilidad</h2>
<div class="grid">
<div>
<h3 id="%E2%9A%A1-performance"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> Performance</h3>
<p>Asociado con el <strong>rendimiento</strong> y los <strong>tiempos de respuesta</strong> esperados del software</p>
</div>
<div>
<h3 id="%F0%9F%94%92-seguridad"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f512.svg" data-marp-twemoji=""/> Seguridad</h3>
<p>El software enfrenta muchas <strong>amenazas</strong> que debe subsanar</p>
<p>Comprometen la <strong>confidencialidad, disponibilidad e integridad</strong> de la información</p>
</div>
<div>
<h3 id="%F0%9F%93%88-escalabilidad"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c8.svg" data-marp-twemoji=""/> Escalabilidad</h3>
<p>Grado en que el sistema puede <strong>crecer</strong> luego de su despliegue inicial</p>
</div>
</div>
<ul>
<li><strong>Sistema (hw)</strong> → más memoria o disco en un sistema centralizado, más nodos en uno distribuido</li>
<li><strong>Software</strong> → diseñado para crecer: componentes distribuidos o servicios (SOA)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="disponibilidad">Disponibilidad</h2>
<ul>
<li>Se relaciona con las <strong>fallas del sistema</strong> y su impacto en los usuarios y otros sistemas</li>
</ul>
<div class="grid">
<div>
<h3 id="%E2%9D%93-pregunta-1"><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> Pregunta 1</h3>
<p>¿Qué sistemas necesitan estar <strong>operacionalmente disponibles todo el tiempo</strong>?</p>
</div>
<div>
<h3 id="%E2%9D%93-pregunta-2"><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> Pregunta 2</h3>
<p>¿Cómo lograr un sistema <strong>tolerante a fallas</strong>?</p>
</div>
</div>
<blockquote>
<p>De naturaleza en el <strong>sistema</strong> — hardware y software</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-uu14LtlZ="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="23" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="34">
<h1 id="modelos-de-proceso">Modelos de proceso</h1>
<h2 id="contenidos-4">Contenidos</h2>
<ul>
<li>Fases del ciclo de vida (SDLC)</li>
<li>Modelos y enfoques</li>
<li>Desarrollo en cascada</li>
<li>RUP: iterativo-incremental</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="fases-del-ciclo-de-vida-del-desarrollo-de-sistemas">Fases del ciclo de vida del desarrollo de sistemas</h2>
<split-slide style="--left: 50%; --right: 50%;">
<p><img src="../assets/ads-sdlc-fases.jpg" alt="contain" style="width:550px;" /></p>
<div>
<ol>
<li>Identificación de problemas, oportunidades y objetivos</li>
<li>Determinación de los <strong>requerimientos</strong> de información</li>
<li><strong>Análisis</strong> de las necesidades del sistema</li>
<li><strong>Diseño</strong> del sistema recomendado</li>
<li><strong>Desarrollo</strong> y documentación del software</li>
<li><strong>Pruebas</strong> y mantenimiento del sistema</li>
<li><strong>Implantación</strong> y evaluación del sistema</li>
</ol>
<blockquote>
<p>Kendall y Kendall (2019)</p>
</blockquote>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="fase-1-identificaci%C3%B3n-de-problemas-oportunidades-y-objetivos">Fase 1: Identificación de problemas, oportunidades y objetivos</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="actividad">Actividad</h3>
<ul>
<li>Se identifica una <strong>necesidad</strong> de un sistema nuevo o mejorado</li>
<li>Las necesidades se identifican, analizan, <strong>priorizan</strong> y organizan</li>
<li>Se determina el <strong>alcance</strong> del sistema propuesto</li>
<li>Se documentan los resultados</li>
</ul>
</div>
<div>
<h3 id="salida">Salida</h3>
<ul>
<li><strong>Reporte de factibilidad</strong>, que contiene:
<ul>
<li>La <strong>definición del problema</strong></li>
<li>Un resumen de objetivos que facilite a la gerencia la decisión de <strong>proceder o no</strong> con la propuesta de proyecto</li>
</ul>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="fase-2-determinaci%C3%B3n-de-los-requerimientos-de-informaci%C3%B3n">Fase 2: Determinación de los requerimientos de información</h2>
<steps>
<step>
<h3 id="actividad-%C2%BFc%C3%B3mo-obtenemos-la-informaci%C3%B3n">Actividad: ¿cómo obtenemos la información?</h3>
<div class="grid">
<div>
<ul>
<li><img class="emoji" draggable="false" alt="🗣️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5e3.svg" data-marp-twemoji=""/> <strong>Entrevista</strong></li>
<li><img class="emoji" draggable="false" alt="🎲" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3b2.svg" data-marp-twemoji=""/> <strong>Muestreo</strong></li>
<li><img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c4.svg" data-marp-twemoji=""/> <strong>Revisión de documentos</strong></li>
</ul>
</div>
<div>
<ul>
<li><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> <strong>Cuestionarios</strong></li>
<li><img class="emoji" draggable="false" alt="👀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f440.svg" data-marp-twemoji=""/> <strong>Observar</strong> el comportamiento del tomador de decisión y el ambiente</li>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <strong>Prototipado</strong></li>
</ul>
</div>
</div>
</step>
<step>
<h3 id="actividad-%C2%BFqu%C3%A9-debemos-aprender">Actividad: ¿qué debemos aprender?</h3>
<ul>
<li>El <strong>quién</strong> → personas involucradas</li>
<li>El <strong>qué</strong> → procesos de negocio</li>
<li>El <strong>dónde</strong> → el ambiente en el cual el trabajo se efectúa</li>
<li>El <strong>cuándo</strong> → los tiempos</li>
<li>El <strong>cómo</strong> → cómo los procedimientos actuales se ejecutan</li>
<li>El <strong>porqué</strong> → por qué se emplea el sistema actual (ya sea manual o computarizado)</li>
</ul>
</step>
<step>
<h3 id="salida-1">Salida</h3>
<ul>
<li>La persona analista <strong>comprende cómo la persona usuaria logra su trabajo</strong> con los sistemas actuales: manuales o computarizados</li>
<li>Empieza a concebir cómo hacer el nuevo sistema <strong>más útil y usable</strong></li>
<li>Debería conocer las <strong>funciones del negocio</strong></li>
<li>Tiene información completa sobre <strong>gente, metas, datos y procedimientos</strong> implicados</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="fase-3-an%C3%A1lisis-de-las-necesidades-del-sistema">Fase 3: Análisis de las necesidades del sistema</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="actividad-1">Actividad</h3>
<ul>
<li>La persona analista <strong>estudia los requerimientos</strong> y los <strong>estructura</strong> con base en sus interrelaciones</li>
</ul>
</div>
<div>
<h3 id="salida-2">Salida</h3>
<ul>
<li>Descripción de la <strong>solución alternativa recomendada</strong> por el equipo de análisis</li>
<li>Incluye recomendaciones sobre <strong>lo que debería hacerse</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="fase-4-dise%C3%B1o-del-sistema-recomendado">Fase 4: Diseño del sistema recomendado</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="actividad-2">Actividad</h3>
<ul>
<li>Convierte la alternativa de solución en especificaciones <strong>lógicas y físicas</strong></li>
<li>Diseño de <strong>procesos</strong> del sistema, entradas y salidas (en pantalla o impresas)</li>
<li>Diseño de la <strong>interfaz humano-computador</strong> (HCI)</li>
<li>Diseño de <strong>archivos</strong> y/o base de datos</li>
<li>Diseño de procedimientos de <strong>respaldo</strong></li>
</ul>
</div>
<div>
<h3 id="salida-3">Salida</h3>
<ul>
<li><strong>Especificación del diseño</strong> del sistema</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="dise%C3%B1o-l%C3%B3gico-vs-dise%C3%B1o-f%C3%ADsico">Diseño lógico vs. diseño físico</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%93%90-dise%C3%B1o-l%C3%B3gico"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> Diseño lógico</h3>
<ul>
<li>Parte del proceso de diseño que es <strong>independiente</strong> de cualquier plataforma de software o hardware específico</li>
</ul>
<blockquote>
<p><em>A logical model shows <strong>what</strong> the system must do, regardless of how it will be implemented physically</em></p>
</blockquote>
</div>
<div>
<h3 id="%F0%9F%8F%97%EF%B8%8F-dise%C3%B1o-f%C3%ADsico"><img class="emoji" draggable="false" alt="🏗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3d7.svg" data-marp-twemoji=""/> Diseño físico</h3>
<ul>
<li>Las especificaciones lógicas son transformadas en <strong>detalles específicos</strong> alineados con la tecnología, para permitir la construcción del sistema</li>
</ul>
<blockquote>
<p><em>A physical model is built that describes <strong>how</strong> the system will be constructed</em></p>
</blockquote>
</div>
</split-slide>
<ul>
<li>La escogencia del <strong>lenguaje, base de datos y plataforma</strong> usualmente la deciden la organización y el cliente</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="fases-5-6-y-7">Fases 5, 6 y 7</h2>
<steps>
<step>
<h3 id="5-desarrollo-y-documentaci%C3%B3n-del-software">5. Desarrollo y documentación del software</h3>
<ul>
<li>La persona analista trabaja con <strong>programadores</strong> para desarrollar el software original</li>
<li>Trabaja con <strong>usuarios</strong> para desarrollar documentación efectiva</li>
<li>Se diseña, codifica y se eliminan los errores sintácticos de los programas</li>
<li>Se documenta con <strong>manuales de procedimiento</strong>, ayuda en línea, FAQ y archivos <em>Read Me</em></li>
<li><strong>Salida</strong> → programas de computadora y documentación del sistema</li>
</ul>
</step>
<step>
<h3 id="6-pruebas-y-mantenimiento-del-sistema">6. Pruebas y mantenimiento del sistema</h3>
<ul>
<li><strong>Probar</strong> el sistema de información</li>
<li><strong>Mantenimiento</strong> del sistema</li>
<li>Documentación del mantenimiento</li>
<li><strong>Salida</strong> → problemas detectados (si los hay), programas actualizados y documentación</li>
</ul>
</step>
<step>
<h3 id="7-implantaci%C3%B3n-y-evaluaci%C3%B3n-del-sistema">7. Implantación y evaluación del sistema</h3>
<ul>
<li><strong>Capacitar</strong> a las personas usuarias</li>
<li>Planear la <strong>conversión</strong> del sistema viejo al sistema nuevo</li>
<li><strong>Revisar y evaluar</strong> el sistema</li>
<li><strong>Salida</strong> → personal capacitado y sistema instalado</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="modelos-y-enfoques">Modelos y enfoques</h2>
<p><a href="../assets/ads-modelos-desarrollo.png"><img src="../assets/ads-modelos-desarrollo.png" alt="contain" style="width:880px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="desarrollo-en-cascada">Desarrollo en cascada</h2>
<split-slide style="--left: 55%; --right: 45%;">
<p><img src="../assets/ads-cascada.png" alt="contain" style="width:600px;" /></p>
<div>
<ul>
<li>Desarrollado por <strong>Winston Royce</strong> en 1970</li>
<li>Proceso <strong>secuencial</strong> dividido en etapas con entradas y salidas</li>
<li>La etapa siguiente inicia <strong>cuando la previa es completada</strong></li>
</ul>
<br />
<ul>
<li>¿Qué pasa si un requerimiento cambia en la etapa de <em>Testing</em>?</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="desarrollo-iterativo-incremental-rup">Desarrollo iterativo-incremental: RUP</h2>
<split-slide style="--left: 55%; --right: 45%;">
<p><img src="../assets/ads-rup.png" alt="contain" style="width:600px;" /></p>
<div>
<ul>
<li><strong>Fases</strong>: <em>Inception</em>, <em>Elaboration</em>, <em>Construction</em>, <em>Transition</em></li>
<li><strong>Disciplinas</strong> (modelado, implementación, pruebas, despliegue...) que se ejecutan <strong>en todas las fases</strong>, pero con distinta intensidad</li>
<li>Cada iteración produce un <strong>incremento</strong> ejecutable</li>
</ul>
<br />
<ul>
<li>A diferencia de cascada, <strong>no se espera</strong> al final para probar o desplegar</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="34">
<h2 id="referencias">Referencias</h2>
<ul>
<li>Booch, G. et al. (2007). <em>Object-Oriented Analysis and Design with Applications</em>. 3ra. edición. USA: Pearson Education.</li>
<li>Deek, F. P., McHugh, J. A. M., Eljabiri, O. M. (2005). <em>Strategic Software Engineering: An Interdisciplinary Approach</em>. USA: Auerbach Publications.</li>
