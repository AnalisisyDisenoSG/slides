<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="1020" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="v-ar" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#555"/></marker>
  </defs>
  <rect width="1020" height="560" fill="#ffffff"/>
  <text x="510" y="36" font-size="19" fill="#111" text-anchor="middle" font-weight="600">Modelo en V: cada actividad de desarrollo produce las pruebas que la verificarán</text>

  <g stroke="#333" stroke-width="1.6">
    <rect x="110" y="80" width="230" height="56" fill="#d6eaf8"/>
    <rect x="170" y="190" width="230" height="56" fill="#d6eaf8"/>
    <rect x="230" y="300" width="230" height="56" fill="#d6eaf8"/>
    <rect x="290" y="410" width="200" height="56" fill="#d6eaf8"/>
    <rect x="680" y="80" width="230" height="56" fill="#e8f6ec"/>
    <rect x="620" y="190" width="230" height="56" fill="#e8f6ec"/>
    <rect x="560" y="300" width="230" height="56" fill="#e8f6ec"/>
    <rect x="530" y="410" width="200" height="56" fill="#e8f6ec"/>
  </g>
  <g font-size="16" fill="#111" font-weight="600" text-anchor="middle">
    <text x="225" y="114">Requerimientos</text>
    <text x="285" y="224">Diseño arquitectónico</text>
    <text x="345" y="334">Diseño detallado</text>
    <text x="390" y="444">Código</text>
