  <g stroke="#555" stroke-width="1.6" fill="none">
    <path d="M225,138 L270,186" marker-end="url(#v-ar)"/>
    <path d="M285,248 L330,296" marker-end="url(#v-ar)"/>
    <path d="M345,358 L380,406" marker-end="url(#v-ar)"/>
    <path d="M492,438 L526,438" marker-end="url(#v-ar)"/>
    <path d="M650,406 L665,360" marker-end="url(#v-ar)"/>
    <path d="M700,296 L725,250" marker-end="url(#v-ar)"/>
    <path d="M760,186 L785,140" marker-end="url(#v-ar)"/>
  </g>

  <g stroke="#27ae60" stroke-width="3" stroke-dasharray="8 6">
    <line x1="342" y1="108" x2="676" y2="108"/>
    <line x1="402" y1="218" x2="616" y2="218"/>
    <line x1="462" y1="328" x2="556" y2="328"/>
