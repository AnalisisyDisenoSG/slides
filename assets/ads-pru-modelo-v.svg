  </g>

  <text x="60" y="290" font-size="15" fill="#2471a3" font-weight="600" text-anchor="middle" transform="rotate(90 60 290)">se ESCRIBEN las pruebas →</text>
  <text x="960" y="290" font-size="15" fill="#1e8449" font-weight="600" text-anchor="middle" transform="rotate(-90 960 290)">se EJECUTAN las pruebas →</text>

  <text x="510" y="510" font-size="14" fill="#444" text-anchor="middle">Verificación: ¿construimos bien el producto? · Validación: ¿construimos el producto correcto?</text>
