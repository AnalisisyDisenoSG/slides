<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" width="1020" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="full" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1020" height="520" fill="#ffffff"/>

  <circle cx="55" cy="150" r="9" fill="#333"/>
  <g stroke="#333" stroke-width="1.5" fill="#fdf3d0">
    <rect x="100" y="115" width="160" height="70" rx="16"/>
    <rect x="340" y="115" width="160" height="70" rx="16"/>
    <rect x="580" y="100" width="200" height="100" rx="16"/>
    <rect x="100" y="270" width="160" height="60" rx="16"/>
    <rect x="580" y="270" width="200" height="60" rx="16"/>
  </g>
  <path d="M580,132 L780,132" stroke="#333" stroke-width="1.3"/>
  <g font-size="16" fill="#111" text-anchor="middle" font-weight="600">
    <text x="180" y="156">Registrado</text>
    <text x="420" y="156">Pagado</text>
    <text x="680" y="123">EnTransito</text>
    <text x="180" y="306">Cancelado</text>
    <text x="680" y="306">Entregado</text>
  </g>
  <g font-size="12.5" fill="#111" font-family="Consolas, monospace">
    <text x="594" y="152">entry / notificarCliente()</text>
    <text x="594" y="172">do / rastrearPaquete()</text>
    <text x="594" y="192">exit / cerrarGuia()</text>
  </g>

  <g stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#full)">
    <path d="M64,150 L96,150"/>
    <path d="M260,150 L336,150"/>
    <path d="M500,150 L576,150"/>
    <path d="M680,200 L680,266"/>
    <path d="M780,300 L862,300"/>
    <path d="M180,185 L180,266"/>
    <path d="M260,300 L316,300"/>
  </g>
  <g stroke="#333" stroke-width="1.8" fill="none">
    <circle cx="880" cy="300" r="12"/><circle cx="880" cy="300" r="6.5" fill="#333"/>
    <circle cx="334" cy="300" r="12"/><circle cx="334" cy="300" r="6.5" fill="#333"/>
  </g>

  <g font-size="13" fill="#111" text-anchor="middle">
    <text x="300" y="92">confirmarPago() [fondos suficientes]</text>
    <text x="300" y="110">/ generarFactura()</text>
    <text x="538" y="140">despachar()</text>
  </g>
  <g font-size="13" fill="#111">
    <text x="690" y="240">entregar()</text>
    <text x="190" y="232">cancelar()</text>
  </g>

  <rect x="40" y="366" width="950" height="136" fill="#f7f7f7" stroke="#bbb"/>
  <g font-size="14.5" fill="#111"><text x="58" y="392" font-weight="700">Cómo se lee una máquina de estados</text></g>
  <g font-size="13.5" fill="#111">
    <text x="58" y="418">Sintaxis de la transición: <tspan font-family="Consolas, monospace" font-weight="700">evento [guarda] / acción</tspan> — los tres son opcionales, pero el orden es fijo.</text>
    <text x="58" y="442">Actividades internas: <tspan font-family="Consolas, monospace" font-weight="700">entry</tspan> al entrar, <tspan font-family="Consolas, monospace" font-weight="700">do</tspan> mientras permanece, <tspan font-family="Consolas, monospace" font-weight="700">exit</tspan> al salir. Se ejecutan siempre, venga de donde venga.</text>
    <text x="58" y="466">Describe el ciclo de vida de <tspan font-weight="700">un objeto</tspan> (un Pedido), no el flujo de trabajo de varios actores — eso es el diagrama de actividad.</text>
    <text x="58" y="490" fill="#555">Vale la pena solo para objetos con comportamiento dependiente del estado: pedidos, reservas, sesiones, dispositivos, protocolos.</text>
  </g>
</svg>
