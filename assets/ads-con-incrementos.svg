<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="1020" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="inc-ar" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1020" height="560" fill="#ffffff"/>
  <text x="510" y="36" font-size="19" fill="#111" text-anchor="middle" font-weight="600">Cada versión funcional atraviesa todas las capas: se construye en rebanadas verticales</text>

  <!-- capas (filas) -->
  <g font-size="13.5" fill="#111" text-anchor="end" font-weight="600">
    <text x="160" y="114">Interfaz</text>
    <text x="160" y="184">Lógica de negocio</text>
    <text x="160" y="254">Persistencia</text>
    <text x="160" y="324">Integraciones</text>
  </g>
  <g stroke="#ddd" stroke-width="1">
    <path d="M180,74 L990,74"/><path d="M180,144 L990,144"/><path d="M180,214 L990,214"/><path d="M180,284 L990,284"/><path d="M180,354 L990,354"/>
  </g>

  <!-- v0.1 esqueleto -->
  <g stroke="#333" stroke-width="1.5">
    <rect x="200" y="84" width="130" height="260" fill="#e8daef"/>
  </g>
  <text x="265" y="210" font-size="13" fill="#111" text-anchor="middle" font-weight="600">Esqueleto</text>
  <text x="265" y="228" font-size="13" fill="#111" text-anchor="middle" font-weight="600">andante</text>
  <text x="265" y="250" font-size="11.5" fill="#555" text-anchor="middle">un caso de uso</text>
  <text x="265" y="266" font-size="11.5" fill="#555" text-anchor="middle">mínimo, punta</text>
  <text x="265" y="282" font-size="11.5" fill="#555" text-anchor="middle">a punta</text>

  <!-- v0.2 -->
  <rect x="360" y="84" width="130" height="260" fill="#d6eaf8" stroke="#333" stroke-width="1.5"/>
  <text x="425" y="210" font-size="13" fill="#111" text-anchor="middle" font-weight="600">CU-01</text>
  <text x="425" y="228" font-size="13" fill="#111" text-anchor="middle">Registrar</text>
  <text x="425" y="246" font-size="13" fill="#111" text-anchor="middle">estudiante</text>

  <!-- v0.3 -->
  <rect x="520" y="84" width="130" height="260" fill="#d6eaf8" stroke="#333" stroke-width="1.5"/>
  <text x="585" y="210" font-size="13" fill="#111" text-anchor="middle" font-weight="600">CU-02</text>
  <text x="585" y="228" font-size="13" fill="#111" text-anchor="middle">Matricular</text>
  <text x="585" y="246" font-size="13" fill="#111" text-anchor="middle">curso</text>

  <!-- v0.4 -->
  <rect x="680" y="84" width="130" height="260" fill="#d6eaf8" stroke="#333" stroke-width="1.5"/>
  <text x="745" y="210" font-size="13" fill="#111" text-anchor="middle" font-weight="600">CU-03</text>
  <text x="745" y="228" font-size="13" fill="#111" text-anchor="middle">Pagar</text>
  <text x="745" y="246" font-size="13" fill="#111" text-anchor="middle">matrícula</text>

  <!-- v1.0 -->
  <rect x="840" y="84" width="130" height="260" fill="#d5f5e3" stroke="#333" stroke-width="1.5"/>
  <text x="905" y="210" font-size="13" fill="#111" text-anchor="middle" font-weight="600">CU-04…</text>
  <text x="905" y="228" font-size="13" fill="#111" text-anchor="middle">+ estabilizar</text>
  <text x="905" y="246" font-size="13" fill="#111" text-anchor="middle">+ migrar datos</text>

  <!-- línea de tiempo -->
  <path d="M200,392 L975,392" stroke="#333" stroke-width="1.8" marker-end="url(#inc-ar)" fill="none"/>
  <g fill="#333">
    <circle cx="265" cy="392" r="6"/><circle cx="425" cy="392" r="6"/><circle cx="585" cy="392" r="6"/><circle cx="745" cy="392" r="6"/><circle cx="905" cy="392" r="6"/>
  </g>
  <g font-size="14" fill="#111" text-anchor="middle" font-weight="600">
    <text x="265" y="418">v0.1.0</text><text x="425" y="418">v0.2.0</text><text x="585" y="418">v0.3.0</text><text x="745" y="418">v0.4.0</text><text x="905" y="418">v1.0.0</text>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="265" y="436">línea base arquitectónica</text><text x="425" y="436">versión interna</text><text x="585" y="436">alfa</text><text x="745" y="436">beta</text><text x="905" y="436">liberación</text>
  </g>

  <rect x="60" y="468" width="900" height="72" fill="#f7f7f7" stroke="#bbb"/>
  <text x="510" y="496" font-size="14" fill="#111" text-anchor="middle">Cada columna <tspan font-weight="600">compila, se integra, pasa sus pruebas y hace algo útil</tspan> de principio a fin.</text>
  <text x="510" y="520" font-size="13" fill="#555" text-anchor="middle">Lo contrario —construir la capa de datos completa, luego toda la lógica, luego toda la interfaz— no deja nada funcional hasta el final.</text>
</svg>
