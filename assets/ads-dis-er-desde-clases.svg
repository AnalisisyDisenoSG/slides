<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="1020" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dc-tri" markerWidth="16" markerHeight="16" refX="14" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#fff" stroke="#333" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="1020" height="620" fill="#ffffff"/>
  <text x="510" y="32" font-size="19" fill="#111" text-anchor="middle" font-weight="600">Del diagrama de clases al diagrama entidad-relaci&#243;n: los tres casos especiales</text>

  <g stroke="#ddd" stroke-width="1.4">
    <path d="M345,52 L345,560"/>
    <path d="M675,52 L675,560"/>
  </g>
  <g font-size="15.5" fill="#111" font-weight="600" text-anchor="middle">
    <text x="180" y="70">Composici&#243;n</text>
    <text x="510" y="70">Clase asociaci&#243;n</text>
    <text x="840" y="70">Generalizaci&#243;n</text>
  </g>
  <g font-size="12.5" fill="#999" text-anchor="middle">
    <text x="180" y="276">&#8595; se transforma en</text>
    <text x="510" y="276">&#8595; se transforma en</text>
    <text x="840" y="276">&#8595; se transforma en</text>
  </g>

  <!-- ===== panel 1: composición ===== -->
  <g stroke="#333" stroke-width="1.5" fill="#ffffff">
    <rect x="120" y="92" width="120" height="40"/>
    <rect x="120" y="196" width="120" height="40"/>
  </g>
  <text x="180" y="117" font-size="13" fill="#111" text-anchor="middle">Factura</text>
  <text x="180" y="221" font-size="13" fill="#111" text-anchor="middle">Linea</text>
  <polygon points="180,132 188,144 180,156 172,144" fill="#333" stroke="#333"/>
  <path d="M180,156 L180,196" stroke="#333" stroke-width="1.5"/>
  <text x="188" y="190" font-size="12" fill="#444">1..*</text>

  <path d="M180,342 L180,364 M180,420 L180,448" stroke="#333" stroke-width="1.5" fill="none"/>
  <rect x="115" y="300" width="130" height="42" fill="#d6eaf8" stroke="#333" stroke-width="1.6"/>
  <text x="180" y="326" font-size="13" fill="#111" text-anchor="middle" font-weight="600">FACTURA</text>
  <polygon points="180,364 236,392 180,420 124,392" fill="#fdf3d0" stroke="#333" stroke-width="1.6"/>
  <polygon points="180,372 224,392 180,412 136,392" fill="none" stroke="#333" stroke-width="1.3"/>
  <text x="180" y="396" font-size="12.5" fill="#111" text-anchor="middle">tiene</text>
  <rect x="115" y="448" width="130" height="42" fill="#d6eaf8" stroke="#333" stroke-width="1.6"/>
  <rect x="120" y="453" width="120" height="32" fill="none" stroke="#333" stroke-width="1.3"/>
  <text x="180" y="474" font-size="13" fill="#111" text-anchor="middle" font-weight="600">LINEA</text>
  <g font-size="12" fill="#1f5fa8" font-weight="600">
    <text x="190" y="358">(1,1)</text>
    <text x="190" y="442">(1,n)</text>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="180" y="522">El <tspan font-weight="600">todo</tspan> &#8594; entidad fuerte</text>
    <text x="180" y="542">La <tspan font-weight="600">parte</tspan> &#8594; entidad d&#233;bil</text>
  </g>

  <!-- ===== panel 2: clase asociación ===== -->
  <g stroke="#333" stroke-width="1.5" fill="#ffffff">
    <rect x="360" y="92" width="110" height="40"/>
    <rect x="550" y="92" width="110" height="40"/>
    <rect x="440" y="164" width="140" height="68"/>
  </g>
  <path d="M470,112 L550,112" stroke="#333" stroke-width="1.5"/>
  <path d="M510,112 L510,164" stroke="#333" stroke-width="1.4" stroke-dasharray="6,4"/>
  <path d="M440,192 L580,192" stroke="#333" stroke-width="1.2"/>
  <g font-size="13" fill="#111" text-anchor="middle">
    <text x="415" y="117">Empresa</text>
    <text x="605" y="117">Empleado</text>
    <text x="510" y="184">Puesto</text>
  </g>
  <g font-size="11.5" fill="#111">
    <text x="450" y="210">fechaIngreso</text>
    <text x="450" y="226">sueldo</text>
  </g>
  <g font-size="12" fill="#444">
    <text x="474" y="106">1..*</text>
    <text x="546" y="106" text-anchor="end">1..*</text>
  </g>

  <g stroke="#333" stroke-width="1.5" fill="none">
    <path d="M510,342 L510,364 M510,420 L510,448"/>
    <path d="M562,386 L578,376"/>
    <path d="M562,398 L592,410"/>
  </g>
  <rect x="445" y="300" width="130" height="42" fill="#d6eaf8" stroke="#333" stroke-width="1.6"/>
  <text x="510" y="326" font-size="13" fill="#111" text-anchor="middle" font-weight="600">EMPRESA</text>
  <polygon points="510,364 566,392 510,420 454,392" fill="#fdf3d0" stroke="#333" stroke-width="1.6"/>
  <text x="510" y="396" font-size="12.5" fill="#111" text-anchor="middle">puesto</text>
  <rect x="445" y="448" width="130" height="42" fill="#d6eaf8" stroke="#333" stroke-width="1.6"/>
  <text x="510" y="474" font-size="13" fill="#111" text-anchor="middle" font-weight="600">EMPLEADO</text>
  <g fill="#e8f6ec" stroke="#333" stroke-width="1.4">
    <ellipse cx="620" cy="366" rx="46" ry="16"/>
    <ellipse cx="624" cy="418" rx="34" ry="16"/>
  </g>
  <g font-size="11.5" fill="#111" text-anchor="middle">
    <text x="620" y="370">fechaIngreso</text>
    <text x="624" y="422">sueldo</text>
  </g>
  <g font-size="12" fill="#1f5fa8" font-weight="600">
    <text x="520" y="358">(1,n)</text>
    <text x="520" y="442">(1,n)</text>
    <text x="446" y="396" text-anchor="end">N:M</text>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="510" y="522">La clase &#8594; interrelaci&#243;n N:M</text>
    <text x="510" y="542">Sus atributos &#8594; atributos de la relaci&#243;n</text>
  </g>

  <!-- ===== panel 3: generalización ===== -->
  <g stroke="#333" stroke-width="1.5" fill="#ffffff">
    <rect x="770" y="92" width="140" height="40"/>
    <rect x="700" y="196" width="110" height="40"/>
    <rect x="870" y="196" width="110" height="40"/>
  </g>
  <g font-size="13" fill="#111" text-anchor="middle">
    <text x="840" y="117">AgenteComercial</text>
    <text x="755" y="221">Cliente</text>
    <text x="925" y="221">Proveedor</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <path d="M755,196 L755,168 L925,168 L925,196"/>
    <path d="M840,168 L840,136" marker-end="url(#dc-tri)"/>
  </g>

  <g stroke="#333" stroke-width="1.5" fill="none">
    <path d="M840,342 L840,356"/>
    <path d="M840,410 L840,428 M755,428 L925,428 M755,428 L755,448 M925,428 L925,448"/>
  </g>
  <rect x="765" y="300" width="150" height="42" fill="#d6eaf8" stroke="#333" stroke-width="1.6"/>
  <text x="840" y="326" font-size="12.5" fill="#111" text-anchor="middle" font-weight="600">AGENTE_COMERCIAL</text>
  <polygon points="840,356 874,410 806,410" fill="#fdf3d0" stroke="#333" stroke-width="1.6"/>
  <text x="840" y="402" font-size="12.5" fill="#111" text-anchor="middle" font-weight="600">ES</text>
  <rect x="700" y="448" width="110" height="42" fill="#d6eaf8" stroke="#333" stroke-width="1.6"/>
  <rect x="870" y="448" width="110" height="42" fill="#d6eaf8" stroke="#333" stroke-width="1.6"/>
  <g font-size="12.5" fill="#111" text-anchor="middle" font-weight="600">
    <text x="755" y="474">CLIENTE</text>
    <text x="925" y="474">PROVEEDOR</text>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="840" y="522">1) superclase y subclases (dibujo)</text>
    <text x="840" y="542">2) bajar atributos &#183; 3) subirlos</text>
  </g>

  <rect x="40" y="566" width="940" height="40" fill="#f7f7f7" stroke="#bbb"/>
  <text x="510" y="591" font-size="13" fill="#333" text-anchor="middle">Regla general: cada clase se vuelve entidad, sus atributos pasan tal cual, se agrega un identificador y <tspan font-weight="600">las operaciones desaparecen</tspan>.</text>
</svg>
