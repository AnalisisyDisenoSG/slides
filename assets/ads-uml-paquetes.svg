<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="open" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto">
      <path d="M1,1 L11,5 L1,9" fill="none" stroke="#333" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1180" height="520" fill="#ffffff"/>

  <!-- ui -->
  <g stroke="#333" stroke-width="1.5" fill="#fdf3d0">
    <rect x="60" y="30" width="95" height="22"/><rect x="60" y="52" width="230" height="76"/>
    <rect x="60" y="190" width="95" height="22"/><rect x="60" y="212" width="230" height="76"/>
    <rect x="60" y="350" width="95" height="22"/><rect x="60" y="372" width="230" height="76"/>
    <rect x="420" y="270" width="120" height="22"/><rect x="420" y="292" width="230" height="76"/>
  </g>
  <g font-size="16" fill="#111" text-anchor="middle">
    <text x="175" y="96" font-weight="600">ui</text>
    <text x="175" y="256" font-weight="600">aplicacion</text>
    <text x="175" y="416" font-weight="600">dominio</text>
    <text x="535" y="336" font-weight="600">infraestructura</text>
  </g>
  <g font-size="13" fill="#666" text-anchor="middle">
    <text x="175" y="116">pantallas, controladores</text>
    <text x="175" y="276">casos de uso, servicios</text>
    <text x="175" y="436">entidades, reglas</text>
    <text x="535" y="356">BD, correo, pasarelas</text>
  </g>

  <g stroke="#333" stroke-width="1.5" fill="none" stroke-dasharray="7,5" marker-end="url(#open)">
    <path d="M175,128 L175,186"/>
    <path d="M175,288 L175,346"/>
    <path d="M290,240 L416,300"/>
    <path d="M430,368 L295,410"/>
  </g>
  <g font-size="13" fill="#c0392b">
    <text x="185" y="163">&#171;use&#187;</text>
    <text x="185" y="323">&#171;use&#187;</text>
    <text x="330" y="255">&#171;use&#187;</text>
    <text x="330" y="405">&#171;use&#187;</text>
  </g>

  <!-- nested -->
  <g stroke="#333" stroke-width="1.5" fill="#eaf4fb">
    <rect x="700" y="30" width="110" height="22"/><rect x="700" y="52" width="280" height="150"/>
  </g>
  <text x="755" y="47" font-size="15" fill="#111" text-anchor="middle" font-weight="600">matricula</text>
  <g stroke="#333" stroke-width="1.4" fill="#fdf3d0">
    <rect x="725" y="80" width="70" height="18"/><rect x="725" y="98" width="110" height="42"/>
    <rect x="850" y="80" width="80" height="18"/><rect x="850" y="98" width="110" height="42"/>
  </g>
  <g font-size="13" fill="#111" text-anchor="middle">
    <text x="780" y="124">modelo</text>
    <text x="905" y="124">servicios</text>
  </g>
  <path d="M905,140 L905,165 L800,165 L800,142" stroke="#333" stroke-width="1.4" fill="none" stroke-dasharray="6,4" marker-end="url(#open)"/>
  <text x="820" y="185" font-size="12" fill="#c0392b" text-anchor="middle">&#171;import&#187;</text>

  <g font-size="13" fill="#555">
    <text x="700" y="238">Anidamiento: el paquete contenedor define el espacio de nombres.</text>
    <text x="700" y="258">Nombre calificado:</text>
    <text x="820" y="258" font-family="Consolas, monospace" fill="#111">matricula::modelo::Curso</text>
  </g>
  <g font-size="13" fill="#555">
    <text x="700" y="300" font-weight="600" fill="#111">Reglas prácticas</text>
    <text x="700" y="322">• Las dependencias apuntan hacia la estabilidad.</text>
    <text x="700" y="342">• Sin ciclos: si A depende de B, B no debe depender de A.</text>
    <text x="700" y="362">• Alta cohesión dentro, bajo acoplamiento fuera.</text>
    <text x="700" y="382">• &#171;import&#187; hace público lo importado; &#171;access&#187; lo deja privado.</text>
  </g>

  <g stroke="#c0392b" stroke-width="1.6" fill="none">
    <path d="M700,415 L740,415"/>
  </g>
  <text x="752" y="420" font-size="13" fill="#555">Un paquete se dibuja como una carpeta: pestaña + cuerpo.</text>
  <text x="700" y="445" font-size="13" fill="#555">Si el paquete muestra su contenido, el nombre va en la pestaña.</text>
</svg>
