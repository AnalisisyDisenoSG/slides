    <text x="738" y="196" text-anchor="middle">estudiante v&#225;lido</text>
    <text x="612" y="276">datos</text>
    <text x="910" y="156">confirmaci&#243;n</text>
    <text x="902" y="276">matr&#237;cula</text>
    <text x="768" y="352" text-anchor="middle">cupo asignado</text>
    <text x="524" y="466">recibo</text>
  </g>

  <rect x="512" y="540" width="478" height="56" fill="#fdf3d0" stroke="#bbb"/>
  <text x="530" y="562" font-size="12.5" fill="#333"><tspan font-weight="600">Balanceo:</tspan> los flujos que entran y salen del nivel 1 tienen que ser</text>
  <text x="530" y="582" font-size="12.5" fill="#333">exactamente los mismos del proceso 0. Si aparece uno nuevo, hay un error.</text>
</svg>
