    <text x="322" y="174">expediente</text>
    <text x="64" y="300">lista de grupo</text>
    <text x="330" y="314">recibo</text>
  </g>

  <rect x="52" y="416" width="376" height="150" fill="#f7f7f7" stroke="#bbb"/>
  <text x="70" y="442" font-size="13.5" fill="#111" font-weight="600">Reglas del nivel 0</text>
  <g font-size="12.5" fill="#333">
    <text x="70" y="466">&#183; Un solo proceso, numerado 0.</text>
    <text x="70" y="488">&#183; Todas las entidades externas, ninguna interna.</text>
    <text x="70" y="510">&#183; Sin almacenes de datos: est&#225;n dentro del sistema.</text>
    <text x="70" y="532">&#183; Equivale al diagrama de contexto del sistema.</text>
    <text x="70" y="554">&#183; Los flujos que entran y salen son el contrato.</text>
  </g>

  <!-- ================= NIVEL 1 ================= -->
  <g fill="#e8f6ec" stroke="#333" stroke-width="1.6">
    <rect x="512" y="92" width="112" height="42"/>
    <rect x="878" y="92" width="112" height="42"/>
    <rect x="512" y="478" width="112" height="42"/>
