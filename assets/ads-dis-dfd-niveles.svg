<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="1020" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="n-ar" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1020" height="620" fill="#ffffff"/>

  <text x="240" y="32" font-size="17" fill="#111" text-anchor="middle" font-weight="600">Nivel 0 &#8212; diagrama de contexto</text>
  <text x="740" y="32" font-size="17" fill="#111" text-anchor="middle" font-weight="600">Nivel 1 &#8212; explosi&#243;n del proceso 0</text>
  <path d="M470,50 L470,596" stroke="#ddd" stroke-width="1.4"/>

  <!-- ================= NIVEL 0 ================= -->
  <circle cx="240" cy="230" r="66" fill="#d6eaf8" stroke="#333" stroke-width="1.8"/>
  <text x="240" y="222" font-size="14" fill="#111" text-anchor="middle" font-weight="600">0</text>
  <text x="240" y="244" font-size="13" fill="#111" text-anchor="middle">Sistema de</text>
  <text x="240" y="262" font-size="13" fill="#111" text-anchor="middle">matr&#237;cula</text>

  <g fill="#e8f6ec" stroke="#333" stroke-width="1.6">
