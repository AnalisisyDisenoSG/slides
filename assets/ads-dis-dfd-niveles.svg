    <rect x="304" y="94" width="124" height="44"/>
    <rect x="52" y="330" width="124" height="44"/>
    <rect x="304" y="330" width="124" height="44"/>
  </g>
  <g font-size="12.5" fill="#111" text-anchor="middle">
    <text x="114" y="121">Estudiante</text>
    <text x="366" y="121">Registro</text>
    <text x="114" y="357">Docente</text>
    <text x="366" y="357">Caja</text>
  </g>

  <g stroke="#333" stroke-width="1.6" fill="none">
    <path d="M142,140 L196,186" marker-end="url(#n-ar)"/>
    <path d="M286,184 L334,140" marker-end="url(#n-ar)"/>
    <path d="M194,276 L144,326" marker-end="url(#n-ar)"/>
    <path d="M332,326 L288,280" marker-end="url(#n-ar)"/>
  </g>
  <g font-size="11.5" fill="#444">
