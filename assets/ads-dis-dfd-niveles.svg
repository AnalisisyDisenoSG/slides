    <text x="880" y="196">2.0</text>
    <text x="880" y="212">Asignar</text>
    <text x="880" y="228">cupo</text>
    <text x="600" y="401">3.0</text>
    <text x="600" y="417">Generar</text>
    <text x="600" y="433">cobro</text>
  </g>

  <g stroke="#333" stroke-width="1.6">
    <path d="M508,296 L720,296"/>
    <path d="M508,326 L720,326"/>
    <path d="M790,296 L1002,296"/>
    <path d="M790,326 L1002,326"/>
  </g>
  <g font-size="11.5" fill="#111" text-anchor="middle">
    <text x="614" y="317">D1  Estudiantes</text>
    <text x="896" y="317">D2  Matr&#237;culas</text>
  </g>

  <g stroke="#333" stroke-width="1.5" fill="none">
    <path d="M580,138 L592,159" marker-end="url(#n-ar)"/>
    <path d="M642,205 L834,205" marker-end="url(#n-ar)"/>
    <path d="M600,249 L600,290" marker-end="url(#n-ar)"/>
    <path d="M898,163 L898,138" marker-end="url(#n-ar)"/>
