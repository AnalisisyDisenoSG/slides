<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 580" width="1020" height="580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="p-ar" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#555"/>
    </marker>
    <marker id="p-red" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1020" height="580" fill="#ffffff"/>
  <text x="510" y="36" font-size="19" fill="#111" text-anchor="middle" font-weight="600">El proceso de pruebas: de la planificación al análisis de errores</text>

  <!-- Actividades -->
  <g stroke="#333" stroke-width="1.6">
    <ellipse cx="160" cy="120" rx="110" ry="44" fill="#d6eaf8"/>
    <ellipse cx="510" cy="120" rx="110" ry="44" fill="#d6eaf8"/>
    <ellipse cx="860" cy="120" rx="110" ry="44" fill="#d6eaf8"/>
    <ellipse cx="860" cy="330" rx="110" ry="44" fill="#e8f6ec"/>
    <ellipse cx="510" cy="330" rx="110" ry="44" fill="#fdebd0"/>
    <ellipse cx="700" cy="500" rx="120" ry="44" fill="#f2e6f7"/>
    <rect x="70" y="300" width="180" height="60" fill="#f7f7f7"/>
  </g>
  <g font-size="17" fill="#111" font-weight="600" text-anchor="middle">
    <text x="160" y="126">Planificación</text>
    <text x="510" y="126">Diseño</text>
    <text x="860" y="126">Ejecución</text>
    <text x="860" y="336">Evaluación</text>
    <text x="510" y="336">Depuración</text>
    <text x="700" y="506">Análisis de errores</text>
    <text x="160" y="336">Desarrollo</text>
  </g>

  <!-- Flujo principal -->
  <g stroke="#555" stroke-width="2" fill="none">
    <path d="M272,120 L394,120" marker-end="url(#p-ar)"/>
    <path d="M622,120 L744,120" marker-end="url(#p-ar)"/>
    <path d="M860,166 L860,282" marker-end="url(#p-ar)"/>
    <path d="M748,330 L626,330" marker-end="url(#p-ar)"/>
    <path d="M820,372 L760,456" marker-end="url(#p-ar)"/>
    <path d="M160,296 L160,168" marker-end="url(#p-ar)"/>
    <path d="M230,296 L430,160" marker-end="url(#p-ar)"/>
  </g>
  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="333" y="110">plan de pruebas</text>
    <text x="683" y="94">casos y</text>
    <text x="683" y="110">procedimientos</text>
    <text x="900" y="228" text-anchor="start">resultados</text>
    <text x="900" y="246" text-anchor="start">obtenidos</text>
    <text x="687" y="320">errores</text>
    <text x="70" y="236" text-anchor="start">info. del</text>
    <text x="70" y="254" text-anchor="start">proyecto</text>
    <text x="400" y="240">info. del software</text>
    <text x="776" y="414" text-anchor="end">estadística de errores</text>
  </g>

  <!-- Oráculo -->
  <path d="M985,430 L950,366" stroke="#555" stroke-width="2" fill="none" marker-end="url(#p-ar)"/>
  <text x="1005" y="452" font-size="13" fill="#444" text-anchor="end">resultados esperados</text>
  <text x="1005" y="470" font-size="12" fill="#888" text-anchor="end">(oráculo)</text>

  <!-- Correcciones -->
  <path d="M560,290 C600,220 690,200 770,152" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#p-red)"/>
  <text x="700" y="252" font-size="13" fill="#c0392b" text-anchor="middle">correcciones →</text><text x="700" y="268" font-size="13" fill="#c0392b" text-anchor="middle">se vuelve a ejecutar</text>

  <!-- Prevención -->
  <path d="M578,512 C400,560 200,520 160,364" stroke="#1e8449" stroke-width="2" fill="none" marker-end="url(#p-ar)"/>
  <text x="300" y="548" font-size="13" fill="#1e8449" text-anchor="middle">actividades preventivas</text>
  <path d="M822,512 L960,540" stroke="#555" stroke-width="2" fill="none" marker-end="url(#p-ar)"/>
  <text x="1005" y="566" font-size="13" fill="#444" text-anchor="end">predicción de fiabilidad</text>
</svg>
