<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" width="1020" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1020" height="520" fill="#ffffff"/>

  <g stroke="#333" stroke-width="1.5">
    <path d="M40,106 L56,90 L296,90 L280,106 Z" fill="#c9d9e8"/>
    <path d="M280,106 L296,90 L296,210 L280,226 Z" fill="#b3c6d8"/>
    <rect x="40" y="106" width="240" height="120" fill="#e4edf5"/>
    <path d="M390,86 L406,70 L676,70 L660,86 Z" fill="#c9d9e8"/>
    <path d="M660,86 L676,70 L676,250 L660,266 Z" fill="#b3c6d8"/>
    <rect x="390" y="86" width="270" height="180" fill="#e4edf5"/>
    <path d="M760,106 L776,90 L1006,90 L990,106 Z" fill="#c9d9e8"/>
    <path d="M990,106 L1006,90 L1006,240 L990,256 Z" fill="#b3c6d8"/>
    <rect x="760" y="106" width="230" height="150" fill="#e4edf5"/>
  </g>

  <g font-size="12.5" fill="#555" text-anchor="middle">
    <text x="160" y="126">&#171;device&#187;</text>
    <text x="525" y="106">&#171;device&#187;</text>
    <text x="875" y="126">&#171;device&#187;</text>
  </g>
  <g font-size="16" fill="#111" text-anchor="middle" font-weight="600">
    <text x="160" y="146">: PC del estudiante</text>
    <text x="525" y="127">: ServidorDeAplicaciones</text>
    <text x="875" y="146">: ServidorDeBaseDeDatos</text>
  </g>

  <g stroke="#333" stroke-width="1.3" fill="#fdf3d0">
    <rect x="58" y="158" width="204" height="56"/>
    <rect x="408" y="140" width="234" height="112"/>
    <rect x="778" y="158" width="194" height="84"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="160" y="178">&#171;execution environment&#187;</text>
    <text x="525" y="160">&#171;execution environment&#187;</text>
    <text x="875" y="178">&#171;execution environment&#187;</text>
  </g>
  <g font-size="14.5" fill="#111" text-anchor="middle" font-weight="600">
    <text x="160" y="199">: Navegador</text>
    <text x="525" y="180">: Tomcat 10</text>
    <text x="875" y="199">: PostgreSQL 16</text>
  </g>

  <g stroke="#333" stroke-width="1.3" fill="#ffffff">
    <path d="M428,192 L588,192 L604,208 L604,240 L428,240 Z"/>
    <path d="M588,192 L588,208 L604,208"/>
    <path d="M800,208 L924,208 L940,224 L940,236 L800,236 Z"/>
    <path d="M924,208 L924,224 L940,224"/>
  </g>
  <g font-size="12" fill="#555">
    <text x="440" y="210">&#171;artifact&#187;</text>
  </g>
  <g font-size="14" fill="#111">
    <text x="440" y="231" font-family="Consolas, monospace">matricula.war</text>
    <text x="812" y="228" font-family="Consolas, monospace" font-size="13">esquema.sql</text>
  </g>

  <g stroke="#333" stroke-width="1.8">
    <path d="M280,166 L390,166"/>
    <path d="M660,176 L760,176"/>
  </g>
  <g font-size="13" fill="#c0392b" text-anchor="middle">
    <text x="335" y="158">&#171;HTTPS&#187;</text>
    <text x="710" y="166">&#171;JDBC&#187;</text>
  </g>
  <g font-size="12.5" fill="#111">
    <text x="288" y="184">1..*</text>
    <text x="382" y="184" text-anchor="end">1</text>
    <text x="668" y="194">1</text>
    <text x="752" y="194" text-anchor="end">1</text>
  </g>

  <rect x="40" y="300" width="950" height="192" fill="#f7f7f7" stroke="#bbb"/>
  <g font-size="14.5" fill="#111">
    <text x="58" y="326" font-weight="700">Elementos del diagrama de despliegue</text>
  </g>
  <g font-size="13.5" fill="#111">
    <text x="58" y="354"><tspan font-weight="700">Nodo</tspan> — recurso de ejecución. Se dibuja como caja 3D.</text>
    <text x="58" y="378"><tspan font-weight="700">&#171;device&#187;</tspan> — nodo físico: servidor, PC, teléfono, impresora, router.</text>
    <text x="58" y="402"><tspan font-weight="700">&#171;execution environment&#187;</tspan> — software que hospeda otro software: JVM, contenedor, SGBD, servidor web.</text>
    <text x="58" y="426"><tspan font-weight="700">Artefacto</tspan> — cosa física que se despliega: .war, .jar, .exe, script, archivo de configuración. Icono con esquina doblada.</text>
    <text x="58" y="450"><tspan font-weight="700">Ruta de comunicación</tspan> — línea entre nodos; el estereotipo indica el protocolo y la multiplicidad, cuántas instancias.</text>
    <text x="58" y="476" fill="#555">Responde a: ¿en qué máquina corre cada pieza, con qué protocolo se hablan y cuántas instancias hay de cada una?</text>
  </g>
</svg>
