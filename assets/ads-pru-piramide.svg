<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="1020" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="py-ar" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/></marker>
    <marker id="py-ag" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1e8449"/></marker>
  </defs>
  <rect width="1020" height="560" fill="#ffffff"/>
  <text x="510" y="36" font-size="19" fill="#111" text-anchor="middle" font-weight="600">La pirámide de automatización de pruebas</text>

  <g stroke="#333" stroke-width="1.6">
    <polygon points="420,70 520,190 320,190" fill="#f2e6f7"/>
    <polygon points="320,190 520,190 590,330 250,330" fill="#d6eaf8"/>
    <polygon points="250,330 590,330 660,470 180,470" fill="#e8f6ec"/>
  </g>
  <g font-size="17" fill="#111" font-weight="600" text-anchor="middle">
    <text x="420" y="160">E2E / UI</text>
    <text x="420" y="262">Integración / API</text>
    <text x="420" y="402">Unitarias</text>
  </g>
  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="420" y="180">pocas</text>
    <text x="420" y="284">bastantes</text>
    <text x="420" y="424">muchísimas</text>
  </g>

  <g font-size="13" fill="#444">
    <text x="540" y="120">Playwright, Selenium, Cypress</text>
    <text x="540" y="138">Recorren el sistema como un usuario</text>
    <text x="610" y="250">Postman/Newman, REST Assured,</text>
    <text x="610" y="268">Supertest, Testcontainers</text>
    <text x="610" y="286">Varias piezas reales juntas</text>
    <text x="680" y="390">JUnit, NUnit, xUnit, pytest,</text>
    <text x="680" y="408">Vitest, Jest</text>
    <text x="680" y="426">Una clase o función, con dobles</text>
  </g>

  <path d="M110,470 L110,80" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#py-ar)"/>
  <text x="92" y="275" font-size="14" fill="#c0392b" font-weight="600" text-anchor="middle" transform="rotate(-90 92 275)">más lentas · más caras · más frágiles</text>
  <path d="M140,80 L140,470" stroke="#1e8449" stroke-width="2.5" fill="none" marker-end="url(#py-ag)"/>
  <text x="162" y="275" font-size="14" fill="#1e8449" font-weight="600" text-anchor="middle" transform="rotate(90 162 275)">más rápidas · más baratas · más estables</text>

  <text x="510" y="520" font-size="14" fill="#444" text-anchor="middle">Las pruebas exploratorias manuales viven sobre la punta: no se automatizan, se diseñan con criterio</text>
</svg>
