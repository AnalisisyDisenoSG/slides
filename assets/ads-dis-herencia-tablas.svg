<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 580" width="1020" height="580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g-tri" markerWidth="16" markerHeight="16" refX="14" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#fff" stroke="#333" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="1020" height="580" fill="#ffffff"/>
  <text x="510" y="32" font-size="19" fill="#111" text-anchor="middle" font-weight="600">La herencia no existe en el modelo relacional: tres formas de resolverla</text>

  <g stroke="#333" stroke-width="1.5" fill="#ffffff">
    <rect x="410" y="56" width="200" height="60"/>
    <rect x="300" y="164" width="180" height="52"/>
    <rect x="540" y="164" width="180" height="52"/>
  </g>
  <text x="510" y="80" font-size="14" fill="#111" text-anchor="middle" font-weight="600">AgenteComercial</text>
  <text x="510" y="102" font-size="12" fill="#444" text-anchor="middle">cedula, razonSocial, email</text>
  <text x="390" y="186" font-size="13.5" fill="#111" text-anchor="middle">Cliente</text>
  <text x="390" y="206" font-size="12" fill="#444" text-anchor="middle">descuento</text>
  <text x="630" y="186" font-size="13.5" fill="#111" text-anchor="middle">Proveedor</text>
  <text x="630" y="206" font-size="12" fill="#444" text-anchor="middle">plazoPago</text>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <path d="M390,164 L390,140 L482,140 L482,120" marker-end="url(#g-tri)"/>
    <path d="M630,164 L630,140 L538,140 L538,120" marker-end="url(#g-tri)"/>
  </g>

  <path d="M60,246 L960,246" stroke="#ddd" stroke-width="1.4"/>

  <rect x="46" y="268" width="290" height="278" fill="#f7fbff" stroke="#bbb"/>
  <text x="191" y="296" font-size="15" fill="#111" text-anchor="middle" font-weight="600">1. Una tabla por jerarqu&#237;a</text>
  <text x="191" y="316" font-size="12" fill="#555" text-anchor="middle">single table</text>
  <g stroke="#333" stroke-width="1.4" fill="#fff">
    <rect x="70" y="332" width="242" height="120"/>
    <rect x="70" y="332" width="242" height="28" fill="#d6eaf8"/>
  </g>
  <text x="191" y="352" font-size="13" fill="#111" text-anchor="middle" font-weight="600">AGENTE_COMERCIAL</text>
  <g font-size="12" fill="#111">
    <text x="84" y="378">PK cedula, razon_social, email</text>
    <text x="84" y="400">tipo  (C / P)  &#8592; discriminador</text>
    <text x="84" y="422">descuento   NULL</text>
    <text x="84" y="444">plazo_pago  NULL</text>
  </g>
  <g font-size="12" fill="#333">
    <text x="62" y="482">+ Consultas simples, sin joins.</text>
    <text x="62" y="502">&#8211; Columnas siempre nulas.</text>
    <text x="62" y="522">&#8211; La BD no puede exigir la regla.</text>
  </g>

  <rect x="364" y="268" width="290" height="278" fill="#fffdf5" stroke="#bbb"/>
  <text x="509" y="296" font-size="15" fill="#111" text-anchor="middle" font-weight="600">2. Una tabla por clase</text>
  <text x="509" y="316" font-size="12" fill="#555" text-anchor="middle">joined / class table</text>
  <g stroke="#333" stroke-width="1.4" fill="#fff">
    <rect x="424" y="332" width="170" height="44"/>
    <rect x="424" y="332" width="170" height="24" fill="#fdf3d0"/>
    <rect x="384" y="400" width="120" height="44"/>
    <rect x="384" y="400" width="120" height="24" fill="#fdf3d0"/>
    <rect x="524" y="400" width="120" height="44"/>
    <rect x="524" y="400" width="120" height="24" fill="#fdf3d0"/>
  </g>
  <text x="509" y="349" font-size="11.5" fill="#111" text-anchor="middle" font-weight="600">AGENTE_COMERCIAL</text>
  <text x="509" y="368" font-size="11" fill="#111" text-anchor="middle">PK cedula, razon_social</text>
  <text x="444" y="417" font-size="11.5" fill="#111" text-anchor="middle" font-weight="600">CLIENTE</text>
  <text x="444" y="436" font-size="11" fill="#111" text-anchor="middle">PK/FK cedula</text>
  <text x="584" y="417" font-size="11.5" fill="#111" text-anchor="middle" font-weight="600">PROVEEDOR</text>
  <text x="584" y="436" font-size="11" fill="#111" text-anchor="middle">PK/FK cedula</text>
  <g stroke="#333" stroke-width="1.3" fill="none">
    <path d="M470,376 L444,400"/>
    <path d="M548,376 L584,400"/>
  </g>
  <g font-size="12" fill="#333">
    <text x="380" y="482">+ Sin nulos, fiel al modelo.</text>
    <text x="380" y="502">+ Integridad garantizada por la BD.</text>
    <text x="380" y="522">&#8211; Toda lectura implica un join.</text>
  </g>

  <rect x="682" y="268" width="292" height="278" fill="#f7fff9" stroke="#bbb"/>
  <text x="828" y="296" font-size="15" fill="#111" text-anchor="middle" font-weight="600">3. Una tabla por concreta</text>
  <text x="828" y="316" font-size="12" fill="#555" text-anchor="middle">table per concrete class</text>
  <g stroke="#333" stroke-width="1.4" fill="#fff">
    <rect x="700" y="344" width="126" height="76"/>
    <rect x="700" y="344" width="126" height="24" fill="#e8f6ec"/>
    <rect x="842" y="344" width="118" height="76"/>
    <rect x="842" y="344" width="118" height="24" fill="#e8f6ec"/>
  </g>
  <text x="763" y="361" font-size="11.5" fill="#111" text-anchor="middle" font-weight="600">CLIENTE</text>
  <g font-size="11" fill="#111" text-anchor="middle">
    <text x="763" y="382">PK cedula</text>
    <text x="763" y="399">razon_social, email</text>
    <text x="763" y="414">descuento</text>
    <text x="901" y="382">PK cedula</text>
    <text x="901" y="399">razon_social, email</text>
    <text x="901" y="414">plazo_pago</text>
  </g>
  <text x="901" y="361" font-size="11.5" fill="#111" text-anchor="middle" font-weight="600">PROVEEDOR</text>
  <g font-size="12" fill="#333">
    <text x="698" y="482">+ Cada tabla se lee sola.</text>
    <text x="698" y="502">&#8211; Columnas repetidas en las dos.</text>
    <text x="698" y="522">&#8211; Consultar todos los agentes exige UNION.</text>
  </g>

  <text x="510" y="568" font-size="13" fill="#555" text-anchor="middle">No hay una correcta: se elige por c&#243;mo se va a consultar. Esa decisi&#243;n se documenta en el modelo de datos.</text>
</svg>
