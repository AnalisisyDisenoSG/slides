</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-VOhGhvGU="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="29" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="53">
<h1 id="versiones-funcionales-del-sistema">Versiones funcionales del sistema</h1>
<h2 id="contenidos-4">Contenidos</h2>
<ul>
<li>Qué es una versión funcional</li>
<li>Construcción incremental por rebanadas verticales</li>
<li>Qué entra en cada versión</li>
<li>Tipos de versión y versionado semántico</li>
<li>Gestión de configuración</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="%C2%BFqu%C3%A9-es-una-versi%C3%B3n-funcional">¿Qué es una versión funcional?</h2>
<steps>
<step>
<h3 id="la-idea">La idea</h3>
<ul>
<li>Una <strong>versión funcional</strong> es un estado del sistema que <strong>compila, está integrado, pasa sus pruebas y hace algo útil</strong> de principio a fin</li>
<li>No es «el 60 % del código escrito»: es un subconjunto del sistema que <strong>ya funciona</strong></li>
<li>En RUP, cada iteración termina con una <strong>versión ejecutable</strong>; en Scrum, cada sprint con un <strong>incremento</strong> utilizable</li>
</ul>
</step>
<step>
<h3 id="por-qu%C3%A9-construir-as%C3%AD">Por qué construir así</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%91%81%EF%B8%8F-visibilidad"><img class="emoji" draggable="false" alt="👁️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f441.svg" data-marp-twemoji=""/> Visibilidad</h3>
<p>El avance se mide en <strong>funcionalidad que corre</strong>, no en porcentajes de avance declarados</p>
</div>
<div>
<h3 id="%F0%9F%A7%AA-retroalimentaci%C3%B3n"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Retroalimentación</h3>
<p>El usuario prueba algo real <strong>meses antes</strong> del final</p>
</div>
<div>
<h3 id="%F0%9F%8E%AF-riesgo"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Riesgo</h3>
<p>Los problemas de integración aparecen <strong>en cada iteración</strong>, no al final</p>
</div>
<div>
<h3 id="%F0%9F%9B%9F-seguro"><img class="emoji" draggable="false" alt="🛟" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6df.svg" data-marp-twemoji=""/> Seguro</h3>
<p>Si el proyecto se corta, queda <strong>algo que sirve</strong></p>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="construir-en-rebanadas-verticales">Construir en rebanadas verticales</h2>
<p><a href="../assets/ads-con-incrementos.svg"><img src="../assets/ads-con-incrementos.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="%C2%BFqu%C3%A9-entra-en-cada-versi%C3%B3n">¿Qué entra en cada versión?</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="criterios-para-ordenar">Criterios para ordenar</h3>
<ol>
<li><strong>Riesgo arquitectónico</strong> primero: los casos de uso que ponen a prueba las decisiones grandes van en la línea base</li>
<li><strong>Valor para el negocio</strong> después: lo que el usuario más necesita</li>
<li><strong>Dependencias</strong>: no se puede pagar una matrícula que no existe</li>
<li><strong>Capacidad</strong> del equipo en la iteración</li>
</ol>
</div>
<div>
<h3 id="partir-casos-de-uso-grandes">Partir casos de uso grandes</h3>
<ul>
<li>
<p>Un caso de uso no tiene que entrar <strong>completo</strong></p>
</li>
<li>
<p>Versión 1: el <strong>flujo básico</strong></p>
</li>
<li>
<p>Versión 2: los <strong>flujos alternos</strong> más frecuentes</p>
</li>
<li>
<p>Versión 3: las <strong>excepciones</strong> y los casos raros</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Así una versión siempre entrega algo que funciona, aunque sea el camino feliz</p>
</li>
</ul>
</div>
</split-slide>
<table>
<thead>
<tr>
<th style="text-align:left">Versión</th>
<th style="text-align:left">Contenido</th>
<th style="text-align:left">Por qué en ese orden</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>v0.1</strong></td>
<td style="text-align:left">Esqueleto: iniciar sesión y consultar cursos</td>
<td style="text-align:left">Prueba capas, base de datos, despliegue</td>
</tr>
<tr>
<td style="text-align:left"><strong>v0.2</strong></td>
<td style="text-align:left">Matricular — flujo básico</td>
<td style="text-align:left">El caso de uso más riesgoso y más valioso</td>
</tr>
<tr>
<td style="text-align:left"><strong>v0.3</strong></td>
<td style="text-align:left">Matricular — choques de horario y requisitos</td>
<td style="text-align:left">Flujos alternos del anterior</td>
</tr>
<tr>
<td style="text-align:left"><strong>v0.4</strong></td>
<td style="text-align:left">Pagar matrícula</td>
<td style="text-align:left">Depende de matricular; integra con el banco</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="tipos-de-versi%C3%B3n">Tipos de versión</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Tipo</th>
<th style="text-align:left">Para quién</th>
<th style="text-align:left">Qué garantiza</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Build</strong> (diario, por commit)</td>
<td style="text-align:left">El equipo</td>
<td style="text-align:left">Compila y pasa las pruebas automáticas</td>
</tr>
<tr>
<td style="text-align:left"><strong>Versión interna</strong> / de iteración</td>
<td style="text-align:left">El equipo y el cliente en la revisión</td>
<td style="text-align:left">Los casos de uso planificados funcionan</td>
</tr>
<tr>
<td style="text-align:left"><strong>Alfa</strong></td>
<td style="text-align:left">Usuarios internos o de prueba</td>
<td style="text-align:left">Funcionalidad casi completa; se esperan defectos</td>
</tr>
<tr>
<td style="text-align:left"><strong>Beta</strong></td>
<td style="text-align:left">Un grupo de usuarios reales</td>
<td style="text-align:left">Funcionalidad completa; se busca retroalimentación de uso</td>
</tr>
<tr>
<td style="text-align:left"><strong>Candidata</strong> (<em>release candidate</em>)</td>
<td style="text-align:left">Pruebas de aceptación</td>
<td style="text-align:left">Lista para salir si no aparecen defectos graves</td>
</tr>
<tr>
<td style="text-align:left"><strong>Liberación</strong> (<em>release</em>, GA)</td>
<td style="text-align:left">Todos los usuarios</td>
<td style="text-align:left">La versión oficial, soportada</td>
</tr>
<tr>
<td style="text-align:left"><strong>Parche</strong> (<em>hotfix</em>)</td>
<td style="text-align:left">Todos</td>
<td style="text-align:left">Corrige un defecto urgente sin agregar nada</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Cada tipo tiene un <strong>criterio de salida</strong> explícito. Una beta que nadie sabe cuándo termina es un sistema en producción sin soporte</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="versionado-sem%C3%A1ntico">Versionado semántico</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="mayormenorparche"><code>MAYOR.MENOR.PARCHE</code></h3>
<table>
<thead>
<tr>
<th style="text-align:left">Se incrementa</th>
<th style="text-align:left">Cuando…</th>
<th style="text-align:left">Ejemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>MAYOR</strong></td>
<td style="text-align:left">Hay cambios <strong>incompatibles</strong> con la versión anterior</td>
<td style="text-align:left"><code>1.4.2 → 2.0.0</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>MENOR</strong></td>
<td style="text-align:left">Se agrega funcionalidad <strong>compatible</strong></td>
<td style="text-align:left"><code>1.4.2 → 1.5.0</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>PARCHE</strong></td>
<td style="text-align:left">Se corrigen defectos, compatible</td>
<td style="text-align:left"><code>1.4.2 → 1.4.3</code></td>
</tr>
</tbody>
</table>
<ul>
<li><code>0.y.z</code>: desarrollo inicial, <strong>cualquier cosa puede cambiar</strong></li>
<li>Sufijos: <code>2.0.0-beta.1</code>, <code>2.0.0-rc.2</code></li>
</ul>
</div>
<div>
<h3 id="notas-de-versi%C3%B3n">Notas de versión</h3>
<pre><code class="language-markdown"><span class="hljs-section">## [0.3.0] - 2026-10-14</span>
<span class="hljs-section">### Agregado</span>
<span class="hljs-bullet">-</span> Validación de choque de horario (CU-02, FA-1)
<span class="hljs-bullet">-</span> Validación de requisitos (CU-02, FA-2)

<span class="hljs-section">### Corregido</span>
<span class="hljs-bullet">-</span> El cupo no se liberaba al retirar un curso (#41)

<span class="hljs-section">### Conocido</span>
<span class="hljs-bullet">-</span> La matrícula no funciona en Safari 15
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Cada línea se puede <strong>rastrear</strong> a un caso de uso o a un defecto</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="gesti%C3%B3n-de-configuraci%C3%B3n">Gestión de configuración</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.95rem;">
<div>
<h3 id="qu%C3%A9-es-1">Qué es</h3>
<ul>
<li>Controlar <strong>qué versión de cada cosa</strong> compone cada versión del sistema: código, configuración, migraciones, dependencias, documentación</li>
<li><strong>Línea base</strong>: una versión revisada y acordada que sirve de punto de partida; solo cambia mediante un proceso controlado</li>
<li>Sin gestión de configuración, la pregunta <em>«¿qué tiene instalado el cliente?»</em> no tiene respuesta</li>
</ul>
<h3 id="estrategias-de-ramas">Estrategias de ramas</h3>
<ul>
<li><strong>Trunk-based</strong>: todos integran en <code>main</code> a diario; ramas cortas. Favorece la integración continua</li>
<li><strong>GitFlow</strong>: ramas <code>develop</code>, <code>release/*</code>, <code>hotfix/*</code>. Más control, más fricción</li>
</ul>
</div>
<div>
<h3 id="marcar-una-versi%C3%B3n">Marcar una versión</h3>
<pre><code class="language-bash"><span class="hljs-comment"># fijar las dependencias exactas</span>
composer install          <span class="hljs-comment"># usa composer.lock</span>

<span class="hljs-comment"># etiquetar la versión</span>
git tag -a v0.3.0 -m <span class="hljs-string">&quot;Iteración 3: flujos alternos de matrícula&quot;</span>
git push origin v0.3.0

<span class="hljs-comment"># reconstruir exactamente esa versión, meses después</span>
git checkout v0.3.0
composer install
php artisan migrate
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> <code>composer.lock</code> y las <strong>migraciones</strong> también se versionan: son parte de la configuración</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="terminado-significa-terminado">Terminado significa terminado</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.95rem;">
<div>
<h3 id="definici%C3%B3n-de-terminado">Definición de terminado</h3>
<p>Un caso de uso entra a la versión solo si:</p>
<ul>
<li>
<p>[x] El código está en la rama principal</p>
</li>
<li>
<p>[x] Pasó revisión de código</p>
</li>
<li>
<p>[x] Tiene pruebas unitarias y de integración que pasan</p>
</li>
<li>
<p>[x] Cumple el estándar (Pint, PHPStan sin errores)</p>
</li>
<li>
<p>[x] Las migraciones corren en limpio</p>
</li>
<li>
<p>[x] El modelo de diseño está actualizado</p>
</li>
<li>
<p>[x] El dueño del producto lo aceptó en la demostración</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> «Está listo, solo falta probarlo» significa <strong>no está listo</strong></p>
</li>
</ul>
</div>
<div>
<h3 id="separar-desplegar-de-liberar">Separar desplegar de liberar</h3>
<p>Un <em>feature flag</em> permite integrar código <strong>inconcluso</strong> sin que el usuario lo vea</p>
<pre><code class="language-php"><span class="hljs-keyword">if</span> (<span class="hljs-title class_">Feature</span>::<span class="hljs-title function_ invoke__">active</span>(<span class="hljs-string">&#x27;pago-en-linea&#x27;</span>)) {
    <span class="hljs-keyword">return</span> <span class="hljs-variable language_">$this</span>-&gt;pagoEnLinea-&gt;<span class="hljs-title function_ invoke__">iniciar</span>(<span class="hljs-variable">$matricula</span>);
}

<span class="hljs-keyword">return</span> <span class="hljs-variable language_">$this</span>-&gt;pagoEnVentanilla-&gt;<span class="hljs-title function_ invoke__">generarBoleta</span>(<span class="hljs-variable">$matricula</span>);
</code></pre>
<ul>
<li>El código se integra a diario; la funcionalidad se <strong>enciende</strong> cuando está lista</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Cada bandera es deuda: se elimina cuando la funcionalidad se estabiliza</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-marpit-scope-yjJRO3kJ="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="37" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="53">
<h1 id="integraci%C3%B3n-de-subsistemas-y-del-sistema">Integración de subsistemas y del sistema</h1>
<h2 id="contenidos-5">Contenidos</h2>
<ul>
<li>Qué es integrar y por qué duele</li>
<li>Big bang vs. integración incremental</li>
<li>Stubs y drivers</li>
<li>El plan de integración</li>
<li>Integración continua</li>
<li>Pruebas e integración del sistema</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="%C2%BFqu%C3%A9-es-integrar">¿Qué es integrar?</h2>
<steps>
<step>
<h3 id="tres-niveles">Tres niveles</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Nivel</th>
<th style="text-align:left">Qué se une</th>
<th style="text-align:left">Ejemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>De componentes</strong></td>
<td style="text-align:left">Clases y componentes dentro de un subsistema</td>
<td style="text-align:left"><code>ServicioCitas</code> + <code>Agenda</code> + <code>RepositorioCitas</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>De subsistemas</strong></td>
<td style="text-align:left">Subsistemas entre sí, a través de sus <strong>interfaces</strong></td>
<td style="text-align:left">Gestión académica + Pagos + Notificaciones</td>
</tr>
<tr>
<td style="text-align:left"><strong>Del sistema</strong></td>
<td style="text-align:left">El sistema completo con su entorno: sistemas externos, datos reales, infraestructura</td>
<td style="text-align:left">El sistema + el banco + el directorio institucional + el servidor de producción</td>
</tr>
</tbody>
</table>
</step>
<step>
<h3 id="por-qu%C3%A9-duele">Por qué duele</h3>
<ul>
<li>
<p>Cada pieza funciona <strong>sola</strong>; los defectos viven <strong>entre</strong> las piezas</p>
</li>
<li>
<p>Causas típicas en las interfaces:</p>
<ul>
<li>Supuestos distintos: ¿la fecha viene en UTC o en hora local? ¿el monto en colones o en céntimos?</li>
<li>Contratos mal especificados: ¿qué pasa si el estudiante no existe? ¿excepción, <code>null</code>, código 404?</li>
<li>Orden y tiempo: el subsistema A llama a B antes de que B esté listo</li>
<li>Entornos distintos: «en mi máquina funciona»</li>
</ul>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Por eso el diseño insiste en <strong>interfaces explícitas</strong>: son el contrato que la integración va a verificar</p>
</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="big-bang-vs-incremental">Big bang vs. incremental</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%92%A5-big-bang"><img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a5.svg" data-marp-twemoji=""/> Big bang</h3>
<p>Se construyen todas las piezas por separado y se <strong>unen al final, de una vez</strong></p>
<ul>
<li><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2795.svg" data-marp-twemoji=""/> No hay que escribir stubs ni drivers</li>
<li><img class="emoji" draggable="false" alt="➖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2796.svg" data-marp-twemoji=""/> Cuando algo falla, <strong>cualquier</strong> interfaz puede ser la culpable</li>
<li><img class="emoji" draggable="false" alt="➖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2796.svg" data-marp-twemoji=""/> Los defectos aparecen todos juntos, al final, sin tiempo</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Solo es razonable en sistemas <strong>muy pequeños</strong></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%A7%B1-incremental"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> Incremental</h3>
<p>Se integra <strong>una pieza a la vez</strong> y se prueba antes de agregar la siguiente</p>
<ul>
<li><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2795.svg" data-marp-twemoji=""/> Si algo falla, el culpable es <strong>lo último que se agregó</strong></li>
<li><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2795.svg" data-marp-twemoji=""/> Siempre hay una versión funcional</li>
<li><img class="emoji" draggable="false" alt="➖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2796.svg" data-marp-twemoji=""/> Hay que simular lo que todavía no existe</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Variantes: <strong>descendente</strong>, <strong>ascendente</strong>, <strong>sándwich</strong> y <strong>por casos de uso</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="descendente-y-ascendente">Descendente y ascendente</h2>
<p><a href="../assets/ads-con-integracion.svg"><img src="../assets/ads-con-integracion.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="s%C3%A1ndwich-y-por-casos-de-uso">Sándwich y por casos de uso</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%A5%AA-s%C3%A1ndwich-mixta"><img class="emoji" draggable="false" alt="🥪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f96a.svg" data-marp-twemoji=""/> Sándwich (mixta)</h3>
<ul>
<li>Se integra <strong>desde arriba y desde abajo a la vez</strong>, y se encuentran en una capa intermedia</li>
<li>Un equipo trabaja la interfaz con stubs; otro, la persistencia con drivers</li>
<li><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2795.svg" data-marp-twemoji=""/> Combina ventajas de ambas</li>
<li><img class="emoji" draggable="false" alt="➖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2796.svg" data-marp-twemoji=""/> La capa intermedia se prueba tarde</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%A7%B5-por-casos-de-uso-por-hilos"><img class="emoji" draggable="false" alt="🧵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f5.svg" data-marp-twemoji=""/> Por casos de uso (por hilos)</h3>
<ul>
<li>Se integran <strong>todas las piezas que necesita un caso de uso</strong>, de punta a punta</li>
<li>Es exactamente la <strong>rebanada vertical</strong> de las versiones funcionales</li>
<li><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2795.svg" data-marp-twemoji=""/> Cada integración entrega funcionalidad visible</li>
<li><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2795.svg" data-marp-twemoji=""/> Encaja con el desarrollo iterativo: un hilo por iteración</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Es la estrategia <strong>más usada</strong> hoy</li>
</ul>
</div>
</split-slide>
<table>
<thead>
<tr>
<th style="text-align:left">Estrategia</th>
<th style="text-align:left">Simula</th>
<th style="text-align:left">Primer resultado visible</th>
<th style="text-align:left">Cuándo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Descendente</td>
<td style="text-align:left">Lo de abajo (<strong>stubs</strong>)</td>
<td style="text-align:left">Pronto</td>
<td style="text-align:left">Interfaz y flujo son el riesgo</td>
</tr>
<tr>
<td style="text-align:left">Ascendente</td>
<td style="text-align:left">Lo de arriba (<strong>drivers</strong>)</td>
<td style="text-align:left">Tarde</td>
<td style="text-align:left">Los componentes base son el riesgo</td>
</tr>
<tr>
<td style="text-align:left">Sándwich</td>
<td style="text-align:left">Ambos</td>
<td style="text-align:left">Medio</td>
<td style="text-align:left">Sistemas grandes con varios equipos</td>
</tr>
<tr>
<td style="text-align:left">Por casos de uso</td>
<td style="text-align:left">Lo que falta del hilo</td>
<td style="text-align:left">Pronto</td>
<td style="text-align:left">Desarrollo iterativo</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="stubs-y-drivers-en-c%C3%B3digo">Stubs y drivers en código</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.9rem;">
<div>
<h3 id="la-interfaz-del-dise%C3%B1o">La interfaz del diseño</h3>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">interface</span> <span class="hljs-title">PasarelaPago</span>
</span>{
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">cobrar</span>(<span class="hljs-params">
        <span class="hljs-keyword">string</span> <span class="hljs-variable">$cuenta</span>,
        <span class="hljs-keyword">int</span> <span class="hljs-variable">$montoCentimos</span>,
    </span>): <span class="hljs-title">Comprobante</span></span>;
}
</code></pre>
<h3 id="%F0%9F%A7%A9-stub-finge-la-dependencia"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Stub: finge la dependencia</h3>
<p>El banco todavía no da acceso a su ambiente de pruebas</p>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">PasarelaPagoStub</span> <span class="hljs-keyword">implements</span> <span class="hljs-title">PasarelaPago</span>
</span>{

<h3 id="githubworkflowsciyml"><code>.github/workflows/ci.yml</code></h3>
<pre><code class="language-yaml"><span class="hljs-attr">name:</span> <span class="hljs-string">CI</span>
<span class="hljs-attr">on:</span>
  <span class="hljs-attr">push:</span>
    <span class="hljs-attr">branches:</span> [<span class="hljs-string">main</span>]
  <span class="hljs-attr">pull_request:</span>

<span class="hljs-attr">jobs:</span>
  <span class="hljs-attr">pruebas:</span>
    <span class="hljs-attr">runs-on:</span> <span class="hljs-string">ubuntu-latest</span>
    <span class="hljs-attr">steps:</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">uses:</span> <span class="hljs-string">actions/checkout@v4</span>

        <span class="hljs-attr">with:</span>
          <span class="hljs-attr">php-version:</span> <span class="hljs-string">&#x27;8.3&#x27;</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">run:</span> <span class="hljs-string">composer</span> <span class="hljs-string">install</span> <span class="hljs-string">--no-interaction</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">run:</span> <span class="hljs-string">cp</span> <span class="hljs-string">.env.example</span> <span class="hljs-string">.env</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">run:</span> <span class="hljs-string">php</span> <span class="hljs-string">artisan</span> <span class="hljs-string">key:generate</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">run:</span> <span class="hljs-string">./vendor/bin/pint</span> <span class="hljs-string">--test</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">run:</span> <span class="hljs-string">./vendor/bin/pest</span>
</code></pre>
</div>
<div>
<h3 id="qu%C3%A9-logra">Qué logra</h3>
<ul>
<li>
<p><strong>Cada push</strong> y cada <em>pull request</em> construye el sistema desde cero en una máquina limpia</p>
</li>
<li>
<p>Si el estilo o una prueba fallan, el cambio <strong>no se integra</strong></p>
</li>
<li>
<p>Se elimina el «en mi máquina funciona»: la máquina de referencia es la del CI</p>
</li>
<li>
<p>El resultado queda <strong>visible</strong> para todo el equipo en el repositorio</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> La integración continua es una <strong>práctica del equipo</strong>, no una herramienta: si nadie integra a diario, el pipeline solo automatiza el big bang</p>
</li>
</ul>
</div>

<h2 id="actividad-2-planifica-versiones-e-integraci%C3%B3n">Actividad 2: planifica versiones e integración</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="el-sistema">El sistema</h3>
<p>Clínica veterinaria con estos subsistemas y dependencias:</p>
<ul>
<li><strong>Citas</strong> → usa Expedientes, Notificaciones</li>
<li><strong>Expedientes</strong> → usa Mascotas</li>
<li><strong>Mascotas</strong> → usa la base de datos</li>
<li><strong>Facturación</strong> → usa Citas y la <strong>pasarela de pago</strong> del banco (externa; su ambiente de pruebas estará listo en la semana 6)</li>
<li><strong>Notificaciones</strong> → usa el <strong>servicio de SMS</strong> (externo)</li>
</ul>
<p>Casos de uso: registrar mascota · agendar cita · atender consulta · facturar · recordar cita por SMS</p>
</div>
<div>
<h3 id="qu%C3%A9-entregar-1">Qué entregar</h3>
<ol>
<li>Un <strong>plan de 4 versiones</strong> funcionales: qué casos de uso (o flujos) entran en cada una y por qué</li>
<li>La <strong>estrategia de integración</strong> y el <strong>orden</strong> de los subsistemas</li>
<li>Los <strong>stubs y drivers</strong> que hacen falta en cada paso</li>
<li>El número de versión semántica de cada entrega</li>
</ol>
<h3 id="preguntas-de-control-1">Preguntas de control</h3>
<ul>
<li>¿Qué va en el esqueleto andante?</li>
<li>¿Qué haría si en la semana 6 el banco no cumple?</li>
</ul>
</div>

<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 20 minutos · en grupos</li>
</ul>

<h2 id="actividad-2-una-soluci%C3%B3n-posible">Actividad 2: una solución posible</h2>
<hidden label="Solución">
<table>
<thead>
<tr>
<th style="text-align:left">Versión</th>
<th style="text-align:left">Casos de uso</th>
<th style="text-align:left">Integra</th>
<th style="text-align:left">Simula (stub)</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>v0.1.0</strong> esqueleto</td>
<td style="text-align:left">Registrar mascota (flujo básico)</td>
<td style="text-align:left">Mascotas + BD + despliegue</td>
<td style="text-align:left">—</td>
</tr>
<tr>
<td style="text-align:left"><strong>v0.2.0</strong></td>
<td style="text-align:left">Agendar cita · atender consulta</td>
<td style="text-align:left">+ Expedientes + Citas</td>
<td style="text-align:left">Notificaciones</td>
</tr>
<tr>
<td style="text-align:left"><strong>v0.3.0</strong> alfa</td>
<td style="text-align:left">Recordar cita por SMS · agendar (flujos alternos)</td>
<td style="text-align:left">+ Notificaciones + SMS real</td>
<td style="text-align:left">Pasarela de pago</td>
</tr>
<tr>
<td style="text-align:left"><strong>v0.4.0</strong> beta</td>
<td style="text-align:left">Facturar</td>
<td style="text-align:left">+ Facturación + pasarela (ambiente de pruebas, semana 6)</td>
<td style="text-align:left">—</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>Estrategia</strong>: por casos de uso, que resulta <strong>ascendente</strong> en el orden de subsistemas (Mascotas → Expedientes → Citas → Facturación), porque las dependencias apuntan hacia abajo</li>
<li><strong>Drivers</strong>: las pruebas Pest de cada servicio hacen de driver mientras no exista la interfaz de usuario</li>
<li><strong>Esqueleto</strong>: registrar una mascota recorre interfaz, servicio, modelo, base de datos y despliegue: prueba el cableado completo con el caso más simple</li>
<li><strong>Si el banco no cumple</strong>: la v0.4 sale con <code>PasarelaPagoStub</code> detrás de un <em>feature flag</em> y el cobro sigue en ventanilla; la integración real pasa a la siguiente versión y se registra el riesgo</li>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> El SMS se integra <strong>antes</strong> que la pasarela porque es externo y está disponible: lo externo, lo antes posible</li>
</ul>
</hidden>
</section>
