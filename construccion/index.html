<li>Ya tenemos <strong>qué</strong> construir: requerimientos, casos de uso, modelo de dominio</li>
<li>Ya tenemos <strong>cómo</strong> construirlo: arquitectura, subsistemas, clases de diseño, modelo de datos</li>
<li>Falta lo que el cliente de verdad paga: <strong>software que funcione</strong></li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%8F%97%EF%B8%8F-dise%C3%B1o"><img class="emoji" draggable="false" alt="🏗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3d7.svg" data-marp-twemoji=""/> Diseño</h3>
<p><em>Decide</em> la estructura<br />
Clases con firmas, interfaces, componentes</p>
</div>
<div>
<h3 id="%E2%8C%A8%EF%B8%8F-construcci%C3%B3n"><img class="emoji" draggable="false" alt="⌨️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2328.svg" data-marp-twemoji=""/> Construcción</h3>
<p><em>Materializa</em> la estructura<br />
Código, pruebas, depuración, integración</p>
</div>
<div>
<h3 id="%F0%9F%9A%80-entrega"><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/> Entrega</h3>
<p><em>Pone en manos</em> del usuario<br />
Versiones, despliegue, operación</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> La construcción es donde el diseño <strong>se pone a prueba</strong>: lo que se dibujó mal aparece como código que no encaja. Lo que no se dibujó, se improvisa</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-GsM79Ued="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="3" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="53">
<h1 id="fundamentos-de-construcci%C3%B3n">Fundamentos de construcción</h1>
<h2 id="contenidos-1">Contenidos</h2>
<ul>
<li>Qué es la construcción de software</li>
<li>Construcción y ciclo de vida</li>
<li>Los cinco fundamentos</li>
<li>Gestión y calidad de la construcción</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="%C2%BFqu%C3%A9-es-la-construcci%C3%B3n-de-software">¿Qué es la construcción de software?</h2>
<steps>
<step>
<h3 id="la-definici%C3%B3n">La definición</h3>
<blockquote>
<p>«La construcción de software es la <strong>creación detallada de software funcional</strong> mediante una combinación de codificación, verificación, pruebas unitarias, pruebas de integración y depuración»<br />
— <em>SWEBOK v3, capítulo 3</em></p>
</blockquote>
<ul>
<li>No es «teclear el diseño»: en la construcción se toman <strong>cientos de decisiones pequeñas</strong> que el diseño no cubre</li>
<li>Es la actividad que produce <strong>el único artefacto que no se puede omitir</strong>: el código</li>
</ul>
</step>
<step>
<h3 id="las-actividades-que-la-componen">Las actividades que la componen</h3>
<div class="grid">
<div>
<h3 id="%E2%9C%8D%EF%B8%8F-codificar">✍️ Codificar</h3>
<p>Escribir el código fuente siguiendo el diseño y los estándares</p>
</div>
<div>
<h3 id="%F0%9F%94%8D-verificar"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> Verificar</h3>
<p>Revisiones de código, análisis estático, programación en pareja</p>
</div>
<div>
<h3 id="%F0%9F%A7%AA-probar"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Probar</h3>
<p>Pruebas <strong>unitarias</strong> y de <strong>integración</strong> escritas por quien construye</p>
</div>
<div>
<h3 id="%F0%9F%90%9E-depurar"><img class="emoji" draggable="false" alt="🐞" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f41e.svg" data-marp-twemoji=""/> Depurar</h3>
<p>Encontrar la causa de un defecto, no solo el síntoma</p>
</div>
<div>
<h3 id="%F0%9F%94%97-integrar"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Integrar</h3>
<p>Unir las piezas en un sistema que compila y funciona</p>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="construcci%C3%B3n-y-ciclo-de-vida">Construcción y ciclo de vida</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="ciclos-lineales-cascada">Ciclos lineales (cascada)</h3>
<ul>
<li>La construcción ocurre <strong>después</strong> de un diseño completo</li>
<li>Se trata como una actividad casi mecánica: el diseño ya decidió todo</li>
<li>La integración ocurre <strong>al final</strong>, de una sola vez</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Los errores de diseño se descubren tarde, cuando corregirlos es caro</li>
</ul>
</div>
<div>
<h3 id="ciclos-iterativos-rup-%C3%A1giles">Ciclos iterativos (RUP, ágiles)</h3>
<ul>
<li>Diseño y construcción <strong>se entrelazan</strong> en cada iteración</li>
<li>Cada iteración termina con una <strong>versión que funciona</strong></li>
<li>La integración es <strong>continua</strong></li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> El código retroalimenta al diseño: si algo no encaja, se corrige el modelo en la siguiente iteración</li>
</ul>
</div>
</split-slide>
<table>
<thead>
<tr>
<th style="text-align:left">Fase de RUP</th>
<th style="text-align:left">Peso de la construcción</th>
<th style="text-align:left">Lo que se construye</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Inicio</strong></td>
<td style="text-align:left">Bajo</td>
<td style="text-align:left">Prototipos para decidir si el proyecto es viable</td>
</tr>
<tr>
<td style="text-align:left"><strong>Elaboración</strong></td>
<td style="text-align:left">Medio</td>
<td style="text-align:left">La <strong>arquitectura ejecutable</strong>: el esqueleto que prueba las decisiones grandes</td>
</tr>
<tr>
<td style="text-align:left"><strong>Construcción</strong></td>
<td style="text-align:left"><strong>Máximo</strong></td>
<td style="text-align:left">Los casos de uso restantes, versión tras versión</td>
</tr>
<tr>
<td style="text-align:left"><strong>Transición</strong></td>
<td style="text-align:left">Bajo</td>
<td style="text-align:left">Correcciones, ajustes y la versión final</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="los-cinco-fundamentos">Los cinco fundamentos</h2>
<ul>
<li>El SWEBOK reúne en cinco principios lo que distingue construir bien de «hacer que funcione»</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%A9-minimizar-la-complejidad"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Minimizar la complejidad</h3>
<p>Nadie retiene mucha información a la vez. El código se escribe para <strong>ser leído</strong></p>
</div>
<div>
<h3 id="%F0%9F%94%84-anticipar-el-cambio"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> Anticipar el cambio</h3>
<p>El software <strong>va a cambiar</strong>. Hay que construirlo para que cambiar no duela</p>
</div>
<div>
<h3 id="%E2%9C%85-construir-para-verificar"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Construir para verificar</h3>
<p>Que los defectos se puedan <strong>encontrar fácil</strong>: pruebas, revisiones, aserciones</p>
</div>
<div>
<h3 id="%E2%99%BB%EF%B8%8F-reutilizar"><img class="emoji" draggable="false" alt="♻️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/267b.svg" data-marp-twemoji=""/> Reutilizar</h3>
<p>Aprovechar lo que ya existe y construir lo nuevo para que <strong>se pueda aprovechar</strong></p>
</div>
<div>
<h3 id="%F0%9F%93%8F-aplicar-est%C3%A1ndares"><img class="emoji" draggable="false" alt="📏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cf.svg" data-marp-twemoji=""/> Aplicar estándares</h3>
<p>Acordar <strong>una sola manera</strong> de hacer las cosas: formato, nombres, interfaces, notación</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="minimizar-la-complejidad">Minimizar la complejidad</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.95rem;">
<div>
<h3 id="complejo">Complejo</h3>
<pre><code class="language-php"><span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">p</span>(<span class="hljs-params"><span class="hljs-variable">$d</span>, <span class="hljs-variable">$t</span></span>) </span>{
    <span class="hljs-keyword">if</span> (<span class="hljs-variable">$t</span> == <span class="hljs-number">1</span>) {
        <span class="hljs-keyword">if</span> (<span class="hljs-variable">$d</span> &gt; <span class="hljs-number">7</span>) {
            <span class="hljs-keyword">return</span> (<span class="hljs-variable">$d</span> - <span class="hljs-number">7</span>) * <span class="hljs-number">100</span>;
        }
    } <span class="hljs-keyword">else</span> {
        <span class="hljs-keyword">if</span> (<span class="hljs-variable">$d</span> &gt; <span class="hljs-number">30</span>) {
            <span class="hljs-keyword">return</span> (<span class="hljs-variable">$d</span> - <span class="hljs-number">30</span>) * <span class="hljs-number">50</span>;
        }
    }
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
<ul>
<li>¿Qué es <code>p</code>? ¿Qué es <code>$t == 1</code>? ¿Qué significan <code>7</code> y <code>100</code>?</li>
<li>Para entenderlo hay que <strong>ejecutarlo en la cabeza</strong></li>
</ul>
</div>
<div>
<h3 id="simple">Simple</h3>
<pre><code class="language-php"><span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">calcularMulta</span>(<span class="hljs-params">
    <span class="hljs-keyword">int</span> <span class="hljs-variable">$diasPrestado</span>,
    TipoUsuario <span class="hljs-variable">$tipo</span>,
</span>): <span class="hljs-title">int</span> </span>{
    <span class="hljs-variable">$atraso</span> = <span class="hljs-variable">$diasPrestado</span> - <span class="hljs-variable">$tipo</span>-&gt;<span class="hljs-title function_ invoke__">plazoDias</span>();

    <span class="hljs-keyword">if</span> (<span class="hljs-variable">$atraso</span> &lt;= <span class="hljs-number">0</span>) {
        <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
    }

    <span class="hljs-keyword">return</span> <span class="hljs-variable">$atraso</span> * <span class="hljs-variable">$tipo</span>-&gt;<span class="hljs-title function_ invoke__">multaPorDia</span>();
}
</code></pre>
<ul>
<li>Nombres del <strong>dominio</strong>, sin números mágicos</li>
<li>Una sola responsabilidad y un solo nivel de abstracción</li>
<li>Se lee <strong>de arriba abajo</strong>, como un párrafo</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Técnicas: nombres que revelan la intención · funciones cortas · retornos tempranos · evitar estructuras «ingeniosas» · eliminar código muerto</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="anticipar-el-cambio-y-construir-para-verificar">Anticipar el cambio y construir para verificar</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<h3 id="dif%C3%ADcil-de-probar-y-de-cambiar">Difícil de probar y de cambiar</h3>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">ServicioPrestamo</span>
</span>{
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">prestar</span>(<span class="hljs-params">Ejemplar <span class="hljs-variable">$e</span></span>): <span class="hljs-title">Prestamo</span>
    </span>{
        <span class="hljs-variable">$hoy</span> = <span class="hljs-keyword">new</span> <span class="hljs-title class_">DateTimeImmutable</span>();
        <span class="hljs-variable">$db</span>  = <span class="hljs-keyword">new</span> <span class="hljs-title class_">MySqlConexion</span>(<span class="hljs-string">&#x27;10.0.0.5&#x27;</span>);
        <span class="hljs-comment">// ...</span>
    }
}
</code></pre>
<ul>
<li>La fecha es <strong>siempre hoy</strong>: ¿cómo se prueba un préstamo vencido?</li>
<li>La base de datos está <strong>cableada</strong>: cambiarla obliga a editar esta clase</li>
</ul>
</div>
<div>
<h3 id="preparado-para-ambos">Preparado para ambos</h3>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">ServicioPrestamo</span>
</span>{
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">__construct</span>(<span class="hljs-params">
        <span class="hljs-keyword">private</span> Reloj <span class="hljs-variable">$reloj</span>,
        <span class="hljs-keyword">private</span> RepositorioPrestamos <span class="hljs-variable">$prestamos</span>,
    </span>) </span>{}

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">prestar</span>(<span class="hljs-params">Ejemplar <span class="hljs-variable">$e</span></span>): <span class="hljs-title">Prestamo</span>
    </span>{
        <span class="hljs-variable">$hoy</span> = <span class="hljs-variable language_">$this</span>-&gt;reloj-&gt;<span class="hljs-title function_ invoke__">hoy</span>();
        <span class="hljs-comment">// ...</span>
    }
}
</code></pre>
<ul>
<li>En una prueba se inyecta un <code>RelojFijo</code> y un repositorio en memoria</li>
<li>Cambiar MySQL por otra cosa es <strong>otra implementación</strong>, no otra edición</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Las mismas decisiones que facilitan las pruebas son las que facilitan el cambio: <strong>dependencias explícitas</strong> e <strong>interfaces</strong> en los puntos que pueden variar</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="reutilizar-y-aplicar-est%C3%A1ndares">Reutilizar y aplicar estándares</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%E2%99%BB%EF%B8%8F-reutilizaci%C3%B3n"><img class="emoji" draggable="false" alt="♻️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/267b.svg" data-marp-twemoji=""/> Reutilización</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Tipo</th>
<th style="text-align:left">Ejemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Con</strong> reutilización</td>
<td style="text-align:left">Usar Laravel, Pest, una librería de fechas de Packagist</td>
</tr>
<tr>
<td style="text-align:left"><strong>Para</strong> reutilización</td>
<td style="text-align:left">Escribir un componente de pagos que usen tres sistemas</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Cada dependencia es <strong>una decisión</strong>: licencia, mantenimiento, seguridad, tamaño</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Regla de tres: la <strong>tercera</strong> vez que se repite algo, se generaliza</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%93%8F-est%C3%A1ndares-en-construcci%C3%B3n"><img class="emoji" draggable="false" alt="📏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cf.svg" data-marp-twemoji=""/> Estándares en construcción</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Área</th>
<th style="text-align:left">Ejemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Formato</strong></td>

<td style="text-align:left"><strong>Autocarga</strong></td>

<tr>

<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> El mejor estándar es el que <strong>una herramienta aplica sola</strong> (PHP-CS-Fixer, Pint)</li>
</ul>
</div>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="gesti%C3%B3n-y-calidad-de-la-construcci%C3%B3n">Gestión y calidad de la construcción</h2>
<steps>
<step>
<h3 id="planificar-y-medir">Planificar y medir</h3>
<ul>
<li><strong>Plan de construcción</strong>: en qué orden se construyen los componentes, quién los construye y cuándo se integran — lo dicta el <strong>diseño</strong>, no el gusto de cada quien</li>
<li><strong>Qué se mide</strong></li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Métrica</th>
<th style="text-align:left">Qué indica</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Defectos encontrados y corregidos</td>
<td style="text-align:left">La calidad y la estabilidad del producto</td>
</tr>
<tr>
<td style="text-align:left">Cobertura de pruebas</td>
<td style="text-align:left">Qué parte del código ejecutan las pruebas (no que esté <strong>bien</strong> probado)</td>
</tr>
<tr>
<td style="text-align:left">Complejidad ciclomática</td>
<td style="text-align:left">Qué funciones son difíciles de entender y de probar</td>
</tr>
<tr>
<td style="text-align:left">Esfuerzo y avance por caso de uso</td>
<td style="text-align:left">Si el plan se está cumpliendo</td>
</tr>
</tbody>
</table>
</step>
<step>
<h3 id="las-pr%C3%A1cticas-de-calidad">Las prácticas de calidad</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%91%80-revisi%C3%B3n-de-c%C3%B3digo"><img class="emoji" draggable="false" alt="👀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f440.svg" data-marp-twemoji=""/> Revisión de código</h3>
<p>Otra persona lee el cambio <strong>antes</strong> de que entre a la rama principal</p>
</div>
<div>
<h3 id="%F0%9F%91%A5-programaci%C3%B3n-en-pareja"><img class="emoji" draggable="false" alt="👥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f465.svg" data-marp-twemoji=""/> Programación en pareja</h3>
<p>Revisión continua mientras se escribe</p>
</div>
<div>
<h3 id="%F0%9F%A4%96-an%C3%A1lisis-est%C3%A1tico"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> Análisis estático</h3>
<p>PHPStan, linters: encuentran errores sin ejecutar</p>
</div>
<div>
<h3 id="%F0%9F%A7%AA-pruebas-primero"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Pruebas primero</h3>
<p>TDD: la prueba define qué debe hacer el código antes de escribirlo</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>Deuda técnica</strong>: cada atajo que se toma «por ahora» se paga después con intereses. Se vale endeudarse, pero <strong>a conciencia y con registro</strong></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-QT4SHd24="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="11" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="53">
<h1 id="prototipos-en-la-etapa-de-dise%C3%B1o">Prototipos en la etapa de diseño</h1>
<h2 id="contenidos-2">Contenidos</h2>
<ul>
<li>Prototipo de requerimientos vs. prototipo de diseño</li>
<li>Tipos de prototipo técnico</li>
<li>El ciclo de un prototipo</li>
<li>Desechable o evolutivo</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="dos-prototipos-dos-preguntas">Dos prototipos, dos preguntas</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%A7%91%E2%80%8D%F0%9F%92%BC-prototipo-de-requerimientos"><img class="emoji" draggable="false" alt="🧑‍💼" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9d1-200d-1f4bc.svg" data-marp-twemoji=""/> Prototipo de requerimientos</h3>
<p><em>Ya lo vimos en ingeniería de requerimientos</em></p>
<ul>
<li>Pregunta: <strong>¿esto es lo que el usuario necesita?</strong></li>
<li>Lo evalúa: el <strong>usuario</strong></li>
<li>Suele ser: pantallas, bocetos, maquetas navegables</li>
<li>Resultado: requerimientos corregidos</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%9B%A0%EF%B8%8F-prototipo-de-dise%C3%B1o"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Prototipo de diseño</h3>
<p><em>El tema de hoy</em></p>
<ul>
<li>Pregunta: <strong>¿esta solución técnica funciona?</strong></li>
<li>Lo evalúa: el <strong>equipo técnico</strong></li>
<li>Suele ser: código mínimo, sin interfaz pulida</li>
<li>Resultado: una <strong>decisión de diseño</strong> respaldada con evidencia</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> En diseño, un prototipo existe para <strong>reducir un riesgo técnico</strong> antes de que la arquitectura dependa de él</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Preguntas típicas: ¿alcanza el rendimiento? ¿se puede integrar con el sistema X? ¿esta librería hace lo que promete? ¿el equipo puede aprender esta tecnología a tiempo?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="tipos-de-prototipo-t%C3%A9cnico">Tipos de prototipo técnico</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Tipo</th>
<th style="text-align:left">Qué es</th>
<th style="text-align:left">Pregunta típica</th>
<th style="text-align:left">Destino</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Prueba de concepto</strong> (PoC)</td>
<td style="text-align:left">Demuestra que una idea es <strong>posible</strong></td>
<td style="text-align:left">¿Se puede firmar digitalmente un PDF desde PHP?</td>
<td style="text-align:left">Se desecha</td>
</tr>
<tr>
<td style="text-align:left"><strong>Spike</strong></td>
<td style="text-align:left">Investigación con tiempo acotado sobre <strong>una</strong> incógnita</td>
<td style="text-align:left">¿Cuánto tarda la API del banco en responder?</td>
<td style="text-align:left">Se desecha; queda el conocimiento</td>
</tr>
<tr>
<td style="text-align:left"><strong>Prototipo arquitectónico</strong></td>
<td style="text-align:left">Implementa los caminos <strong>críticos</strong> de la arquitectura</td>
<td style="text-align:left">¿Las capas y la base de datos soportan la carga de matrícula?</td>
<td style="text-align:left">Suele evolucionar</td>
</tr>
<tr>
<td style="text-align:left"><strong>Esqueleto andante</strong></td>
<td style="text-align:left">La versión más pequeña que recorre <strong>todas las capas</strong> de punta a punta</td>
<td style="text-align:left">¿Están bien cableadas las piezas y el despliegue?</td>
<td style="text-align:left">Evoluciona: es la v0.1</td>
</tr>
<tr>
<td style="text-align:left"><strong>Prototipo de interfaz</strong></td>
<td style="text-align:left">Pantallas navegables</td>
<td style="text-align:left">¿El flujo de navegación tiene sentido?</td>
<td style="text-align:left">Se desecha o se vuelve la guía de estilo</td>
</tr>
</tbody>
</table>
<div class="grid">
<div>
<h3 id="%E2%86%94%EF%B8%8F-horizontal"><img class="emoji" draggable="false" alt="↔️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2194.svg" data-marp-twemoji=""/> Horizontal</h3>
<p>Mucha <strong>amplitud</strong>, poca profundidad: todas las pantallas, ninguna lógica real</p>
</div>
<div>
<h3 id="%E2%86%95%EF%B8%8F-vertical"><img class="emoji" draggable="false" alt="↕️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2195.svg" data-marp-twemoji=""/> Vertical</h3>
<p>Poca amplitud, mucha <strong>profundidad</strong>: una función, pero completa hasta la base de datos</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="el-ciclo-de-un-prototipo-de-dise%C3%B1o">El ciclo de un prototipo de diseño</h2>
<steps>
<step>
<h3 id="seis-pasos">Seis pasos</h3>
<ol>
<li><strong>Formular la pregunta</strong> — una sola, concreta, que se pueda responder sí o no</li>
<li><strong>Fijar el criterio de éxito</strong> — medible: «menos de 300 ms con 500 usuarios»</li>
<li><strong>Acotar el tiempo</strong> (<em>timebox</em>) — dos días, no «hasta que funcione»</li>
<li><strong>Construir lo mínimo</strong> que responde la pregunta, nada más</li>
<li><strong>Medir</strong> contra el criterio y <strong>decidir</strong></li>
<li><strong>Registrar</strong> la decisión (un ADR) y <strong>desechar</strong> o <strong>evolucionar</strong> el código</li>
</ol>
</step>
<step>
<h3 id="un-ejemplo">Un ejemplo</h3>
<ul>
<li>
<p><strong>Contexto</strong>: el catálogo de la biblioteca tiene 400 000 títulos; se espera un pico de 150 búsquedas por segundo al inicio de semestre</p>
</li>
<li>
<p><strong>Pregunta</strong>: ¿basta una búsqueda con <code>LIKE</code> en MySQL o hace falta un índice de texto completo?</p>
</li>
<li>
<p><strong>Criterio</strong>: el 95 % de las búsquedas en menos de 500 ms</p>
</li>
<li>
<p><strong>Tiempo</strong>: 2 días · un script que carga datos sintéticos y una prueba de carga</p>
</li>
<li>
<p><strong>Resultado</strong>: <code>LIKE '%texto%'</code> tarda 2,1 s; <code>FULLTEXT</code> responde en 80 ms</p>
</li>
<li>
<p><strong>Decisión</strong> (ADR-007): se usa <code>FULLTEXT</code> de MySQL; se descarta un motor de búsqueda externo porque no hace falta todavía</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> El prototipo costó 2 días. Descubrirlo en producción habría costado un semestre de quejas</p>
</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="%C2%BFdesechable-o-evolutivo">¿Desechable o evolutivo?</h2>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left">Desechable</th>
<th style="text-align:left">Evolutivo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Propósito</strong></td>
<td style="text-align:left">Aprender, responder una pregunta</td>
<td style="text-align:left">Ser la base del producto</td>
</tr>
<tr>
<td style="text-align:left"><strong>Calidad del código</strong></td>
<td style="text-align:left">La mínima necesaria</td>
<td style="text-align:left">La del producto final: pruebas, estándares, revisión</td>
</tr>
<tr>
<td style="text-align:left"><strong>Velocidad</strong></td>
<td style="text-align:left">Muy rápido</td>
<td style="text-align:left">Más lento</td>
</tr>
<tr>
<td style="text-align:left"><strong>Qué se conserva</strong></td>
<td style="text-align:left">El <strong>conocimiento</strong> y la decisión</td>
<td style="text-align:left">El <strong>código</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Ejemplos</strong></td>
<td style="text-align:left">PoC, spike</td>
<td style="text-align:left">Esqueleto andante, prototipo arquitectónico</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> El riesgo clásico: un prototipo desechable que <strong>se queda en producción</strong> porque «ya funciona». Nació sin pruebas, sin manejo de errores y sin seguridad</li>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> La decisión se toma <strong>antes</strong> de escribir la primera línea, no después</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Truco práctico: construir el desechable en una <strong>rama o repositorio aparte</strong>, o incluso en otro lenguaje, para que sea imposible «promoverlo»</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-kZOorY1R="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="16" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="53">
<h1 id="transici%C3%B3n-del-dise%C3%B1o-a-la-implementaci%C3%B3n">Transición del diseño a la implementación</h1>
<h2 id="contenidos-3">Contenidos</h2>
<ul>
<li>El modelo de implementación</li>
<li>De la clase UML a la clase PHP</li>
<li>Asociaciones, multiplicidad, agregación y composición</li>
<li>Herencia y clases asociación</li>
<li>De la secuencia a los métodos · de los paquetes a las carpetas</li>
<li>Ingeniería directa e inversa</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="el-modelo-de-implementaci%C3%B3n">El modelo de implementación</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="qu%C3%A9-es">Qué es</h3>
<ul>
<li>Describe <strong>cómo se organizan</strong> los elementos del diseño en archivos de código, componentes y artefactos desplegables</li>
<li>En RUP es el artefacto que produce la disciplina de <strong>implementación</strong></li>
<li>Se representa con diagramas de <strong>componentes</strong> y de <strong>despliegue</strong></li>
<li>Cada elemento debe poder <strong>rastrearse</strong> al diseño</li>
</ul>
</div>
<div>
<h3 id="qu%C3%A9-se-traduce-en-qu%C3%A9">Qué se traduce en qué</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Diseño</th>
<th style="text-align:left">Implementación</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Subsistema</td>
<td style="text-align:left">Paquete / módulo / carpeta</td>
</tr>
<tr>
<td style="text-align:left">Clase de diseño</td>
<td style="text-align:left">Clase en un archivo</td>
</tr>
<tr>
<td style="text-align:left">Interfaz</td>
<td style="text-align:left"><code>interface</code></td>
</tr>
<tr>
<td style="text-align:left">Clase entidad</td>
<td style="text-align:left">Modelo + tabla</td>
</tr>
<tr>
<td style="text-align:left">Clase límite</td>
<td style="text-align:left">Controlador, vista, API</td>
</tr>
<tr>
<td style="text-align:left">Clase control</td>
<td style="text-align:left">Servicio, caso de uso</td>
</tr>
<tr>
<td style="text-align:left">Nodo de despliegue</td>
<td style="text-align:left">Servidor, contenedor</td>
</tr>
</tbody>
</table>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> El diseño y el código <strong>no son dos verdades</strong>: si el código se aparta del modelo, se actualiza el modelo o se corrige el código. Lo que no se vale es que convivan contradiciéndose</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="de-la-clase-uml-a-la-clase-php">De la clase UML a la clase PHP</h2>
<split-slide style="--left: 42%; --right: 58%; --font-size: 0.85rem;">
<div>
<h3 id="el-diagrama">El diagrama</h3>
<pre><code class="language-text">┌──────────────────────────────┐
│          Mascota             │  ← cursiva: abstracta
├──────────────────────────────┤
│ - nombre: string             │
│ - nacimiento: Date           │
│ # peso: float                │
│ - total: int  (subrayado)    │  ← estático
├──────────────────────────────┤
│ + edad(): int                │
│ + especie(): string  {abs}   │
└──────────────────────────────┘
</code></pre>
<table>
<thead>
<tr>
<th style="text-align:left">UML</th>
<th style="text-align:left">PHP</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>+</code> público</td>
<td style="text-align:left"><code>public</code></td>
</tr>
<tr>
<td style="text-align:left"><code>-</code> privado</td>
<td style="text-align:left"><code>private</code></td>
</tr>
<tr>
<td style="text-align:left"><code>#</code> protegido</td>
<td style="text-align:left"><code>protected</code></td>
</tr>
<tr>
<td style="text-align:left">subrayado</td>
<td style="text-align:left"><code>static</code></td>
</tr>
<tr>
<td style="text-align:left">cursiva</td>
<td style="text-align:left"><code>abstract</code></td>
</tr>
</tbody>
</table>
</div>
<div>
<h3 id="el-c%C3%B3digo">El código</h3>
<pre><code class="language-php"><span class="hljs-meta">&lt;?php</span>

<span class="hljs-keyword">namespace</span> <span class="hljs-title class_">App</span>\<span class="hljs-title class_">Models</span>;

<span class="hljs-keyword">abstract</span> <span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Mascota</span>
</span>{
    <span class="hljs-keyword">private</span> <span class="hljs-built_in">static</span> <span class="hljs-keyword">int</span> <span class="hljs-variable">$total</span> = <span class="hljs-number">0</span>;

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">__construct</span>(<span class="hljs-params">
        <span class="hljs-keyword">private</span> <span class="hljs-keyword">string</span> <span class="hljs-variable">$nombre</span>,
        <span class="hljs-keyword">private</span> DateTimeImmutable <span class="hljs-variable">$nacimiento</span>,
        <span class="hljs-keyword">protected</span> <span class="hljs-keyword">float</span> <span class="hljs-variable">$peso</span>,
    </span>) </span>{
        <span class="hljs-built_in">self</span>::<span class="hljs-variable">$total</span>++;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">edad</span>(<span class="hljs-params"></span>): <span class="hljs-title">int</span>
    </span>{
        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">$this</span>-&gt;nacimiento
            -&gt;<span class="hljs-title function_ invoke__">diff</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">DateTimeImmutable</span>())-&gt;y;
    }

    <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">especie</span>(<span class="hljs-params"></span>): <span class="hljs-title">string</span></span>;
}
</code></pre>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="asociaciones-y-multiplicidad">Asociaciones y multiplicidad</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.78rem;">
<div>
<h3 id="unidireccional-cita-%E2%86%92-veterinario">Unidireccional: <code>Cita → Veterinario</code></h3>
<p>Solo la cita conoce al veterinario</p>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Cita</span>
</span>{
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">__construct</span>(<span class="hljs-params">
        <span class="hljs-keyword">private</span> DateTimeImmutable <span class="hljs-variable">$fecha</span>,
        <span class="hljs-keyword">private</span> Veterinario <span class="hljs-variable">$veterinario</span>, <span class="hljs-comment">// 1</span>
        <span class="hljs-keyword">private</span> ?Sala <span class="hljs-variable">$sala</span> = <span class="hljs-literal">null</span>,       <span class="hljs-comment">// 0..1</span>
    </span>) </span>{}
}
</code></pre>
<table>
<thead>
<tr>
<th style="text-align:left">Multiplicidad</th>
<th style="text-align:left">En PHP</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>1</code></td>
<td style="text-align:left">Propiedad obligatoria, en el constructor</td>
</tr>
<tr>
<td style="text-align:left"><code>0..1</code></td>
<td style="text-align:left">Propiedad <em>nullable</em>: <code>?Tipo</code></td>
</tr>
<tr>
<td style="text-align:left"><code>*</code> · <code>1..*</code></td>
<td style="text-align:left"><code>array</code> o colección + métodos para agregar</td>
</tr>
</tbody>
</table>
</div>
<div>
<h3 id="bidireccional-due%C3%B1o-%E2%86%94-mascota">Bidireccional: <code>Dueño ↔ Mascota</code></h3>
<p>Cada lado conoce al otro: <strong>hay que mantenerlos sincronizados</strong></p>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Dueno</span>
</span>{
    <span class="hljs-comment">/** <span class="hljs-doctag">@var</span> Mascota[] */</span>
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">array</span> <span class="hljs-variable">$mascotas</span> = [];      <span class="hljs-comment">// 0..*</span>

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">adoptar</span>(<span class="hljs-params">Mascota <span class="hljs-variable">$m</span></span>): <span class="hljs-title">void</span>
    </span>{
        <span class="hljs-variable language_">$this</span>-&gt;mascotas[] = <span class="hljs-variable">$m</span>;
        <span class="hljs-variable">$m</span>-&gt;<span class="hljs-title function_ invoke__">asignarDueno</span>(<span class="hljs-variable">$this</span>);       <span class="hljs-comment">// el otro lado</span>
    }
}

<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Mascota</span>
</span>{
    <span class="hljs-keyword">private</span> ?Dueno <span class="hljs-variable">$dueno</span> = <span class="hljs-literal">null</span>;      <span class="hljs-comment">// 0..1</span>

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">asignarDueno</span>(<span class="hljs-params">Dueno <span class="hljs-variable">$d</span></span>): <span class="hljs-title">void</span>
    </span>{
        <span class="hljs-variable language_">$this</span>-&gt;dueno = <span class="hljs-variable">$d</span>;
    }
}
</code></pre>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Prefiera la <strong>unidireccional</strong>: cada flecha doble es una invariante más que cuidar</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="agregaci%C3%B3n-y-composici%C3%B3n-en-c%C3%B3digo">Agregación y composición en código</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.9rem;">
<div>
<h3 id="%E2%97%87-agregaci%C3%B3n-cl%C3%ADnica-%E2%97%87-veterinario">◇ Agregación: <code>Clínica ◇— Veterinario</code></h3>
<p>El veterinario <strong>existe por su cuenta</strong> y puede estar en varias clínicas</p>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Clinica</span>
</span>{
    <span class="hljs-comment">/** <span class="hljs-doctag">@var</span> Veterinario[] */</span>
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">array</span> <span class="hljs-variable">$veterinarios</span> = [];

    <span class="hljs-comment">// recibe un objeto que ya existía</span>
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">contratar</span>(<span class="hljs-params">Veterinario <span class="hljs-variable">$v</span></span>): <span class="hljs-title">void</span>
    </span>{
        <span class="hljs-variable language_">$this</span>-&gt;veterinarios[] = <span class="hljs-variable">$v</span>;
    }
}
</code></pre>
<ul>
<li>Si la clínica desaparece, los veterinarios <strong>siguen existiendo</strong></li>
</ul>
</div>
<div>
<h3 id="%E2%97%86-composici%C3%B3n-expediente-%E2%97%86-consulta">◆ Composición: <code>Expediente ◆— Consulta</code></h3>
<p>La consulta <strong>nace y muere</strong> con su expediente</p>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Expediente</span>
</span>{
    <span class="hljs-comment">/** <span class="hljs-doctag">@var</span> Consulta[] */</span>
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">array</span> <span class="hljs-variable">$consultas</span> = [];

    <span class="hljs-comment">// el todo CREA la parte: nadie más la tiene</span>
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">registrarConsulta</span>(<span class="hljs-params">
        DateTimeImmutable <span class="hljs-variable">$fecha</span>,
        <span class="hljs-keyword">string</span> <span class="hljs-variable">$diagnostico</span>,
    </span>): <span class="hljs-title">Consulta</span> </span>{
        <span class="hljs-variable">$c</span> = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Consulta</span>(<span class="hljs-variable">$fecha</span>, <span class="hljs-variable">$diagnostico</span>);
        <span class="hljs-variable language_">$this</span>-&gt;consultas[] = <span class="hljs-variable">$c</span>;
        <span class="hljs-keyword">return</span> <span class="hljs-variable">$c</span>;
    }
}
</code></pre>
<ul>
<li>En base de datos: <code>ON DELETE CASCADE</code> desde el expediente</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> La diferencia no está en la sintaxis sino en <strong>quién crea la parte</strong> y <strong>quién más puede tenerla</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="generalizaci%C3%B3n-y-clase-asociaci%C3%B3n">Generalización y clase asociación</h2>
<split-slide style="--left: 45%; --right: 55%; --font-size: 0.85rem;">
<div>
<h3 id="generalizaci%C3%B3n-%E2%86%92-extends">Generalización → <code>extends</code></h3>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Perro</span> <span class="hljs-keyword">extends</span> <span class="hljs-title">Mascota</span>
</span>{
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">__construct</span>(<span class="hljs-params">
        <span class="hljs-keyword">string</span> <span class="hljs-variable">$nombre</span>,
        DateTimeImmutable <span class="hljs-variable">$nacimiento</span>,
        <span class="hljs-keyword">float</span> <span class="hljs-variable">$peso</span>,
        <span class="hljs-keyword">private</span> <span class="hljs-keyword">string</span> <span class="hljs-variable">$raza</span>,
    </span>) </span>{
        <span class="hljs-built_in">parent</span>::<span class="hljs-title function_ invoke__">__construct</span>(
            <span class="hljs-variable">$nombre</span>, <span class="hljs-variable">$nacimiento</span>, <span class="hljs-variable">$peso</span>
        );
    }

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">especie</span>(<span class="hljs-params"></span>): <span class="hljs-title">string</span>
    </span>{
        <span class="hljs-keyword">return</span> <span class="hljs-string">&#x27;Canino&#x27;</span>;
    }
}
</code></pre>
<ul>
<li>Realización (<code>- - -▷</code>) → <code>implements</code></li>
</ul>
</div>
<div>
<h3 id="clase-asociaci%C3%B3n-%E2%86%92-una-clase-m%C3%A1s">Clase asociación → una clase más</h3>
<p><code>Mascota * —— * Vacuna</code>, y de <strong>cada aplicación</strong> interesa la fecha y la dosis</p>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Aplicacion</span>   // <span class="hljs-title">la</span> <span class="hljs-title">clase</span> <span class="hljs-title">asociaci</span>ó<span class="hljs-title">n</span>
</span>{
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">__construct</span>(<span class="hljs-params">
        <span class="hljs-keyword">private</span> Mascota <span class="hljs-variable">$mascota</span>,
        <span class="hljs-keyword">private</span> Vacuna <span class="hljs-variable">$vacuna</span>,
        <span class="hljs-keyword">private</span> DateTimeImmutable <span class="hljs-variable">$fecha</span>,
        <span class="hljs-keyword">private</span> <span class="hljs-keyword">float</span> <span class="hljs-variable">$dosisMl</span>,
    </span>) </span>{}
}
</code></pre>
<ul>
<li>En la base de datos se vuelve la <strong>tabla intermedia</strong> con columnas propias</li>
<li>En Eloquent:</li>
</ul>
<pre><code class="language-php"><span class="hljs-keyword">return</span> <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">belongsToMany</span>(<span class="hljs-title class_">Vacuna</span>::<span class="hljs-variable language_">class</span>, <span class="hljs-string">&#x27;aplicaciones&#x27;</span>)
            -&gt;<span class="hljs-title function_ invoke__">withPivot</span>(<span class="hljs-string">&#x27;fecha&#x27;</span>, <span class="hljs-string">&#x27;dosis_ml&#x27;</span>);
</code></pre>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="de-la-secuencia-a-los-m%C3%A9todos">De la secuencia a los métodos</h2>
<split-slide style="--left: 45%; --right: 55%; --font-size: 0.9rem;">
<div>
<h3 id="la-regla">La regla</h3>
<ul>
<li>Cada <strong>mensaje</strong> que llega a un objeto en el diagrama de secuencia es un <strong>método público</strong> de su clase</li>
<li>Los parámetros del mensaje son los <strong>parámetros</strong> del método; el retorno punteado es el <strong>tipo de retorno</strong></li>
<li>El orden vertical de los mensajes es el <strong>orden de las instrucciones</strong></li>
<li>Un fragmento <code>alt</code> es un <code>if</code>; un <code>loop</code>, un <code>foreach</code></li>
</ul>
<pre><code class="language-text">:FormCita  :ServicioCitas  :Agenda   :RepoCitas
   │ agendar(datos) │           │          │
   │──────────────▶│ libre(f,v)│          │
   │               │──────────▶│          │
   │               │◀─ ─ bool ─│          │
   │               │ guardar(cita)        │
   │               │─────────────────────▶│
</code></pre>
</div>
<div>
<h3 id="el-c%C3%B3digo-que-resulta">El código que resulta</h3>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">ServicioCitas</span>               // «<span class="hljs-title">control</span>»
</span>{
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">__construct</span>(<span class="hljs-params">
        <span class="hljs-keyword">private</span> Agenda <span class="hljs-variable">$agenda</span>,
        <span class="hljs-keyword">private</span> RepositorioCitas <span class="hljs-variable">$citas</span>,
    </span>) </span>{}

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">agendar</span>(<span class="hljs-params">DatosCita <span class="hljs-variable">$d</span></span>): <span class="hljs-title">Cita</span>
    </span>{
        <span class="hljs-keyword">if</span> (! <span class="hljs-variable language_">$this</span>-&gt;agenda-&gt;<span class="hljs-title function_ invoke__">libre</span>(
                <span class="hljs-variable">$d</span>-&gt;fecha, <span class="hljs-variable">$d</span>-&gt;veterinario)) {
            <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">HorarioOcupado</span>();   <span class="hljs-comment">// alt</span>
        }

        <span class="hljs-variable">$cita</span> = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Cita</span>(<span class="hljs-variable">$d</span>-&gt;fecha, <span class="hljs-variable">$d</span>-&gt;veterinario);
        <span class="hljs-variable language_">$this</span>-&gt;citas-&gt;<span class="hljs-title function_ invoke__">guardar</span>(<span class="hljs-variable">$cita</span>);

        <span class="hljs-keyword">return</span> <span class="hljs-variable">$cita</span>;
    }
}
</code></pre>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="de-los-paquetes-a-las-carpetas">De los paquetes a las carpetas</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.95rem;">
<div>
<h3 id="clases-de-an%C3%A1lisis-%E2%86%92-estructura-del-proyecto">Clases de análisis → estructura del proyecto</h3>
<pre><code class="language-text">app/
├── Http/Controllers/     ← «boundary»
│   └── CitaController.php
├── Services/             ← «control»
│   └── ServicioCitas.php
├── Models/               ← «entity»
│   ├── Cita.php
│   ├── Mascota.php
│   └── Dueno.php
└── Contracts/            ← interfaces
    └── RepositorioCitas.php
database/migrations/      ← modelo de datos
tests/
├── Unit/                 ← pruebas por clase
└── Feature/              ← pruebas de integración
</code></pre>
</div>
<div>
<h3 id="reglas-que-conviene-respetar">Reglas que conviene respetar</h3>
<ul>
<li>
<p><strong>Un archivo por clase</strong>, con el mismo nombre (PSR-4)</p>
</li>
<li>
<p>El <strong>espacio de nombres</strong> refleja la carpeta: <code>App\Services\ServicioCitas</code></p>
</li>
<li>
<p>Las dependencias entre carpetas siguen la <strong>dirección de las capas</strong> del diseño: un modelo nunca usa un controlador</p>
</li>
<li>
<p>Si el diseño tiene subsistemas, cada uno puede ser un <strong>módulo</strong> con su propia estructura interna</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> En el proyecto del curso, cada clase del diagrama es un <strong>modelo</strong> de la carpeta <code>app/Models</code>, y se instancia desde una <strong>prueba</strong> en <code>tests/</code></p>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="instanciar-el-dise%C3%B1o-desde-una-prueba">Instanciar el diseño desde una prueba</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.95rem;">
<div>
<h3 id="por-qu%C3%A9-en-una-prueba">Por qué en una prueba</h3>
<ul>
<li>Una prueba es el <strong>primer cliente</strong> del código: si instanciar las clases es incómodo, el diseño tiene un problema</li>
<li>Documenta <strong>cómo se usa</strong> cada clase</li>
<li>Verifica las relaciones del diagrama: multiplicidad, navegabilidad, composición</li>
<li>Se ejecuta en segundos con <code>./vendor/bin/pest</code></li>
</ul>
</div>
<div>
<h3 id="pest">Pest</h3>
<pre><code class="language-php"><span class="hljs-title function_ invoke__">test</span>(<span class="hljs-string">&#x27;un dueño adopta una mascota&#x27;</span>, function () {
    <span class="hljs-variable">$ana</span> = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Dueno</span>(<span class="hljs-string">&#x27;Ana Mora&#x27;</span>);
    <span class="hljs-variable">$luna</span> = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Perro</span>(
        <span class="hljs-string">&#x27;Luna&#x27;</span>,
        <span class="hljs-keyword">new</span> <span class="hljs-title class_">DateTimeImmutable</span>(<span class="hljs-string">&#x27;2021-03-10&#x27;</span>),
        <span class="hljs-number">12.5</span>,
        <span class="hljs-string">&#x27;Beagle&#x27;</span>,
    );

    <span class="hljs-variable">$ana</span>-&gt;<span class="hljs-title function_ invoke__">adoptar</span>(<span class="hljs-variable">$luna</span>);

    <span class="hljs-title function_ invoke__">expect</span>(<span class="hljs-variable">$ana</span>-&gt;<span class="hljs-title function_ invoke__">mascotas</span>())-&gt;<span class="hljs-title function_ invoke__">toContain</span>(<span class="hljs-variable">$luna</span>)
        -&gt;<span class="hljs-keyword">and</span>(<span class="hljs-variable">$luna</span>-&gt;<span class="hljs-title function_ invoke__">dueno</span>())-&gt;<span class="hljs-title function_ invoke__">toBe</span>(<span class="hljs-variable">$ana</span>)
        -&gt;<span class="hljs-keyword">and</span>(<span class="hljs-variable">$luna</span>-&gt;<span class="hljs-title function_ invoke__">especie</span>())-&gt;<span class="hljs-title function_ invoke__">toBe</span>(<span class="hljs-string">&#x27;Canino&#x27;</span>);
});
</code></pre>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> La prueba comprueba la <strong>bidireccionalidad</strong>: si <code>adoptar()</code> olvidara el otro lado, la segunda expectativa fallaría</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="ingenier%C3%ADa-directa-inversa-y-de-ida-y-vuelta">Ingeniería directa, inversa y de ida y vuelta</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Dirección</th>
<th style="text-align:left">Qué hace</th>
<th style="text-align:left">Cuándo sirve</th>
<th style="text-align:left">Herramienta</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Directa</strong> (<em>forward</em>)</td>
<td style="text-align:left">Genera <strong>esqueletos de código</strong> desde el diagrama de clases</td>
<td style="text-align:left">Al iniciar un módulo con muchas clases</td>
<td style="text-align:left">Visual Paradigm, StarUML, Enterprise Architect</td>
</tr>
<tr>
<td style="text-align:left"><strong>Inversa</strong> (<em>reverse</em>)</td>
<td style="text-align:left">Genera <strong>diagramas</strong> a partir del código existente</td>
<td style="text-align:left">Documentar o entender un sistema heredado</td>
<td style="text-align:left">Visual Paradigm, PhpStorm, <code>phpuml</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Ida y vuelta</strong> (<em>round-trip</em>)</td>
<td style="text-align:left">Sincroniza en ambos sentidos</td>
<td style="text-align:left">Cuando el modelo se mantiene vivo durante todo el proyecto</td>
<td style="text-align:left">Visual Paradigm, Enterprise Architect</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> La generación produce <strong>estructura</strong>, no comportamiento: firmas, atributos, relaciones. La lógica la escribe una persona</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> El modelo E-R también se puede generar desde la base de datos (inversa) o producir las migraciones (directa). Revise siempre lo que genera: las herramientas no conocen sus reglas de negocio</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> En la práctica, los equipos modelan <strong>lo arquitectónicamente significativo</strong> y dejan que el código sea la fuente de verdad del detalle</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="errores-frecuentes-en-la-transici%C3%B3n">Errores frecuentes en la transición</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%B1-getters-y-setters-para-todo"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> Getters y setters para todo</h3>
<p>Convierte cada clase en una estructura de datos. El comportamiento termina en otro lado</p>
</div>
<div>
<h3 id="%F0%9F%94%80-bidireccional-sin-sincronizar"><img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f500.svg" data-marp-twemoji=""/> Bidireccional sin sincronizar</h3>
<p>Un lado dice que la mascota tiene dueño; el otro no la tiene en su lista</p>
</div>
<div>
<h3 id="%F0%9F%A7%AC-herencia-donde-iba-asociaci%C3%B3n"><img class="emoji" draggable="false" alt="🧬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ec.svg" data-marp-twemoji=""/> Herencia donde iba asociación</h3>
<p><code>Veterinario extends Persona</code> está bien; <code>Cita extends Veterinario</code> no</p>
</div>
<div>
<h3 id="%F0%9F%93%A6-composici%C3%B3n-sin-due%C3%B1o"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Composición sin dueño</h3>
<p>La parte se crea afuera y se comparte: ya no es composición</p>
</div>
<div>
<h3 id="%F0%9F%97%84%EF%B8%8F-dise%C3%B1ar-desde-la-tabla"><img class="emoji" draggable="false" alt="🗄️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5c4.svg" data-marp-twemoji=""/> Diseñar desde la tabla</h3>
<p>Las clases copian las columnas y pierden las reglas del dominio</p>
</div>
<div>
<h3 id="%F0%9F%93%9D-diagrama-y-c%C3%B3digo-divorciados"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> Diagrama y código divorciados</h3>
<p>Nadie actualiza el modelo; a los tres meses nadie le cree</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="actividad-1-del-diagrama-al-c%C3%B3digo">Actividad 1: del diagrama al código</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="el-escenario">El escenario</h3>
<p>En la universidad, un <strong>curso</strong> tiene un código y un nombre, y se ofrece en uno o varios <strong>grupos</strong> cada semestre. Un grupo tiene un número y un cupo, y no existe sin su curso. Cada grupo lo imparte un <strong>docente</strong>; al docente no le interesa saber qué grupos tiene.</p>
<p>Un <strong>estudiante</strong> se matricula en varios grupos, y un grupo tiene muchos estudiantes. De cada matrícula interesa la <strong>fecha</strong> y la <strong>nota final</strong>.</p>
</div>
<div>
<h3 id="qu%C3%A9-entregar">Qué entregar</h3>
<ol>
<li>El <strong>diagrama de clases</strong> con multiplicidad, navegabilidad y tipo de relación</li>
<li>El <strong>código PHP</strong> de las clases, en <code>app/Models</code></li>
<li>Una <strong>prueba Pest</strong> que cree un grupo con dos estudiantes matriculados</li>
<li>Las <strong>tablas</strong> que resultarían</li>
</ol>
<h3 id="preguntas-de-control">Preguntas de control</h3>
<ul>
<li>¿Qué relación es composición y por qué?</li>
<li>¿Qué asociación es unidireccional?</li>
<li>¿Dónde vive la nota?</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 25 minutos · en parejas</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="actividad-1-una-soluci%C3%B3n-posible">Actividad 1: una solución posible</h2>
<hidden label="Solución">
<split-slide style="--left: 38%; --right: 62%; --font-size: 0.78rem;">
<div>
<h3 id="las-decisiones">Las decisiones</h3>
<ul>
<li><code>Curso ◆— 1..* Grupo</code>: <strong>composición</strong>, el grupo no existe sin su curso</li>
<li><code>Grupo → 1 Docente</code>: <strong>unidireccional</strong>, el docente no navega a sus grupos</li>
<li><code>Estudiante * —— * Grupo</code> con la clase asociación <strong><code>Matricula</code></strong> (fecha, nota): la nota no es del estudiante ni del grupo, es <strong>de la relación</strong></li>
</ul>
<h3 id="las-tablas">Las tablas</h3>
<p><code>cursos</code> · <code>grupos</code> (FK <code>curso_id</code>, <code>ON DELETE CASCADE</code>; FK <code>docente_id</code>) · <code>docentes</code> · <code>estudiantes</code> · <code>matriculas</code> (FK <code>estudiante_id</code>, FK <code>grupo_id</code>, <code>fecha</code>, <code>nota</code>)</p>
</div>
<div>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Curso</span> </span>{
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">array</span> <span class="hljs-variable">$grupos</span> = [];

}

}

        -&gt;<span class="hljs-title function_ invoke__">abrirGrupo</span>(<span class="hljs-number">1</span>, <span class="hljs-number">30</span>, <span class="hljs-keyword">new</span> <span class="hljs-title class_">Docente</span>(<span class="hljs-string">&#x27;D. Solís&#x27;</span>));
    <span class="hljs-variable">$g</span>-&gt;<span class="hljs-title function_ invoke__">matricular</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Estudiante</span>(<span class="hljs-string">&#x27;B12345&#x27;</span>), <span class="hljs-keyword">new</span> <span class="hljs-title class_">DateTimeImmutable</span>());

    <span class="hljs-title function_ invoke__">expect</span>(<span class="hljs-variable">$g</span>-&gt;<span class="hljs-title function_ invoke__">matriculas</span>())-&gt;<span class="hljs-title function_ invoke__">toHaveCount</span>(<span class="hljs-number">2</span>);
