</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="los-artefactos-de-la-ingenier%C3%ADa-de-requerimientos">Los artefactos de la ingeniería de requerimientos</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Artefacto</th>
<th style="text-align:left">Responde</th>
<th style="text-align:left">Nivel</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Plan de administración de requerimientos</strong></td>

<td style="text-align:left">Proceso</td>

<tr>

<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Juntos, <strong>Casos de uso + Especificaciones suplementarias</strong> forman la especificación completa</li>

<h2 id="plan-de-administraci%C3%B3n-de-requerimientos">Plan de administración de requerimientos</h2>
<ul>
<li>Define <strong>cómo</strong> se van a manejar los requerimientos en <strong>este</strong> proyecto. Se escribe <strong>antes</strong> de tener requerimientos</li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="qu%C3%A9-define">Qué define</h3>
<ul>
<li><strong>Tipos</strong> de requerimiento que se usarán (STR, FEA, UC, SUPL, RN...)</li>
<li><strong>Atributos</strong> de cada tipo y sus valores permitidos</li>
<li><strong>Convención de identificadores</strong> y numeración</li>
<li><strong>Herramienta</strong> de gestión y su configuración</li>
<li>Política de <strong>trazabilidad</strong>: qué se traza con qué</li>
</ul>
</div>
<div>
<h3 id="y-sobre-todo">Y sobre todo</h3>
<ul>
<li>El <strong>proceso de control de cambios</strong>:
<ul>
<li>Quién puede <strong>proponer</strong> un cambio</li>
<li>Quién lo <strong>evalúa</strong> y quién lo <strong>aprueba</strong></li>
<li>Cómo se mide el <strong>impacto</strong></li>
<li>Cómo se <strong>comunica</strong> a quienes lo necesitan</li>
</ul>
</li>
<li>Los <strong>roles y responsabilidades</strong></li>
<li>Los <strong>hitos de validación</strong> en el cronograma</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Sin este plan, cada persona numera y prioriza a su manera, y la trazabilidad se vuelve <strong>imposible</strong> a los tres meses</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="peticiones-de-los-afectados">Peticiones de los afectados</h2>
<ul>
<li>Registro <strong>textual</strong> de lo que cada persona interesada pidió, <strong>antes</strong> de interpretarlo</li>
</ul>
<steps>
<step>
<div class="grid">
<div>
<h3 id="%F0%9F%93%A5-qu%C3%A9-es"><img class="emoji" draggable="false" alt="📥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4e5.svg" data-marp-twemoji=""/> Qué es</h3>
<p>La lista <strong>cruda</strong> de solicitudes: de entrevistas, correos, tiquetes de soporte, actas de reuniones</p>
</div>
<div>
<h3 id="%F0%9F%8E%AF-para-qu%C3%A9-sirve"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> Para qué sirve</h3>
<p>Permite <strong>rastrear</strong> cada característica hasta la persona que la pidió y <strong>cuándo</strong></p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-qu%C3%A9-no-es"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Qué no es</h3>
<p><strong>No</strong> es la Visión. La Visión es el resultado de <strong>analizar</strong> y <strong>consolidar</strong> estas peticiones</p>
</div>
</div>
</step>
<step>
<h3 id="el-flujo-completo">El flujo completo</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Paso</th>
<th style="text-align:left">Artefacto</th>
<th style="text-align:left">Qué ocurre</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">1</td>
<td style="text-align:left"><strong>Peticiones de los afectados</strong></td>
<td style="text-align:left">Se registra lo que se pidió, tal cual, con su origen</td>
</tr>
<tr>
<td style="text-align:left">2</td>
<td style="text-align:left"><em>Análisis</em></td>
<td style="text-align:left">Se depuran duplicados, se detectan conflictos, se agrupan</td>
</tr>
<tr>
<td style="text-align:left">3</td>
<td style="text-align:left"><strong>Visión</strong></td>
<td style="text-align:left">Se consolidan en <strong>necesidades (STR)</strong> y <strong>características (FEA)</strong> priorizadas</td>
</tr>
<tr>
<td style="text-align:left">4</td>
<td style="text-align:left"><strong>Casos de uso</strong> y <strong>Suplementarias</strong></td>
<td style="text-align:left">Se detallan en requerimientos verificables</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🧵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9f5.svg" data-marp-twemoji=""/> Cada paso mantiene un <strong>vínculo hacia atrás</strong> → eso es trazabilidad</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Cuando alguien reclame «yo pedí eso y no está», la respuesta sale de este artefacto: se pidió, se analizó y <strong>se decidió</strong> postergarlo... o efectivamente se perdió</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="los-prototipos-como-medio-de-validaci%C3%B3n">Los prototipos como medio de validación</h2>
<ul>
<li>Un prototipo convierte una especificación <strong>abstracta</strong> en algo <strong>criticable</strong></li>
</ul>
<steps>
<step>
<h3 id="por-qu%C3%A9-funciona-1">Por qué funciona</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%91%80-lo-abstracto-no-se-valida"><img class="emoji" draggable="false" alt="👀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f440.svg" data-marp-twemoji=""/> Lo abstracto no se valida</h3>
<p>Nadie detecta un hueco leyendo 40 páginas; <strong>todo el mundo</strong> lo detecta usando una pantalla</p>
</div>
<div>
<h3 id="%F0%9F%92%AC-cambia-la-conversaci%C3%B3n"><img class="emoji" draggable="false" alt="💬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4ac.svg" data-marp-twemoji=""/> Cambia la conversación</h3>
<p>De <em>«¿está completo el documento?»</em> a <em>«esto no es lo que necesito, falta X»</em></p>
</div>
<div>
<h3 id="%F0%9F%92%B0-falla-barato"><img class="emoji" draggable="false" alt="💰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4b0.svg" data-marp-twemoji=""/> Falla barato</h3>
<p>Es mucho más barato desechar un prototipo que <strong>rehacer</strong> un sistema construido</p>
</div>
</div>
</step>
<step>
<h3 id="tipos-de-prototipo">Tipos de prototipo</h3>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%97%91%EF%B8%8F-desechable-throwaway"><img class="emoji" draggable="false" alt="🗑️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5d1.svg" data-marp-twemoji=""/> Desechable (<em>throwaway</em>)</h3>
<p>Se construye <strong>rápido y sucio</strong> solo para responder una pregunta, y luego <strong>se bota</strong></p>
<ul>
<li>Ideal para validar <strong>requerimientos</strong></li>
<li>No se cuida la calidad interna</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8C%B1-evolutivo"><img class="emoji" draggable="false" alt="🌱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f331.svg" data-marp-twemoji=""/> Evolutivo</h3>
<p>Se construye con <strong>calidad</strong> y se va refinando hasta convertirse en el producto</p>
<ul>
<li>Ideal cuando los requerimientos se <strong>descubren</strong> al usar</li>
<li>Requiere disciplina de diseño desde el inicio</li>
</ul>
</div>
</split-slide>
<div class="grid">
<div>
<h3 id="%F0%9F%93%90-horizontal"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4d0.svg" data-marp-twemoji=""/> Horizontal</h3>
<p>Muchas pantallas, <strong>poca</strong> profundidad → valida el <strong>flujo</strong> y el alcance</p>
</div>
<div>
<h3 id="%F0%9F%93%8F-vertical"><img class="emoji" draggable="false" alt="📏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cf.svg" data-marp-twemoji=""/> Vertical</h3>
<p>Una función <strong>completa</strong> de punta a punta → valida la <strong>factibilidad técnica</strong></p>
</div>
</div>
</step>
<step>
<h3 id="el-riesgo-que-hay-que-gestionar">El riesgo que hay que gestionar</h3>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> El peligro central: que el cliente crea que el prototipo <strong>ya es el sistema</strong></li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%9A%A9-s%C3%ADntomas"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Síntomas</h3>
<ul>
<li><em>«Si ya se ve así, ¿por qué faltan 6 meses?»</em></li>
<li>Presión para <strong>entregar el prototipo</strong> como producto</li>
<li>El prototipo desechable <strong>se queda</strong> en producción, sin pruebas ni arquitectura</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-mitigaciones"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6e1.svg" data-marp-twemoji=""/> Mitigaciones</h3>
<ul>
<li>Usar estética deliberadamente <strong>de boceto</strong> al inicio</li>
<li><strong>Decir explícitamente</strong> qué es y qué no es, en cada sesión</li>
<li>Definir <strong>desde el plan</strong> si es desechable o evolutivo</li>
<li>Usar <strong>datos de ejemplo</strong> obviamente falsos</li>
</ul>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Un prototipo es una <strong>pregunta</strong>, no una promesa. Que quede escrito <strong>qué pregunta</strong> responde</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="actividad-4-dise%C3%B1a-un-prototipo-de-validaci%C3%B3n">Actividad 4: diseña un prototipo de validación</h2>
<ul>
<li>Tomen la característica <em>«validación de choques de horario en línea»</em></li>
</ul>
<div class="grid">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-%C2%BFqu%C3%A9-pregunta-responde"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> ¿Qué pregunta responde?</h3>
<p>Escriban la <strong>pregunta concreta</strong> que el prototipo debe resolver. Una sola</p>
</div>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-%C2%BFqu%C3%A9-tipo"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> ¿Qué tipo?</h3>
<p>¿Desechable o evolutivo? ¿Horizontal o vertical? <strong>Justifiquen</strong></p>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-%C2%BFc%C3%B3mo-lo-presentan"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/33-20e3.svg" data-marp-twemoji=""/> ¿Cómo lo presentan?</h3>
<p>¿Pasivo, activo o interactivo? ¿A <strong>quién</strong> se lo muestran y qué les van a <strong>preguntar</strong>?</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/23f1.svg" data-marp-twemoji=""/> 15 minutos</li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> ¿Qué harían si, al mostrarlo, la contraparte pide <strong>entregarlo tal cual</strong> la próxima semana?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-marpit-scope-BWHQZ1TW="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="48" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="83">
<h1 id="modelado-de-casos-de-uso">Modelado de casos de uso</h1>
<h2 id="contenidos-5">Contenidos</h2>
<ul>
<li>Actores y su identificación</li>
<li>Casos de uso y su diagrama</li>
<li>Especificación de casos de uso</li>
<li>Errores comunes</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="de-requerimientos-a-casos-de-uso">De requerimientos a casos de uso</h2>
<ul>
<li>El punto de partida es la <strong>lista de requerimientos funcionales</strong></li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Código</th>
<th style="text-align:left">Requerimiento</th>
<th style="text-align:left">Caso de uso</th>
<th style="text-align:left">Actor</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>RF1</strong></td>
<td style="text-align:left">El sistema debe permitir al Encargado de vuelos mantener datos de las unidades</td>
<td style="text-align:left">Mantener datos de unidades <em>(Añadir, Modificar, Eliminar)</em></td>
<td style="text-align:left">Encargado de vuelos</td>
</tr>
<tr>
<td style="text-align:left"><strong>RF2</strong></td>
<td style="text-align:left">El sistema debe permitir registrar los vuelos de carga</td>
<td style="text-align:left">Registrar vuelos de carga</td>
<td style="text-align:left">Encargado de vuelos</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Ejemplo: Sistema de Transportes Aéreos</p>
</blockquote>
<ul>
<li><img class="emoji" draggable="false" alt="🧵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9f5.svg" data-marp-twemoji=""/> Esta tabla <strong>es</strong> trazabilidad: conecta el requerimiento con el caso de uso que lo realiza</li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> Fíjate en RF1: tres operaciones (añadir, modificar, eliminar) forman <strong>un solo</strong> caso de uso. ¿Por qué? → <spoiler>porque el objetivo del actor es «mantener los datos», no «hacer clic en Añadir»</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="%C2%BFqu%C3%A9-es-el-modelo-de-casos-de-uso">¿Qué es el modelo de casos de uso?</h2>
<ul>
<li>Es un modelo que describe los <strong>requerimientos funcionales</strong> del sistema en forma de <strong>casos de uso</strong></li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%91-actor"><img class="emoji" draggable="false" alt="🧑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9d1.svg" data-marp-twemoji=""/> Actor</h3>
<p>El <strong>rol</strong> externo que interactúa con el sistema</p>
</div>
<div>
<h3 id="%F0%9F%A5%9A-caso-de-uso"><img class="emoji" draggable="false" alt="🥚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f95a.svg" data-marp-twemoji=""/> Caso de uso</h3>
<p>Una <strong>pieza de funcionalidad</strong> con valor para el actor</p>
</div>
<div>
<h3 id="%F0%9F%93%84-descripci%C3%B3n-de-casos-de-uso"><img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c4.svg" data-marp-twemoji=""/> Descripción de casos de uso</h3>
<p>La <strong>especificación</strong> textual de cada uno</p>
</div>
<div>
<h3 id="%F0%9F%93%8A-diagrama-de-casos-de-uso"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4ca.svg" data-marp-twemoji=""/> Diagrama de casos de uso</h3>
<p>La <strong>vista gráfica</strong> de actores, casos de uso y relaciones</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Los cuatro son necesarios: el <strong>diagrama solo</strong> no especifica nada. Es un índice, no la especificación</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="%C2%BFqu%C3%A9-es-un-actor">¿Qué es un actor?</h2>
<ul>
<li>Un actor es un <strong>rol</strong> que desempeña <strong>una persona</strong> o <strong>una cosa</strong> que es <strong>externa</strong> al sistema de software</li>
<li>Interactúa con el sistema para <strong>alcanzar un objetivo de negocio</strong></li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%94%91-es-un-rol-no-una-persona"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f511.svg" data-marp-twemoji=""/> Es un ROL, no una persona</h3>
<ul>
<li>Una <strong>misma persona</strong> puede desempeñar varios roles</li>
<li>Un <strong>mismo rol</strong> puede ser desempeñado por muchas personas</li>
<li>Por eso se nombra <em>«Encargado de vuelos»</em> y no <em>«doña Marta»</em></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%9A%A7-los-actores-definen-la-frontera"><img class="emoji" draggable="false" alt="🚧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6a7.svg" data-marp-twemoji=""/> Los actores definen la frontera</h3>
<ul>
<li>Todo lo que es <strong>actor</strong> está <strong>fuera</strong> del sistema</li>
<li>Identificar actores <strong>es</strong> decidir el alcance</li>
<li>Es la misma idea del <strong>diagrama de contexto</strong>, ahora en UML</li>
</ul>
</div>
</split-slide>
<blockquote>
<p>Unhelkar (2018)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="los-actores-definen-la-frontera">Los actores definen la frontera</h2>
<p><a href="../assets/ads-cu-frontera.png"><img src="../assets/ads-cu-frontera.png" alt="" style="height:340px;" /></a></p>
<ul>
<li>Arriba, el <strong>Agente de viajes</strong> usa el sistema y el <strong>Pasajero</strong> no → solo el agente es actor</li>
<li>Abajo, el pasajero interactúa <strong>directamente</strong> con el sistema → ahora sí es actor</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> El <strong>mismo</strong> sistema, dos fronteras distintas. Cambiar quién es actor <strong>cambia el alcance del proyecto</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="%C2%BFqu%C3%A9-puede-ser-un-actor">¿Qué puede ser un actor?</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%91%A4-un-rol-de-una-persona"><img class="emoji" draggable="false" alt="👤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f464.svg" data-marp-twemoji=""/> Un ROL de una persona</h3>
<p>Que <strong>usa</strong> el sistema</p>
</div>
<div>
<h3 id="%F0%9F%8E%AC-un-rol-que-inicia"><img class="emoji" draggable="false" alt="🎬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3ac.svg" data-marp-twemoji=""/> Un ROL que inicia</h3>
<p>Una interacción, aunque no opere el sistema</p>
</div>
<div>
<h3 id="%E2%8F%B0-el-tiempo"><img class="emoji" draggable="false" alt="⏰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/23f0.svg" data-marp-twemoji=""/> El TIEMPO</h3>
<p>Porque los eventos que activa <strong>inician</strong> una interacción o un proceso</p>
</div>
<div>
<h3 id="%F0%9F%96%A5%EF%B8%8F-un-sistema-externo"><img class="emoji" draggable="false" alt="🖥️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5a5.svg" data-marp-twemoji=""/> Un SISTEMA EXTERNO</h3>
<p>Que interactúa con el sistema en desarrollo</p>
<p><em>Ej.: una base de datos pública o un servicio</em></p>
</div>
<div>
<h3 id="%F0%9F%96%A8%EF%B8%8F-un-dispositivo-externo"><img class="emoji" draggable="false" alt="🖨️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5a8.svg" data-marp-twemoji=""/> Un DISPOSITIVO EXTERNO</h3>
<p>Que interactúa con el sistema en desarrollo</p>
<p><em>Ej.: una impresora o un lector de tarjetas</em></p>
</div>
<div>
<h3 id="%E2%9A%A0%EF%B8%8F-ojo"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Ojo</h3>
<p>La paciente <strong>no interactúa</strong>, pero su presencia <strong>invoca acciones</strong> → puede ser actor indirecto</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> El actor <strong>Tiempo</strong> es el más olvidado: los procesos nocturnos, los cierres mensuales y los recordatorios <strong>también</strong> son casos de uso</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="54" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="identificaci%C3%B3n-de-actores">Identificación de actores</h2>
<ul>
<li>Es una de las actividades <strong>más importantes</strong> durante el análisis del dominio del problema</li>
<li>Usualmente se recurre al involucramiento de las <strong>personas usuarias</strong> para que colaboren con la identificación</li>
</ul>
<steps>
<step>
<h3 id="las-cinco-preguntas">Las cinco preguntas</h3>
<ul>
<li>¿Quiénes serán las personas usuarias <strong>principales y secundarias</strong> del sistema?</li>
<li>¿Quiénes serán los principales <strong>beneficiarios</strong> de las interacciones con el sistema?</li>
<li>¿Quiénes serán los principales <strong>iniciadores</strong> de interacciones con el sistema?</li>
<li>¿Con qué <strong>sistemas y dispositivos externos</strong> deberá interactuar el sistema en desarrollo?</li>
<li>¿Existe un proceso basado en el <strong>tiempo</strong> en el sistema?</li>
</ul>
</step>
<step>
<h3 id="ejemplo-actores-de-un-sistema-de-gesti%C3%B3n-hospitalaria">Ejemplo: actores de un sistema de gestión hospitalaria</h3>
<p><a href="../assets/ads-cu-actores-hospital.png"><img src="../assets/ads-cu-actores-hospital.png" alt="" style="height:330px;" /></a></p>
<ul>
<li>Fíjate en los <strong>cuatro grupos</strong> separados por las líneas: pacientes, personal, <strong>sistemas externos</strong> y <strong>dispositivos</strong></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="clasificaci%C3%B3n-de-actores">Clasificación de actores</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="directos-vs-indirectos">Directos vs. indirectos</h3>
<ul>
<li><strong>Directos / primarios</strong>: <strong>usan</strong> el sistema
<ul>
<li><em>Ej.:</em> la persona cajera del banco</li>
</ul>
</li>
<li><strong>Indirectos / secundarios</strong>: son <strong>generadores de interacciones</strong> pero no usan el sistema
<ul>
<li><em>Ej.:</em> la persona clienta del banco</li>
</ul>
</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Los indirectos se documentan porque sus <strong>necesidades</strong> determinan el caso de uso, aunque no toquen el teclado</li>
</ul>
</div>
<div>
<h3 id="abstractos-vs-concretos">Abstractos vs. concretos</h3>
<ul>
<li><strong>Abstractos</strong>: permiten la <strong>generalización</strong> de un comportamiento común del sistema</li>
<li><strong>Concretos</strong>: modelan el comportamiento <strong>específico</strong></li>
</ul>
<br />
<ul>
<li>La generalización de actores se dibuja con la flecha de <strong>herencia</strong></li>
<li>Sirve para no repetir las mismas asociaciones en cada rol especializado</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="generalizaci%C3%B3n-de-actores">Generalización de actores</h2>
<p><a href="../assets/ads-cu-actores-generalizacion.png"><img src="../assets/ads-cu-actores-generalizacion.png" alt="" style="height:400px;" /></a></p>
<ul>
<li><em>Patient</em> y <em>Staff</em> (en cursiva) son <strong>abstractos</strong>; los de abajo son <strong>concretos</strong></li>
<li>Todo lo que puede hacer <em>Staff</em>, lo pueden hacer <em>Doctor</em>, <em>Nurse</em> y <em>Administrator</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="%C2%BFqu%C3%A9-es-un-caso-de-uso">¿Qué es un caso de uso?</h2>
<ul>
<li>Los casos de uso <strong>documentan</strong> las <strong>interacciones</strong> de un <strong>actor</strong> con el <strong>sistema</strong></li>
</ul>
<steps>
<step>
<div class="grid">
<div>
<h3 id="%F0%9F%92%8E-resultado-de-valor"><img class="emoji" draggable="false" alt="💎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f48e.svg" data-marp-twemoji=""/> Resultado de valor</h3>
<p>Estas interacciones deben producir un <strong>resultado de valor observable</strong> para el actor</p>
</div>
<div>
<h3 id="%F0%9F%AA%9C-serie-de-pasos"><img class="emoji" draggable="false" alt="🪜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1fa9c.svg" data-marp-twemoji=""/> Serie de pasos</h3>
<p>Documentan una <strong>secuencia</strong> de pasos, no una función suelta</p>
</div>
<div>
<h3 id="%F0%9F%8E%AF-el-qu%C3%A9-no-el-c%C3%B3mo"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> El qué, no el cómo</h3>
<p>Especifican <strong>lo que hace</strong> el sistema, pero <strong>no cómo</strong> lo hace</p>
</div>
</div>
<ul>
<li>Se representan de <strong>dos formas complementarias</strong>:
<ul>
<li><strong>Diagramas UML</strong> → la vista de conjunto</li>
<li><strong>Texto</strong> → las interacciones detalladas del actor y el sistema</li>
</ul>
</li>
</ul>
<blockquote>
<p>Unhelkar (2018)</p>
</blockquote>
</step>
<step>
<h3 id="la-prueba-del-%C2%ABresultado-de-valor%C2%BB">La prueba del «resultado de valor»</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Candidato</th>
<th style="text-align:left">¿Es caso de uso?</th>
<th style="text-align:left">Por qué</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><em>Iniciar sesión</em></td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Discutible</td>
<td style="text-align:left">Es un medio, no un fin. Suele ser una <strong>precondición</strong></td>
</tr>
<tr>
<td style="text-align:left"><em>Buscar cliente</em></td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> No</td>
<td style="text-align:left">Nadie termina su día satisfecho por haber buscado</td>
</tr>
<tr>
<td style="text-align:left"><em>Gestionar cliente</em></td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Sí</td>
<td style="text-align:left">El actor logra su objetivo: los datos quedan al día</td>
</tr>
<tr>
<td style="text-align:left"><em>Hacer clic en Guardar</em></td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> No</td>
<td style="text-align:left">Es un <strong>paso</strong> dentro de un flujo</td>
</tr>
<tr>
<td style="text-align:left"><em>Registrar matrícula</em></td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Sí</td>
<td style="text-align:left">Produce un resultado observable y valioso</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Prueba práctica: si el actor puede <strong>irse a la casa satisfecho</strong> después de hacerlo, es un caso de uso</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="notaci%C3%B3n-del-diagrama-de-casos-de-uso">Notación del diagrama de casos de uso</h2>
<split-slide style="--left: 45%; --right: 55%;">
<p><a href="../assets/ads-cu-notacion.png"><img src="../assets/ads-cu-notacion.png" alt="" style="height:420px;" /></a></p>
<div>
<ul>
<li>El <strong>diagrama de casos de uso</strong> muestra los actores, los casos de uso y las <strong>relaciones</strong> entre ellos</li>
</ul>
<br />
<table>
<thead>
<tr>
<th style="text-align:left">Elemento</th>
<th style="text-align:left">Significado</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Muñeco</td>
<td style="text-align:left"><strong>Actor</strong></td>
</tr>
<tr>
<td style="text-align:left">Elipse</td>
<td style="text-align:left"><strong>Caso de uso</strong></td>
</tr>
<tr>
<td style="text-align:left">Línea</td>
<td style="text-align:left"><strong>Asociación</strong> actor–caso de uso</td>
</tr>
<tr>
<td style="text-align:left">Rectángulo</td>
<td style="text-align:left"><strong>Frontera</strong> del sistema</td>
</tr>
<tr>
<td style="text-align:left">Nota</td>
<td style="text-align:left">Aclaración adjunta</td>
</tr>
</tbody>
</table>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> La <strong>asociación</strong> solo indica que se comunican: <strong>no</strong> indica dirección del flujo de datos ni orden temporal</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="relaciones-entre-casos-de-uso">Relaciones entre casos de uso</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%94%81-inclusi%C3%B3n--include"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f501.svg" data-marp-twemoji=""/> Inclusión — <code>&lt;&lt;include&gt;&gt;</code></h3>
<p>Comportamiento documentado dentro de un CU que <strong>puede ser reutilizado</strong>: se factoriza y se muestra como otro CU</p>
<p>→ Es <strong>obligatorio</strong>: siempre ocurre</p>
</div>
<div>
<h3 id="%E2%9E%95-extensi%C3%B3n--extend"><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2795.svg" data-marp-twemoji=""/> Extensión — <code>&lt;&lt;extend&gt;&gt;</code></h3>
<p>El CU <strong>extiende o especializa</strong> el comportamiento de otro CU</p>
<p>→ Es <strong>opcional</strong>: ocurre bajo cierta condición</p>
</div>
<div>
<h3 id="%F0%9F%A7%AC-herencia"><img class="emoji" draggable="false" alt="🧬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ec.svg" data-marp-twemoji=""/> Herencia</h3>
<p>Un CU <strong>implementa el comportamiento</strong> descrito por otro CU</p>
<p>→ Especialización, como en clases</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Truco para no confundirlas:
<ul>
<li><code>&lt;&lt;include&gt;&gt;</code> → <em>«para hacer A, <strong>siempre</strong> hay que hacer B»</em></li>
<li><code>&lt;&lt;extend&gt;&gt;</code> → <em>«a veces, además de A, ocurre B»</em></li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> La flecha apunta en <strong>direcciones opuestas</strong>: en <em>include</em> del base al incluido; en <em>extend</em> del extensor al base</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="ejemplo-consulta-de-pacientes">Ejemplo: consulta de pacientes</h2>
<p><a href="../assets/ads-cu-diagrama-pacientes.png"><img src="../assets/ads-cu-diagrama-pacientes.png" alt="" style="height:400px;" /></a></p>
<ul>
<li>Obsérvese que <strong>paciente</strong> y <strong>doctor</strong> interactúan con <em>UC32</em>: un caso de uso puede tener <strong>varios actores</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="ejemplo-contabilidad">Ejemplo: contabilidad</h2>
<p><a href="../assets/ads-cu-diagrama-contabilidad.png"><img src="../assets/ads-cu-diagrama-contabilidad.png" alt="" style="height:390px;" /></a></p>
<ul>
<li><em>PrivatePatient</em> tiene <strong>las mismas tareas</strong> que <em>Patient</em> y una adicional → generalización de actores</li>
<li>Tres formas de pagar la factura, todas <code>&lt;&lt;extend&gt;&gt;</code> de <em>UC50-PaysBill</em>: son <strong>opcionales y excluyentes</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="especificaci%C3%B3n-de-casos-de-uso-formato-b%C3%A1sico">Especificación de casos de uso: formato básico</h2>
<split-slide style="--left: 42%; --right: 58%;">
<div>
<h3 id="la-plantilla">La plantilla</h3>
<ul>
<li><strong>Caso de uso:</strong></li>
<li><strong>Actor:</strong></li>
<li><strong>Precondición:</strong></li>
<li><strong>Poscondición:</strong></li>
<li><strong>Flujo de eventos básico</strong>
<ul>
<li>
<ol>
<li>…</li>
</ol>
</li>
<li>
<ol start="2">
<li>…</li>
</ol>
</li>
</ul>
</li>
<li><strong>Flujos de eventos alternativos</strong></li>
</ul>
</div>
<div>
<h3 id="qu%C3%A9-va-en-cada-campo">Qué va en cada campo</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Campo</th>
<th style="text-align:left">Contenido</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Caso de uso</strong></td>
<td style="text-align:left">El nombre del caso de uso</td>
</tr>
<tr>
<td style="text-align:left"><strong>Actor</strong></td>
<td style="text-align:left">El nombre del actor</td>
</tr>
<tr>
<td style="text-align:left"><strong>Precondición</strong></td>
<td style="text-align:left">Condición que debe ser <strong>verdadera para iniciar</strong> el caso de uso. Se definen <strong>relativas al sistema</strong>, no a su entorno</td>
</tr>
<tr>
<td style="text-align:left"><strong>Poscondición</strong></td>
<td style="text-align:left">Condición que debe cumplirse para indicar que el caso de uso <strong>terminó con éxito</strong></td>
</tr>
</tbody>
</table>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="flujo-b%C3%A1sico-y-flujos-alternativos">Flujo básico y flujos alternativos</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%E2%9E%A1%EF%B8%8F-flujo-de-eventos-b%C3%A1sico"><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/27a1.svg" data-marp-twemoji=""/> Flujo de eventos básico</h3>
<ul>
<li><strong>Secuencia de eventos</strong> que describen qué hace el actor y qué hace el sistema para cumplir un objetivo</li>
<li>También se conoce como <strong>flujo normal</strong>, pues <strong>no</strong> incluye variaciones ni desviaciones</li>
</ul>
</div>
<div>
<h3 id="%E2%86%AA%EF%B8%8F-flujos-de-eventos-alternativos"><img class="emoji" draggable="false" alt="↪️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/21aa.svg" data-marp-twemoji=""/> Flujos de eventos alternativos</h3>
<ul>
<li>Diversas secuencias que reflejan las <strong>diferentes situaciones</strong> que provocan una desviación del flujo básico</li>
<li>Provocadas por condiciones <strong>anormales, extremas, ocasionales, de error</strong> o de <strong>violación de reglas del negocio</strong></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Se escriben <strong>alternando</strong>: un paso del actor, un paso del sistema. Nunca dos del mismo lado seguidos sin razón</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Si el flujo básico tiene un <code>si...</code> en medio, eso <strong>no</strong> es flujo básico: es un <strong>alternativo</strong> que hay que sacar</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="64" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="ejemplo-%C2%ABregistrar-notas%C2%BB">Ejemplo: «Registrar notas»</h2>
<steps>
<step>
<h3 id="encabezado">Encabezado</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Campo</th>
<th style="text-align:left">Contenido</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Caso de uso</strong></td>
<td style="text-align:left">Registrar notas</td>
</tr>
<tr>
<td style="text-align:left"><strong>Actor</strong></td>
<td style="text-align:left">Profesor</td>
</tr>
<tr>
<td style="text-align:left"><strong>Precondición</strong></td>
<td style="text-align:left">El usuario ha sido aceptado en el sistema con el rol de profesor</td>
</tr>
<tr>
<td style="text-align:left"><strong>Poscondición</strong></td>
<td style="text-align:left">Se han registrado en el sistema las notas de los alumnos asignados al profesor</td>
</tr>
</tbody>
</table>
<ul>
<li>Fíjate: la precondición está escrita <strong>relativa al sistema</strong> (<em>«ha sido aceptado en el sistema»</em>), no al entorno (<em>«el profesor llegó a la oficina»</em>)</li>
</ul>
</step>
<step>
<h3 id="flujo-b%C3%A1sico">Flujo básico</h3>
<ol>
<li>El caso de uso comienza cuando el profesor indica <strong>«Registrar notas»</strong></li>
<li>El <strong>sistema</strong> muestra los cursos asignados al profesor</li>
<li>El <strong>profesor</strong> selecciona el curso</li>
<li>El <strong>sistema</strong> muestra un listado de los estudiantes con sus notas</li>
<li>El <strong>profesor</strong> selecciona el estudiante e ingresa la nota de práctica, del parcial, del examen final y la nota final. Se repite para cada estudiante</li>
<li>El <strong>profesor</strong> indica <strong>«guardar»</strong></li>
<li>El <strong>sistema</strong> valida toda la información, muestra un mensaje de confirmación y el caso de uso finaliza</li>
</ol>
</step>
<step>
<h3 id="flujos-alternativos">Flujos alternativos</h3>
<ul>
<li>En el <strong>paso 2</strong>, si el profesor <strong>no tiene curso asignado</strong>, el sistema muestra un mensaje y el caso de uso finaliza</li>
<li>En el <strong>paso 4</strong>, si el sistema determina que el <strong>curso está cerrado</strong>, muestra un mensaje y el caso de uso finaliza</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> ¿Qué otros alternativos faltan? → <spoiler>nota fuera de rango, pérdida de conexión al guardar, la suma de porcentajes no cuadra, el profesor cancela</spoiler></li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Cada alternativo indica <strong>en qué paso</strong> se desvía y <strong>cómo</strong> termina: así queda claro dónde engancha</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="65" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="plantilla-completa-ejemplo-%C2%ABacceso-a-la-aplicaci%C3%B3n%C2%BB">Plantilla completa: ejemplo «Acceso a la aplicación»</h2>
<split-slide style="--left: 38%; --right: 62%;">
<p><a href="../assets/ads-cu-plantilla-acceso.png"><img src="../assets/ads-cu-plantilla-acceso.png" alt="" style="height:480px;" /></a></p>
<div>
<ul>
<li>Una plantilla real agrega campos de <strong>administración</strong> al formato básico:</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Campo</th>
<th style="text-align:left">Para qué</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Versión</strong></td>
<td style="text-align:left">Control de cambios</td>
</tr>
<tr>
<td style="text-align:left"><strong>Autores</strong></td>
<td style="text-align:left">Responsabilidad</td>
</tr>
<tr>
<td style="text-align:left"><strong>Objetivos asociados</strong></td>
<td style="text-align:left">Traza hacia el <strong>negocio</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Requisitos asociados</strong></td>
<td style="text-align:left">Traza hacia los <strong>requerimientos</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Importancia</strong> / <strong>Urgencia</strong></td>
<td style="text-align:left"><strong>Atributos</strong> para priorizar</td>
</tr>
<tr>
<td style="text-align:left"><strong>Comentarios</strong></td>
<td style="text-align:left">Supuestos y pendientes</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🧵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9f5.svg" data-marp-twemoji=""/> <em>Objetivos</em> y <em>Requisitos asociados</em> son <strong>trazabilidad pura</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="66" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="plantilla-con-reglas-de-negocio-%C2%ABregistrar-pr%C3%A9stamo%C2%BB">Plantilla con reglas de negocio: «Registrar préstamo»</h2>
<split-slide style="--left: 36%; --right: 64%;">
<p><a href="../assets/ads-cu-plantilla-prestamo.png"><img src="../assets/ads-cu-plantilla-prestamo.png" alt="" style="height:480px;" /></a></p>
<div>
<ul>
<li>
<p>Observa el campo <strong>Dependencias</strong>: el caso de uso <strong>referencia</strong> las reglas de negocio en lugar de copiarlas</p>
<ul>
<li><code>RG-001</code> Gestionar los préstamos de los libros</li>
<li><code>RN-008</code> Número máximo de préstamos simultáneos</li>
<li><code>RN-010</code> Fecha de devolución de un préstamo</li>
</ul>
</li>
<li>
<p>En el paso <strong>9</strong> aparece una <strong>inclusión</strong>: <em>«Se realiza el caso de uso Añadir elemento multimedia al préstamo»</em></p>
</li>
<li>
<p>Los <strong>alternativos</strong> se numeran ligados a su paso: <strong>E.1</strong>, <strong>E.2</strong> en el paso 3</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> El comentario final dice que el máximo <strong>puede cambiar</strong>: por eso es una <strong>regla</strong>, no un número enterrado en el flujo</p>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="67" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="otro-formato-dos-columnas">Otro formato: dos columnas</h2>
<split-slide style="--left: 52%; --right: 48%;">
<p><a href="../assets/ads-cu-formato-dos-columnas.png"><img src="../assets/ads-cu-formato-dos-columnas.png" alt="" style="height:400px;" /></a></p>
<div>
<ul>
<li>Separa explícitamente <strong>acciones del actor</strong> y <strong>respuestas del sistema</strong></li>
</ul>
<br />
<h3 id="%E2%9C%85-ventaja"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Ventaja</h3>
<p>Hace <strong>imposible</strong> olvidar de quién es cada paso, y evidencia los pasos donde el sistema <strong>no responde nada</strong></p>
<h3 id="%E2%9A%A0%EF%B8%8F-desventaja"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Desventaja</h3>
<p>Ocupa más espacio y es más difícil de mantener en documentos largos</p>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Elige <strong>un</strong> formato y úsalo en todo el proyecto: eso lo define el <strong>plan de administración de requerimientos</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="68" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="errores-comunes-identificaci%C3%B3n-de-actores">Errores comunes: identificación de actores</h2>
<split-slide style="--left: 50%; --right: 50%;">
<p><a href="../assets/ads-cu-error-actor.png"><img src="../assets/ads-cu-error-actor.png" alt="" style="height:330px;" /></a></p>
<div>
<ul>
<li>En algunos casos se incluyen actores que <strong>realmente no lo son</strong></li>
<li>En un sistema de pedidos, se considera al <strong>cliente</strong> como actor</li>
<li>Pero quien <strong>ingresa</strong> los pedidos en el sistema es el <strong>vendedor</strong> → el vendedor es el actor</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> La pregunta correcta no es <em>«¿a quién le importa?»</em> sino <em>«¿quién <strong>interactúa</strong> con el sistema?»</em></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> El cliente sigue siendo relevante: es un actor <strong>indirecto</strong>, y se documenta como tal</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="69" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="errores-comunes-identificaci%C3%B3n-de-casos-de-uso">Errores comunes: identificación de casos de uso</h2>
<split-slide style="--left: 55%; --right: 45%;">
<p><a href="../assets/ads-cu-error-menu.png"><img src="../assets/ads-cu-error-menu.png" alt="" style="height:340px;" /></a></p>
<div>
<ul>
<li>Error muy extendido: considerar las <strong>opciones del menú</strong> o las <strong>funciones</strong> del sistema como casos de uso</li>
<li>Los casos de uso deben mostrar <strong>lo que la persona usuaria necesita</strong>, no las opciones que se lo permitirán</li>
</ul>
<br />
<ul>
<li><em>Agregar</em>, <em>modificar</em> y <em>eliminar</em> cliente son <strong>opciones de menú</strong></li>
<li>Lo que a la persona usuaria le importa es <strong>actualizar la información de clientes</strong></li>
<li>→ un solo caso de uso: <strong>«Gestionar cliente»</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="70" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="errores-comunes-especificaci%C3%B3n">Errores comunes: especificación</h2>
<ul>
<li>La técnica de casos de uso se usa para la <strong>especificación de requisitos</strong>, <strong>no</strong> para el diseño del sistema</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%9A%AB-componentes-de-ventana"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Componentes de ventana</h3>
<p>Introducir palabras como <strong>botones, listas desplegables, opciones de menú</strong></p>
<p>Debe incluirse <strong>qué información</strong> será ingresada o mostrada, pero <strong>no con qué componente</strong> → eso es diseño de pantallas</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-dise%C3%B1o-de-datos-y-algoritmos"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Diseño de datos y algoritmos</h3>
<p>Mencionar elementos del <strong>diseño de base de datos o de algoritmos</strong></p>
<p><em>«Grabar en la tabla clientes»</em> u <em>«ordenar con el algoritmo de burbuja»</em> <strong>no</strong> deben aparecer: se determinan en la etapa de <strong>diseño</strong></p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Prueba rápida: si al cambiar de tecnología (web → móvil, SQL → NoSQL) tuvieras que <strong>reescribir</strong> el caso de uso, es que colaste diseño</li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> ¿Y si el cliente <strong>exige</strong> una tecnología? → <spoiler>es una restricción de diseño: va en las especificaciones suplementarias</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="71" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="errores-comunes-relaciones-1-de-2">Errores comunes: relaciones (1 de 2)</h2>
<split-slide style="--left: 55%; --right: 45%;">
<p><a href="../assets/ads-cu-error-include-niveles.png"><img src="../assets/ads-cu-error-include-niveles.png" alt="" style="width:640px;" /></a></p>
<div>
<ul>
<li>Los errores al incluir relaciones se deben principalmente a <strong>confundir los casos de uso con los procesos</strong> de un diagrama de flujo de datos (DFD)</li>
<li>Aquí <em>Ingresar datos</em> → <em>Verificar datos</em> → <em>Guardar datos</em> es una <strong>descomposición funcional</strong>, no casos de uso</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="📏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cf.svg" data-marp-twemoji=""/> Recomendación: <strong>no más de dos niveles</strong> de relaciones <code>&lt;&lt;include&gt;&gt;</code> o <code>&lt;&lt;extend&gt;&gt;</code> en un diagrama</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="72" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="errores-comunes-relaciones-2-de-2">Errores comunes: relaciones (2 de 2)</h2>
<split-slide style="--left: 55%; --right: 45%;">
<p><a href="../assets/ads-cu-error-include-unico.png"><img src="../assets/ads-cu-error-include-unico.png" alt="" style="width:620px;" /></a></p>
<div>
<ul>
<li>Otro error frecuente: crear un caso de uso que es <strong>incluido por un solo</strong> caso de uso</li>
<li><em>Buscar cliente</em> solo es incluido por <em>Gestionar clientes</em></li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Si solo lo usa uno, <strong>no hay reutilización</strong> que justifique separarlo</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Debería ser simplemente un <strong>paso</strong> dentro del flujo de <em>Gestionar clientes</em></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Regla práctica: factoriza con <code>&lt;&lt;include&gt;&gt;</code> solo cuando <strong>dos o más</strong> casos de uso comparten el comportamiento</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="73" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="actividad-5-modela-y-especifica">Actividad 5: modela y especifica</h2>
<ul>
<li>Sistema de <strong>préstamo de equipo</strong> de laboratorio. En equipos:</li>
</ul>
<div class="grid">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-actores"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Actores</h3>
<p>Identifíquenlos con las <strong>5 preguntas</strong>. Incluyan al menos un <strong>sistema externo</strong> y consideren el actor <strong>Tiempo</strong></p>
</div>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-diagrama"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Diagrama</h3>
<p>Dibujen el diagrama de casos de uso con la frontera. Usen <code>&lt;&lt;include&gt;&gt;</code> <strong>solo</strong> si se justifica</p>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-especificaci%C3%B3n"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Especificación</h3>
<p>Especifiquen <strong>un</strong> caso de uso completo: precondición, poscondición, flujo básico y <strong>al menos 3</strong> alternativos</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/23f1.svg" data-marp-twemoji=""/> 30 minutos</li>
<li><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50d.svg" data-marp-twemoji=""/> <strong>Revisión cruzada</strong> con otro equipo, buscando los errores que acabamos de ver:
<ul>
<li>¿Hay actores que no interactúan? ¿Casos de uso que son opciones de menú?</li>
<li>¿Se coló <strong>diseño</strong> en la especificación? ¿Hay <code>&lt;&lt;include&gt;&gt;</code> usados una sola vez?</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-marpit-scope-tNDnkqIX="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="74" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="83">
<h1 id="validaci%C3%B3n-y-trazabilidad">Validación y trazabilidad</h1>
<h2 id="contenidos-6">Contenidos</h2>
<ul>
<li>Validación de requerimientos</li>
<li>Técnicas y lista de verificación</li>
<li>Trazabilidad y su matriz</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="75" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="validaci%C3%B3n-de-requerimientos">Validación de requerimientos</h2>
<ul>
<li><strong>Verificación</strong> y <strong>validación</strong> no son lo mismo:</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%94%8D-verificaci%C3%B3n"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50d.svg" data-marp-twemoji=""/> Verificación</h3>
<p><em>¿Estamos construyendo el producto <strong>correctamente</strong>?</em></p>
<p>¿El documento es consistente, completo y cumple los estándares?</p>
</div>
<div>
<h3 id="%F0%9F%8E%AF-validaci%C3%B3n"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> Validación</h3>
<p><em>¿Estamos construyendo el <strong>producto correcto</strong>?</em></p>
<p>¿Esto es realmente lo que el negocio necesita?</p>
</div>
</div>
<ul>
<li>
<p>Objetivos de la validación:</p>
<ul>
<li>Asegurar que quien hace ingeniería <strong>entendió</strong> lo que se necesita</li>
<li>Verificar que el documento es <strong>entendible, consistente y completo</strong></li>
<li>Verificar que cumple con los <strong>estándares</strong> de la organización</li>
<li>Incluir en el <strong>cronograma</strong> los puntos donde se valida</li>
</ul>
</li>
<li>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Un documento puede pasar la verificación <strong>perfectamente</strong> y estar validando el sistema equivocado</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="76" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="t%C3%A9cnicas-de-validaci%C3%B3n">Técnicas de validación</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%91%A5-revisiones-e-inspecciones"><img class="emoji" draggable="false" alt="👥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f465.svg" data-marp-twemoji=""/> Revisiones e inspecciones</h3>
<p>Lectura <strong>estructurada</strong> por un grupo, con roles y lista de verificación</p>
<p>La más efectiva para encontrar defectos por unidad de esfuerzo</p>
</div>
<div>
<h3 id="%F0%9F%9A%B6-recorridos-walkthroughs"><img class="emoji" draggable="false" alt="🚶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6b6.svg" data-marp-twemoji=""/> Recorridos (<em>walkthroughs</em>)</h3>
<p>Quien escribió el documento lo <strong>recorre</strong> con la audiencia, paso a paso</p>
<p>Menos formal, útil para alinear comprensión</p>
</div>
<div>
<h3 id="%F0%9F%A7%AA-prototipos"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Prototipos</h3>
<p>Se valida <strong>usando</strong>, no leyendo</p>
<p>Especialmente potente para requerimientos de interfaz y flujo</p>
</div>
<div>
<h3 id="%F0%9F%93%8B-dise%C3%B1o-de-casos-de-prueba"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Diseño de casos de prueba</h3>
<p>Escribir la prueba <strong>antes</strong> de construir</p>
<p>Si no puedes escribirla, el requerimiento <strong>no es verificable</strong></p>
</div>
<div>
<h3 id="%E2%9C%85-listas-de-verificaci%C3%B3n"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Listas de verificación</h3>
<p>Preguntas sistemáticas aplicadas a <strong>cada</strong> requerimiento</p>
</div>
<div>
<h3 id="%F0%9F%A4%96-an%C3%A1lisis-automatizado"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f916.svg" data-marp-twemoji=""/> Análisis automatizado</h3>
<p>Consistencia, terminología y <strong>completitud</strong> de modelos con herramientas</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> La técnica del <strong>caso de prueba</strong> es la más barata y la que más defectos revela: obliga a hacer preciso lo vago</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="77" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="lista-de-verificaci%C3%B3n">Lista de verificación</h2>
<ul>
<li>Aplicable a <strong>cada</strong> requerimiento, derivada de las características de calidad:</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Pregunta</th>
<th style="text-align:left">Verifica</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">¿Se entiende de una sola forma?</td>
<td style="text-align:left"><strong>No ambigüedad</strong></td>
</tr>
<tr>
<td style="text-align:left">¿Puedo escribir un caso de prueba para esto?</td>
<td style="text-align:left"><strong>Verificable</strong></td>
</tr>
<tr>
<td style="text-align:left">¿Tiene un número, umbral o criterio de aceptación?</td>
<td style="text-align:left"><strong>Cuantificable</strong></td>
</tr>
<tr>
<td style="text-align:left">¿Sé quién lo pidió y por qué?</td>
<td style="text-align:left"><strong>Necesario</strong> · Origen</td>
</tr>
<tr>
<td style="text-align:left">¿Se puede construir con los recursos y el plazo?</td>
<td style="text-align:left"><strong>Factible</strong></td>
</tr>
<tr>
<td style="text-align:left">¿Contradice a otro requerimiento?</td>
<td style="text-align:left"><strong>Consistente</strong></td>
</tr>
<tr>
<td style="text-align:left">¿Describe <em>qué</em>, sin decir <em>cómo</em>?</td>
<td style="text-align:left"><strong>Correcto</strong> (sin diseño colado)</td>
</tr>
<tr>
<td style="text-align:left">¿Tiene prioridad asignada?</td>
<td style="text-align:left"><strong>Priorizado</strong></td>
</tr>
<tr>
<td style="text-align:left">¿Está trazado hacia una necesidad y hacia un caso de uso?</td>
<td style="text-align:left"><strong>Trazable</strong></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> ¿Y la <strong>completitud</strong> del conjunto? Esa no se verifica requerimiento por requerimiento: se verifica preguntando <spoiler>¿toda necesidad de la Visión está cubierta por al menos un caso de uso?</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="78" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="trazabilidad">Trazabilidad</h2>
<ul>
<li>Capacidad de seguir la <strong>vida de un requerimiento</strong> hacia adelante y hacia atrás, a través de todos los artefactos</li>
</ul>
<steps>
<step>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%E2%AC%85%EF%B8%8F-hacia-atr%C3%A1s-backward"><img class="emoji" draggable="false" alt="⬅️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2b05.svg" data-marp-twemoji=""/> Hacia atrás (<em>backward</em>)</h3>
<p>Del requerimiento <strong>hacia su origen</strong></p>
<ul>
<li>¿Quién lo pidió?</li>
<li>¿De qué necesidad de negocio nace?</li>
<li>¿Qué regla o normativa lo justifica?</li>
</ul>
<blockquote>
<p>Responde: <em>«¿por qué estamos construyendo esto?»</em></p>
</blockquote>
</div>
<div>
<h3 id="%E2%9E%A1%EF%B8%8F-hacia-adelante-forward"><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/27a1.svg" data-marp-twemoji=""/> Hacia adelante (<em>forward</em>)</h3>
<p>Del requerimiento <strong>hacia su realización</strong></p>
<ul>
<li>¿Qué caso de uso lo realiza?</li>
<li>¿Qué componentes lo implementan?</li>
<li>¿Qué pruebas lo verifican?</li>
</ul>
<blockquote>
<p>Responde: <em>«si cambia, ¿qué se rompe?»</em></p>
</blockquote>
</div>
</split-slide>
</step>
<step>
<h3 id="la-cadena-completa">La cadena completa</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Origen</th>
<th style="text-align:left">→</th>
<th style="text-align:left">Intermedio</th>
<th style="text-align:left">→</th>
<th style="text-align:left">Realización</th>
<th style="text-align:left">→</th>
<th style="text-align:left">Verificación</th>
</tr>
</thead>

<li><img class="emoji" draggable="false" alt="🧵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9f5.svg" data-marp-twemoji=""/> Cada flecha se puede recorrer en <strong>ambas direcciones</strong></li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Es exactamente la <strong>trazabilidad</strong> entre niveles de abstracción del primer mazo del curso</li>

</step>

</ul>

</tr>

<h3 id="%F0%9F%95%B3%EF%B8%8F-fila-vac%C3%ADa"><img class="emoji" draggable="false" alt="🕳️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f573.svg" data-marp-twemoji=""/> Fila vacía</h3>

<h3 id="%F0%9F%8E%AF-su-verdadero-valor"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> Su verdadero valor</h3>

<h2 id="trazabilidad-an%C3%A1lisis-de-impacto">Trazabilidad: análisis de impacto</h2>
<ul>
<li>El uso más práctico: cuando llega un <strong>cambio</strong>, saber qué toca</li>
</ul>
<steps>
<step>
<h3 id="el-escenario">El escenario</h3>
<blockquote>
<p><em>«La Vicerrectoría cambió la regla: ahora el máximo son 20 créditos, no 18.»</em></p>
</blockquote>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%9A%AB-sin-trazabilidad"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Sin trazabilidad</h3>
<ul>
<li>Alguien <strong>recuerda</strong> dónde estaba el número</li>
<li>Se cambia en un lugar y se olvida en otros dos</li>
<li>Las <strong>pruebas</strong> siguen validando 18</li>
<li>El error aparece en producción, en la semana de matrícula</li>
</ul>
</div>
<div>
<h3 id="%E2%9C%85-con-trazabilidad"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Con trazabilidad</h3>
<ul>
<li>Se busca la regla <strong>RN-004</strong></li>
<li>La matriz muestra: <strong>2 casos de uso</strong>, <strong>1 componente</strong>, <strong>3 casos de prueba</strong></li>
<li>Se estima el impacto <strong>antes</strong> de aceptar el cambio</li>
<li>Se actualiza todo y se <strong>verifica</strong> la cobertura</li>
</ul>
</div>
</split-slide>
</step>
<step>
<h3 id="el-costo-de-mantenerla">El costo de mantenerla</h3>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> La trazabilidad <strong>no es gratis</strong>: mantenerla cuesta esfuerzo real y continuo</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%93%89-trazar-de-menos"><img class="emoji" draggable="false" alt="📉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c9.svg" data-marp-twemoji=""/> Trazar de menos</h3>
<p>Se pierde el análisis de impacto, justo cuando más se necesita</p>
</div>
<div>
<h3 id="%F0%9F%93%88-trazar-de-m%C3%A1s"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c8.svg" data-marp-twemoji=""/> Trazar de más</h3>
<p>La matriz se vuelve tan grande que <strong>nadie la actualiza</strong> → deja de ser confiable, que es peor que no tenerla</p>
</div>
<div>
<h3 id="%E2%9A%96%EF%B8%8F-el-equilibrio"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2696.svg" data-marp-twemoji=""/> El equilibrio</h3>
<p>Se decide en el <strong>plan de administración de requerimientos</strong>: qué se traza con qué, y <strong>nada más</strong></p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Criterio útil: traza lo que necesitarías para responder <em>«¿qué se rompe si esto cambia?»</em> y <em>«¿por qué existe esto?»</em></li>
</ul>
</step>
</steps>
</section>

<p>Su cliente cambia una regla de negocio. Usando la matriz, digan <strong>exactamente</strong> qué artefactos hay que revisar</p>

<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> Preguntas de cierre:

</ul>
</li>
