<h3 id="el-problema-de-fondo">El problema de fondo</h3>
<ul>
<li>Los requerimientos precisan <strong>comunicación</strong> entre personas desarrolladoras, clientes y usuarias</li>
<li>Los errores se descubren <strong>tarde</strong> y son <strong>caros</strong> de corregir a posteriori</li>
</ul>
</step>
<step>
<h3 id="c%C3%B3mo-se-manifiesta">Cómo se manifiesta</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%95%B3%EF%B8%8F-falta-de-funcionalidad"><img class="emoji" draggable="false" alt="🕳️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f573.svg" data-marp-twemoji=""/> Falta de funcionalidad</h3>
<p>El sistema no hace algo que el negocio necesitaba</p>
</div>
<div>
<h3 id="%F0%9F%8E%AF-funcionalidad-mal-especificada"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> Funcionalidad mal especificada</h3>
<p>Lo hace, pero no como se necesitaba</p>
</div>
<div>
<h3 id="%F0%9F%98%B5-interfaces-confusas-o-in%C3%BAtiles"><img class="emoji" draggable="false" alt="😵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f635.svg" data-marp-twemoji=""/> Interfaces confusas o inútiles</h3>
<p>Existe, pero nadie logra usarlo</p>
</div>
<div>
<h3 id="%F0%9F%97%91%EF%B8%8F-funcionalidad-obsoleta"><img class="emoji" draggable="false" alt="🗑️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5d1.svg" data-marp-twemoji=""/> Funcionalidad obsoleta</h3>
<p>Se construyó algo que ya nadie necesita</p>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="%C2%BFd%C3%B3nde-se-originan-los-defectos">¿Dónde se originan los defectos?</h2>
<split-slide style="--left: 55%; --right: 45%;">
<p><a href="../assets/ads-ir-costo-defectos.png"><img src="../assets/ads-ir-costo-defectos.png" alt="" style="height:400px;" /></a></p>
<div>
<ul>
<li>El <strong>76 %</strong> de los defectos se origina en los <strong>requerimientos</strong></li>
<li>Solo el <strong>1 %</strong> proviene de errores de codificación</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> Si la mayor parte del esfuerzo del equipo se va en <strong>programar</strong>, ¿por qué la mayor parte de los defectos nace <strong>antes</strong> de programar?</li>
</ul>
</div>
</split-slide>
<blockquote>
<p>El costo de corregir un defecto crece de forma acelerada con la fase en que se detecta: lo que cuesta <strong>1</strong> en requerimientos puede costar <strong>100</strong> en producción</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="el-espacio-del-problema-y-el-de-la-soluci%C3%B3n">El espacio del problema y el de la solución</h2>
<split-slide style="--left: 45%; --right: 55%;">
<p><a href="../assets/ads-ir-espacios.png"><img src="../assets/ads-ir-espacios.png" alt="" style="height:400px;" /></a></p>
<div>
<ul>
<li>La <strong>separación</strong> entre ambos espacios es crucial en la ingeniería</li>
<li>La ingeniería de sistemas físicos establece una <strong>clara separación</strong> entre ambos... la de software, muchas veces no</li>
</ul>
<br />
<ul>
<li><strong>Espacio del problema</strong> → formulación y análisis del problema</li>
<li><strong>Espacio de la solución</strong> → búsqueda, selección, diseño e implementación</li>
</ul>
<blockquote>
<p>Jensen &amp; Tonies (1979)</p>
</blockquote>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Saltar al espacio de la solución sin haber cerrado el del problema es el error más caro de todos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="la-pir%C3%A1mide-de-los-requerimientos">La pirámide de los requerimientos</h2>
<split-slide style="--left: 48%; --right: 52%;">
<p><a href="../assets/ads-ir-piramide.png"><img src="../assets/ads-ir-piramide.png" alt="" style="height:390px;" /></a></p>
<div>
<ul>
<li><strong>Necesidades</strong> (<em>needs</em>) → dominio del <strong>problema</strong></li>
<li><strong>Características</strong> (<em>features</em>) → puente entre ambos</li>
<li><strong>Requisitos de software</strong> → dominio de la <strong>solución</strong></li>
</ul>
<br />
<table>
<thead>
<tr>
<th style="text-align:left">Actividad</th>
<th style="text-align:left">Produce</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Modelado de negocio</td>
<td style="text-align:left">Necesidades</td>
</tr>
<tr>
<td style="text-align:left">Ingeniería de requisitos</td>
<td style="text-align:left">Características y requisitos</td>
</tr>
<tr>
<td style="text-align:left">Diseño</td>
<td style="text-align:left">Solución y documentación</td>
</tr>
</tbody>
</table>
</div>
</split-slide>
<ul>
<li>Los <strong>procedimientos de prueba</strong> se derivan de los requisitos → por eso la trazabilidad importa</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="niveles-de-requerimiento">Niveles de requerimiento</h2>
<ul>
<li>Los requisitos se pueden definir a distintos <strong>niveles de abstracción o detalle</strong></li>
</ul>
<steps>
<step>
<div class="grid">
<div>
<h3 id="%F0%9F%91%A4-de-usuario-needs"><img class="emoji" draggable="false" alt="👤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f464.svg" data-marp-twemoji=""/> De usuario (<em>needs</em>)</h3>
<p>Declaraciones en <strong>lenguaje natural</strong> —y quizás tablas y diagramas— de los servicios que el sistema provee y sus <strong>restricciones operacionales</strong></p>
</div>
<div>
<h3 id="%F0%9F%96%A5%EF%B8%8F-de-sistema-features"><img class="emoji" draggable="false" alt="🖥️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5a5.svg" data-marp-twemoji=""/> De sistema (<em>features</em>)</h3>
<p>Documento <strong>estructurado</strong> con las descripciones detalladas de funciones, servicios y restricciones</p>
<p>Son la <strong>base del diseño</strong>: definen lo que deberá ser implementado</p>
<p>Puede ser parte de un <strong>contrato</strong> con el cliente</p>
</div>
<div>
<h3 id="%F0%9F%92%BE-de-software"><img class="emoji" draggable="false" alt="💾" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4be.svg" data-marp-twemoji=""/> De software</h3>
<p>Declaraciones <strong>detalladas</strong> de diseño e implementación del software</p>
</div>
</div>
</step>
<step>
<h3 id="los-mismos-tres-niveles-un-solo-ejemplo">Los mismos tres niveles, un solo ejemplo</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Nivel</th>
<th style="text-align:left">Enunciado</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>De usuario</strong></td>
<td style="text-align:left">El software debe proveer un medio de representar y acceder a los ficheros externos creados por otras herramientas</td>
</tr>
<tr>
<td style="text-align:left"><strong>De sistema</strong></td>
<td style="text-align:left">La persona usuaria debe poder elegir el tipo de fichero externo <br /> Cada tipo de fichero externo debe poder tener asociada una herramienta externa para editarlo y mostrarlo <br /> Cada tipo de fichero externo tiene un icono asociado</td>
</tr>
<tr>
<td style="text-align:left"><strong>De software</strong></td>
<td style="text-align:left">Los iconos de los tipos de fichero se guardan en archivos JPG</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Fíjate cómo el <strong>mismo requerimiento</strong> se vuelve más concreto —y más atado a la tecnología— al bajar de nivel</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="%C2%BFqu%C3%A9-es-un-requerimiento">¿Qué es un requerimiento?</h2>
<ul>
<li>Según el estándar IEEE, un requerimiento es:</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%93%8B-definici%C3%B3n-1"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Definición 1</h3>
<p>Una <strong>condición o capacidad</strong> que debe ser reunida por un sistema o componente de un sistema para <strong>satisfacer un contrato, estándar</strong>, etc.</p>
</div>
<div>
<h3 id="%F0%9F%8E%AF-definici%C3%B3n-2"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> Definición 2</h3>
<p>Una <strong>condición o capacidad</strong> necesitada por una persona usuaria para <strong>resolver un problema</strong> o cumplir un objetivo</p>
</div>
</div>
<ul>
<li>La primera mira al <strong>cumplimiento formal</strong>; la segunda, al <strong>valor real</strong></li>
<li>Un buen requerimiento satisface <strong>las dos</strong>: es verificable <em>y</em> le sirve a alguien</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="la-ingenier%C3%ADa-de-requerimientos">La ingeniería de requerimientos</h2>
<split-slide style="--left: 52%; --right: 48%;">
<p><a href="../assets/ads-ir-proceso.png"><img src="../assets/ads-ir-proceso.png" alt="" style="height:300px;" /></a></p>
<div>
<ul>
<li>Se divide en dos grandes bloques:</li>
</ul>
<h3 id="%F0%9F%94%A8-desarrollo-de-requerimientos"><img class="emoji" draggable="false" alt="🔨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f528.svg" data-marp-twemoji=""/> Desarrollo de requerimientos</h3>
<p>Elicitación → Análisis → Especificación → <strong>Validación</strong></p>
<p><em>Produce</em> los requerimientos</p>
<h3 id="%F0%9F%93%8A-administraci%C3%B3n-de-requerimientos"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4ca.svg" data-marp-twemoji=""/> Administración de requerimientos</h3>
<p>Corre <strong>en paralelo</strong> durante todo el proyecto</p>
<p><em>Cuida</em> los requerimientos a lo largo del tiempo</p>
</div>
</split-slide>
<ul>
<li>Un proyecto puede hacer excelente <strong>desarrollo</strong> de requerimientos y aun así fracasar por mala <strong>administración</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="desarrollo-elicitaci%C3%B3n">Desarrollo: Elicitación</h2>
<steps>
<step>
<ul>
<li><strong>Definir y entender el problema</strong>: de dónde vienen los requerimientos y cómo obtenerlos</li>
<li>Es un problema de <strong>comunicación</strong> entre las personas usuarias y quienes hacen ingeniería</li>
<li>Quien analiza actúa como <strong>mediador</strong>: traduce en ambas direcciones</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Elicitar <strong>no</strong> es «preguntarle al cliente qué quiere y anotarlo». Las personas usuarias saben su <strong>problema</strong>, no necesariamente la <strong>solución</strong></li>
</ul>
</step>
<step>
<h3 id="fuentes-y-t%C3%A9cnicas">Fuentes y técnicas</h3>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%94%8E-fuentes-de-requerimientos"><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50e.svg" data-marp-twemoji=""/> Fuentes de requerimientos</h3>
<ul>
<li>Objetivos del negocio</li>
<li>Dominio de la aplicación</li>
<li>Personas interesadas (<em>stakeholders</em>)</li>
<li>Ambiente organizacional</li>
<li>Ambiente operacional</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%9B%A0%EF%B8%8F-t%C3%A9cnicas"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Técnicas</h3>
<ul>
<li>Entrevistas</li>
<li>Escenarios</li>
<li>Prototipos</li>
<li>Lluvia de ideas</li>
<li>Observación</li>
</ul>
</div>
</split-slide>
<ul>
<li>Las veremos a fondo en la sección de <strong>guías de apoyo</strong></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="desarrollo-an%C3%A1lisis">Desarrollo: Análisis</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="qu%C3%A9-se-hace">Qué se hace</h3>
<ul>
<li>Entender <strong>cómo el software debe interactuar</strong> con su ambiente</li>
<li><strong>Clasificar</strong> los requerimientos</li>
<li><strong>Detectar conflictos</strong> entre requerimientos</li>
<li>Escribir requerimientos suficientemente <strong>precisos</strong></li>
</ul>
</div>
<div>
<h3 id="d%C3%B3nde-aparecen-los-conflictos">Dónde aparecen los conflictos</h3>
<ul>
<li>Entre <strong>características mutuamente incompatibles</strong></li>
<li>Entre las distintas <strong>personas interesadas</strong></li>
<li>Entre <strong>requerimientos y recursos</strong> disponibles</li>
<li>Entre requerimientos <strong>funcionales y no funcionales</strong></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Un conflicto detectado en análisis se <strong>negocia</strong>; el mismo conflicto detectado en construcción se <strong>paga</strong></li>
<li>Ejemplo clásico: <em>máxima seguridad</em> vs. <em>máxima facilidad de uso</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="desarrollo-especificaci%C3%B3n">Desarrollo: Especificación</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="caracter%C3%ADsticas">Características</h3>
<ul>
<li>Frecuentemente en <strong>lenguaje natural</strong></li>
<li>Se complementa con lenguaje <strong>formal o semiformal</strong> (modelos, UML, tablas de decisión)</li>
<li>Debe ser <strong>entendible para el cliente</strong> → si no lo entiende, no lo puede validar</li>
<li>Se apoya en <strong>tipos de documentos</strong> (plantillas)</li>
</ul>
</div>
<div>
<h3 id="la-tensi%C3%B3n-permanente">La tensión permanente</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Más informal</th>
<th style="text-align:left">Más formal</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Fácil de leer</td>
<td style="text-align:left">Difícil de leer</td>
</tr>
<tr>
<td style="text-align:left">Ambiguo</td>
<td style="text-align:left">Preciso</td>
</tr>
<tr>
<td style="text-align:left">Rápido de escribir</td>
<td style="text-align:left">Costoso de escribir</td>
</tr>
<tr>
<td style="text-align:left">Difícil de verificar</td>
<td style="text-align:left">Verificable</td>
</tr>
</tbody>
</table>
<ul>
<li>La respuesta práctica: <strong>lenguaje natural disciplinado</strong> + modelos donde la precisión importa</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="desarrollo-validaci%C3%B3n">Desarrollo: Validación</h2>
<ul>
<li><strong>Verificar</strong> que lo escrito es lo correcto, <strong>antes</strong> de construir</li>
</ul>
<div class="grid">
<div>
<h3 id="%E2%9C%85-asegurar-la-comprensi%C3%B3n"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Asegurar la comprensión</h3>
<p>Que la persona que hace ingeniería <strong>entendió</strong> lo que el negocio necesita</p>
</div>
<div>
<h3 id="%F0%9F%93%8F-verificar-est%C3%A1ndares"><img class="emoji" draggable="false" alt="📏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cf.svg" data-marp-twemoji=""/> Verificar estándares</h3>
<p>Que el documento cumple con los <strong>estándares</strong> de la organización</p>
</div>
<div>
<h3 id="%F0%9F%94%8D-verificar-la-calidad"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50d.svg" data-marp-twemoji=""/> Verificar la calidad</h3>
<p>Que el documento es <strong>entendible, consistente y completo</strong></p>
</div>
<div>
<h3 id="%F0%9F%93%85-planificarla"><img class="emoji" draggable="false" alt="📅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c5.svg" data-marp-twemoji=""/> Planificarla</h3>
<p>En el <strong>cronograma</strong> se incluyen puntos donde se valida el documento</p>
</div>
</div>
<ul>
<li>Volveremos a esto en detalle en la sección de <strong>validación y trazabilidad</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="administraci%C3%B3n-de-requerimientos">Administración de requerimientos</h2>
<ul>
<li>Los requerimientos <strong>cambian</strong>. Administrarlos es aceptar ese hecho y controlarlo</li>
</ul>
<steps>
<step>
<div class="grid">
<div>
<h3 id="%F0%9F%94%8E-revisar-y-evaluar-el-impacto"><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50e.svg" data-marp-twemoji=""/> Revisar y evaluar el impacto</h3>
<p>Antes de aceptar un cambio, saber <strong>qué más se rompe</strong></p>
</div>
<div>
<h3 id="%F0%9F%9A%A6-controles-adecuados-de-los-cambios"><img class="emoji" draggable="false" alt="🚦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6a6.svg" data-marp-twemoji=""/> Controles adecuados de los cambios</h3>
<p>Quién los propone, quién los <strong>aprueba</strong>, cómo se comunican</p>
</div>
<div>
<h3 id="%F0%9F%93%85-mantener-actualizado-el-plan"><img class="emoji" draggable="false" alt="📅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c5.svg" data-marp-twemoji=""/> Mantener actualizado el plan</h3>
<p>Un cambio aceptado sin ajustar el plan es una <strong>deuda oculta</strong></p>
</div>
<div>
<h3 id="%F0%9F%A4%9D-negociar-acuerdos"><img class="emoji" draggable="false" alt="🤝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f91d.svg" data-marp-twemoji=""/> Negociar acuerdos</h3>
<p>Basados en los cambios: si entra algo, <strong>sale algo</strong> o se mueve la fecha</p>
</div>
<div>
<h3 id="%F0%9F%A7%B5-trazar-requerimientos"><img class="emoji" draggable="false" alt="🧵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9f5.svg" data-marp-twemoji=""/> Trazar requerimientos</h3>
<p>Hacia los diferentes <strong>entregables</strong></p>
</div>
<div>
<h3 id="%F0%9F%93%88-seguimiento"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c8.svg" data-marp-twemoji=""/> Seguimiento</h3>
<p>Del <strong>estado</strong> y el <strong>cambio</strong> de cada requerimiento</p>
</div>
</div>
</step>
<step>
<h3 id="por-qu%C3%A9-importa">Por qué importa</h3>
<ul>
<li>Sin administración de requerimientos aparecen dos patologías clásicas:</li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%93%88-scope-creep"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c8.svg" data-marp-twemoji=""/> <em>Scope creep</em></h3>
<p>El alcance crece poco a poco, sin que nadie decida que creció</p>
<p>Cada cambio parece pequeño; la suma no lo es</p>
</div>
<div>
<h3 id="%F0%9F%91%BB-requerimientos-hu%C3%A9rfanos"><img class="emoji" draggable="false" alt="👻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f47b.svg" data-marp-twemoji=""/> Requerimientos huérfanos</h3>
<p>Código que nadie sabe por qué existe, y necesidades que nadie sabe si se implementaron</p>
<p>Es exactamente lo que la <strong>trazabilidad</strong> previene</p>
</div>
</split-slide>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="actividad-1-del-s%C3%ADntoma-al-requerimiento">Actividad 1: del síntoma al requerimiento</h2>
<ul>
<li>En grupos, tomen esta queja real de una persona usuaria:</li>
</ul>
<blockquote>
<p>«El sistema de matrícula es un desastre, siempre se cae.»</p>
</blockquote>
<div class="grid">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-clasifiquen"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Clasifiquen</h3>
<p>¿Es una <strong>necesidad</strong>, una <strong>característica</strong> o un <strong>requisito de software</strong>?</p>
</div>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-suban-de-nivel"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Suban de nivel</h3>
<p>¿Cuál es la <strong>necesidad</strong> de negocio detrás de la queja?</p>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-bajen-de-nivel"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Bajen de nivel</h3>
<p>Escriban el mismo requerimiento en los <strong>tres niveles</strong>: usuario, sistema y software</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/23f1.svg" data-marp-twemoji=""/> 15 minutos</li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> Al terminar: ¿en cuál de los tres niveles fue <strong>más difícil</strong> escribirlo? ¿Por qué?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-jSlNkq9y="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="17" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="83">
<h1 id="clasificaci%C3%B3n-y-calidad">Clasificación y calidad</h1>
<h2 id="contenidos-2">Contenidos</h2>
<ul>
<li>FURPS+ y requerimientos funcionales</li>
<li>Requerimientos no funcionales</li>
<li>Reglas de negocio</li>
<li>Características y atributos de un requerimiento</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="clasificaci%C3%B3n-de-requerimientos-furps">Clasificación de requerimientos: FURPS+</h2>
<ul>
<li>Una manera de categorizar los requerimientos está descrita en el modelo <strong>FURPS+</strong></li>
</ul>
<div class="grid">
<div>
<h3 id="f--functionality">F — <em>Functionality</em></h3>
<p><strong>Funcionalidad</strong>: qué hace el sistema</p>
</div>
<div>
<h3 id="u--usability">U — <em>Usability</em></h3>
<p><strong>Capacidad de uso</strong></p>
</div>
<div>
<h3 id="r--reliability">R — <em>Reliability</em></h3>
<p><strong>Fiabilidad</strong></p>
</div>
<div>
<h3 id="p--performance">P — <em>Performance</em></h3>
<p><strong>Desempeño</strong></p>
</div>
<div>
<h3 id="s--supportability">S — <em>Supportability</em></h3>
<p><strong>Capacidad de soporte</strong></p>
</div>
<div>
<h3 id="%E2%9E%95-el-signo-%C2%AB%C2%BB"><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2795.svg" data-marp-twemoji=""/> El signo «+»</h3>
<p>Restricciones de <strong>diseño</strong>, requerimientos de <strong>implementación</strong>, de <strong>interfaz</strong> y <strong>físicos</strong></p>
</div>
</div>
<ul>
<li>La <strong>F</strong> son los requerimientos <strong>funcionales</strong>; <strong>URPS+</strong> son los <strong>no funcionales</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="requerimiento-funcional">Requerimiento funcional</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="definici%C3%B3n">Definición</h3>
<ul>
<li>Describe <strong>qué debe hacer</strong> el sistema respecto a su entorno: las personas usuarias u otros sistemas</li>
<li>Especifica los comportamientos de <strong>entradas y salidas</strong> del sistema</li>
<li>Se captura con los <strong>casos de uso</strong></li>
</ul>
</div>
<div>
<h3 id="ejemplo-sistema-de-gesti%C3%B3n-acad%C3%A9mica">Ejemplo: Sistema de Gestión Académica</h3>
<p><strong>A los profesores</strong>, el sistema permitirá:</p>
<ul>
<li>Consultar los horarios de sus cursos</li>
<li>Consultar la programación de los exámenes</li>
<li>Actualizar y ver su información personal</li>
<li>Registrar y modificar las notas de los estudiantes a su cargo</li>
<li>Cerrar un curso</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> ¿Y para los <strong>estudiantes</strong>? → <spoiler>consultar horarios y exámenes, actualizar su información y consultar notas de un curso</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="requerimiento-no-funcional">Requerimiento no funcional</h2>
<ul>
<li>Describe <strong>atributos del sistema</strong> o del ambiente en donde éste se desarrolla</li>
</ul>
<steps>
<step>
<h3 id="tres-ejemplos-reales">Tres ejemplos reales</h3>
<ul>
<li>La tasa de <strong>disponibilidad</strong> de Gehoweb debe ser de un <strong>99 %</strong></li>
<li>El sistema debe tener una interfaz de uso <strong>intuitiva y sencilla</strong>, complementada con un buen sistema de ayuda (la administración puede recaer en personal con poca experiencia en el uso de aplicaciones informáticas)</li>
<li>El sistema debe disponer de una <strong>documentación fácilmente actualizable</strong> que permita realizar operaciones de mantenimiento con el menor esfuerzo</li>
</ul>
</step>
<step>
<h3 id="%C2%BFcu%C3%A1l-de-los-tres-est%C3%A1-bien-escrito">¿Cuál de los tres está bien escrito?</h3>
<div class="grid">
<div>
<h3 id="%E2%9C%85-el-primero"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> El primero</h3>
<p>«99 %» es <strong>medible</strong>. Se puede probar</p>
</div>
<div>
<h3 id="%E2%9A%A0%EF%B8%8F-el-segundo"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> El segundo</h3>
<p>«Intuitiva y sencilla» es <strong>subjetivo</strong></p>
<p>¿Cómo se prueba? → <em>«una persona sin capacitación completa la matrícula en menos de 5 minutos»</em></p>
</div>
<div>
<h3 id="%E2%9A%A0%EF%B8%8F-el-tercero"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> El tercero</h3>
<p>«Menor esfuerzo» no es verificable</p>
<p>→ <em>«el 90 % de los textos de interfaz se editan sin recompilar»</em></p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Regla: si no le puedes poner un <strong>número</strong> o un <strong>criterio de aceptación</strong>, todavía no es un requerimiento</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="no-funcionales-capacidad-de-uso-y-fiabilidad">No funcionales: capacidad de uso y fiabilidad</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%96%90%EF%B8%8F-capacidad-de-uso-usability"><img class="emoji" draggable="false" alt="🖐️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f590.svg" data-marp-twemoji=""/> Capacidad de uso (<em>Usability</em>)</h3>
<p>Facilidad o nivel de uso del producto: el grado en el que el diseño de un elemento <strong>facilita o dificulta su manejo</strong></p>
<ul>
<li>Factores humanos</li>
<li>Estética</li>
<li>Consistencia de la interfaz</li>
<li>Ayudas en línea</li>
<li>Agentes y asistentes</li>
<li>Documentación y material de entrenamiento</li>
</ul>
<blockquote>
<p><em>Ejemplo:</em> visibilidad del texto a cierta distancia · combinación de colores del texto</p>
</blockquote>
</div>
<div>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-fiabilidad-reliability"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6e1.svg" data-marp-twemoji=""/> Fiabilidad (<em>Reliability</em>)</h3>
<p>Capacidad de un sistema o componente para <strong>ejecutar sus funciones</strong> requeridas bajo condiciones normales en un periodo específico (IEEE)</p>
<ul>
<li>Frecuencia y severidad de los errores</li>
<li>Capacidad de recuperación</li>
<li>Capacidad predictiva</li>
<li>Exactitud</li>
<li>Tiempo promedio entre fallas (<strong>MTBF</strong>)</li>
</ul>
<blockquote>
<p><em>Ejemplo:</em> el sistema estará disponible el 99 % del tiempo</p>
</blockquote>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="no-funcionales-rendimiento-y-soporte">No funcionales: rendimiento y soporte</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%E2%9A%A1-rendimiento-performance"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a1.svg" data-marp-twemoji=""/> Rendimiento (<em>Performance</em>)</h3>
<p>Afectan a los funcionales en la medida de parámetros como:</p>
<ul>
<li>Velocidad</li>
<li>Eficiencia</li>
<li>Disponibilidad</li>
<li>Exactitud</li>
<li>Tiempo de respuesta</li>
</ul>
<blockquote>
<p><em>Ejemplo:</em> el tiempo de respuesta es de 1 segundo</p>
</blockquote>
</div>
<div>
<h3 id="%F0%9F%94%A7-soporte-supportability"><img class="emoji" draggable="false" alt="🔧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f527.svg" data-marp-twemoji=""/> Soporte (<em>Supportability</em>)</h3>
<p>Incluye la capacidad de:</p>
<ul>
<li>Prueba</li>
<li>Extensión</li>
<li>Adaptación</li>
<li>Mantenimiento</li>
<li>Compatibilidad</li>
<li>Configuración</li>
<li>Instalación y localización</li>
</ul>
<blockquote>
<p><em>Ejemplo:</em> inclusión de nuevas reglas en algún punto determinado</p>
</blockquote>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f517.svg" data-marp-twemoji=""/> Estos son los <strong>atributos de calidad</strong> que ya viste en el mazo de <em>Introducción al Análisis y Diseño</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="especificaciones-suplementarias">Especificaciones suplementarias</h2>
<ul>
<li>Es el <strong>artefacto</strong> donde viven los requerimientos que <strong>no</strong> caben en un caso de uso</li>
</ul>
<split-slide style="--left: 52%; --right: 48%;">
<div>
<h3 id="%C2%BFqu%C3%A9-contiene">¿Qué contiene?</h3>
<ul>
<li>Los requerimientos <strong>no funcionales</strong> (URPS+)</li>
<li>Requerimientos funcionales que <strong>no</strong> pertenecen a un caso de uso específico, sino que aplican a <strong>todo</strong> el sistema</li>
<li><strong>Restricciones</strong> de diseño e implementación</li>
<li><strong>Estándares</strong> aplicables y requisitos legales</li>
<li>Interfaces con <strong>hardware</strong> y <strong>software</strong> externo</li>
</ul>
</div>
<div>
<h3 id="%C2%BFpor-qu%C3%A9-separarlo">¿Por qué separarlo?</h3>
<ul>
<li>Un requerimiento como <em>«toda pantalla debe responder en menos de 2 s»</em> aplica a <strong>los 40 casos de uso</strong></li>
<li>Repetirlo 40 veces lo vuelve <strong>imposible de mantener</strong></li>
<li>Se escribe <strong>una vez</strong> aquí y los casos de uso lo <strong>referencian</strong></li>
</ul>
<br />
<blockquote>
<p>Junto con el <strong>Modelo de casos de uso</strong>, forma la <strong>especificación completa</strong> del sistema</p>
</blockquote>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="reglas-de-negocio">Reglas de negocio</h2>
<ul>
<li>Políticas, estándares, prácticas, regulaciones o guías <strong>definidas a nivel de la organización</strong></li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>No</strong> son requerimientos del sistema: <strong>existen aunque el sistema no exista</strong>. El sistema las <em>hace cumplir</em></li>
</ul>
<steps>
<step>
<h3 id="los-cinco-tipos">Los cinco tipos</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%93%8C-hechos-facts"><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cc.svg" data-marp-twemoji=""/> Hechos (<em>facts</em>)</h3>
<p>Enunciados <strong>verdaderos</strong> sobre el negocio</p>
<p><em>«Toda orden tiene un cargo de envío»</em></p>
</div>
<div>
<h3 id="%F0%9F%9A%A7-restricciones-constraints"><img class="emoji" draggable="false" alt="🚧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6a7.svg" data-marp-twemoji=""/> Restricciones (<em>constraints</em>)</h3>
<p><strong>Limitan</strong> lo que el sistema o la persona usuaria puede hacer</p>
<p><em>«Máximo 18 créditos por estudiante»</em></p>
</div>
<div>
<h3 id="%E2%9A%A1-disparadores-action-enablers"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a1.svg" data-marp-twemoji=""/> Disparadores (<em>action enablers</em>)</h3>
<p>Activan una actividad cuando se cumple una condición</p>
<p><em>«Al vencer el plazo, notificar al responsable»</em></p>
</div>
<div>
<h3 id="%F0%9F%94%97-inferencias-inferences"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f517.svg" data-marp-twemoji=""/> Inferencias (<em>inferences</em>)</h3>
<p>Hechos <strong>derivados</strong> de otros hechos, en forma <em>si/entonces</em></p>
<p><em>«Sin pago en 30 días → cuenta morosa»</em></p>
</div>
<div>
<h3 id="%F0%9F%A7%AE-c%C3%A1lculos-computations"><img class="emoji" draggable="false" alt="🧮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ee.svg" data-marp-twemoji=""/> Cálculos (<em>computations</em>)</h3>
<p><strong>Fórmulas</strong> y algoritmos definidos por el negocio</p>
<p><em>«Nota = 40 % prácticas + 60 % exámenes»</em></p>
</div>
<div>
<h3 id="%F0%9F%92%A1-regla-de-oro"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Regla de oro</h3>
<p>Reglas <strong>atómicas</strong>: combinar varias en una sola la vuelve imposible de mantener</p>
</div>
</div>
</step>
<step>
<h3 id="c%C3%B3mo-se-conectan-con-los-requerimientos">Cómo se conectan con los requerimientos</h3>
<table>
<thead>
<tr>
<th style="text-align:left">La regla de negocio...</th>
<th style="text-align:left">Se traduce en...</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Restricción</strong></td>
<td style="text-align:left">Una validación en un caso de uso · Una precondición</td>
</tr>
<tr>
<td style="text-align:left"><strong>Disparador</strong></td>
<td style="text-align:left">Un flujo alternativo o un caso de uso iniciado por el <em>tiempo</em></td>
</tr>
<tr>
<td style="text-align:left"><strong>Inferencia</strong></td>
<td style="text-align:left">Lógica de negocio y estados del modelo de dominio</td>
</tr>
<tr>
<td style="text-align:left"><strong>Cálculo</strong></td>
<td style="text-align:left">Un paso del flujo básico con su fórmula documentada</td>
</tr>
<tr>
<td style="text-align:left"><strong>Hecho</strong></td>
<td style="text-align:left">Una relación o restricción del <strong>modelo de dominio</strong></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🧵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9f5.svg" data-marp-twemoji=""/> Se numeran (<strong>RN-001</strong>, <strong>RG-005</strong>...) y los casos de uso las <strong>referencian</strong> → así, si cambia la política, se sabe <strong>exactamente</strong> qué casos de uso revisar</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Si copias la regla dentro de cada caso de uso, tendrás <strong>N versiones</strong> de la misma política</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="niveles-tipos-y-documentos-de-requisitos">Niveles, tipos y documentos de requisitos</h2>
<p><a href="../assets/ads-ir-niveles-tipos-docs.png"><img src="../assets/ads-ir-niveles-tipos-docs.png" alt="" style="height:420px;" /></a></p>
<ul>
<li>Fíjate en la línea punteada vertical: separa lo <strong>funcional</strong> de lo <strong>no funcional</strong>; las horizontales separan los <strong>niveles</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="caracter%C3%ADsticas-de-un-buen-requerimiento">Características de un buen requerimiento</h2>
<div class="grid">
<div>
<h3 id="%E2%9C%94%EF%B8%8F-completo"><img class="emoji" draggable="false" alt="✔️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2714.svg" data-marp-twemoji=""/> Completo</h3>
<p>Contiene la <strong>información necesaria</strong> para quien desarrolla</p>
</div>
<div>
<h3 id="%F0%9F%8E%AF-correcto"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> Correcto</h3>
<p>Describe la funcionalidad que <strong>se construirá</strong></p>
</div>
<div>
<h3 id="%F0%9F%94%A8-factible"><img class="emoji" draggable="false" alt="🔨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f528.svg" data-marp-twemoji=""/> Factible</h3>
<p>Es posible implementarlo dentro de las <strong>capacidades y limitaciones</strong> conocidas</p>
</div>
<div>
<h3 id="%F0%9F%99%8B-necesario"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f64b.svg" data-marp-twemoji=""/> Necesario</h3>
<p>Es lo que el cliente <strong>realmente</strong> necesita</p>
</div>
<div>
<h3 id="%F0%9F%93%8A-priorizado"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4ca.svg" data-marp-twemoji=""/> Priorizado</h3>
<p>Indica <strong>qué tan esencial</strong> es para esta versión del producto</p>
</div>
<div>
<h3 id="%F0%9F%94%8D-no-ambiguo"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50d.svg" data-marp-twemoji=""/> No ambiguo</h3>
<p>Cada persona que lo lee entiende <strong>lo mismo</strong></p>
</div>
<div>
<h3 id="%F0%9F%A7%AA-verificable"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Verificable</h3>
<p>Se puede comprobar por <strong>inspección o demostración</strong></p>
</div>
<div>
<h3 id="%F0%9F%94%A2-cuantificable"><img class="emoji" draggable="false" alt="🔢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f522.svg" data-marp-twemoji=""/> Cuantificable</h3>
<p>No depende de la <strong>interpretación o el juicio subjetivo</strong></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="aplicando-las-caracter%C3%ADsticas">Aplicando las características</h2>
<ul>
<li>Un mismo requerimiento, reescrito hasta que cumple:</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Versión</th>
<th style="text-align:left">Enunciado</th>
<th style="text-align:left">Problema</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>v1</strong></td>
<td style="text-align:left">El sistema debe ser rápido</td>
<td style="text-align:left">No es cuantificable ni verificable</td>
</tr>
<tr>
<td style="text-align:left"><strong>v2</strong></td>
<td style="text-align:left">El sistema debe responder rápido a las consultas de notas</td>
<td style="text-align:left">Sigue siendo ambiguo: ¿rápido para quién?</td>
</tr>
<tr>
<td style="text-align:left"><strong>v3</strong></td>
<td style="text-align:left">La consulta de notas debe responder en menos de 2 segundos</td>
<td style="text-align:left">Falta: ¿bajo qué carga? ¿siempre?</td>
</tr>
<tr>
<td style="text-align:left"><strong>v4</strong></td>
<td style="text-align:left">La consulta de notas debe responder en <strong>menos de 2 s</strong> para el <strong>95 % de las peticiones</strong>, con hasta <strong>500 usuarios concurrentes</strong></td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Cuantificable, verificable, no ambiguo</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> ¿La <strong>v4</strong> es <em>factible</em>? Eso no lo dice el requerimiento: lo dice el <strong>análisis de factibilidad técnica</strong></li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Truco de validación: si no puedes escribir el <strong>caso de prueba</strong> a partir del requerimiento, todavía no está listo</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="atributos-de-los-requerimientos">Atributos de los requerimientos</h2>
<ul>
<li>Un requerimiento no es solo su <strong>texto</strong>: lleva <strong>metadatos</strong> que permiten administrarlo</li>
</ul>
<steps>
<step>
<table>
<thead>
<tr>
<th style="text-align:left">Atributo</th>
<th style="text-align:left">Para qué sirve</th>
<th style="text-align:left">Valores típicos</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Estado</strong></td>
<td style="text-align:left">Saber en qué punto del ciclo está</td>
<td style="text-align:left">Propuesto · Aprobado · Incorporado · Validado · Rechazado</td>
</tr>
<tr>
<td style="text-align:left"><strong>Prioridad</strong></td>
<td style="text-align:left">Decidir qué entra en cada versión</td>
<td style="text-align:left">Alta · Media · Baja · <em>(o MoSCoW)</em></td>
</tr>
<tr>
<td style="text-align:left"><strong>Beneficio</strong></td>
<td style="text-align:left">Cuánto valor aporta al negocio</td>
<td style="text-align:left">Crítico · Importante · Útil</td>
</tr>
<tr>
<td style="text-align:left"><strong>Esfuerzo</strong></td>
<td style="text-align:left">Cuánto cuesta implementarlo</td>
<td style="text-align:left">Puntos · horas · talla</td>
</tr>
<tr>
<td style="text-align:left"><strong>Riesgo</strong></td>
<td style="text-align:left">Probabilidad de causar problemas</td>
<td style="text-align:left">Alto · Medio · Bajo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Estabilidad</strong></td>
<td style="text-align:left">Qué tan probable es que cambie</td>
<td style="text-align:left">Alta · Media · Baja</td>
</tr>
<tr>
<td style="text-align:left"><strong>Versión objetivo</strong></td>
<td style="text-align:left">En qué entrega se compromete</td>
<td style="text-align:left">1.0 · 1.1 · Futuro</td>
</tr>
<tr>
<td style="text-align:left"><strong>Asignado a</strong></td>
<td style="text-align:left">Quién es responsable</td>
<td style="text-align:left">Persona o equipo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Origen / razón</strong></td>
<td style="text-align:left">De dónde salió y por qué</td>
<td style="text-align:left"><em>Stakeholder</em>, documento, regulación</td>
</tr>
</tbody>
</table>
</step>
<step>
<h3 id="para-qu%C3%A9-sirven-en-la-pr%C3%A1ctica">Para qué sirven en la práctica</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%93%8A-priorizar-con-criterio"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4ca.svg" data-marp-twemoji=""/> Priorizar con criterio</h3>
<p><strong>Beneficio alto + esfuerzo bajo</strong> primero. Sin estos atributos, la priorización es una opinión</p>
</div>
<div>
<h3 id="%E2%9A%A0%EF%B8%8F-anticipar-el-riesgo"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Anticipar el riesgo</h3>
<p>Requerimientos de <strong>estabilidad baja</strong> no deben congelarse temprano: se diseñan para el cambio</p>
</div>
<div>
<h3 id="%F0%9F%94%8E-rastrear-el-origen"><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50e.svg" data-marp-twemoji=""/> Rastrear el origen</h3>
<p>Cuando alguien pregunte «¿por qué hacemos esto?», el atributo <strong>origen</strong> responde</p>
</div>
<div>
<h3 id="%F0%9F%93%88-medir-el-avance"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c8.svg" data-marp-twemoji=""/> Medir el avance</h3>
<p>Contar requerimientos por <strong>estado</strong> dice más del proyecto que contar líneas de código</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Los atributos son lo que convierte una <strong>lista de deseos</strong> en un <strong>conjunto administrable</strong></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="actividad-2-clasifica-y-eval%C3%BAa">Actividad 2: clasifica y evalúa</h2>
<ul>
<li>Para cada enunciado: clasifíquenlo (<strong>funcional / no funcional / regla de negocio</strong>) y evalúen si cumple las características de un buen requerimiento</li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="enunciados">Enunciados</h3>
<ol>
<li>El sistema debe permitir matricular cursos</li>
<li>Un estudiante no puede matricular un curso si no aprobó el requisito</li>
<li>El sistema debe ser seguro</li>
<li>La nota final se calcula como 40 % prácticas y 60 % exámenes</li>
<li>El sistema debe soportar 3000 usuarios concurrentes</li>
<li>Al cerrar el curso, notificar a los estudiantes</li>
</ol>
</div>
<div>
<h3 id="para-cada-uno">Para cada uno</h3>
<ul>
<li>¿Qué <strong>tipo</strong> es?</li>
<li>Si es no funcional, ¿en qué categoría <strong>FURPS+</strong>?</li>
<li>¿Qué <strong>características</strong> incumple?</li>
<li><strong>Reescríbanlo</strong> para que las cumpla</li>
<li>Asígnenle <strong>prioridad</strong>, <strong>riesgo</strong> y <strong>estabilidad</strong></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/23f1.svg" data-marp-twemoji=""/> 20 minutos · <img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> ¿Cuántos de los seis eran en realidad <strong>reglas de negocio</strong> disfrazadas de requerimiento?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-scope-LyMxlDT5="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="30" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="83">
<h1 id="gu%C3%ADas-de-apoyo">Guías de apoyo</h1>
<h2 id="contenidos-3">Contenidos</h2>
<ul>
<li>Entrevistas, cuestionarios y sesiones de trabajo</li>
<li>Lluvia de ideas, storyboarding y roles</li>
<li>Espina de pescado, Pareto y afinidad</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="mapa-de-las-t%C3%A9cnicas">Mapa de las técnicas</h2>
<ul>
<li>No compiten entre sí: cada una sirve para un <strong>momento</strong> distinto</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Quiero...</th>
<th style="text-align:left">Técnica</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Entender en profundidad</strong> a una persona</td>
<td style="text-align:left">Entrevista</td>
</tr>
<tr>
<td style="text-align:left">Llegar a <strong>muchas</strong> personas rápido</td>
<td style="text-align:left">Cuestionario</td>
</tr>
<tr>
<td style="text-align:left"><strong>Decidir en grupo</strong> y resolver conflictos</td>
<td style="text-align:left">Sesión de trabajo (<em>workshop</em>)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Generar</strong> muchas ideas y luego filtrarlas</td>
<td style="text-align:left">Lluvia y reducción de ideas</td>
</tr>
<tr>
<td style="text-align:left">Hacer <strong>tangible</strong> algo que aún no existe</td>
<td style="text-align:left"><em>Storyboarding</em> · Prototipos</td>
</tr>
<tr>
<td style="text-align:left">Entender el trabajo <strong>desde adentro</strong></td>
<td style="text-align:left">Representación de roles · Juego de roles</td>
</tr>
<tr>
<td style="text-align:left">Encontrar la <strong>causa raíz</strong> de un problema</td>
<td style="text-align:left">Diagrama de espina de pescado</td>
</tr>
<tr>
<td style="text-align:left">Saber <strong>qué atacar primero</strong></td>
<td style="text-align:left">Diagrama de Pareto</td>
</tr>
<tr>
<td style="text-align:left"><strong>Organizar</strong> un montón de ideas sueltas</td>
<td style="text-align:left">Diagrama de afinidad</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> En un proyecto real se <strong>combinan</strong>: entrevistas → taller → lluvia de ideas → afinidad → prototipo</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="entrevistas">Entrevistas</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="c%C3%B3mo-se-hace">Cómo se hace</h3>
<ul>
<li><strong>Preparar</strong>: estudiar el dominio y los documentos <strong>antes</strong></li>
<li>Combinar preguntas <strong>abiertas</strong> (exploran) y <strong>cerradas</strong> (confirman)</li>
<li>Empezar por lo <strong>general</strong> y bajar al detalle (<em>embudo</em>)</li>
<li><strong>Registrar</strong> y enviar el resumen para confirmación</li>
</ul>
</div>
<div>
<h3 id="la-%C2%ABentrevista-libre-de-contexto%C2%BB">La «entrevista libre de contexto»</h3>
<p>Preguntas que evitan sesgar hacia una solución:</p>
<ul>
<li>¿<strong>Quién</strong> es la persona usuaria? ¿Quién es el cliente?</li>
<li>¿Cuál es el <strong>problema</strong> de fondo?</li>
<li>¿Cuáles son las <strong>causas</strong> de ese problema?</li>
<li>¿Cómo lo resuelve <strong>hoy</strong>?</li>
<li>¿Cómo sabría que el problema <strong>se resolvió</strong>?</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>Ventaja</strong>: profundidad, permite repreguntar y leer el lenguaje no verbal</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>Riesgo</strong>: costosa en tiempo; la persona describe lo que <strong>cree</strong> que hace, no siempre lo que hace</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="cuestionarios">Cuestionarios</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="cu%C3%A1ndo-usarlo">Cuándo usarlo</h3>
<ul>
<li>Hay <strong>muchas</strong> personas usuarias y poco tiempo</li>
<li>Están <strong>dispersas</strong> geográficamente</li>
<li>Se quiere <strong>cuantificar</strong> algo que ya se conoce cualitativamente</li>
<li>Se necesita <strong>evidencia</strong> para respaldar una decisión</li>
</ul>
</div>
<div>
<h3 id="buenas-pr%C3%A1cticas">Buenas prácticas</h3>
<ul>
<li><strong>Pilotear</strong> el cuestionario con 3-5 personas antes</li>
<li>Preguntas <strong>cortas</strong> y una sola idea por pregunta</li>
<li>Escalas <strong>consistentes</strong> (p. ej. Likert 1-5)</li>
<li>Evitar preguntas que <strong>sugieren</strong> la respuesta</li>
<li>Decir cuánto <strong>tiempo</strong> toma y para qué se usará</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>Ventaja</strong>: alcance y datos comparables</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>Riesgo</strong>: no permite repreguntar; baja tasa de respuesta; <strong>no descubre</strong> lo que no preguntaste</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Úsalo <strong>después</strong> de las entrevistas, no antes: primero descubres, luego mides</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="sesiones-de-trabajo-requirements-workshop">Sesiones de trabajo (<em>requirements workshop</em>)</h2>
<ul>
<li>Reunión <strong>facilitada</strong> y estructurada con las personas interesadas clave, para <strong>decidir en conjunto</strong></li>
</ul>
<steps>
<step>
<h3 id="los-tres-roles">Los tres roles</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%8E%A4-facilitador"><img class="emoji" draggable="false" alt="🎤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3a4.svg" data-marp-twemoji=""/> Facilitador</h3>
<p><strong>No opina</strong> sobre el contenido: cuida el proceso, el tiempo y que todos participen</p>
</div>
<div>
<h3 id="%F0%9F%93%9D-escriba"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4dd.svg" data-marp-twemoji=""/> Escriba</h3>
<p>Registra decisiones, <strong>supuestos</strong> y temas pendientes en vivo, visibles para todos</p>
</div>
<div>
<h3 id="%F0%9F%91%A5-participantes"><img class="emoji" draggable="false" alt="👥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f465.svg" data-marp-twemoji=""/> Participantes</h3>
<p>Personas con <strong>autoridad para decidir</strong>, no solo mensajeros</p>
</div>
</div>
</step>
<step>
<h3 id="c%C3%B3mo-se-ejecuta">Cómo se ejecuta</h3>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="antes">Antes</h3>
<ul>
<li>Definir <strong>objetivo</strong> y entregable de la sesión</li>
<li>Enviar material de <strong>preparación</strong></li>
<li>Asegurar que asisten quienes <strong>deciden</strong></li>
</ul>
</div>
<div>
<h3 id="durante">Durante</h3>
<ul>
<li>Reglas del juego <strong>explícitas</strong></li>
<li>Estacionar los temas fuera de alcance en un <strong>«parqueo»</strong></li>
<li>Cerrar con <strong>decisiones y responsables</strong>, no con «lo seguimos viendo»</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>Ventaja</strong>: resuelve <strong>conflictos entre stakeholders</strong> en horas en lugar de semanas de correos</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>Riesgo</strong>: sin facilitación, la persona de mayor jerarquía <strong>decide sola</strong> y el resto calla</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="lluvia-y-reducci%C3%B3n-de-ideas">Lluvia y reducción de ideas</h2>
<ul>
<li>Son <strong>dos</strong> momentos distintos y no se deben mezclar</li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%92%AD-lluvia-de-ideas-divergir"><img class="emoji" draggable="false" alt="💭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4ad.svg" data-marp-twemoji=""/> Lluvia de ideas (divergir)</h3>
<ul>
<li><strong>Nada de crítica</strong> durante la generación</li>
<li>Buscar <strong>cantidad</strong>, no calidad</li>
<li>Las ideas <strong>descabelladas</strong> son bienvenidas</li>
<li><strong>Combinar y mejorar</strong> las ideas ajenas</li>
<li>Todo el mundo aporta, por turnos o en paralelo</li>
</ul>
</div>
<div>
<h3 id="%E2%9C%82%EF%B8%8F-reducci%C3%B3n-de-ideas-converger"><img class="emoji" draggable="false" alt="✂️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2702.svg" data-marp-twemoji=""/> Reducción de ideas (converger)</h3>
<ul>
<li><strong>Podar</strong> duplicados y agrupar similares</li>
<li><strong>Depurar</strong> el enunciado de cada idea</li>
<li><strong>Priorizar</strong> con votación acumulativa (cada persona reparte <em>N</em> votos)</li>
<li>Descartar lo <strong>fuera de alcance</strong> de forma explícita</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> El error clásico: <strong>criticar mientras se genera</strong>. Mata la participación en los primeros 5 minutos</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> La <strong>votación acumulativa</strong> revela qué problemas hay que resolver frente a cuáles solo <em>gustaría</em> resolver</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="storyboarding"><em>Storyboarding</em></h2>
<ul>
<li>Representación <strong>temprana y barata</strong> del sistema, para provocar reacción antes de construir</li>
</ul>
<steps>
<step>
<h3 id="los-tres-tipos">Los tres tipos</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%91%81%EF%B8%8F-pasivo"><img class="emoji" draggable="false" alt="👁️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f441.svg" data-marp-twemoji=""/> Pasivo</h3>
<p>La persona usuaria <strong>observa</strong>: bocetos, capturas, una secuencia narrada</p>
<p><em>«Déjame contarte cómo funcionaría»</em></p>
</div>
<div>
<h3 id="%F0%9F%8E%AC-activo"><img class="emoji" draggable="false" alt="🎬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3ac.svg" data-marp-twemoji=""/> Activo</h3>
<p>Muestra el sistema <strong>en movimiento</strong>: una animación o una secuencia automática</p>
<p><em>«Mira cómo se comportaría»</em></p>
</div>
<div>
<h3 id="%F0%9F%96%B1%EF%B8%8F-interactivo"><img class="emoji" draggable="false" alt="🖱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5b1.svg" data-marp-twemoji=""/> Interactivo</h3>
<p>La persona usuaria <strong>prueba</strong>: navega una maqueta clicable</p>
<p><em>«Pruébalo tú»</em></p>
</div>
</div>
</step>
<step>
<h3 id="el-prop%C3%B3sito-real">El propósito real</h3>
<ul>
<li>El objetivo del <em>storyboard</em> <strong>no</strong> es que guste: es <strong>provocar el rechazo temprano</strong></li>
<li>Un <em>storyboard</em> que la persona usuaria aprueba sin comentarios probablemente <strong>no se entendió</strong></li>
</ul>
<div class="grid">
<div>
<h3 id="%E2%9C%85-hazlo"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Hazlo</h3>
<ul>
<li><strong>Fácil</strong> de modificar</li>
<li><strong>Barato</strong> de desechar</li>
<li>Enfocado en <strong>una historia</strong> de uso</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%9A%AB-ev%C3%ADtalo"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Evítalo</h3>
<ul>
<li>Pulirlo tanto que <strong>parezca terminado</strong></li>
<li>Que el cliente crea que el sistema <strong>ya está hecho</strong></li>
<li>Convertirlo en el diseño <strong>definitivo</strong> sin discusión</li>
</ul>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="representaci%C3%B3n-de-roles-y-juego-de-roles">Representación de roles y juego de roles</h2>
<ul>
<li>Dos técnicas de <strong>inmersión</strong>: entender el trabajo viviéndolo, no preguntando por él</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Varias personas autoras las tratan como <strong>sinónimos</strong>; aquí las distinguimos por su montaje</li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%8E%AD-representaci%C3%B3n-de-roles"><img class="emoji" draggable="false" alt="🎭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3ad.svg" data-marp-twemoji=""/> Representación de roles</h3>
<p>Quien analiza <strong>asume el rol</strong> de la persona usuaria y <strong>hace su trabajo real</strong> durante un tiempo</p>
<ul>
<li>Revela los <strong>atajos</strong> y trucos que nadie menciona en una entrevista</li>
<li>Descubre el trabajo <strong>invisible</strong>: las excepciones, los post-its, el «cuadernito»</li>
</ul>
<blockquote>
<p><em>«Pasé un turno atendiendo la ventanilla de matrícula»</em></p>
</blockquote>
</div>
<div>
<h3 id="%F0%9F%8E%AC-juego-de-roles"><img class="emoji" draggable="false" alt="🎬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3ac.svg" data-marp-twemoji=""/> Juego de roles</h3>
<p>Sesión en grupo donde se <strong>dramatiza un escenario</strong>: alguien hace de persona usuaria, alguien de <strong>sistema</strong>, alguien observa</p>
<ul>
<li>Recorre un <strong>flujo completo</strong> paso a paso</li>
<li>Quien hace de <em>sistema</em> solo puede responder con lo que el sistema <strong>realmente sabría</strong></li>
<li>Expone <strong>huecos</strong>: «¿y de dónde saco ese dato?»</li>
</ul>
<blockquote>
<p>Emparienta con el recorrido de <strong>casos de uso</strong></p>
</blockquote>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Ambas son especialmente útiles cuando el dominio es <strong>muy ajeno</strong> al equipo técnico</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="diagramas-de-espina-de-pescado-ishikawa">Diagramas de espina de pescado (Ishikawa)</h2>
<ul>
<li>Herramienta de <strong>causa-efecto</strong>: separa el <strong>síntoma</strong> de sus <strong>causas raíz</strong></li>
</ul>
<steps>
<step>
<h3 id="c%C3%B3mo-se-construye">Cómo se construye</h3>
<ol>
<li>Escribir el <strong>efecto</strong> (el problema) en la cabeza del pescado, a la derecha</li>
<li>Trazar la <strong>espina central</strong> y las espinas mayores: las <strong>categorías</strong> de causa</li>
<li>En cada categoría, preguntar <strong>«¿por qué?»</strong> repetidamente y anotar las sub-causas</li>
<li>Identificar las causas que <strong>más contribuyen</strong> y verificarlas con datos</li>
</ol>
<div class="grid">
<div>
<h3 id="categor%C3%ADas-cl%C3%A1sicas-6m">Categorías clásicas (6M)</h3>
<p>Máquina · Método · Material · Mano de obra · Medición · Medio ambiente</p>
</div>
<div>
<h3 id="categor%C3%ADas-para-software">Categorías para software</h3>
<p><strong>Personas</strong> · <strong>Procesos</strong> · <strong>Tecnología</strong> · <strong>Datos</strong> · <strong>Políticas</strong> · <strong>Entorno</strong></p>
</div>
</div>
</step>
<step>
<h3 id="ejemplo-%C2%ABla-matr%C3%ADcula-se-cae-cada-semestre%C2%BB">Ejemplo: «La matrícula se cae cada semestre»</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Categoría</th>
<th style="text-align:left">Causas identificadas</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Personas</strong></td>
<td style="text-align:left">Toda la población matricula el mismo día · No hay capacitación previa</td>
</tr>
<tr>
<td style="text-align:left"><strong>Procesos</strong></td>
<td style="text-align:left">Los cupos se validan al final, no al asignar · No hay ventanas escalonadas</td>
</tr>
<tr>
<td style="text-align:left"><strong>Tecnología</strong></td>
<td style="text-align:left">Un solo servidor · Sin caché · Consultas sin índices</td>
</tr>
<tr>
<td style="text-align:left"><strong>Datos</strong></td>
<td style="text-align:left">El padrón se sincroniza manualmente · Cursos duplicados</td>
</tr>
<tr>
<td style="text-align:left"><strong>Políticas</strong></td>
<td style="text-align:left">La normativa exige matrícula en 3 días · Sin lista de espera oficial</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Fíjate: solo <strong>una</strong> de las cinco categorías es técnica</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Si el equipo solo agranda el servidor, el problema <strong>vuelve</strong> el próximo semestre</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-marpit-scope-a53NEBoE="" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="diagramas-de-pareto">Diagramas de Pareto</h2>
<ul>
<li>Principio <strong>80/20</strong>: aproximadamente el <strong>80 %</strong> de los efectos proviene del <strong>20 %</strong> de las causas</li>
</ul>
<steps>
<step>
<h3 id="ejemplo-quejas-del-sistema-de-matr%C3%ADcula-en-un-semestre">Ejemplo: quejas del sistema de matrícula en un semestre</h3>
<div class="bar"><i>Caídas en hora pico</i><u style="width:100%"></u><b>420 · 48 %</b></div>
<div class="bar"><i>Cupos mal asignados</i><u style="width:56%"></u><b>235 · 27 %</b></div>
<div class="bar"><i>Choques de horario</i><u style="width:24%"></u><b>102 · 12 %</b></div>
<div class="bar"><i>Notas desactualizadas</i><u style="width:13%"></u><b>55 · 6 %</b></div>
<div class="bar"><i>Errores de impresión</i><u style="width:8%"></u><b>34 · 4 %</b></div>
<div class="bar"><i>Otros</i><u style="width:6%"></u><b>26 · 3 %</b></div>
<ul>
<li>Las <strong>dos primeras</strong> causas concentran el <strong>75 %</strong> de las quejas</li>
</ul>
</step>
<step>
<h3 id="c%C3%B3mo-se-usa-en-requerimientos">Cómo se usa en requerimientos</h3>
<div class="grid">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-contar-no-opinar"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Contar, no opinar</h3>
<p>Clasificar los problemas por <strong>categoría</strong> y contar su frecuencia (o su costo)</p>
</div>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-ordenar-de-mayor-a-menor"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Ordenar de mayor a menor</h3>
<p>Y acumular el porcentaje para ver dónde está el <strong>corte</strong></p>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-priorizar-el-alcance"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Priorizar el alcance</h3>
<p>Los <strong>pocos vitales</strong> entran en la versión 1.0; los <strong>muchos triviales</strong> esperan</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Convierte la priorización en una conversación sobre <strong>datos</strong> y no sobre quién habla más fuerte</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>Cuidado</strong>: lo más frecuente no siempre es lo más <strong>grave</strong>. Un fallo raro que compromete datos personales puede superar en impacto a mil quejas menores → considera ponderar por <strong>costo</strong>, no solo por conteo</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="diagramas-de-afinidad">Diagramas de afinidad</h2>
<ul>
<li>Técnica para <strong>organizar</strong> una gran cantidad de ideas sueltas agrupándolas por <strong>relación natural</strong></li>
<li>También llamada <strong>método KJ</strong>, por su autor Jiro Kawakita</li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="c%C3%B3mo-se-hace-1">Cómo se hace</h3>
<ol>
<li>Cada idea, en <strong>una tarjeta</strong> o <em>post-it</em> (una idea por tarjeta)</li>
<li>Agrupar <strong>en silencio</strong>: cada quien mueve tarjetas donde ve afinidad</li>
<li>Discutir solo cuando el movimiento se <strong>estabiliza</strong></li>
<li>Ponerle <strong>nombre</strong> a cada grupo → ese nombre suele ser una <strong>necesidad</strong> o una <strong>característica</strong></li>
<li>Ordenar los grupos por <strong>prioridad</strong></li>
</ol>
</div>
<div>
<h3 id="por-qu%C3%A9-funciona">Por qué funciona</h3>
<ul>
<li>El silencio inicial evita que la <strong>jerarquía</strong> sesgue el agrupamiento</li>
<li>Los grupos <strong>emergen</strong> de los datos en lugar de imponerse desde una estructura previa</li>
<li>Es el <strong>complemento natural</strong> de la lluvia de ideas: primero se genera, luego se agrupa</li>
</ul>
<br />
<blockquote>
<p>Es la técnica que convierte <strong>200 post-its</strong> en <strong>8 temas</strong> discutibles</p>
</blockquote>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Encadenamiento habitual: <strong>lluvia de ideas → afinidad → votación acumulativa → características (FEA)</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="83">
<h2 id="actividad-3-escoge-y-aplica">Actividad 3: escoge y aplica</h2>
<ul>
<li>Su equipo debe levantar los requerimientos de un <strong>sistema de préstamo de equipo</strong> para un laboratorio</li>
</ul>
<div class="grid">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-dise%C3%B1en-la-estrategia"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Diseñen la estrategia</h3>
<p>¿Qué <strong>tres</strong> técnicas usarían y <strong>en qué orden</strong>? Justifiquen cada una en una línea</p>
</div>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-espina-de-pescado"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Espina de pescado</h3>
<p>El problema es <em>«se pierden equipos cada semestre»</em>. Construyan el diagrama con las <strong>5 categorías</strong> de software</p>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-pareto"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Pareto</h3>
<p>Con las causas que encontraron, ¿cuáles serían los <strong>pocos vitales</strong>? ¿Qué dejarían fuera de la v1.0?</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/23f1.svg" data-marp-twemoji=""/> 25 minutos</li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> Discusión final: ¿su estrategia descubre lo que las personas usuarias <strong>no saben que necesitan</strong>? ¿Qué técnica de las diez sirve para eso?</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-marpit-scope-NIdUDmba="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="42" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="83">
