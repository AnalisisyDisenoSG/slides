<td style="text-align:left">Dónde y cómo <strong>se rompe</strong> más allá del máximo</td>
<td style="text-align:left">¿Se degrada con dignidad o se cae?</td>
</tr>
<tr>
<td style="text-align:left"><strong>Volumen</strong></td>
<td style="text-align:left">Grandes cantidades de <strong>datos</strong></td>
<td style="text-align:left">Un reporte de 10 años de historia</td>
</tr>
<tr>
<td style="text-align:left"><strong>Usabilidad</strong></td>
<td style="text-align:left">Facilidad de aprendizaje y de uso</td>
<td style="text-align:left">5 usuarios nuevos completan la tarea sin ayuda</td>
</tr>
<tr>
<td style="text-align:left"><strong>Accesibilidad</strong></td>
<td style="text-align:left">Uso por personas con discapacidad</td>
<td style="text-align:left">Navegable solo con teclado; WCAG 2.2 AA</td>
</tr>
<tr>
<td style="text-align:left"><strong>Recuperación</strong></td>
<td style="text-align:left">Vuelta a la operación tras una falla</td>
<td style="text-align:left">Se corta la base de datos en medio de una transacción</td>
</tr>
<tr>
<td style="text-align:left"><strong>Compatibilidad</strong></td>
<td style="text-align:left">Funcionamiento en distintos entornos</td>
<td style="text-align:left">Chrome, Firefox, Safari; Android e iOS</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Todas salen de la <strong>especificación suplementaria</strong>. Si un requerimiento no funcional no tiene una prueba asociada, es un <strong>deseo</strong>, no un requerimiento</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="regresi%C3%B3n-confirmaci%C3%B3n-y-humo">Regresión, confirmación y humo</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%94%81-regresi%C3%B3n"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> Regresión</h3>
<p>Volver a ejecutar pruebas que <strong>ya pasaban</strong> después de un cambio, para detectar efectos colaterales. Es la razón número uno para <strong>automatizar</strong></p>
</div>
<div>
<h3 id="%E2%9C%85-confirmaci%C3%B3n-re-test"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Confirmación (<em>re-test</em>)</h3>
<p>Volver a ejecutar <strong>el caso que falló</strong> después de corregir el defecto, para confirmar la corrección</p>
</div>
<div>
<h3 id="%F0%9F%92%A8-humo-smoke"><img class="emoji" draggable="false" alt="💨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a8.svg" data-marp-twemoji=""/> Humo (<em>smoke</em>)</h3>
<p>Un subconjunto <strong>pequeño y rápido</strong> que verifica que lo esencial funciona: ¿arranca? ¿se puede entrar? Si falla, no vale la pena seguir probando</p>
</div>
<div>
<h3 id="%F0%9F%A7%AA-cordura-sanity"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Cordura (<em>sanity</em>)</h3>
<p>Una revisión rápida y <strong>enfocada</strong> en la funcionalidad recién cambiada</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Cada corrección es un <strong>cambio</strong>, y cada cambio puede romper otra cosa. Sin regresión, se arregla un defecto y se introducen dos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="resumen-clasificaci%C3%B3n-seg%C3%BAn-finalidad">Resumen: clasificación según finalidad</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Comprueban…</th>
<th style="text-align:left">Tipo de prueba</th>
<th style="text-align:left">Quién participa</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Que las especificaciones funcionales están <strong>implementadas correctamente</strong></td>
<td style="text-align:left">Unidad, componentes e integración</td>
<td style="text-align:left">Desarrolladores</td>
</tr>
<tr>
<td style="text-align:left">El comportamiento funcional <strong>de punta a punta</strong></td>
<td style="text-align:left">Sistema, casos de uso</td>
<td style="text-align:left">Equipo de pruebas</td>
</tr>
<tr>
<td style="text-align:left">Los requerimientos <strong>no funcionales</strong></td>
<td style="text-align:left">Sistema: seguridad, rendimiento, usabilidad…</td>
<td style="text-align:left">Equipo de pruebas, especialistas</td>
</tr>
<tr>
<td style="text-align:left">El comportamiento frente a los <strong>requerimientos del cliente</strong></td>
<td style="text-align:left">Aceptación</td>
<td style="text-align:left">El cliente o los usuarios</td>
</tr>
<tr>
<td style="text-align:left">El comportamiento frente a la <strong>configuración</strong> de hardware y software</td>
<td style="text-align:left">Instalación</td>
<td style="text-align:left">Operaciones, equipo de pruebas</td>
</tr>
<tr>
<td style="text-align:left">El sistema con <strong>usuarios potenciales</strong> antes de la difusión</td>
<td style="text-align:left">Alfa (adentro) y beta (afuera)</td>
<td style="text-align:left">Usuarios reales</td>
</tr>
<tr>
<td style="text-align:left">Que nada <strong>se rompió</strong> tras un cambio</td>
<td style="text-align:left">Regresión</td>
<td style="text-align:left">Automatización</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="pruebas-en-sistemas-orientados-a-objetos">Pruebas en sistemas orientados a objetos</h2>
<steps>
<step>
<h3 id="qu%C3%A9-cambia">Qué cambia</h3>
<ul>
<li>Las pruebas de sistemas <strong>estructurados</strong> y de sistemas <strong>OO</strong> difieren por las características de cada paradigma</li>
<li>No todas las pruebas se hacen sobre código: también sobre los <strong>modelos</strong> (revisar que el diagrama de clases soporte todos los escenarios)</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Concepto estructurado</th>
<th style="text-align:left">Equivalente en OO</th>
<th style="text-align:left">Lo que complica</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Módulo</td>
<td style="text-align:left"><strong>La clase</strong></td>
<td style="text-align:left">Un método no se puede probar sin el <strong>estado</strong> del objeto</td>
</tr>
<tr>
<td style="text-align:left">Llamada a procedimiento</td>
<td style="text-align:left">Mensaje entre objetos</td>
<td style="text-align:left">El <strong>polimorfismo</strong>: no se sabe qué método se ejecuta hasta correr</td>
</tr>
<tr>
<td style="text-align:left">Jerarquía de llamadas</td>
<td style="text-align:left">Red de colaboraciones</td>
<td style="text-align:left">No hay un árbol claro para integrar de arriba abajo</td>
</tr>
<tr>
<td style="text-align:left">—</td>
<td style="text-align:left"><strong>Herencia</strong></td>
<td style="text-align:left">Lo probado en la superclase <strong>no queda probado</strong> en la subclase</td>
</tr>
<tr>
<td style="text-align:left">—</td>
<td style="text-align:left"><strong>Encapsulamiento</strong></td>
<td style="text-align:left">El estado interno no se ve: hay que observarlo por la interfaz</td>
</tr>
</tbody>
</table>
</step>
<step>
<h3 id="los-tres-niveles-en-oo">Los tres niveles en OO</h3>
<div class="grid">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-unidad--clase"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Unidad = clase</h3>
<p>Se prueba cada <strong>método</strong> (caja negra y blanca) y luego las <strong>secuencias</strong> de métodos que cambian el estado del objeto</p>
</div>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-integraci%C3%B3n"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Integración</h3>
<p><strong>Por hilos</strong> (las clases de un diagrama de secuencia), <strong>por uso</strong> (de las más independientes a las más dependientes) o <strong>por agrupamiento</strong> (clases colaboradoras)</p>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-validaci%C3%B3n"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Validación</h3>
<p>Desaparecen las clases: se prueba el <strong>comportamiento visible</strong> contra los casos de uso, igual que en cualquier sistema</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Para sistemas reales, importa <strong>minimizar</strong> el número de casos de prueba: la explosión de combinaciones entre estados y mensajes es real</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="ejemplo-de-prueba-de-validaci%C3%B3n">Ejemplo de prueba de validación</h2>
<split-slide style="--left: 55%; --right: 45%;">
<div>
<h3 id="caso-de-prueba-pagar-%E2%82%A1150-000-por-una-bicicleta-de-monta%C3%B1a">Caso de prueba: <em>Pagar ₡150 000 por una bicicleta de montaña</em></h3>
<p><strong>Precondiciones (estado inicial)</strong></p>
<ul>
<li>Existe un pedido válido de la bicicleta, enviado a un vendedor</li>
<li>El precio es <strong>₡150 000</strong>, envío incluido</li>
<li>El comprador recibió la confirmación del pedido <code>ID 12345</code></li>
<li>Existe una factura de ₡150 000 en estado <strong>pendiente</strong>, que apunta a la cuenta <code>22-222-2222</code> del vendedor, con saldo <strong>₡963 000</strong></li>
<li>La cuenta <code>11-111-1111</code> del comprador tiene saldo <strong>₡175 000</strong></li>
</ul>
</div>
<div>
<p><strong>Resultado esperado</strong></p>
<ul>
<li>La factura pasa a estado <strong>cerrada</strong></li>
<li>Saldo de <code>11-111-1111</code> = <strong>₡25 000</strong></li>
<li>Saldo de <code>22-222-2222</code> = <strong>₡1 113 000</strong></li>
</ul>
<p><strong>Condiciones de ejecución</strong></p>
<ul>
<li>
<p>Ninguna otra instancia puede acceder a las cuentas durante el caso de prueba</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Ninguna clase aparece en el caso: solo <strong>estados observables</strong> antes y después. Eso lo hace un caso de <strong>validación</strong></p>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-marpit-scope-iV2WgTuQ="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="40" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="79">
<h1 id="creaci%C3%B3n-de-las-pruebas">Creación de las pruebas</h1>
<h2 id="contenidos-4">Contenidos</h2>
<ul>
<li>Del caso de uso al caso de prueba en tres pasos</li>
<li>Escenarios, matriz de casos y datos</li>
<li>Pruebas desde los requerimientos suplementarios</li>
<li>La matriz de trazabilidad</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="por-qu%C3%A9-partir-de-los-casos-de-uso">Por qué partir de los casos de uso</h2>
<ul>
<li>El caso de uso ya describe <strong>qué hace el sistema</strong> desde el punto de vista del actor: es casi un guion de prueba escrito de antemano</li>
<li>Diseñar las pruebas <strong>mientras</strong> se escribe el caso de uso es la mejor revisión que puede tener: un flujo que no se puede probar es un flujo <strong>mal especificado</strong></li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%93%84-caso-de-uso"><img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c4.svg" data-marp-twemoji=""/> Caso de uso</h3>
<p>Describe <strong>todos</strong> los caminos posibles, en lenguaje del negocio</p>
</div>
<div>
<h3 id="%F0%9F%9B%A4%EF%B8%8F-escenario"><img class="emoji" draggable="false" alt="🛤️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e4.svg" data-marp-twemoji=""/> Escenario</h3>
<p>Es <strong>una instancia</strong> del caso de uso: un camino concreto de principio a fin</p>
</div>
<div>
<h3 id="%F0%9F%A7%AA-caso-de-prueba"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Caso de prueba</h3>
<p>Es un escenario <strong>con datos concretos</strong>, condiciones y resultado esperado</p>
</div>
</div>
<blockquote>
<p>Un <strong>caso de prueba</strong> es un conjunto de entradas, condiciones de ejecución y resultados esperados, desarrollado para un objetivo particular: ejercitar un camino o verificar un requerimiento<br />
— <em>IEEE 610.12</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="el-m%C3%A9todo-en-tres-pasos">El método en tres pasos</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Paso</th>
<th style="text-align:left">Qué se hace</th>
<th style="text-align:left">Qué se obtiene</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>1. Generar los escenarios</strong></td>
<td style="text-align:left">Combinar el flujo básico con cada flujo alterno — y con las combinaciones que tengan sentido</td>
<td style="text-align:left">Una lista de <strong>escenarios</strong> completos</td>
</tr>
<tr>
<td style="text-align:left"><strong>2. Identificar los casos de prueba</strong></td>
<td style="text-align:left">Para cada escenario, determinar las <strong>condiciones</strong> que lo hacen ocurrir y el <strong>resultado esperado</strong></td>
<td style="text-align:left">Una <strong>matriz</strong> de casos con V / I / N/A</td>
</tr>
<tr>
<td style="text-align:left"><strong>3. Identificar los valores de datos</strong></td>
<td style="text-align:left">Reemplazar cada V e I por un <strong>dato concreto</strong> que cumpla la condición</td>
<td style="text-align:left">Casos <strong>ejecutables</strong></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="📎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ce.svg" data-marp-twemoji=""/> Técnica de <strong>Jim Heumann</strong>, <em>Generating Test Cases From Use Cases</em> (Rational, 2001)</li>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Se trabaja <strong>por caso de uso</strong> y en <strong>prioridad</strong>: primero los casos de uso de mayor riesgo o valor para el negocio</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="paso-1-generar-los-escenarios">Paso 1: generar los escenarios</h2>
<split-slide style="--left: 48%; --right: 52%;">
<div>
<h3 id="el-caso-de-uso-%C2%ABprestar-un-libro%C2%BB">El caso de uso: «Prestar un libro»</h3>
<p><strong>Flujo básico</strong></p>
<ol>
<li>El usuario presenta su carné</li>
<li>El sistema verifica que el usuario esté activo y sin multas</li>
<li>El bibliotecario digita el código del ejemplar</li>
<li>El sistema verifica que el ejemplar esté disponible</li>
<li>El sistema registra el préstamo con la fecha de devolución según el tipo de usuario</li>
<li>El sistema imprime el comprobante</li>
</ol>
<p><strong>Flujos alternos</strong></p>
<ul>
<li><strong>FA1</strong> Usuario inactivo → rechaza</li>
<li><strong>FA2</strong> Usuario con multas → rechaza y muestra el monto</li>
<li><strong>FA3</strong> Código de ejemplar inexistente → solicita de nuevo</li>
<li><strong>FA4</strong> Ejemplar prestado → ofrece reservarlo</li>
</ul>
</div>
<div>
<h3 id="los-escenarios">Los escenarios</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Esc.</th>
<th style="text-align:left">Recorrido</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>E1</strong></td>
<td style="text-align:left">Flujo básico completo</td>
</tr>
<tr>
<td style="text-align:left"><strong>E2</strong></td>
<td style="text-align:left">Básico + FA1</td>
</tr>
<tr>
<td style="text-align:left"><strong>E3</strong></td>
<td style="text-align:left">Básico + FA2</td>
</tr>
<tr>
<td style="text-align:left"><strong>E4</strong></td>
<td style="text-align:left">Básico + FA3, luego vuelve al básico</td>
</tr>
<tr>
<td style="text-align:left"><strong>E5</strong></td>
<td style="text-align:left">Básico + FA4</td>
</tr>
<tr>
<td style="text-align:left"><strong>E6</strong></td>
<td style="text-align:left">Básico + FA3 + FA4</td>
</tr>
</tbody>
</table>
<ul>
<li>Cada flujo alterno <strong>regresa al básico o termina</strong>: eso define cuántos escenarios hay</li>
<li>No se combinan alternos que <strong>no pueden</strong> darse juntos (FA1 y FA2 son excluyentes en el paso 2)</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="paso-2-la-matriz-de-casos-de-prueba">Paso 2: la matriz de casos de prueba</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Caso</th>
<th style="text-align:left">Esc.</th>
<th style="text-align:left">Usuario activo</th>
<th style="text-align:left">Sin multas</th>
<th style="text-align:left">Código existe</th>
<th style="text-align:left">Ejemplar disponible</th>
<th style="text-align:left">Resultado esperado</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>CP1</strong></td>
<td style="text-align:left">E1</td>
<td style="text-align:left">V</td>
<td style="text-align:left">V</td>
<td style="text-align:left">V</td>
<td style="text-align:left">V</td>
<td style="text-align:left">Préstamo registrado, comprobante impreso con fecha correcta</td>
</tr>
<tr>
<td style="text-align:left"><strong>CP2</strong></td>
<td style="text-align:left">E2</td>
<td style="text-align:left"><strong>I</strong></td>
<td style="text-align:left">N/A</td>
<td style="text-align:left">N/A</td>
<td style="text-align:left">N/A</td>
<td style="text-align:left">Rechazo: «usuario inactivo»</td>
</tr>
<tr>
<td style="text-align:left"><strong>CP3</strong></td>
<td style="text-align:left">E3</td>
<td style="text-align:left">V</td>
<td style="text-align:left"><strong>I</strong></td>
<td style="text-align:left">N/A</td>
<td style="text-align:left">N/A</td>
<td style="text-align:left">Rechazo con el monto de la multa</td>
</tr>
<tr>
<td style="text-align:left"><strong>CP4</strong></td>
<td style="text-align:left">E4</td>
<td style="text-align:left">V</td>
<td style="text-align:left">V</td>
<td style="text-align:left"><strong>I</strong> → V</td>
<td style="text-align:left">V</td>
<td style="text-align:left">Solicita el código de nuevo; luego, préstamo registrado</td>
</tr>
<tr>
<td style="text-align:left"><strong>CP5</strong></td>
<td style="text-align:left">E5</td>
<td style="text-align:left">V</td>
<td style="text-align:left">V</td>
<td style="text-align:left">V</td>
<td style="text-align:left"><strong>I</strong></td>
<td style="text-align:left">Ofrece reservar; no se registra préstamo</td>
</tr>
<tr>
<td style="text-align:left"><strong>CP6</strong></td>
<td style="text-align:left">E6</td>
<td style="text-align:left">V</td>
<td style="text-align:left">V</td>
<td style="text-align:left"><strong>I</strong> → V</td>
<td style="text-align:left"><strong>I</strong></td>

<h2 id="actividad-1-casos-de-prueba-desde-un-caso-de-uso">Actividad 1: casos de prueba desde un caso de uso</h2>
<split-slide style="--left: 52%; --right: 48%;">
<div>
<h3 id="el-caso-de-uso-%C2%ABmatricular-un-curso%C2%BB">El caso de uso: «Matricular un curso»</h3>
<ol>
<li>El estudiante ingresa con su carné y contraseña</li>
<li>El sistema muestra los cursos que puede matricular según su plan</li>
<li>El estudiante elige un grupo</li>
<li>El sistema verifica que haya <strong>cupo</strong> y que el horario <strong>no choque</strong></li>
<li>El sistema verifica que la suma de créditos no supere <strong>18</strong></li>
<li>El sistema registra la matrícula y muestra el comprobante</li>
</ol>
<p><strong>Alternos</strong>: FA1 sin cupo · FA2 choque de horario · FA3 excede 18 créditos · FA4 tiene deuda con la universidad (paso 1)</p>
<p><strong>Suplementario</strong>: <em>«Durante la matrícula, el sistema atiende 4 000 usuarios concurrentes con respuesta &lt; 3 s»</em></p>
</div>
<div>
<h3 id="qu%C3%A9-entregar">Qué entregar</h3>
<ol>
<li>La lista de <strong>escenarios</strong></li>
<li>La <strong>matriz</strong> de casos con V / I / N/A</li>
<li>Los <strong>valores</strong> concretos de al menos 4 casos, incluyendo <strong>límites</strong> de créditos</li>
<li>Una prueba <strong>no funcional</strong> derivada del suplementario</li>
<li>La <strong>matriz de trazabilidad</strong></li>
</ol>
<h3 id="preguntas-de-control">Preguntas de control</h3>
<ul>
<li>¿Cuántos escenarios salen? ¿Se pueden combinar FA1 y FA2?</li>
<li>¿Qué valores de créditos son límites?</li>
<li>¿Qué nivel de prueba es el del suplementario?</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 30 minutos · en grupos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-marpit-scope-3IfpaJ9E="" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="actividad-1-una-soluci%C3%B3n-posible">Actividad 1: una solución posible</h2>
<hidden label="Solución">
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="escenarios">Escenarios</h3>
<p><strong>E1</strong> básico · <strong>E2</strong> +FA4 (termina en el paso 1) · <strong>E3</strong> +FA1 · <strong>E4</strong> +FA2 · <strong>E5</strong> +FA3 · <strong>E6</strong> +FA1 y luego elige otro grupo que sí tiene cupo</p>
<ul>
<li>FA1 y FA2 <strong>sí</strong> se pueden combinar si el estudiante reintenta con otro grupo; en un solo intento, el primero que falla termina el paso</li>

<h3 id="valores-l%C3%ADmite-de-cr%C3%A9ditos">Valores límite de créditos</h3>
<p>Con 14 créditos ya matriculados:</p>
<ul>
<li>curso de <strong>4</strong> → total <strong>18</strong> → acepta <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>curso de <strong>5</strong> → total <strong>19</strong> → rechaza <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></li>
<li>y el caso de <strong>0</strong> créditos previos con un curso de 4 → acepta</li>
</ul>
<h3 id="no-funcional">No funcional</h3>
<p><strong>CPN-01</strong> — Prueba de <strong>carga</strong> a nivel de <strong>sistema</strong>: 4 000 usuarios virtuales durante 30 min ejecutando E1; criterio: percentil 95 &lt; 3 s y 0 % de errores</p>
<h3 id="trazabilidad">Trazabilidad</h3>
<p>CU-12 básico → CP1 · FA4 → CP2 · FA1 → CP3 · FA2 → CP4 · FA3 → CP5 · RS-01 → CPN-01</p>

<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Si nadie escribió el caso de <strong>18 exactos</strong>, la regla <code>&gt; 18</code> vs <code>&gt;= 18</code> queda sin probar</li>

<h1 id="estrategias-de-pruebas">Estrategias de pruebas</h1>
<h2 id="contenidos-5">Contenidos</h2>
<ul>
<li>El modelo en V: cuándo se escribe y cuándo se ejecuta</li>
<li>Pruebas durante el desarrollo</li>
<li>La fase de pruebas</li>
<li>Pruebas en la liberación</li>
<li>Criterios de entrada y de salida</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="%C2%BFqu%C3%A9-es-una-estrategia-de-pruebas">¿Qué es una estrategia de pruebas?</h2>
<ul>
<li>Es la respuesta de alto nivel a <strong>cuándo, quién, a qué nivel y con qué intensidad</strong> se prueba</li>
<li>Integra los métodos de diseño de casos en una <strong>serie planificada de pasos</strong> que llevan a construir software de calidad</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%94%AC-de-lo-peque%C3%B1o-a-lo-grande"><img class="emoji" draggable="false" alt="🔬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f52c.svg" data-marp-twemoji=""/> De lo pequeño a lo grande</h3>
<p>Se empieza por los <strong>componentes</strong> y se avanza hacia la integración del <strong>sistema completo</strong></p>
</div>
<div>
<h3 id="%F0%9F%91%A5-distintos-actores"><img class="emoji" draggable="false" alt="👥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f465.svg" data-marp-twemoji=""/> Distintos actores</h3>
<p>El desarrollador prueba sus unidades; un <strong>grupo independiente</strong> prueba el sistema; el <strong>cliente</strong> acepta</p>
</div>
<div>
<h3 id="%E2%9A%96%EF%B8%8F-guiada-por-el-riesgo"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> Guiada por el riesgo</h3>
<p>Más esfuerzo donde <strong>más daño</strong> haría una falla y donde más defectos se esperan</p>
</div>
<div>
<h3 id="%F0%9F%A7%AD-con-criterio-de-parada"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> Con criterio de parada</h3>
<p>Se define <strong>antes</strong> cuándo se termina de probar; si no, se termina cuando se acaba el tiempo</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Probar y depurar son <strong>actividades distintas</strong>, pero la depuración debe caber dentro de la estrategia</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="el-modelo-en-v">El modelo en V</h2>
<p><a href="../assets/ads-pru-modelo-v.svg"><img src="../assets/ads-pru-modelo-v.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="leer-el-modelo-en-v">Leer el modelo en V</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Actividad de desarrollo</th>
<th style="text-align:left">Prueba que la verifica</th>
<th style="text-align:left">Cuándo se <strong>escribe</strong> la prueba</th>
<th style="text-align:left">Cuándo se <strong>ejecuta</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Requerimientos</td>
<td style="text-align:left">Aceptación</td>
<td style="text-align:left">Al escribir los requerimientos</td>
<td style="text-align:left">Al final, con el cliente</td>
</tr>
<tr>
<td style="text-align:left">Diseño arquitectónico</td>
<td style="text-align:left">Sistema</td>
<td style="text-align:left">Al definir la arquitectura</td>
<td style="text-align:left">Con el sistema integrado</td>
</tr>
<tr>
<td style="text-align:left">Diseño detallado</td>
<td style="text-align:left">Integración</td>
<td style="text-align:left">Al definir interfaces</td>
<td style="text-align:left">Al juntar componentes</td>
</tr>
<tr>
<td style="text-align:left">Código</td>
<td style="text-align:left">Unitarias</td>
<td style="text-align:left">Antes o junto al código (TDD)</td>
<td style="text-align:left">Constantemente</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> El mensaje del modelo no es el orden de ejecución — eso es obvio — sino que <strong>las pruebas se escriben en el lado izquierdo</strong>: diseñar una prueba de aceptación mientras se escriben los requerimientos los obliga a ser <strong>verificables</strong></li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Sus críticas: asume una secuencia <strong>en cascada</strong>. En iterativo y ágil, la V se recorre <strong>en cada iteración</strong>, en miniatura</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="54" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="tres-momentos-de-la-estrategia">Tres momentos de la estrategia</h2>
<steps>
<step>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> <strong>Desarrollo</strong></th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <strong>Fase de pruebas</strong></th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/> <strong>Liberación</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Pregunta</strong></td>
<td style="text-align:left">¿Funciona mi pieza?</td>
<td style="text-align:left">¿Funciona el sistema?</td>
<td style="text-align:left">¿Está listo para el usuario?</td>
</tr>
<tr>
<td style="text-align:left"><strong>Quién</strong></td>
<td style="text-align:left">Desarrolladores</td>
<td style="text-align:left">Equipo de pruebas independiente</td>
<td style="text-align:left">Cliente, usuarios, operaciones</td>
</tr>
<tr>
<td style="text-align:left"><strong>Niveles</strong></td>
<td style="text-align:left">Unidad, componente, integración</td>
<td style="text-align:left">Integración, sistema, no funcionales</td>
<td style="text-align:left">Aceptación, alfa, beta, instalación</td>
</tr>
<tr>
<td style="text-align:left"><strong>Entorno</strong></td>
<td style="text-align:left">Máquina del desarrollador, CI</td>
<td style="text-align:left">Ambiente de QA / <em>staging</em></td>
<td style="text-align:left">Preproducción y producción</td>
</tr>
<tr>
<td style="text-align:left"><strong>Técnica dominante</strong></td>
<td style="text-align:left">Caja blanca</td>
<td style="text-align:left">Caja negra</td>
<td style="text-align:left">Caja negra, escenarios reales</td>
</tr>
<tr>
<td style="text-align:left"><strong>Automatización</strong></td>
<td style="text-align:left">Casi total</td>
<td style="text-align:left">Alta para regresión</td>
<td style="text-align:left">Pruebas de humo y monitoreo</td>
</tr>
</tbody>
</table>
</step>
<step>
<ul>
<li><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> En un proceso iterativo (RUP, Scrum), <strong>los tres momentos ocurren en cada iteración</strong>: cada incremento se desarrolla, se prueba y se libera — al menos internamente</li>
<li><img class="emoji" draggable="false" alt="📎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ce.svg" data-marp-twemoji=""/> En RUP la disciplina de pruebas está activa en <strong>todas</strong> las fases, con un pico en <strong>Construcción</strong> y <strong>Transición</strong></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="estrategia-1-pruebas-durante-el-desarrollo">Estrategia 1: pruebas durante el desarrollo</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="qu%C3%A9-se-hace">Qué se hace</h3>
<ul>
<li><strong>Pruebas unitarias</strong> de cada clase y método</li>
<li><strong>Desarrollo guiado por pruebas</strong> (TDD): rojo → verde → refactorizar</li>
<li><strong>Revisiones de código</strong> entre pares (<em>pull requests</em>)</li>
<li><strong>Análisis estático</strong>: <em>linters</em>, SonarQube, complejidad ciclomática</li>
<li><strong>Integración continua</strong>: cada cambio dispara la compilación y todas las pruebas automáticas</li>
</ul>
</div>
<div>
<h3 id="por-qu%C3%A9-aqu%C3%AD">Por qué aquí</h3>
<ul>
<li>Es donde el defecto es <strong>más barato</strong> de corregir: el desarrollador todavía tiene el contexto en la cabeza</li>
<li>Es el corazón del enfoque <em><strong>shift-left</strong></em>: mover las pruebas lo más <strong>a la izquierda</strong> posible del ciclo</li>
<li>Una suite rápida le da al equipo <strong>confianza para refactorizar</strong></li>
</ul>
<h3 id="criterio-de-salida-t%C3%ADpico">Criterio de salida típico</h3>
<p>Todas las pruebas en verde · cobertura mínima acordada · revisión aprobada · sin vulnerabilidades críticas</p>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="estrategia-2-la-fase-de-pruebas">Estrategia 2: la fase de pruebas</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="qu%C3%A9-se-hace-1">Qué se hace</h3>
<ul>
<li><strong>Integración</strong> de los componentes en un ambiente de QA</li>
<li><strong>Pruebas de sistema</strong> desde los casos de uso</li>
<li><strong>Pruebas no funcionales</strong> desde la especificación suplementaria: rendimiento, seguridad, usabilidad, compatibilidad</li>
<li><strong>Pruebas exploratorias</strong> guiadas por la experiencia</li>
<li><strong>Regresión</strong> completa en cada nueva versión</li>
</ul>
</div>
<div>
<h3 id="qui%C3%A9n-y-c%C3%B3mo">Quién y cómo</h3>
<ul>
<li>Un <strong>equipo independiente</strong>: no por desconfianza, sino porque tiene <strong>otros ojos</strong></li>
<li>En un <strong>entorno controlado</strong>, parecido a producción, con <strong>datos de prueba</strong> gestionados</li>
<li>Cada defecto se <strong>reporta, prioriza, corrige y confirma</strong></li>
</ul>
<h3 id="criterios-de-entrada-y-salida">Criterios de entrada y salida</h3>
<ul>
<li><strong>Entrada</strong>: el <em>build</em> pasó las pruebas de humo; el plan y los casos están aprobados</li>
<li><strong>Salida</strong>: 100 % de los casos críticos ejecutados · 0 defectos de severidad alta abiertos · métricas dentro del umbral</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="estrategia-3-pruebas-en-la-liberaci%C3%B3n">Estrategia 3: pruebas en la liberación</h2>
<steps>
<step>
<h3 id="qu%C3%A9-se-hace-2">Qué se hace</h3>
<div class="grid">
<div>
<h3 id="%E2%9C%8D%EF%B8%8F-aceptaci%C3%B3n">✍️ Aceptación</h3>
<p>El cliente ejecuta o aprueba las pruebas contra sus criterios</p>
</div>
<div>
<h3 id="%F0%9F%85%B0%EF%B8%8F%F0%9F%85%B1%EF%B8%8F-alfa-y-beta"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🅱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f171.svg" data-marp-twemoji=""/> Alfa y beta</h3>
<p>Usuarios reales, primero adentro y después afuera</p>
</div>
<div>
<h3 id="%F0%9F%93%A6-instalaci%C3%B3n"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Instalación</h3>
<p>En el entorno destino: instalar, actualizar, revertir</p>
</div>
<div>
<h3 id="%F0%9F%92%A8-humo-en-producci%C3%B3n"><img class="emoji" draggable="false" alt="💨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a8.svg" data-marp-twemoji=""/> Humo en producción</h3>
<p>Inmediatamente después de desplegar: ¿lo esencial funciona?</p>
</div>
</div>
</step>
<step>
<h3 id="t%C3%A9cnicas-de-liberaci%C3%B3n-de-bajo-riesgo">Técnicas de liberación de bajo riesgo</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Técnica</th>
<th style="text-align:left">Idea</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Despliegue canario</strong></td>
<td style="text-align:left">La versión nueva va a un porcentaje pequeño de usuarios; se amplía si las métricas están bien</td>
</tr>
<tr>
<td style="text-align:left"><strong>Azul / verde</strong></td>
<td style="text-align:left">Dos ambientes idénticos; se cambia el tráfico de uno al otro y se puede volver en segundos</td>
</tr>
<tr>
<td style="text-align:left"><em><strong>Feature flags</strong></em></td>
<td style="text-align:left">El código se despliega apagado y se enciende por grupos de usuarios</td>
</tr>
<tr>
<td style="text-align:left"><strong>Monitoreo y observabilidad</strong></td>
<td style="text-align:left">Las métricas de producción son la <strong>última prueba</strong>: errores, latencia, uso</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Criterio de liberación: lo define el <strong>cliente</strong> con el equipo, y queda escrito <strong>antes</strong> de empezar a probar</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="%C2%BFcu%C3%A1ndo-se-termina-de-probar">¿Cuándo se termina de probar?</h2>
<ul>
<li>Nunca se termina: <strong>se decide parar</strong>. La pregunta correcta es <em>¿con qué información se toma esa decisión?</em></li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Criterio</th>
<th style="text-align:left">Ejemplo</th>
<th style="text-align:left">Riesgo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Cobertura de requerimientos</strong></td>
<td style="text-align:left">100 % de los casos de uso tienen al menos un caso ejecutado</td>
<td style="text-align:left">No dice nada de la profundidad</td>
</tr>
<tr>
<td style="text-align:left"><strong>Cobertura de código</strong></td>
<td style="text-align:left">≥ 80 % de decisiones</td>
<td style="text-align:left">Se puede maquillar</td>
</tr>
<tr>
<td style="text-align:left"><strong>Tasa de defectos</strong></td>
<td style="text-align:left">Menos de 2 defectos nuevos por semana durante 3 semanas</td>
<td style="text-align:left">Puede que se esté probando lo mismo (pesticida)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Severidad</strong></td>
<td style="text-align:left">0 defectos críticos o altos abiertos</td>
<td style="text-align:left">Depende de cómo se clasificó</td>
</tr>
<tr>
<td style="text-align:left"><strong>Riesgo residual</strong></td>
<td style="text-align:left">El cliente acepta los defectos conocidos que quedan</td>
<td style="text-align:left">Es una decisión de negocio, no técnica</td>
</tr>
<tr>
<td style="text-align:left"><strong>Tiempo o presupuesto</strong></td>
<td style="text-align:left">Se acabó el plazo</td>
<td style="text-align:left">El más común — y el peor</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Lo sano es <strong>combinar</strong> varios y escribirlos en el <strong>Plan de pruebas</strong> como criterios de salida</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-marpit-scope-84R5Yoyg="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="59" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="79">
<h1 id="automatizaci%C3%B3n-de-las-pruebas">Automatización de las pruebas</h1>
<h2 id="contenidos-6">Contenidos</h2>
<ul>
<li>Por qué y qué automatizar</li>
<li>La pirámide de pruebas</li>
<li>Anatomía de una prueba automatizada</li>
<li>Herramientas por nivel</li>
<li>Integración continua</li>
<li>Los riesgos de automatizar</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="por-qu%C3%A9-automatizar">Por qué automatizar</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%E2%9E%95-lo-que-se-gana"><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2795.svg" data-marp-twemoji=""/> Lo que se gana</h3>
<ul>
<li><strong>Regresión barata</strong>: miles de pruebas en minutos, en cada cambio</li>
<li><strong>Repetibilidad</strong>: la máquina no se cansa ni se salta pasos</li>
<li><strong>Retroalimentación rápida</strong>: el desarrollador sabe en minutos si rompió algo</li>
<li><strong>Documentación ejecutable</strong>: la prueba dice qué debe hacer el código, y no se desactualiza</li>
<li>Libera a las personas para lo que <strong>no</strong> se automatiza: explorar, pensar, usar</li>
</ul>
</div>
<div>
<h3 id="%E2%9E%96-lo-que-cuesta"><img class="emoji" draggable="false" alt="➖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2796.svg" data-marp-twemoji=""/> Lo que cuesta</h3>
<ul>
<li>Escribirlas <strong>cuesta más</strong> que ejecutar una prueba a mano una vez</li>
<li>Hay que <strong>mantenerlas</strong>: si la interfaz cambia, las pruebas cambian</li>
<li>Requieren <strong>habilidades de programación</strong></li>
<li>Una prueba automatizada solo verifica lo que <strong>se le dijo</strong> que verificara</li>
<li>La herramienta y la infraestructura tienen <strong>costo</strong></li>
</ul>
</div>
</split-slide>
<blockquote>
<p>«La automatización no reemplaza a quien prueba: reemplaza la parte <strong>repetitiva</strong> de su trabajo»</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="qu%C3%A9-automatizar-y-qu%C3%A9-no">Qué automatizar y qué no</h2>
<table>
<thead>
<tr>
<th style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Buenos candidatos</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Malos candidatos</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Pruebas de <strong>regresión</strong> que se ejecutan en cada versión</td>
<td style="text-align:left">Pruebas que se ejecutan <strong>una sola vez</strong></td>
</tr>
<tr>
<td style="text-align:left">Pruebas <strong>unitarias</strong> y de <strong>API</strong></td>
<td style="text-align:left">Funcionalidad <strong>inestable</strong>, que cambia cada semana</td>
</tr>
<tr>
<td style="text-align:left">Cálculos con <strong>muchas combinaciones</strong> de datos</td>
<td style="text-align:left">Evaluaciones <strong>subjetivas</strong>: ¿se ve bien? ¿se entiende?</td>
</tr>
<tr>
<td style="text-align:left">Pruebas de <strong>carga</strong> y <strong>rendimiento</strong> (imposibles a mano)</td>
<td style="text-align:left">Pruebas <strong>exploratorias</strong></td>
</tr>
<tr>
<td style="text-align:left">Pruebas de <strong>humo</strong> tras cada despliegue</td>
<td style="text-align:left">Usabilidad y accesibilidad <strong>percibida</strong></td>
</tr>
<tr>
<td style="text-align:left">Flujos críticos del negocio de punta a punta</td>
<td style="text-align:left">Escenarios cuyo costo de automatizar supera el beneficio</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🧮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ee.svg" data-marp-twemoji=""/> Regla del retorno: si una prueba manual toma 30 min y se ejecuta 40 veces al año, son <strong>20 horas</strong>. Si automatizarla cuesta 6 horas y mantenerla 4, se paga sola en el primer año</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="la-pir%C3%A1mide-de-pruebas">La pirámide de pruebas</h2>
<p><a href="../assets/ads-pru-piramide.svg"><img src="../assets/ads-pru-piramide.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="leer-la-pir%C3%A1mide">Leer la pirámide</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="la-idea-mike-cohn-2009">La idea (Mike Cohn, 2009)</h3>
<ul>
<li><strong>Muchas</strong> pruebas unitarias: rápidas, baratas, precisas para localizar el defecto</li>
<li><strong>Bastantes</strong> pruebas de integración o de API: verifican que las piezas encajan</li>
<li><strong>Pocas</strong> pruebas de punta a punta por la interfaz: lentas y frágiles, pero las únicas que ven lo que ve el usuario</li>
</ul>
</div>
<div>
<h3 id="el-antipatr%C3%B3n-el-cono-de-helado-%F0%9F%8D%A6">El antipatrón: el cono de helado <img class="emoji" draggable="false" alt="🍦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f366.svg" data-marp-twemoji=""/></h3>
<ul>
<li>Pocas unitarias, muchas pruebas manuales y de interfaz</li>
<li>La suite tarda <strong>horas</strong>, falla por cambios de diseño visual y nadie confía en ella</li>
<li>Síntoma: <em>«no corras las pruebas, tardan mucho»</em></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Variante moderna: el <strong>trofeo de pruebas</strong> (Kent C. Dodds) pone más peso en integración que en unidad para aplicaciones web. La forma exacta se discute; el principio no: <strong>más pruebas abajo, menos arriba</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="64" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="anatom%C3%ADa-de-una-prueba-automatizada">Anatomía de una prueba automatizada</h2>
<split-slide style="--left: 56%; --right: 44%; --font-size: 0.8rem;">
<div>
<pre><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">PrestamoTest</span> {

  <span class="hljs-meta">@Test</span>
  <span class="hljs-type">void</span> <span class="hljs-title function_">estudianteRecibePlazoDeSieteDias</span><span class="hljs-params">()</span> {
    <span class="hljs-comment">// Arrange: preparar</span>
    <span class="hljs-type">var</span> <span class="hljs-variable">tipo</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">TipoUsuario</span>(<span class="hljs-string">&quot;Estudiante&quot;</span>, <span class="hljs-number">7</span>);
    <span class="hljs-type">var</span> <span class="hljs-variable">usuario</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Usuario</span>(<span class="hljs-string">&quot;B12345&quot;</span>, tipo);
    <span class="hljs-type">var</span> <span class="hljs-variable">hoy</span> <span class="hljs-operator">=</span> LocalDate.of(<span class="hljs-number">2026</span>, <span class="hljs-number">10</span>, <span class="hljs-number">10</span>);

    <span class="hljs-comment">// Act: actuar</span>
    <span class="hljs-type">var</span> <span class="hljs-variable">prestamo</span> <span class="hljs-operator">=</span> Prestamo.registrar(usuario, ejemplar, hoy);

    <span class="hljs-comment">// Assert: verificar (el oráculo)</span>
    assertEquals(LocalDate.of(<span class="hljs-number">2026</span>, <span class="hljs-number">10</span>, <span class="hljs-number">17</span>),
                 prestamo.fechaDevolucion());
  }

  <span class="hljs-meta">@Test</span>
  <span class="hljs-type">void</span> <span class="hljs-title function_">usuarioConMultaNoPuedePrestar</span><span class="hljs-params">()</span> {
    <span class="hljs-type">var</span> <span class="hljs-variable">usuario</span> <span class="hljs-operator">=</span> usuarioConMulta(<span class="hljs-number">2_500</span>);
    assertThrows(MultaPendienteException.class,
      () -&gt; Prestamo.registrar(usuario, ejemplar, hoy));
  }
}
</code></pre>
</div>
<div>
<h3 id="el-patr%C3%B3n-aaa">El patrón AAA</h3>
<ol>
<li><strong>Arrange</strong>: construir el objeto y el estado inicial (las precondiciones)</li>
<li><strong>Act</strong>: ejecutar <strong>una</strong> operación</li>
<li><strong>Assert</strong>: comparar contra lo esperado</li>
</ol>
<h3 id="buenas-pr%C3%A1cticas">Buenas prácticas</h3>
<ul>
<li>El <strong>nombre</strong> describe el comportamiento, no el método</li>
<li><strong>Una razón</strong> para fallar por prueba</li>
<li><strong>Sin dependencias</strong> entre pruebas: el orden no importa</li>
<li>La fecha <strong>se inyecta</strong>: una prueba que depende del reloj es una prueba que falla los domingos</li>
<li><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Este caso es el <strong>CP1</strong> de la matriz anterior</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="65" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="herramientas-por-nivel">Herramientas por nivel</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Nivel o tipo</th>
<th style="text-align:left">Java / .NET</th>
<th style="text-align:left">JavaScript / TypeScript</th>
<th style="text-align:left">Python</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Unidad</strong></td>
<td style="text-align:left">JUnit 5, NUnit, xUnit.net</td>
<td style="text-align:left">Vitest, Jest</td>
<td style="text-align:left">pytest, unittest</td>
</tr>
<tr>
<td style="text-align:left"><strong>Dobles de prueba</strong></td>
<td style="text-align:left">Mockito, Moq</td>
<td style="text-align:left"><code>vi.fn()</code>, Sinon</td>
<td style="text-align:left"><code>unittest.mock</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Integración / API</strong></td>
<td style="text-align:left">REST Assured, Testcontainers</td>
<td style="text-align:left">Supertest, Postman/Newman</td>
<td style="text-align:left">requests + pytest</td>
</tr>
<tr>
<td style="text-align:left"><strong>Interfaz (E2E)</strong></td>
<td style="text-align:left">Selenium WebDriver</td>
<td style="text-align:left">Playwright, Cypress</td>
<td style="text-align:left">Playwright, Selenium</td>
</tr>
<tr>
<td style="text-align:left"><strong>Aceptación (BDD)</strong></td>

<td style="text-align:left">Cucumber.js</td>
<td style="text-align:left">behave</td>
</tr>
<tr>
<td style="text-align:left"><strong>Carga y rendimiento</strong></td>

<td style="text-align:left">k6, Artillery</td>

</tr>
<tr>
<td style="text-align:left"><strong>Seguridad</strong></td>
<td style="text-align:left">OWASP ZAP, Dependency-Check</td>
<td style="text-align:left"><code>npm audit</code>, ZAP</td>
<td style="text-align:left">Bandit, ZAP</td>
</tr>
<tr>
<td style="text-align:left"><strong>Cobertura</strong></td>
<td style="text-align:left">JaCoCo, Coverlet</td>
<td style="text-align:left">Istanbul (<code>v8</code>)</td>

<tr>
<td style="text-align:left"><strong>Gestión de casos</strong></td>
<td style="text-align:left">TestRail, Xray (Jira), Azure Test Plans</td>
<td style="text-align:left">←</td>
<td style="text-align:left">←</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> La herramienta importa menos que el <strong>diseño de los casos</strong>: una prueba mal pensada automatizada sigue estando mal pensada, solo que más rápido</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="66" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="integraci%C3%B3n-continua-las-pruebas-en-el-pipeline">Integración continua: las pruebas en el pipeline</h2>
<steps>
<step>
<h3 id="cada-cambio-dispara-el-pipeline">Cada cambio dispara el pipeline</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Etapa</th>
<th style="text-align:left">Qué corre</th>
<th style="text-align:left">Tiempo objetivo</th>
<th style="text-align:left">Si falla…</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>1. Compilar</strong></td>
<td style="text-align:left">Compilación, <em>linters</em>, análisis estático</td>
<td style="text-align:left">&lt; 2 min</td>
<td style="text-align:left">Se rechaza el cambio</td>
</tr>
<tr>
<td style="text-align:left"><strong>2. Unitarias</strong></td>
<td style="text-align:left">Toda la suite unitaria + cobertura</td>
<td style="text-align:left">&lt; 5 min</td>
<td style="text-align:left">Se rechaza el cambio</td>
</tr>
<tr>
<td style="text-align:left"><strong>3. Integración</strong></td>
<td style="text-align:left">API, base de datos en contenedor</td>
<td style="text-align:left">&lt; 15 min</td>
<td style="text-align:left">Se rechaza el cambio</td>
</tr>
<tr>
<td style="text-align:left"><strong>4. Desplegar en QA</strong></td>
<td style="text-align:left">Instalación automática</td>
<td style="text-align:left">—</td>
<td style="text-align:left">Se investiga el entorno</td>
</tr>
<tr>
<td style="text-align:left"><strong>5. E2E y humo</strong></td>
<td style="text-align:left">Flujos críticos por la interfaz</td>
<td style="text-align:left">&lt; 30 min</td>
<td style="text-align:left">Se bloquea la liberación</td>
</tr>
<tr>
<td style="text-align:left"><strong>6. No funcionales</strong></td>
<td style="text-align:left">Carga, seguridad (DAST)</td>
<td style="text-align:left">Nocturno</td>
<td style="text-align:left">Se reporta</td>
</tr>
</tbody>
</table>
</step>
<step>
<h3 id="las-reglas-del-juego">Las reglas del juego</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%94%B4-rojo--todos-paran"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> Rojo = todos paran</h3>
<p>Un <em>build</em> roto es la prioridad del equipo: nadie integra encima de un rojo</p>
</div>
<div>
<h3 id="%E2%9A%A1-r%C3%A1pido-primero"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> Rápido primero</h3>
<p>Lo más rápido y lo que más falla, al principio del pipeline</p>
</div>
<div>
<h3 id="%F0%9F%8E%B2-cero-pruebas-inestables"><img class="emoji" draggable="false" alt="🎲" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3b2.svg" data-marp-twemoji=""/> Cero pruebas inestables</h3>
<p>Una prueba que falla «a veces» (<em>flaky</em>) se arregla o se elimina: si no, el equipo aprende a ignorar el rojo</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="📎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ce.svg" data-marp-twemoji=""/> Herramientas: GitHub Actions, GitLab CI, Jenkins, Azure Pipelines</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="67" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="los-riesgos-de-automatizar">Los riesgos de automatizar</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Riesgo</th>
<th style="text-align:left">Cómo se ve</th>
<th style="text-align:left">Cómo se evita</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Pruebas frágiles</strong></td>
<td style="text-align:left">Fallan cuando cambia un color o un <code>id</code></td>
<td style="text-align:left">Localizadores estables (<code>data-testid</code>), menos E2E</td>
</tr>
<tr>
<td style="text-align:left"><strong>Pruebas inestables</strong> (<em>flaky</em>)</td>
<td style="text-align:left">Pasan o fallan sin que cambie el código</td>
<td style="text-align:left">Sin <code>sleep</code> fijos; datos aislados; reloj inyectado</td>
</tr>
<tr>
<td style="text-align:left"><strong>Falsa seguridad</strong></td>
<td style="text-align:left">90 % de cobertura, pero sin <code>assert</code> útiles</td>
<td style="text-align:left"><strong>Pruebas de mutación</strong> (PIT, Stryker)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Costo de mantenimiento</strong></td>
<td style="text-align:left">Más tiempo arreglando pruebas que código</td>
<td style="text-align:left">Refactorizar las pruebas igual que el código</td>
</tr>
<tr>
<td style="text-align:left"><strong>Automatizar lo equivocado</strong></td>
<td style="text-align:left">Una suite enorme que no cubre lo crítico</td>
<td style="text-align:left">Partir del <strong>riesgo</strong> y de la matriz de trazabilidad</td>
</tr>
<tr>
<td style="text-align:left"><strong>Paradoja del pesticida</strong></td>
<td style="text-align:left">La suite pasa siempre y los usuarios encuentran defectos</td>
<td style="text-align:left">Revisar y renovar los casos; sumar exploratorias</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>Una suite con 85 % de cobertura no detecta un defecto que cambia <code>&gt;=</code> por <code>&gt;</code>. ¿Qué herramienta lo habría revelado?</em> → <spoiler>las pruebas de mutación: generan exactamente ese mutante y verifican si alguna prueba falla</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-marpit-scope-1vnnl6AX="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="68" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="79">
<h1 id="artefactos-de-la-disciplina">Artefactos de la disciplina</h1>
<h2 id="contenidos-7">Contenidos</h2>
<ul>
<li>Plan de Calidad del Software</li>
<li>Plan de Pruebas</li>
<li>Elementos de Prueba</li>
<li>Resultados de Prueba</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="69" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="los-artefactos-y-c%C3%B3mo-se-encadenan">Los artefactos y cómo se encadenan</h2>
<p><a href="../assets/ads-pru-artefactos.svg"><img src="../assets/ads-pru-artefactos.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="70" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="plan-de-calidad-del-software">Plan de Calidad del Software</h2>
<split-slide style="--left: 48%; --right: 52%;">
<div>
<h3 id="qu%C3%A9-es-1">Qué es</h3>
<ul>
<li>
<p>El documento que define <strong>qué significa calidad</strong> en este proyecto y <strong>cómo se va a asegurar</strong></p>
</li>
<li>
<p>Es más amplio que el plan de pruebas: las pruebas son <strong>una</strong> de las actividades de aseguramiento de la calidad (SQA)</p>
</li>
<li>
<p>Se escribe <strong>al inicio</strong> del proyecto y lo aprueba la dirección</p>
</li>
<li>
<p>Norma de referencia: <strong>IEEE 730</strong> — <em>Software Quality Assurance Processes</em></p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Calidad = <strong>aseguramiento</strong> (prevenir: procesos, estándares, revisiones) + <strong>control</strong> (detectar: pruebas, inspecciones)</p>
</li>
</ul>
</div>
<div>
<h3 id="contenido-t%C3%ADpico">Contenido típico</h3>
<ol>
<li>Propósito y alcance</li>
<li><strong>Objetivos de calidad</strong> medibles (ISO/IEC 25010: funcionalidad, rendimiento, seguridad, usabilidad…)</li>
<li><strong>Organización</strong> y responsabilidades de SQA</li>
<li><strong>Estándares</strong> y convenciones: codificación, documentación, nomenclatura</li>
<li><strong>Revisiones y auditorías</strong>: cuáles, cuándo, quién</li>
<li><strong>Estrategia de pruebas</strong> (remite al Plan de Pruebas)</li>
<li><strong>Gestión de defectos</strong> y de la configuración</li>
<li><strong>Métricas</strong> que se recolectan y umbrales</li>
<li>Herramientas, técnicas y metodologías</li>
<li>Gestión de <strong>riesgos</strong> de calidad</li>
</ol>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="71" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="plan-de-pruebas">Plan de Pruebas</h2>
<steps>
<step>
<h3 id="qu%C3%A9-es-2">Qué es</h3>
<ul>
<li>Describe el <strong>alcance, enfoque, recursos y calendario</strong> de las actividades de prueba</li>
<li>Identifica <strong>qué</strong> se va a probar, <strong>qué no</strong>, <strong>quién</strong> lo hace, <strong>cómo</strong> y con qué <strong>criterios</strong> se decide si pasa</li>
<li>Puede haber un <strong>plan maestro</strong> y planes <strong>por nivel</strong> (unidad, integración, sistema, aceptación)</li>
<li>Normas: <strong>IEEE 829</strong> (clásica) y su sucesora <strong>ISO/IEC/IEEE 29119-3</strong></li>
</ul>
</step>
<step>
<h3 id="secciones-ieee-829">Secciones (IEEE 829)</h3>

<th style="text-align:left">Sección</th>

<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> La sección 6 es la más honesta del documento: dejar por escrito qué <strong>no</strong> se probará obliga a aceptar el riesgo <strong>en voz alta</strong></li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-marpit-scope-yeL0Lum8="" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="72" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="elementos-de-prueba">Elementos de Prueba</h2>

<div>

<li><strong>El elemento bajo prueba</strong> (<em>test item</em>): el software concreto que se prueba — un módulo, un componente, una versión — identificado en el plan con su número de versión</li>
<li><strong>Los elementos que se construyen para probar</strong> (<em>testware</em>): todo lo que hace falta para ejecutar las pruebas</li>

<h2 id="resultados-de-prueba">Resultados de Prueba</h2>

<step>
<h3 id="los-tres-documentos">Los tres documentos</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%93%92-bit%C3%A1cora-de-ejecuci%C3%B3n"><img class="emoji" draggable="false" alt="📒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d2.svg" data-marp-twemoji=""/> Bitácora de ejecución</h3>

<h2 id="actividad-2-un-plan-de-pruebas-m%C3%ADnimo">Actividad 2: un plan de pruebas mínimo</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="el-escenario">El escenario</h3>
<p>Retome el sistema de <strong>matrícula</strong> de la Actividad 1. Se libera en 6 semanas; el equipo tiene 4 desarrolladores y 1 analista de pruebas a medio tiempo.</p>
<h3 id="qu%C3%A9-entregar-una-p%C3%A1gina">Qué entregar (una página)</h3>
<ol>
<li><strong>Elementos de prueba</strong> y versión</li>
<li><strong>Características a probar</strong> y <strong>una</strong> que <strong>no</strong> se probará, con su justificación</li>
<li><strong>Enfoque</strong>: qué niveles, qué se automatiza, con qué herramientas</li>
<li><strong>Criterios de salida</strong> (al menos tres, medibles)</li>
<li><strong>Dos riesgos</strong> del plan y su contingencia</li>
</ol>
</div>
<div>
<h3 id="preguntas-de-control-1">Preguntas de control</h3>
<ul>
<li>¿Quién hace las pruebas unitarias y quién las de sistema, si solo hay un analista?</li>
<li>¿La prueba de carga de 4 000 usuarios entra en el plan? ¿En qué semana?</li>
<li>¿Qué pasa si en la semana 5 hay 3 defectos críticos abiertos?</li>
<li>¿Qué de lo que van a probar <strong>automatizarían</strong> primero y por qué?</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 25 minutos · en grupos · se comparan los criterios de salida entre grupos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="77" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="actividad-2-una-soluci%C3%B3n-posible">Actividad 2: una solución posible</h2>
<hidden label="Solución">
<split-slide style="--left: 50%; --right: 50%;">
<div>
<ul>
<li><strong>Elementos</strong>: Sistema de Matrícula v1.0 — módulos Matrícula, Expediente (réplica) e Integración con Cobros</li>
<li><strong>A probar</strong>: CU-12 Matricular, CU-13 Retirar, CU-14 Consultar horario; RS-01 carga; RS-05 autorización</li>
<li><strong>No se probará</strong>: la interfaz de <strong>administración de planes de estudio</strong> — se usa una vez por semestre y la opera una sola persona; riesgo aceptado por el cliente</li>
<li><strong>Enfoque</strong>: unitarias por cada desarrollador (JUnit, ≥ 80 % de decisiones en el dominio); integración de API con Testcontainers; E2E solo de CU-12 con Playwright; carga con k6 en la <strong>semana 4</strong>; aceptación con 10 estudiantes en la semana 6</li>
</ul>
</div>
<div>
<ul>
<li><strong>Criterios de salida</strong>: 100 % de casos de prioridad alta ejecutados · 0 defectos críticos o altos abiertos · percentil 95 &lt; 3 s con 4 000 usuarios · aprobación escrita de Registro</li>
<li><strong>Riesgos</strong>:
<ul>
<li>el analista no da abasto → los desarrolladores prueban en pares <strong>el código del otro</strong></li>
<li>el sistema de Cobros no tiene ambiente de pruebas → <strong>stub</strong> de Cobros con contrato acordado</li>
</ul>
</li>
<li><strong>Si en la semana 5 hay 3 críticos</strong> → aplica el criterio de suspensión: se congela funcionalidad nueva y el equipo completo corrige</li>
<li><strong>Primero se automatiza</strong> la regresión de CU-12: es el más usado, el de mayor riesgo y el que más va a cambiar</li>
</ul>
</div>
</split-slide>
</hidden>

<h2 id="cierre-ideas-para-llevarse">Cierre: ideas para llevarse</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%AA-probar-es-medir"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Probar es medir</h3>
<p>Con evidencia y contra una vara: los requerimientos</p>
</div>
<div>
<h3 id="%F0%9F%94%8E-encuentra-no-garantiza"><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50e.svg" data-marp-twemoji=""/> Encuentra, no garantiza</h3>
<p>Las pruebas muestran presencia de defectos, nunca ausencia</p>
</div>
<div>
<h3 id="%E2%AC%9B%E2%AC%9C-dos-miradas"><img class="emoji" draggable="false" alt="⬛" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b1b.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⬜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b1c.svg" data-marp-twemoji=""/> Dos miradas</h3>
<p>Caja negra ve lo que falta; caja blanca ve lo que sobra</p>
</div>
<div>
<h3 id="%F0%9F%93%84-desde-el-caso-de-uso"><img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c4.svg" data-marp-twemoji=""/> Desde el caso de uso</h3>
<p>Escenarios → matriz → datos, y una matriz de trazabilidad que lo amarra</p>
</div>
<div>
<h3 id="%E2%8F%B1%EF%B8%8F-temprano-y-siempre"><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> Temprano y siempre</h3>
<p>Desarrollo, fase de pruebas y liberación, en cada iteración</p>
</div>
<div>
<h3 id="%F0%9F%A4%96-automatizar-lo-repetible"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> Automatizar lo repetible</h3>
<p>Muchas unitarias, pocas E2E; el criterio humano no se automatiza</p>
</div>
</div>
</section>
