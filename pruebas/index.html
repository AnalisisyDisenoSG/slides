<li>Automatización y artefactos</li>
</ul>
<blockquote>
<p>Curso <strong>Análisis y Diseño de Sistemas</strong> <br />II Semestre 2026</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="%C2%BFd%C3%B3nde-estamos">¿Dónde estamos?</h2>
<ul>
<li>Ya sabemos <strong>qué</strong> debe hacer el sistema: requerimientos, casos de uso, especificaciones suplementarias</li>
<li>Ya sabemos <strong>cómo</strong> se va a construir: arquitectura, clases de diseño, base de datos</li>
<li>Falta la pregunta incómoda: <strong>¿cómo sabemos que lo construido hace lo que se pidió?</strong></li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%93%8B-requerimientos"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Requerimientos</h3>
<p><em>¿Qué se pidió?</em><br />
Son la <strong>vara</strong> contra la que se mide</p>
</div>
<div>
<h3 id="%F0%9F%8F%97%EF%B8%8F-dise%C3%B1o-e-implementaci%C3%B3n"><img class="emoji" draggable="false" alt="🏗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3d7.svg" data-marp-twemoji=""/> Diseño e implementación</h3>
<p><em>¿Qué se construyó?</em><br />
Es el <strong>objeto</strong> que se mide</p>
</div>
<div>
<h3 id="%F0%9F%A7%AA-pruebas"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Pruebas</h3>
<p><em>¿Coinciden?</em><br />
Es el <strong>acto</strong> de medir, con evidencia</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Probar no es lo que se hace «al final, si sobra tiempo». Es una disciplina que <strong>corre en paralelo</strong> a todas las demás desde el primer día</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-4GTSm502="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="3" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="79">
<h1 id="prop%C3%B3sitos-de-la-disciplina">Propósitos de la disciplina</h1>
<h2 id="contenidos-1">Contenidos</h2>
<ul>
<li>Qué es probar y qué no es</li>
<li>Error, defecto y falla</li>
<li>Los límites de las pruebas</li>
<li>El oráculo</li>
<li>Los siete principios</li>
<li>El proceso de pruebas</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="%C2%BFqu%C3%A9-son-las-pruebas">¿Qué son las pruebas?</h2>
<steps>
<step>
<h3 id="la-definici%C3%B3n">La definición</h3>
<blockquote>
<p>«Las pruebas de software consisten en la <strong>verificación dinámica</strong> de que un programa ofrece los comportamientos esperados sobre un <strong>conjunto finito de casos de prueba</strong>, seleccionados adecuadamente del dominio de ejecución, normalmente infinito»<br />
— <em>SWEBOK v3, capítulo 4</em></p>
</blockquote>
<ul>
<li><strong>Dinámica</strong>: siempre implica <strong>ejecutar</strong> el programa. Revisar código sin ejecutarlo es <em>verificación estática</em> (inspecciones, revisiones, análisis estático)</li>
<li><strong>Finito</strong>: nunca se prueba todo; se <strong>escoge</strong> qué probar</li>
<li><strong>Esperados</strong>: alguien tiene que saber de antemano qué debería pasar</li>
</ul>
</step>
<step>
<h3 id="para-qu%C3%A9-sirven">Para qué sirven</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%93%8F-evaluar"><img class="emoji" draggable="false" alt="📏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cf.svg" data-marp-twemoji=""/> Evaluar</h3>
<p>Medir la <strong>calidad</strong> del producto con evidencia, no con opiniones</p>
</div>
<div>
<h3 id="%F0%9F%94%8E-encontrar"><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50e.svg" data-marp-twemoji=""/> Encontrar</h3>
<p>Identificar <strong>defectos</strong> antes de que los encuentre el usuario</p>
</div>
<div>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-prevenir"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> Prevenir</h3>
<p>Diseñar pruebas temprano <strong>expone ambigüedades</strong> en los requerimientos</p>
</div>
<div>
<h3 id="%E2%9C%85-dar-confianza"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Dar confianza</h3>
<p>Aportar información para decidir <strong>si se libera o no</strong></p>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="los-prop%C3%B3sitos-de-la-disciplina">Los propósitos de la disciplina</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Propósito</th>
<th style="text-align:left">Qué significa en la práctica</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Encontrar y documentar defectos</strong></td>
<td style="text-align:left">En la calidad del software, no solo en el código: también en requerimientos y diseño</td>
</tr>
<tr>
<td style="text-align:left"><strong>Asesorar sobre la calidad percibida</strong></td>
<td style="text-align:left">Darle a quien decide una lectura honesta del estado del producto</td>
</tr>
<tr>
<td style="text-align:left"><strong>Validar los supuestos</strong></td>
<td style="text-align:left">Probar que las decisiones de diseño y de requerimientos <strong>funcionan de verdad</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Verificar que el producto funciona como se diseñó</strong></td>
<td style="text-align:left">Comprobar el «cómo» contra la especificación</td>
</tr>
<tr>
<td style="text-align:left"><strong>Validar que se implementaron los requerimientos</strong></td>
<td style="text-align:left">Comprobar el «qué» contra lo que el usuario pidió</td>
</tr>
<tr>
<td style="text-align:left"><strong>Reducir el riesgo</strong></td>
<td style="text-align:left">Atacar primero lo que más daño haría si falla</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Los propósitos vienen de la disciplina de pruebas del <strong>RUP</strong>. Ojo con el que <strong>no</strong> está: <em>«demostrar que el sistema no tiene errores»</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="verificaci%C3%B3n-y-validaci%C3%B3n">Verificación y validación</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%E2%9C%94%EF%B8%8F-verificaci%C3%B3n"><img class="emoji" draggable="false" alt="✔️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2714.svg" data-marp-twemoji=""/> Verificación</h3>
<p><em>¿Estamos construyendo <strong>bien</strong> el producto?</em></p>
<ul>
<li>Compara el producto contra su <strong>especificación</strong></li>
<li>Pregunta interna del equipo</li>
<li>Se apoya en revisiones, inspecciones y pruebas de unidad e integración</li>
<li>Un sistema puede pasar toda la verificación y aun así <strong>no servirle a nadie</strong></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8E%AF-validaci%C3%B3n"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Validación</h3>
<p><em>¿Estamos construyendo <strong>el producto correcto</strong>?</em></p>
<ul>
<li>Compara el producto contra las <strong>necesidades reales</strong> del usuario</li>
<li>Pregunta que solo contesta el usuario</li>
<li>Se apoya en prototipos, pruebas de sistema y de aceptación</li>
<li>Detecta los requerimientos <strong>mal entendidos o ausentes</strong></li>
</ul>
</div>
</split-slide>
<blockquote>
<p>«Verificación: ¿construimos bien el producto? Validación: ¿construimos el producto correcto?»<br />
— <em>Barry Boehm, 1979</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="error-defecto-y-falla">Error, defecto y falla</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Término</th>
<th style="text-align:left">Qué es</th>
<th style="text-align:left">Dónde vive</th>
<th style="text-align:left">Ejemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Error</strong> (equivocación)</td>
<td style="text-align:left">Una acción <strong>humana</strong> que produce un resultado incorrecto</td>
<td style="text-align:left">En la cabeza de alguien</td>
<td style="text-align:left">El analista entendió «mayor que» donde el usuario dijo «mayor o igual»</td>
</tr>
<tr>
<td style="text-align:left"><strong>Defecto</strong> (<em>bug</em>, falta)</td>
<td style="text-align:left">La imperfección <strong>en un artefacto</strong>: código, requerimiento, diseño</td>
<td style="text-align:left">En el producto</td>
<td style="text-align:left"><code>if (edad &gt; 18)</code> en vez de <code>if (edad &gt;= 18)</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Falla</strong> (<em>failure</em>)</td>
<td style="text-align:left">La desviación <strong>observable</strong> del comportamiento esperado al ejecutar</td>
<td style="text-align:left">En la ejecución</td>
<td style="text-align:left">Un estudiante de 18 años no puede matricular</td>
</tr>
<tr>
<td style="text-align:left"><strong>Incidente</strong></td>
<td style="text-align:left">Cualquier evento que <strong>requiere investigación</strong></td>
<td style="text-align:left">En el reporte</td>
<td style="text-align:left">«No me deja matricular» — ¿defecto, dato o mal uso?</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> La cadena es siempre la misma: <strong>error → defecto → falla</strong>. Un defecto puede quedar dormido años si nadie ejecuta esa línea con ese dato</li>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Las pruebas <strong>provocan fallas</strong>; la <strong>depuración</strong> encuentra el defecto que las causa. Son actividades distintas</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="ideas-preconcebidas-sobre-las-pruebas">Ideas preconcebidas sobre las pruebas</h2>
<steps>
<step>
<h3 id="tres-preguntas-antes-de-empezar">Tres preguntas antes de empezar</h3>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>¿Pueden las pruebas demostrar la <strong>ausencia</strong> de errores?</em> → <spoiler>No. Solo demuestran su presencia</spoiler></li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>¿Se puede hacer una prueba <strong>exhaustiva</strong>, con todas las posibilidades?</em> → <spoiler>No, salvo en programas de juguete. El espacio de entradas es astronómico</spoiler></li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>Si una prueba <strong>descubre</strong> un error, ¿tuvo éxito o fracasó?</em> → <spoiler>Tuvo éxito: para eso se escribió</spoiler></li>
</ul>
</step>
<step>
<h3 id="por-qu%C3%A9-no-se-puede-probar-todo">Por qué no se puede probar todo</h3>
<ul>
<li>Una función que recibe <strong>dos enteros de 32 bits</strong> tiene 2⁶⁴ ≈ 1,8 × 10¹⁹ combinaciones. A un millón de pruebas por segundo: <strong>más de 580 000 años</strong></li>
<li>Y eso sin contar el <strong>estado</strong>: un sistema complejo reacciona distinto a la misma entrada según lo que pasó antes</li>
<li>Hay que buscar un <strong>equilibrio</strong> entre recursos, tiempo y riesgo:
<ul>
<li>seleccionar <strong>valores de entrada</strong> representativos</li>
<li>seleccionar un <strong>conjunto finito</strong> de casos de prueba</li>
<li>el <strong>criterio de selección</strong> depende de la técnica de prueba</li>
</ul>
</li>
</ul>
<blockquote>
<p>«Probar programas sirve para demostrar la presencia de errores, pero nunca para demostrar su ausencia»<br />
— <em>Edsger W. Dijkstra, 1970</em></p>
</blockquote>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="el-or%C3%A1culo">El oráculo</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="qu%C3%A9-es">Qué es</h3>
<blockquote>
<p>Agente — humano o no — que decide si un programa actuó correctamente en una prueba dada, emitiendo un veredicto de <strong>«pasa»</strong> o <strong>«falla»</strong></p>
</blockquote>
<ul>
<li>Toda prueba compara la <strong>salida obtenida</strong> con la <strong>esperada</strong></li>
<li>La salida esperada sale de: la especificación, los requerimientos, las expectativas del usuario, un sistema anterior, un cálculo independiente</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Sin oráculo no hay prueba: hay <strong>ejecución</strong></li>
</ul>
</div>
<div>
<h3 id="tipos-de-or%C3%A1culo">Tipos de oráculo</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Oráculo</th>
<th style="text-align:left">Ejemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Especificación</strong></td>
<td style="text-align:left">«El IVA es el 13 % del subtotal»</td>
</tr>
<tr>
<td style="text-align:left"><strong>Sistema de referencia</strong></td>
<td style="text-align:left">El sistema viejo calculaba lo mismo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Cálculo inverso</strong></td>
<td style="text-align:left"><code>raiz(x)² ≈ x</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Propiedad</strong></td>
<td style="text-align:left">Una lista ordenada no cambia de tamaño</td>
</tr>
<tr>
<td style="text-align:left"><strong>Humano experto</strong></td>
<td style="text-align:left">La contadora revisa el reporte</td>
</tr>
<tr>
<td style="text-align:left"><strong>Regresión</strong></td>
<td style="text-align:left">Hoy da lo mismo que ayer</td>
</tr>
</tbody>
</table>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="ejemplo-%C2%BFbastan-estos-casos">Ejemplo: ¿bastan estos casos?</h2>
<split-slide style="--left: 48%; --right: 52%;">
<div>
<h3 id="el-c%C3%B3digo">El código</h3>
<pre><code class="language-text">if (A + B + C) / 3 == A
then print(&quot;A, B y C son iguales&quot;)
else print(&quot;A, B y C no son iguales&quot;)
</code></pre>
<h3 id="los-casos-propuestos">Los casos propuestos</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Caso</th>
<th style="text-align:left">A</th>
<th style="text-align:left">B</th>
<th style="text-align:left">C</th>
<th style="text-align:left">Salida</th>
<th style="text-align:left">¿Correcto?</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">1</td>
<td style="text-align:left">5</td>
<td style="text-align:left">5</td>
<td style="text-align:left">5</td>
<td style="text-align:left">iguales</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
</tr>
<tr>
<td style="text-align:left">2</td>
<td style="text-align:left">2</td>
<td style="text-align:left">3</td>
<td style="text-align:left">7</td>
<td style="text-align:left">no iguales</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
</tr>
</tbody>
</table>
</div>
<div>
<h3 id="las-preguntas">Las preguntas</h3>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>¿Son suficientes estos dos casos?</em> → <spoiler>No: ambos pasan y el programa está mal</spoiler></p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>¿Qué caso lo rompe?</em> → <spoiler>A = 2, B = 1, C = 3: el promedio es 2 = A, pero no son iguales</spoiler></p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>¿Qué cobertura de sentencias logran los dos casos?</em> → <spoiler>100 %. Y aun así el defecto sobrevive</spoiler></p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Lección: <strong>cubrir todo el código no es probar todo el comportamiento</strong>. Hace falta pensar en las entradas que <strong>engañan</strong> a la lógica</p>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="los-siete-principios-de-las-pruebas">Los siete principios de las pruebas</h2>
<div class="grid">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-muestran-presencia"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Muestran presencia</h3>
<p>Las pruebas revelan defectos; <strong>no</strong> prueban que no existan</p>
</div>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-exhaustivas-imposibles"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Exhaustivas: imposibles</h3>
<p>Se prueba por <strong>riesgo y prioridad</strong>, no todo</p>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-temprano-ahorra"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Temprano ahorra</h3>
<p>Un defecto en requerimientos cuesta <strong>mucho menos</strong> si se encuentra ahí (<em>shift-left</em>)</p>
</div>
<div>
<h3 id="4%EF%B8%8F%E2%83%A3-los-defectos-se-agrupan"><img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/34-20e3.svg" data-marp-twemoji=""/> Los defectos se agrupan</h3>
<p>Pocos módulos concentran la mayoría de los defectos (Pareto)</p>
</div>
<div>
<h3 id="5%EF%B8%8F%E2%83%A3-la-paradoja-del-pesticida"><img class="emoji" draggable="false" alt="5️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/35-20e3.svg" data-marp-twemoji=""/> La paradoja del pesticida</h3>
<p>Repetir siempre las mismas pruebas deja de encontrar defectos nuevos</p>
</div>
<div>
<h3 id="6%EF%B8%8F%E2%83%A3-dependen-del-contexto"><img class="emoji" draggable="false" alt="6️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/36-20e3.svg" data-marp-twemoji=""/> Dependen del contexto</h3>
<p>No se prueba igual un videojuego que un marcapasos</p>
</div>
<div>
<h3 id="7%EF%B8%8F%E2%83%A3-falacia-de-la-ausencia-de-errores"><img class="emoji" draggable="false" alt="7️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/37-20e3.svg" data-marp-twemoji=""/> Falacia de la ausencia de errores</h3>
<p>Un sistema sin defectos que <strong>no resuelve la necesidad</strong> sigue siendo un fracaso</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="📎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ce.svg" data-marp-twemoji=""/> Fuente: <em>ISTQB Certified Tester Foundation Level</em>, v4.0 (2023)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="el-proceso-de-pruebas">El proceso de pruebas</h2>
<p><a href="../assets/ads-pru-proceso.svg"><img src="../assets/ads-pru-proceso.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="las-actividades-del-proceso">Las actividades del proceso</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Actividad</th>
<th style="text-align:left">Qué se hace</th>
<th style="text-align:left">Qué produce</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Planificación</strong></td>
<td style="text-align:left">Definir alcance, enfoque, recursos, calendario, riesgos y criterios de salida</td>
<td style="text-align:left"><strong>Plan de pruebas</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Diseño</strong></td>
<td style="text-align:left">Escoger técnicas, derivar casos, preparar datos y entorno</td>
<td style="text-align:left"><strong>Casos y procedimientos</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Ejecución</strong></td>
<td style="text-align:left">Correr los casos — a mano o automatizados — y registrar lo que pasó</td>
<td style="text-align:left"><strong>Bitácora</strong> de ejecución</td>
</tr>
<tr>
<td style="text-align:left"><strong>Evaluación</strong></td>
<td style="text-align:left">Comparar lo obtenido con lo esperado (oráculo)</td>
<td style="text-align:left">Veredictos y <strong>reportes de incidentes</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Depuración</strong></td>
<td style="text-align:left">Localizar y corregir el defecto que causó la falla</td>
<td style="text-align:left">Software corregido → <strong>se vuelve a probar</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Análisis de errores</strong></td>
<td style="text-align:left">Estadísticas: dónde se concentran, por qué ocurren</td>
<td style="text-align:left"><strong>Informe resumen</strong>, acciones preventivas</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> La flecha que vuelve a <strong>Desarrollo</strong> es la más valiosa: si un tipo de defecto se repite, se cambia el <strong>proceso</strong>, no solo el código</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-pSR3y5fh="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="14" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="79">
<h1 id="caja-negra-y-caja-blanca">Caja negra y caja blanca</h1>
<h2 id="contenidos-2">Contenidos</h2>
<ul>
<li>Los dos enfoques</li>
<li>Partición de equivalencia y valores límite</li>
<li>Tablas de decisión y transición de estados</li>
<li>Criterios de cobertura</li>
<li>Complejidad ciclomática y caminos básicos</li>
<li>Otras fuentes de casos de prueba</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="dos-formas-de-mirar-el-programa">Dos formas de mirar el programa</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%E2%AC%9B-caja-negra--funcional"><img class="emoji" draggable="false" alt="⬛" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b1b.svg" data-marp-twemoji=""/> Caja negra — <em>funcional</em></h3>
<ul>
<li>Los casos se basan <strong>solo</strong> en el comportamiento de <strong>entrada / salida</strong></li>
<li>Se diseñan desde la <strong>especificación</strong>: requerimientos, casos de uso, contratos</li>
<li>No hace falta ver el código: lo puede diseñar alguien que <strong>nunca lo leyó</strong></li>
<li>Buscan asegurar que:
<ul>
<li>se probó <strong>toda clase</strong> de entrada</li>
<li>la salida observada <strong>es</strong> la esperada</li>
</ul>
</li>
<li>Encuentran: funciones <strong>faltantes</strong>, interpretaciones erróneas, errores de interfaz</li>
</ul>
</div>
<div>
<h3 id="%E2%AC%9C-caja-blanca--estructural"><img class="emoji" draggable="false" alt="⬜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b1c.svg" data-marp-twemoji=""/> Caja blanca — <em>estructural</em></h3>
<ul>
<li>Los casos se basan en <strong>cómo</strong> se diseñó o codificó el software</li>
<li>Se diseñan desde el <strong>código</strong>: decisiones, caminos, flujo de datos</li>
<li>Interesa la <strong>cobertura</strong> alcanzada dentro de la unidad bajo prueba</li>
<li>Buscan asegurar que:
<ul>
<li>cada <strong>sentencia</strong> y cada <strong>decisión</strong> se ejercitó</li>
<li>no quedan caminos <strong>sin recorrer</strong></li>
</ul>
</li>
<li>Encuentran: código <strong>muerto</strong>, ramas olvidadas, condiciones mal escritas</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> No compiten, <strong>se complementan</strong>: la caja blanca no ve lo que <strong>falta</strong> en el código; la caja negra no ve lo que <strong>sobra</strong></li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>Caja gris</strong>: se diseña desde la especificación, pero conociendo la arquitectura interna (típico en pruebas de integración y de API)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="caja-negra-partici%C3%B3n-de-equivalencia">Caja negra: partición de equivalencia</h2>
<steps>
<step>
<h3 id="la-idea">La idea</h3>
<ul>
<li>Dividir el dominio de entrada en <strong>clases de equivalencia</strong>: conjuntos de valores que el programa <strong>debería tratar igual</strong></li>
<li>Si un valor de la clase revela un defecto, los demás probablemente también. Basta <strong>un representante</strong> por clase</li>
<li>Se identifican clases <strong>válidas</strong> y <strong>no válidas</strong></li>
</ul>
</step>
<step>
<h3 id="ejemplo-%C2%ABel-sistema-acepta-matr%C3%ADcula-a-estudiantes-de-16-a-65-a%C3%B1os-con-un-m%C3%A1ximo-de-18-cr%C3%A9ditos%C2%BB">Ejemplo: <em>«El sistema acepta matrícula a estudiantes de 16 a 65 años, con un máximo de 18 créditos»</em></h3>
<table>
<thead>
<tr>
<th style="text-align:left">Entrada</th>
<th style="text-align:left">Clases válidas</th>
<th style="text-align:left">Clases no válidas</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Edad</td>
<td style="text-align:left"><strong>CE1</strong>: 16 ≤ edad ≤ 65</td>
<td style="text-align:left"><strong>CE2</strong>: edad &lt; 16 · <strong>CE3</strong>: edad &gt; 65 · <strong>CE4</strong>: no numérica</td>
</tr>
<tr>
<td style="text-align:left">Créditos</td>
<td style="text-align:left"><strong>CE5</strong>: 1 ≤ créditos ≤ 18</td>
<td style="text-align:left"><strong>CE6</strong>: créditos &lt; 1 · <strong>CE7</strong>: créditos &gt; 18</td>
</tr>
</tbody>
</table>
<ul>
<li>Regla: un caso de prueba cubre <strong>todas las clases válidas que pueda</strong>, pero <strong>una sola clase no válida</strong> a la vez — si no, un error tapa al otro</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Caso</th>
<th style="text-align:left">Edad</th>
<th style="text-align:left">Créditos</th>
<th style="text-align:left">Clases cubiertas</th>
<th style="text-align:left">Esperado</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">1</td>
<td style="text-align:left">30</td>
<td style="text-align:left">12</td>
<td style="text-align:left">CE1, CE5</td>
<td style="text-align:left">Acepta</td>
</tr>
<tr>
<td style="text-align:left">2</td>
<td style="text-align:left">10</td>
<td style="text-align:left">12</td>
<td style="text-align:left">CE2</td>
<td style="text-align:left">Rechaza por edad</td>
</tr>
<tr>
<td style="text-align:left">3</td>
<td style="text-align:left">30</td>
<td style="text-align:left">25</td>
<td style="text-align:left">CE7</td>
<td style="text-align:left">Rechaza por créditos</td>
</tr>
</tbody>
</table>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="caja-negra-valores-l%C3%ADmite">Caja negra: valores límite</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="por-qu%C3%A9-los-bordes">Por qué los bordes</h3>
<ul>
<li>Los programadores se equivocan <strong>en los bordes</strong>: <code>&lt;</code> en vez de <code>&lt;=</code>, contar desde 0 o desde 1</li>
<li>Complementa la partición: en vez de <strong>cualquier</strong> valor de la clase, se escogen los de <strong>la frontera</strong></li>
<li>Para un rango <code>[min, max]</code> se prueban: <code>min-1</code>, <code>min</code>, <code>max</code>, <code>max+1</code> (y a veces <code>min+1</code>, <code>max-1</code>)</li>
</ul>
</div>
<div>
<h3 id="para-el-ejemplo-anterior">Para el ejemplo anterior</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Entrada</th>
<th style="text-align:left">Valores límite</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Edad</td>
<td style="text-align:left"><strong>15</strong>, <strong>16</strong>, <strong>65</strong>, <strong>66</strong></td>
</tr>
<tr>
<td style="text-align:left">Créditos</td>
<td style="text-align:left"><strong>0</strong>, <strong>1</strong>, <strong>18</strong>, <strong>19</strong></td>
</tr>
</tbody>
</table>
<ul>
<li>También en las <strong>salidas</strong>: un reporte con 0 filas, con 1, con el máximo de una página, con una más</li>
<li>Y en las <strong>estructuras</strong>: lista vacía, un elemento, llena</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>Si el código dice <code>if (edad &gt; 16 &amp;&amp; edad &lt; 65)</code>, ¿qué casos lo atrapan?</em> → <spoiler>edad = 16 y edad = 65: deberían aceptarse y se rechazan</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="caja-negra-tablas-de-decisi%C3%B3n-y-estados">Caja negra: tablas de decisión y estados</h2>
<split-slide style="--left: 52%; --right: 48%;">
<div>
<h3 id="%F0%9F%93%8A-tabla-de-decisi%C3%B3n"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> Tabla de decisión</h3>
<p>Cuando la salida depende de <strong>combinaciones</strong> de condiciones</p>
<table>
<thead>
<tr>
<th style="text-align:left">Condición</th>
<th style="text-align:left">R1</th>
<th style="text-align:left">R2</th>
<th style="text-align:left">R3</th>
<th style="text-align:left">R4</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">¿Usuario activo?</td>
<td style="text-align:left">S</td>
<td style="text-align:left">S</td>
<td style="text-align:left">S</td>
<td style="text-align:left">N</td>
</tr>
<tr>
<td style="text-align:left">¿Tiene multas?</td>
<td style="text-align:left">N</td>
<td style="text-align:left">N</td>
<td style="text-align:left">S</td>
<td style="text-align:left">—</td>
</tr>
<tr>
<td style="text-align:left">¿Ejemplar disponible?</td>
<td style="text-align:left">S</td>
<td style="text-align:left">N</td>
<td style="text-align:left">—</td>
<td style="text-align:left">—</td>
</tr>
<tr>
<td style="text-align:left"><strong>Acción</strong></td>
<td style="text-align:left">Presta</td>
<td style="text-align:left">Reserva</td>
<td style="text-align:left">Rechaza: multa</td>
<td style="text-align:left">Rechaza: inactivo</td>
</tr>
</tbody>
</table>
<ul>
<li>Cada <strong>columna</strong> es un caso de prueba</li>
<li><code>—</code> significa «no importa»: reduce combinaciones</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%94%84-transici%C3%B3n-de-estados"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> Transición de estados</h3>
<p>Cuando el comportamiento depende de la <strong>historia</strong></p>
<ul>
<li>Se parte del <strong>diagrama de estados</strong> del objeto</li>
<li>Criterios de cobertura:
<ul>
<li>visitar <strong>cada estado</strong></li>
<li>disparar <strong>cada transición</strong></li>
<li>intentar las transiciones <strong>inválidas</strong></li>
</ul>
</li>
<li>Ejemplo con <code>Prestamo</code>: <code>Activo → Devuelto</code> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> · <code>Devuelto → Activo</code> <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> debe rechazarse</li>
<li><img class="emoji" draggable="false" alt="📎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ce.svg" data-marp-twemoji=""/> La notación está en el mazo de <strong>UML</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="caja-blanca-criterios-de-cobertura">Caja blanca: criterios de cobertura</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Criterio</th>
<th style="text-align:left">Exige que…</th>
<th style="text-align:left">Fuerza</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Sentencias</strong></td>
<td style="text-align:left">Cada sentencia se ejecute <strong>al menos una vez</strong></td>
<td style="text-align:left">La más débil</td>
</tr>
<tr>
<td style="text-align:left"><strong>Decisiones</strong> (ramas)</td>
<td style="text-align:left">Cada decisión tome <strong>al menos una vez verdadero y una vez falso</strong></td>
<td style="text-align:left">Incluye a sentencias</td>
</tr>
<tr>
<td style="text-align:left"><strong>Condiciones</strong></td>
<td style="text-align:left">Cada condición <strong>atómica</strong> de cada decisión tome verdadero y falso</td>
<td style="text-align:left">No siempre incluye a decisiones</td>
</tr>
<tr>
<td style="text-align:left"><strong>Decisión / condición</strong></td>
<td style="text-align:left">Se cumplan <strong>a la vez</strong> los criterios de condiciones y de decisiones</td>
<td style="text-align:left">Incluye a ambos</td>
</tr>
<tr>
<td style="text-align:left"><strong>Condición múltiple</strong></td>
<td style="text-align:left">Se prueben <strong>todas las combinaciones</strong> de condiciones de cada decisión</td>
<td style="text-align:left">La más fuerte — y la más cara</td>
</tr>
</tbody>
</table>
<pre><code class="language-java"><span class="hljs-keyword">if</span> (edad &gt;= <span class="hljs-number">16</span> &amp;&amp; creditos &lt;= <span class="hljs-number">18</span>) { aceptar(); } <span class="hljs-keyword">else</span> { rechazar(); }
</code></pre>
<ul>
<li><strong>Decisiones</strong>: basta <code>(20, 10)</code> → V y <code>(10, 10)</code> → F</li>
<li><strong>Condiciones</strong>: <code>(20, 25)</code> y <code>(10, 10)</code> — cada condición fue V y F, ¡pero la decisión <strong>nunca</strong> fue verdadera!</li>
<li><strong>Condición múltiple</strong>: las 4 combinaciones <code>VV</code>, <code>VF</code>, <code>FV</code>, <code>FF</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="caja-blanca-cobertura-en-la-pr%C3%A1ctica">Caja blanca: cobertura en la práctica</h2>
<split-slide style="--left: 55%; --right: 45%;">
<div>
<h3 id="un-m%C3%A9todo-real">Un método real</h3>
<pre><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">getTipo</span><span class="hljs-params">()</span> {
  <span class="hljs-keyword">if</span> (i &lt;= <span class="hljs-number">0</span> || j &lt;= <span class="hljs-number">0</span> || k &lt;= <span class="hljs-number">0</span>)
    <span class="hljs-keyword">return</span> NO_TRIANGULO;
  <span class="hljs-keyword">if</span> (i + j &lt;= k || j + k &lt;= i || i + k &lt;= j)
    <span class="hljs-keyword">return</span> NO_TRIANGULO;
  <span class="hljs-keyword">if</span> (i == j &amp;&amp; j == k)
    <span class="hljs-keyword">return</span> EQUILATERO;
  <span class="hljs-keyword">if</span> (i == j || j == k || i == k)
    <span class="hljs-keyword">return</span> ISOSCELES;
  <span class="hljs-keyword">return</span> ESCALENO;
}
</code></pre>
</div>
<div>
<h3 id="valores-interesantes">Valores interesantes</h3>
<blockquote>
<p>Un valor <strong>interesante</strong> es aquel que permite recorrer la mayor cantidad de código posible</p>
</blockquote>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>¿Qué conjunto mínimo de <code>(i, j, k)</code> logra 100 % de sentencias?</em> → <spoiler>(0,2,4) · (2,3,5) · (2,2,2) · (2,2,3) · (3,4,5)</spoiler></li>
<li>Se ayuda uno con <strong>partición</strong> y <strong>límites</strong>: <code>(2,3,5)</code> está justo en el borde de la desigualdad triangular</li>
<li>Las herramientas (JaCoCo, Istanbul, coverage.py) <strong>miden</strong> la cobertura y señalan las líneas sin recorrer</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Ley de Goodhart aplicada: cuando el 80 % de cobertura se vuelve <strong>meta</strong>, aparecen pruebas que ejecutan código <strong>sin verificar nada</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="caja-blanca-complejidad-ciclom%C3%A1tica">Caja blanca: complejidad ciclomática</h2>
<steps>
<step>
<h3 id="la-m%C3%A9trica-de-mccabe">La métrica de McCabe</h3>
<ul>
<li>Se dibuja el <strong>grafo de flujo</strong> del método: nodos = bloques de sentencias, aristas = saltos</li>
<li>La <strong>complejidad ciclomática</strong> <code>V(G)</code> es el número de <strong>caminos linealmente independientes</strong>:</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Fórmula</th>
<th style="text-align:left">Significado</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>V(G) = E − N + 2</code></td>
<td style="text-align:left">Aristas menos nodos más 2</td>
</tr>
<tr>
<td style="text-align:left"><code>V(G) = P + 1</code></td>
<td style="text-align:left">Decisiones simples (predicados) más 1</td>
</tr>
<tr>
<td style="text-align:left"><code>V(G) = regiones</code></td>
<td style="text-align:left">Regiones cerradas del grafo más la exterior</td>
</tr>
</tbody>
</table>
</step>
<step>
<h3 id="para-qu%C3%A9-sirve">Para qué sirve</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%AA-m%C3%ADnimo-de-casos"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Mínimo de casos</h3>
<p><code>V(G)</code> es el número <strong>mínimo</strong> de casos para cubrir todos los caminos básicos: garantiza sentencias y decisiones</p>
</div>
<div>
<h3 id="%F0%9F%93%8F-se%C3%B1al-de-alerta"><img class="emoji" draggable="false" alt="📏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cf.svg" data-marp-twemoji=""/> Señal de alerta</h3>
<p><code>V(G) &gt; 10</code> suele indicar un método difícil de probar y de mantener: candidato a <strong>refactorizar</strong></p>
</div>
<div>
<h3 id="%F0%9F%A7%AD-gu%C3%ADa-del-dise%C3%B1o"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> Guía del diseño</h3>
<p>Si un método necesita 25 casos para cubrirse, el problema no son las pruebas: es el <strong>diseño</strong></p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>¿Cuánto vale <code>V(G)</code> para <code>getTipo()</code> si cada <code>||</code> y <code>&amp;&amp;</code> cuenta como un predicado?</em> → <spoiler>1 + 3 + 3 + 2 + 3 = 12. Merece dividirse</spoiler></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="otras-fuentes-de-casos-de-prueba">Otras fuentes de casos de prueba</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Fuente</th>
<th style="text-align:left">Técnicas</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>La experiencia del ingeniero</strong></td>
<td style="text-align:left">Ad hoc, <strong>exploratorias</strong>, adivinación de errores (<em>error guessing</em>)</td>
</tr>
<tr>
<td style="text-align:left"><strong>La especificación</strong></td>
<td style="text-align:left">Partición de equivalencia, valores límite, tablas de decisión, máquinas de estados, <strong>casos de uso</strong>, aleatorias</td>
</tr>
<tr>
<td style="text-align:left"><strong>La estructura del código</strong></td>
<td style="text-align:left">Flujo de control (cobertura), <strong>flujo de datos</strong> (definición–uso de variables)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Los defectos</strong></td>
<td style="text-align:left">Modelos de fallas típicas, <strong>mutación</strong> (se inyectan defectos para medir si las pruebas los detectan)</td>
</tr>
<tr>
<td style="text-align:left"><strong>El campo de uso</strong></td>
<td style="text-align:left"><strong>Perfil operacional</strong>: se prueba más lo que más se usa; pruebas guiadas por objetivos de fiabilidad (SRET)</td>
</tr>
<tr>
<td style="text-align:left"><strong>La naturaleza de la aplicación</strong></td>
<td style="text-align:left">Orientada a objetos, basada en componentes, web, interfaz de usuario, concurrente, tiempo real, crítica</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="📎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ce.svg" data-marp-twemoji=""/> Clasificación tomada del <strong>SWEBOK v3, capítulo 4</strong>: el criterio es <strong>de dónde salen</strong> los casos, no qué tan «negros» o «blancos» son</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-RoQHHPru="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="23" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="79">
<h1 id="tipos-de-pruebas">Tipos de pruebas</h1>
<h2 id="contenidos-3">Contenidos</h2>
<ul>
<li>Niveles: unidad, integración, sistema, aceptación</li>
<li>Componentes y casos de uso</li>
<li>Alfa, beta e instalación</li>
<li>Seguridad y otras no funcionales</li>
<li>Regresión y humo</li>
<li>Pruebas en sistemas orientados a objetos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="dos-ejes-para-clasificar">Dos ejes para clasificar</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%93%90-por-nivel-%C2%BFqu%C3%A9-tama%C3%B1o"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> Por nivel (<em>¿qué tamaño?</em>)</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Nivel</th>
<th style="text-align:left">Objeto bajo prueba</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Unidad</strong></td>
<td style="text-align:left">Un módulo, una clase, un método</td>
</tr>
<tr>
<td style="text-align:left"><strong>Componentes</strong></td>
<td style="text-align:left">Una pieza reemplazable con interfaz</td>
</tr>
<tr>
<td style="text-align:left"><strong>Integración</strong></td>
<td style="text-align:left">Un grupo de módulos que colaboran</td>
</tr>
<tr>
<td style="text-align:left"><strong>Sistema</strong></td>
<td style="text-align:left">El sistema completo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Aceptación</strong></td>
<td style="text-align:left">El sistema, frente al cliente</td>
</tr>
</tbody>
</table>
</div>
<div>
<h3 id="%F0%9F%8E%AF-por-objetivo-%C2%BFqu%C3%A9-se-busca"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Por objetivo (<em>¿qué se busca?</em>)</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Tipo</th>
<th style="text-align:left">Qué comprueba</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Funcionales</strong></td>
<td style="text-align:left">Que hace lo que debe</td>
</tr>
<tr>
<td style="text-align:left"><strong>No funcionales</strong></td>
<td style="text-align:left">Seguridad, rendimiento, usabilidad…</td>
</tr>
<tr>
<td style="text-align:left"><strong>De confirmación</strong></td>
<td style="text-align:left">Que el defecto corregido ya no está</td>
</tr>
<tr>
<td style="text-align:left"><strong>De regresión</strong></td>
<td style="text-align:left">Que lo que funcionaba sigue funcionando</td>
</tr>
<tr>
<td style="text-align:left"><strong>De instalación</strong></td>
<td style="text-align:left">Que se instala en el entorno real</td>
</tr>
</tbody>
</table>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Los ejes <strong>se cruzan</strong>: una prueba de rendimiento puede ser de componente o de sistema; una de regresión puede ser de cualquier nivel</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="pruebas-de-unidad">Pruebas de unidad</h2>
<split-slide style="--left: 52%; --right: 48%;">
<div>
<h3 id="qu%C3%A9-verifican">Qué verifican</h3>
<ul>
<li>El funcionamiento <strong>aislado</strong> de piezas de software que pueden probarse por separado
<ul>
<li>subprogramas o módulos individuales</li>
<li>en OO, <strong>la clase</strong> y sus métodos</li>
</ul>
</li>
<li>Se aíslan las dependencias con <strong>dobles de prueba</strong>: <em>stubs</em>, <em>mocks</em>, <em>fakes</em></li>
</ul>
<h3 id="c%C3%B3mo-se-hacen">Cómo se hacen</h3>
<ul>
<li>Con <strong>acceso al código fuente</strong></li>
<li>Con ayuda de herramientas de depuración y frameworks <em>xUnit</em></li>
<li>Normalmente las escribe <strong>quien escribió el código</strong></li>
</ul>
</div>
<div>
<h3 id="un-caso-de-prueba-de-unidad-en-oo">Un caso de prueba de unidad en OO</h3>
<ol>
<li><strong>Construir</strong> una instancia de la clase bajo prueba</li>
<li><strong>Ejecutar</strong> una serie de servicios sobre ella</li>
<li><strong>Comprobar</strong> el resultado contra el oráculo</li>
</ol>
<h3 id="lo-que-buscan">Lo que buscan</h3>
<ul>
<li>Errores de <strong>cálculo</strong> y de lógica</li>
<li>Condiciones <strong>límite</strong> mal manejadas</li>
<li>Caminos de <strong>error</strong> que nunca se ejecutaron</li>
<li>Estructuras de datos <strong>inconsistentes</strong></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Deben ser <strong>F.I.R.S.T.</strong>: <em>Fast, Independent, Repeatable, Self-validating, Timely</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="pruebas-de-integraci%C3%B3n">Pruebas de integración</h2>
<steps>
<step>
<h3 id="qu%C3%A9-verifican-1">Qué verifican</h3>
<ul>
<li>La <strong>interacción</strong> entre componentes del sistema: que las interfaces encajen, que los datos crucen sin perderse, que los errores se propaguen bien</li>
<li>Defectos típicos: parámetros en <strong>orden distinto</strong>, unidades distintas (colones vs. dólares), suposiciones distintas sobre nulos, <em>timeouts</em></li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Estrategia</th>
<th style="text-align:left">Idea</th>
<th style="text-align:left">Riesgo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Big bang</strong></td>
<td style="text-align:left">Se junta todo de una vez</td>
<td style="text-align:left">Cuando falla, no se sabe dónde</td>
</tr>
<tr>
<td style="text-align:left"><strong>Incremental ascendente</strong></td>
<td style="text-align:left">Desde las hojas hacia la raíz</td>
<td style="text-align:left">La lógica de control se prueba al final</td>
</tr>
<tr>
<td style="text-align:left"><strong>Incremental descendente</strong></td>
<td style="text-align:left">Desde la raíz hacia las hojas</td>
<td style="text-align:left">Muchos <em>stubs</em>; el procesamiento real llega tarde</td>
</tr>
<tr>
<td style="text-align:left"><strong>Sándwich</strong></td>
<td style="text-align:left">Ambas a la vez, se encuentran en el medio</td>
<td style="text-align:left">Más coordinación</td>
</tr>
<tr>
<td style="text-align:left"><strong>Guiada por la arquitectura</strong></td>
<td style="text-align:left">Se integra por <strong>hilos de funcionalidad</strong></td>
<td style="text-align:left">Hay que conocer bien los hilos</td>
</tr>
</tbody>
</table>
</step>
<step>
<p><a href="../assets/ads-pru-integracion.svg"><img src="../assets/ads-pru-integracion.svg" alt="" style="height:440px;" /></a></p>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="stubs-y-drivers">Stubs y drivers</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%94%BD-stub-resguardo"><img class="emoji" draggable="false" alt="🔽" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f53d.svg" data-marp-twemoji=""/> Stub (resguardo)</h3>
<ul>
<li>Reemplaza a un módulo <strong>llamado</strong> que todavía no existe o no se quiere usar</li>
<li>Devuelve respuestas <strong>predefinidas</strong></li>
<li>Lo necesita la integración <strong>descendente</strong></li>
<li>Ejemplo: <code>CobrosStub.consultarDeuda()</code> siempre devuelve <code>0</code></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%94%BC-driver-controlador"><img class="emoji" draggable="false" alt="🔼" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f53c.svg" data-marp-twemoji=""/> Driver (controlador)</h3>
<ul>
<li>Reemplaza al módulo <strong>que llama</strong></li>
<li>Prepara los datos, invoca al módulo bajo prueba y revisa el resultado</li>
<li>Lo necesita la integración <strong>ascendente</strong></li>
<li>Hoy casi siempre es el propio <strong>framework de pruebas</strong>: JUnit es un <em>driver</em></li>
</ul>
</div>
</split-slide>
<table>
<thead>
<tr>
<th style="text-align:left">Doble de prueba</th>
<th style="text-align:left">Qué hace</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Dummy</strong></td>
<td style="text-align:left">Se pasa pero nunca se usa; solo llena un parámetro</td>
</tr>
<tr>
<td style="text-align:left"><strong>Stub</strong></td>
<td style="text-align:left">Devuelve respuestas fijas</td>
</tr>
<tr>
<td style="text-align:left"><strong>Spy</strong></td>
<td style="text-align:left">Un stub que además <strong>registra</strong> cómo lo llamaron</td>
</tr>
<tr>
<td style="text-align:left"><strong>Mock</strong></td>
<td style="text-align:left">Viene programado con <strong>expectativas</strong> y falla si no se cumplen</td>
</tr>
<tr>
<td style="text-align:left"><strong>Fake</strong></td>
<td style="text-align:left">Implementación real pero simplificada: base de datos en memoria</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="pruebas-de-componentes">Pruebas de componentes</h2>
<ul>
<li>Prueban un <strong>componente</strong> — pieza modular y reemplazable con <strong>interfaces bien definidas</strong> — a través de esas interfaces, sin mirar adentro</li>
<li>Están entre la unidad y la integración: el componente puede tener <strong>muchas clases</strong> adentro, pero se prueba como una sola cosa</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%94%8C-contra-la-interfaz-provista"><img class="emoji" draggable="false" alt="🔌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50c.svg" data-marp-twemoji=""/> Contra la interfaz provista</h3>
<p>Cada operación de <code>IGestionMatricula</code> se prueba con sus precondiciones, poscondiciones y excepciones</p>
</div>
<div>
<h3 id="%F0%9F%A7%A9-con-la-interfaz-requerida-simulada"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Con la interfaz requerida simulada</h3>
<p><code>IAutenticacion</code> y <code>ICobros</code> se sustituyen por dobles para aislar el componente</p>
</div>
<div>
<h3 id="%F0%9F%93%9C-pruebas-de-contrato"><img class="emoji" draggable="false" alt="📜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dc.svg" data-marp-twemoji=""/> Pruebas de contrato</h3>
<p>El consumidor publica qué espera; el proveedor verifica que lo cumple (Pact, Spring Cloud Contract)</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> El beneficio: el componente se puede <strong>reemplazar</strong> por otra implementación y las mismas pruebas siguen valiendo</li>
<li><img class="emoji" draggable="false" alt="📎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ce.svg" data-marp-twemoji=""/> La definición de componente e interfaz provista/requerida está en el mazo de <strong>Diseño de sistemas</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="pruebas-de-sistema">Pruebas de sistema</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="qu%C3%A9-verifican-2">Qué verifican</h3>
<ul>
<li>El comportamiento del sistema <strong>en su conjunto</strong>, en un entorno lo más parecido posible al de producción</li>
<li>Los fallos funcionales se suelen detectar en los niveles anteriores</li>
<li>Este nivel es <strong>el más adecuado</strong> para comprobar los requerimientos <strong>no funcionales</strong>:
<ul>
<li>seguridad, velocidad, exactitud, fiabilidad</li>
</ul>
</li>
</ul>
</div>
<div>
<h3 id="tambi%C3%A9n-se-prueban">También se prueban</h3>
<ul>
<li><strong>Interfaces externas</strong> con otros sistemas</li>
<li><strong>Utilidades</strong>: respaldos, recuperación, carga de datos</li>
<li><strong>Unidades físicas</strong>: impresoras, lectores, sensores</li>
<li><strong>Entorno operativo</strong>: sistema operativo, navegadores, red</li>
<li>La <strong>documentación</strong> de usuario contra el sistema real</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Las prueba un <strong>equipo independiente</strong> del que construyó: quien lo programó tiende a usarlo de la forma en que sabe que funciona</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="pruebas-de-casos-de-uso">Pruebas de casos de uso</h2>
<ul>
<li>Son pruebas <strong>funcionales de caja negra</strong> a nivel de sistema, en las que <strong>cada caso de uso</strong> es la fuente de los casos de prueba</li>
<li>Cada <strong>escenario</strong> — un camino concreto por el flujo básico y los alternos — se vuelve <strong>al menos un</strong> caso de prueba</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Lo que tiene el caso de uso</th>
<th style="text-align:left">Lo que aporta a la prueba</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Precondiciones</strong></td>
<td style="text-align:left">El estado inicial que hay que preparar</td>
</tr>
<tr>
<td style="text-align:left"><strong>Flujo básico</strong></td>
<td style="text-align:left">El escenario principal: el primer caso de prueba</td>
</tr>
<tr>
<td style="text-align:left"><strong>Flujos alternos y de excepción</strong></td>
<td style="text-align:left">Un escenario cada uno: los casos negativos</td>
</tr>
<tr>
<td style="text-align:left"><strong>Poscondiciones</strong></td>
<td style="text-align:left">El oráculo: qué debe quedar cierto al terminar</td>
</tr>
<tr>
<td style="text-align:left"><strong>Reglas de negocio</strong></td>
<td style="text-align:left">Los valores para partición y límites</td>
</tr>
<tr>
<td style="text-align:left"><strong>Requerimientos especiales</strong></td>
<td style="text-align:left">Las pruebas no funcionales asociadas</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Ventaja: la <strong>trazabilidad es directa</strong>. Si el caso de uso cambia, se sabe exactamente qué pruebas revisar</li>
<li><img class="emoji" draggable="false" alt="📎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ce.svg" data-marp-twemoji=""/> La técnica completa está en la sección <strong>Creación de las pruebas</strong> más adelante</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="pruebas-de-aceptaci%C3%B3n">Pruebas de aceptación</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="qu%C3%A9-son">Qué son</h3>
<ul>
<li>Comprueban el comportamiento del sistema <strong>frente a los requerimientos del cliente</strong></li>
<li>Las ejecuta — o al menos las aprueba — <strong>el cliente o los usuarios</strong></li>
<li>Responden una sola pregunta: <strong>¿lo recibimos o no?</strong></li>
<li>Suelen ser una condición <strong>contractual</strong> para cerrar una etapa o pagar</li>
</ul>
</div>
<div>
<h3 id="sus-variantes">Sus variantes</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Tipo</th>
<th style="text-align:left">Quién la hace</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>De usuario (UAT)</strong></td>
<td style="text-align:left">Usuarios finales, sobre sus tareas reales</td>
</tr>
<tr>
<td style="text-align:left"><strong>Operacional</strong></td>
<td style="text-align:left">Operaciones: respaldos, recuperación, monitoreo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Contractual</strong></td>
<td style="text-align:left">Contra los criterios del contrato</td>
</tr>
<tr>
<td style="text-align:left"><strong>Regulatoria</strong></td>
<td style="text-align:left">Contra una norma o ley</td>
</tr>
<tr>
<td style="text-align:left"><strong>Alfa y beta</strong></td>
<td style="text-align:left">Usuarios potenciales, antes de la difusión</td>
</tr>
</tbody>
</table>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> En ágil: los <strong>criterios de aceptación</strong> de cada historia se escriben como escenarios ejecutables — <em>Dado… Cuando… Entonces…</em> (BDD, Gherkin)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="pruebas-alfa-y-beta">Pruebas alfa y beta</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%85%B0%EF%B8%8F-alfa"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Alfa</h3>
<ul>
<li>En las <strong>instalaciones del desarrollador</strong></li>
<li>Usuarios reales o representativos, <strong>observados</strong> por el equipo</li>
<li>Entorno <strong>controlado</strong>: se registran errores y problemas de uso en el momento</li>
<li>El producto está casi completo, pero todavía puede cambiar</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%85%B1%EF%B8%8F-beta"><img class="emoji" draggable="false" alt="🅱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f171.svg" data-marp-twemoji=""/> Beta</h3>
<ul>
<li><strong>Fuera</strong> de la organización, en el entorno <strong>real</strong> del usuario</li>
<li>El desarrollador <strong>no</strong> está presente</li>
<li>Los usuarios reportan problemas por un canal acordado</li>
<li>Se descubren combinaciones de hardware, datos y usos que nadie previó</li>
</ul>
</div>
</split-slide>
<ul>
<li>Son pruebas en <strong>grupos pequeños</strong> de usuarios potenciales <strong>antes</strong> de la difusión del software</li>
<li>Variantes actuales: <strong>acceso anticipado</strong>, <strong>lanzamiento canario</strong> (un 5 % de los usuarios recibe la versión nueva), <em>feature flags</em></li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>Una app bancaria invita a 200 clientes a usar la versión nueva desde su celular por dos semanas</em> → <spoiler>beta</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="pruebas-de-instalaci%C3%B3n">Pruebas de instalación</h2>
<ul>
<li>Comprueban el comportamiento del sistema frente a los <strong>requerimientos de configuración</strong>: hardware, sistema operativo, red, otros productos</li>
<li>Se ejecutan en el <strong>entorno destino</strong> o en uno equivalente</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%93%A6-instalaci%C3%B3n-limpia"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Instalación limpia</h3>
<p>En una máquina sin versiones previas</p>
</div>
<div>
<h3 id="%E2%AC%86%EF%B8%8F-actualizaci%C3%B3n"><img class="emoji" draggable="false" alt="⬆️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b06.svg" data-marp-twemoji=""/> Actualización</h3>
<p>Desde la versión anterior, <strong>conservando los datos</strong></p>
</div>
<div>
<h3 id="%E2%86%A9%EF%B8%8F-reversi%C3%B3n"><img class="emoji" draggable="false" alt="↩️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/21a9.svg" data-marp-twemoji=""/> Reversión</h3>
<p>Volver a la versión anterior si la nueva falla</p>
</div>
<div>
<h3 id="%F0%9F%97%91%EF%B8%8F-desinstalaci%C3%B3n"><img class="emoji" draggable="false" alt="🗑️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5d1.svg" data-marp-twemoji=""/> Desinstalación</h3>
<p>Sin dejar basura ni romper otros productos</p>
</div>
<div>
<h3 id="%E2%9A%99%EF%B8%8F-configuraciones"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2699.svg" data-marp-twemoji=""/> Configuraciones</h3>
<p>Cada combinación soportada de SO, navegador, base de datos</p>
</div>
<div>
<h3 id="%F0%9F%93%84-documentaci%C3%B3n"><img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c4.svg" data-marp-twemoji=""/> Documentación</h3>
<p>Seguir el manual de instalación <strong>al pie de la letra</strong></p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> En sistemas web modernos, la instalación es el <strong>despliegue</strong>: se prueba con <em>scripts</em> de infraestructura como código y pruebas de humo posteriores</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="pruebas-de-seguridad">Pruebas de seguridad</h2>
<steps>
<step>
<h3 id="qu%C3%A9-comprueban">Qué comprueban</h3>
<ul>
<li>Que el sistema <strong>protege la información</strong> y mantiene su funcionalidad frente a usos maliciosos</li>
<li>Se derivan de los <strong>requerimientos de seguridad</strong> de la especificación suplementaria y de un <strong>modelo de amenazas</strong></li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Propiedad</th>
<th style="text-align:left">Pregunta que se prueba</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Confidencialidad</strong></td>
<td style="text-align:left">¿Un estudiante puede ver las notas de otro?</td>
</tr>
<tr>
<td style="text-align:left"><strong>Integridad</strong></td>
<td style="text-align:left">¿Se puede alterar un monto en tránsito?</td>
</tr>
<tr>
<td style="text-align:left"><strong>Disponibilidad</strong></td>
<td style="text-align:left">¿Aguanta un pico de peticiones malintencionadas?</td>
</tr>
<tr>
<td style="text-align:left"><strong>Autenticación</strong></td>
<td style="text-align:left">¿Se puede entrar sin credenciales válidas?</td>
</tr>
<tr>
<td style="text-align:left"><strong>Autorización</strong></td>
<td style="text-align:left">¿Un docente puede ejecutar funciones de administrador?</td>
</tr>
<tr>
<td style="text-align:left"><strong>No repudio</strong></td>
<td style="text-align:left">¿Queda <strong>bitácora</strong> de quién hizo qué?</td>
</tr>
</tbody>
</table>
</step>
<step>
<h3 id="c%C3%B3mo-se-hacen-1">Cómo se hacen</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%94%8D-sast"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> SAST</h3>
<p>Análisis <strong>estático</strong> del código buscando patrones vulnerables (SonarQube, Semgrep)</p>
</div>
<div>
<h3 id="%F0%9F%8C%90-dast"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> DAST</h3>
<p>Análisis <strong>dinámico</strong> del sistema en ejecución (OWASP ZAP, Burp Suite)</p>
</div>
<div>
<h3 id="%F0%9F%93%A6-dependencias"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Dependencias</h3>
<p>Bibliotecas con vulnerabilidades conocidas (Dependabot, OWASP Dependency-Check)</p>
</div>
<div>
<h3 id="%F0%9F%A5%B7-pruebas-de-penetraci%C3%B3n"><img class="emoji" draggable="false" alt="🥷" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f977.svg" data-marp-twemoji=""/> Pruebas de penetración</h3>
<p>Un especialista <strong>autorizado</strong> intenta atacar el sistema como lo haría un atacante real</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="📎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ce.svg" data-marp-twemoji=""/> Lista de referencia: <strong>OWASP Top 10</strong> y la guía de pruebas <strong>OWASP WSTG</strong></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="79">
<h2 id="otras-pruebas-no-funcionales">Otras pruebas no funcionales</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Tipo</th>
<th style="text-align:left">Qué comprueba</th>
<th style="text-align:left">Ejemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Rendimiento</strong></td>
<td style="text-align:left">Tiempos de respuesta con carga <strong>normal</strong></td>
<td style="text-align:left">«El préstamo se registra en menos de 2 s»</td>
</tr>
<tr>
<td style="text-align:left"><strong>Carga</strong></td>
<td style="text-align:left">Comportamiento con la carga <strong>esperada máxima</strong></td>
<td style="text-align:left">4 000 usuarios en la matrícula</td>
</tr>
