<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" width="1020" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="h-ar" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1020" height="600" fill="#ffffff"/>
  <text x="510" y="38" font-size="19" fill="#111" text-anchor="middle" font-weight="600">Puertos y adaptadores (arquitectura hexagonal)</text>

  <polygon points="510,110 690,205 690,400 510,495 330,400 330,205" fill="#e8f6ec" stroke="#333" stroke-width="2"/>
  <polygon points="510,168 640,236 640,370 510,438 380,370 380,236" fill="#ffffff" stroke="#666" stroke-width="1.4" stroke-dasharray="6,5"/>
  <text x="510" y="288" font-size="18" fill="#111" text-anchor="middle" font-weight="600">Dominio</text>
  <text x="510" y="312" font-size="13.5" fill="#444" text-anchor="middle">entidades + reglas</text>
  <text x="510" y="360" font-size="13.5" fill="#444" text-anchor="middle">Aplicaci&#243;n (casos de uso)</text>

  <!-- puertos -->
  <g fill="#fdf3d0" stroke="#333" stroke-width="1.6">
    <rect x="286" y="222" width="88" height="34"/>
    <rect x="286" y="352" width="88" height="34"/>
    <rect x="646" y="222" width="88" height="34"/>
    <rect x="646" y="352" width="88" height="34"/>
  </g>
  <g font-size="12" fill="#111" text-anchor="middle">
    <text x="330" y="244">puerto</text>
    <text x="330" y="374">puerto</text>
    <text x="690" y="244">puerto</text>
    <text x="690" y="374">puerto</text>
  </g>

  <!-- adaptadores izquierda -->
  <g fill="#d6eaf8" stroke="#333" stroke-width="1.6">
    <rect x="70" y="207" width="160" height="64"/>
    <rect x="70" y="337" width="160" height="64"/>
  </g>
  <g font-size="13.5" fill="#111" text-anchor="middle">
    <text x="150" y="235">Controlador web</text>
    <text x="150" y="257">(REST / MVC)</text>
    <text x="150" y="365">CLI / pruebas</text>
    <text x="150" y="387">automatizadas</text>
  </g>

  <!-- adaptadores derecha -->
  <g fill="#f2e6f7" stroke="#333" stroke-width="1.6">
    <rect x="790" y="207" width="160" height="64"/>
    <rect x="790" y="337" width="160" height="64"/>
  </g>
  <g font-size="13.5" fill="#111" text-anchor="middle">
    <text x="870" y="235">Repositorio JPA</text>
    <text x="870" y="257">/ SQL</text>
    <text x="870" y="365">Servicio de correo</text>
    <text x="870" y="387">/ pasarela de pago</text>
  </g>

  <g stroke="#444" stroke-width="1.8" fill="none">
    <path d="M230,239 L282,239" marker-end="url(#h-ar)"/>
    <path d="M230,369 L282,369" marker-end="url(#h-ar)"/>
    <path d="M738,239 L788,239" marker-end="url(#h-ar)"/>
    <path d="M738,369 L788,369" marker-end="url(#h-ar)"/>
  </g>

  <text x="150" y="300" font-size="13" fill="#555" text-anchor="middle">lado que <tspan font-weight="600">dirige</tspan></text>
  <text x="150" y="318" font-size="13" fill="#555" text-anchor="middle">(driving / primario)</text>
  <text x="870" y="300" font-size="13" fill="#555" text-anchor="middle">lado <tspan font-weight="600">dirigido</tspan></text>
  <text x="870" y="318" font-size="13" fill="#555" text-anchor="middle">(driven / secundario)</text>

  <rect x="70" y="520" width="880" height="54" fill="#f7f7f7" stroke="#bbb"/>
  <text x="86" y="543" font-size="13.5" fill="#333">Un <tspan font-weight="600">puerto</tspan> es una interfaz que declara el dominio; un <tspan font-weight="600">adaptador</tspan> es la clase concreta que la conecta a una tecnolog&#237;a.</text>
  <text x="86" y="564" font-size="13.5" fill="#333">Cambiar de framework, de base de datos o de proveedor de correo se reduce a escribir otro adaptador.</text>
</svg>
