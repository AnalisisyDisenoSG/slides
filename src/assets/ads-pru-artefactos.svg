    <text x="510" y="244">(IEEE 829 / ISO/IEC/IEEE 29119-3)</text>
    <text x="260" y="354">Casos de prueba · procedimientos</text>
    <text x="260" y="372">scripts automatizados · datos de prueba</text>
    <text x="260" y="390">dobles (stubs, drivers, mocks) · entorno</text>
    <text x="760" y="354">Bitácora de ejecución</text>
    <text x="760" y="372">Reportes de incidentes / defectos</text>
    <text x="760" y="390">Informe resumen y métricas</text>
    <text x="210" y="500">Casos de uso + requerimientos</text>
    <text x="210" y="518">suplementarios (entrada)</text>
    <text x="810" y="500">Decisión: liberar o corregir</text>
