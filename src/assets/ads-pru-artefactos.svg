<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 580" width="1020" height="580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-ar" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#555"/></marker>
  </defs>
  <rect width="1020" height="580" fill="#ffffff"/>
  <text x="510" y="36" font-size="19" fill="#111" text-anchor="middle" font-weight="600">Artefactos de la disciplina de pruebas y cómo se encadenan</text>

  <g stroke="#333" stroke-width="1.6">
    <rect x="310" y="64" width="400" height="76" fill="#f2e6f7"/>
    <rect x="310" y="178" width="400" height="76" fill="#d6eaf8"/>
    <rect x="60" y="300" width="400" height="110" fill="#fdebd0"/>
    <rect x="560" y="300" width="400" height="110" fill="#e8f6ec"/>
  </g>
  <rect x="60" y="470" width="300" height="70" fill="#f7f7f7" stroke="#999" stroke-dasharray="5 4"/>
  <rect x="660" y="470" width="300" height="70" fill="#f7f7f7" stroke="#999" stroke-dasharray="5 4"/>

  <g font-size="17" fill="#111" font-weight="600" text-anchor="middle">
    <text x="510" y="92">Plan de Calidad del Software</text>
    <text x="510" y="206">Plan de Pruebas</text>
    <text x="260" y="330">Elementos de Prueba</text>
    <text x="760" y="330">Resultados de Prueba</text>
  </g>
  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="510" y="114">Qué es «calidad» en este proyecto y cómo se asegura</text>
