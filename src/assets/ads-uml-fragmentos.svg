</defs>
<rect width="1020" height="512" fill="#ffffff"/>
<g stroke="#333" stroke-width="1.4" fill="#d6eaf8"><rect x="40" y="40" width="70" height="28"/><rect x="150" y="40" width="70" height="28"/></g><g font-size="12" fill="#111" text-anchor="middle" text-decoration="underline"><text x="75" y="59">: Pago</text><text x="185" y="59">: Banco</text></g><g stroke="#888" stroke-width="1.1" stroke-dasharray="6,6"><path d="M75,68 L75,370"/><path d="M185,68 L185,370"/></g><rect x="35" y="95" width="200" height="235" fill="none" stroke="#333" stroke-width="1.6"/><path d="M35,95 L100,95 L100,113 L86,127 L35,127 Z" fill="#fdf3d0" stroke="#333" stroke-width="1.6"/><text x="46" y="117" font-size="14" fill="#111" font-weight="700">alt</text><text x="79" y="142" font-size="12" fill="#c0392b">[saldo >= monto]</text><path d="M75,168 L181,168" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#full)"/><text x="130" y="162" font-size="11.5" fill="#111" text-anchor="middle">debitar(monto)</text><path d="M35,205 L235,205" stroke="#333" stroke-width="1.3" stroke-dasharray="8,5"/><text x="79" y="228" font-size="12" fill="#c0392b">[else]</text><path d="M75,254 L181,254" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#full)"/><text x="130" y="248" font-size="11.5" fill="#111" text-anchor="middle">rechazar()</text><g stroke="#333" stroke-width="1.4" fill="#d6eaf8"><rect x="290" y="40" width="70" height="28"/><rect x="400" y="40" width="70" height="28"/></g><g font-size="12" fill="#111" text-anchor="middle" text-decoration="underline"><text x="325" y="59">: UI</text><text x="435" y="59">: Sesion</text></g><g stroke="#888" stroke-width="1.1" stroke-dasharray="6,6"><path d="M325,68 L325,370"/><path d="M435,68 L435,370"/></g><rect x="285" y="95" width="200" height="235" fill="none" stroke="#333" stroke-width="1.6"/><path d="M285,95 L350,95 L350,113 L336,127 L285,127 Z" fill="#fdf3d0" stroke="#333" stroke-width="1.6"/><text x="296" y="117" font-size="14" fill="#111" font-weight="700">opt</text><text x="329" y="142" font-size="12" fill="#c0392b">[primera vez]</text><path d="M325,168 L431,168" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#full)"/><text x="380" y="162" font-size="11.5" fill="#111" text-anchor="middle">solicitarDatos()</text><g stroke="#333" stroke-width="1.4" fill="#d6eaf8"><rect x="540" y="40" width="70" height="28"/><rect x="650" y="40" width="70" height="28"/></g><g font-size="12" fill="#111" text-anchor="middle" text-decoration="underline"><text x="575" y="59">: Carrito</text><text x="685" y="59">: Linea</text></g><g stroke="#888" stroke-width="1.1" stroke-dasharray="6,6"><path d="M575,68 L575,370"/><path d="M685,68 L685,370"/></g><rect x="535" y="95" width="200" height="235" fill="none" stroke="#333" stroke-width="1.6"/><path d="M535,95 L600,95 L600,113 L586,127 L535,127 Z" fill="#fdf3d0" stroke="#333" stroke-width="1.6"/><text x="546" y="117" font-size="14" fill="#111" font-weight="700">loop</text><text x="579" y="142" font-size="12" fill="#c0392b">[por cada item]</text><path d="M575,168 L681,168" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#full)"/><text x="630" y="162" font-size="11.5" fill="#111" text-anchor="middle">agregarLinea()</text><path d="M685,200 L579,200" stroke="#333" stroke-width="1.5" fill="none" stroke-dasharray="6,4" marker-end="url(#thin)"/><text x="630" y="194" font-size="11.5" fill="#c0392b" text-anchor="middle">subtotal</text><g stroke="#333" stroke-width="1.4" fill="#d6eaf8"><rect x="790" y="40" width="70" height="28"/><rect x="900" y="40" width="70" height="28"/></g><g font-size="12" fill="#111" text-anchor="middle" text-decoration="underline"><text x="825" y="59">: Orden</text><text x="935" y="59">: Servicio</text></g><g stroke="#888" stroke-width="1.1" stroke-dasharray="6,6"><path d="M825,68 L825,370"/><path d="M935,68 L935,370"/></g><rect x="785" y="95" width="200" height="235" fill="none" stroke="#333" stroke-width="1.6"/><path d="M785,95 L850,95 L850,113 L836,127 L785,127 Z" fill="#fdf3d0" stroke="#333" stroke-width="1.6"/><text x="796" y="117" font-size="14" fill="#111" font-weight="700">par</text><path d="M825,150 L931,150" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#full)"/><text x="880" y="144" font-size="11.5" fill="#111" text-anchor="middle">notificarCorreo()</text><path d="M785,200 L985,200" stroke="#333" stroke-width="1.3" stroke-dasharray="8,5"/><path d="M825,238 L931,238" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#full)"/><text x="880" y="232" font-size="11.5" fill="#111" text-anchor="middle">actualizarStock()</text><text x="30" y="400" font-size="13.5" fill="#111"><tspan font-weight="700" font-family="Consolas, monospace" fill="#c0392b">alt</tspan>  Alternativa: se ejecuta la región cuya guarda es verdadera (if / else).</text><text x="30" y="422" font-size="13.5" fill="#111"><tspan font-weight="700" font-family="Consolas, monospace" fill="#c0392b">opt</tspan>  Opcional: la región se ejecuta solo si la guarda es verdadera (if sin else).</text><text x="30" y="444" font-size="13.5" fill="#111"><tspan font-weight="700" font-family="Consolas, monospace" fill="#c0392b">loop</tspan>  Repetición: la región se repite mientras se cumpla la guarda.</text><text x="30" y="466" font-size="13.5" fill="#111"><tspan font-weight="700" font-family="Consolas, monospace" fill="#c0392b">par</tspan>  Paralelo: las regiones se ejecutan concurrentemente, en cualquier orden.</text><text x="30" y="494" font-size="12.5" fill="#666">Otros operadores frecuentes: critical, break, seq, strict, neg, assert, ref (referencia a otra interacción).</text></svg>