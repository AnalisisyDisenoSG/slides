<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" width="1020" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="nav" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto">
      <path d="M2,1 L12,5 L2,9" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1020" height="480" fill="#ffffff"/>

  <g stroke="#333" stroke-width="1.5" fill="#d6eaf8">
    <rect x="100" y="85" width="190" height="32"/><rect x="100" y="117" width="190" height="38"/>
    <rect x="700" y="85" width="190" height="32"/><rect x="700" y="117" width="190" height="38"/>
  </g>
  <g font-size="17" fill="#111" text-anchor="middle" font-weight="600">
    <text x="195" y="107">Profesor</text>
    <text x="795" y="107">Curso</text>
  </g>
  <path d="M290,136 L700,136" stroke="#333" stroke-width="1.6"/>
  <text x="470" y="128" font-size="16" fill="#111">imparte</text>
  <path d="M537,121 L551,128 L537,135 Z" fill="#111"/>
  <g font-size="14" fill="#c0392b">
    <text x="300" y="128">1</text>
    <text x="300" y="158">+docente</text>
    <text x="690" y="128" text-anchor="end">0..*</text>
    <text x="690" y="158" text-anchor="end">+cursoAsignado</text>
  </g>
  <g font-size="13" fill="#777">
    <text x="470" y="182" text-anchor="middle">nombre de la asociación + triángulo de lectura: «Profesor imparte Curso»</text>
    <text x="100" y="204">extremo Profesor: multiplicidad + rol</text>
    <text x="890" y="204" text-anchor="end">extremo Curso: multiplicidad + rol</text>
  </g>

  <text x="60" y="242" font-size="15" font-weight="700" fill="#111">Navegabilidad</text>
  <g stroke="#333" stroke-width="1.5" fill="#eaf4fb">
    <rect x="60" y="262" width="80" height="34"/><rect x="240" y="262" width="80" height="34"/>
    <rect x="400" y="262" width="80" height="34"/><rect x="580" y="262" width="80" height="34"/>
    <rect x="740" y="262" width="80" height="34"/><rect x="920" y="262" width="80" height="34"/>
  </g>
  <g font-size="15" fill="#111" text-anchor="middle">
    <text x="100" y="285">A</text><text x="280" y="285">B</text>
    <text x="440" y="285">A</text><text x="620" y="285">B</text>
    <text x="780" y="285">A</text><text x="960" y="285">B</text>
  </g>
  <path d="M140,279 L240,279" stroke="#333" stroke-width="1.6"/>
  <path d="M480,279 L576,279" stroke="#333" stroke-width="1.6" marker-end="url(#nav)"/>
  <path d="M820,279 L916,279" stroke="#333" stroke-width="1.6" marker-end="url(#nav)"/>
  <g stroke="#c0392b" stroke-width="2">
    <path d="M822,272 L834,286 M834,272 L822,286"/>
  </g>
  <g font-size="13" fill="#555" text-anchor="middle">
    <text x="190" y="320">no especificada</text>
    <text x="190" y="338">(lo habitual en análisis)</text>
    <text x="530" y="320">A conoce a B</text>
    <text x="530" y="338">(B no conoce a A)</text>
    <text x="870" y="320">unidireccional explícita</text>
    <text x="870" y="338">la X marca «no navegable»</text>
  </g>

  <text x="60" y="392" font-size="15" font-weight="700" fill="#111">Asociación reflexiva</text>
  <g stroke="#333" stroke-width="1.5" fill="#d6eaf8">
    <rect x="380" y="380" width="170" height="30"/><rect x="380" y="410" width="170" height="34"/>
  </g>
  <text x="465" y="401" font-size="16" fill="#111" text-anchor="middle" font-weight="600">Empleado</text>
  <path d="M550,392 L640,392 L640,436 L550,436" stroke="#333" stroke-width="1.6" fill="none"/>
  <g font-size="13" fill="#c0392b">
    <text x="558" y="385">0..1 +jefe</text>
    <text x="558" y="454">0..* +subalterno</text>
  </g>
  <text x="652" y="416" font-size="14" fill="#111">supervisa</text>
  <text x="60" y="420" font-size="13" fill="#555">La misma clase en</text>
  <text x="60" y="438" font-size="13" fill="#555">ambos extremos: los</text>
  <text x="60" y="456" font-size="13" fill="#555">roles la desambiguan.</text>
</svg>
