  <rect x="30" y="532" width="700" height="72" fill="#f7f7f7" stroke="#bbb"/>
  <g font-size="12.5" fill="#333">
    <text x="46" y="554"><tspan font-weight="600">VISITA</tspan> es d&#233;bil: se identifica por <tspan font-style="italic">chip de la mascota + n&#250;mero</tspan> (identificador parcial, punteado).</text>
    <text x="46" y="574"><tspan font-weight="600">tel&#233;fonos</tspan> es multivaluado; <tspan font-weight="600">edad</tspan> es derivado de fechaNac y no se guarda.</text>
    <text x="46" y="594"><tspan font-weight="600">dosis</tspan> no es de la visita ni del medicamento: es de la relaci&#243;n <tspan font-style="italic">aplica</tspan>.</text>
  </g>
