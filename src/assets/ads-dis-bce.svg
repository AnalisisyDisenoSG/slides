<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="1020" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333"/>
    </marker>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1020" height="560" fill="#ffffff"/>

  <text x="510" y="34" font-size="19" fill="#111" text-anchor="middle" font-weight="600">Las tres clases del modelo de análisis y quién puede hablar con quién</text>

  <!-- actor -->
  <g stroke="#333" stroke-width="1.8" fill="none">
    <circle cx="105" cy="180" r="13" fill="#fff"/>
    <path d="M105,193 L105,222 M84,202 L126,202 M105,222 L90,248 M105,222 L120,248"/>
  </g>
  <text x="105" y="276" font-size="14" fill="#111" text-anchor="middle">Actor</text>

  <!-- boundary icon -->
  <g stroke="#333" stroke-width="2" fill="#d6eaf8">
    <circle cx="360" cy="210" r="40"/>
  </g>
  <path d="M300,166 L300,254 M300,210 L320,210" stroke="#333" stroke-width="2" fill="none"/>
  <text x="352" y="276" font-size="15" fill="#111" text-anchor="middle" font-weight="600">&#171;boundary&#187;</text>
  <text x="352" y="296" font-size="14" fill="#111" text-anchor="middle">Clase l&#237;mite</text>
  <text x="352" y="318" font-size="12.5" fill="#555" text-anchor="middle">Pantallas, APIs, sensores</text>

  <!-- control icon -->
  <g stroke="#333" stroke-width="2" fill="#fdf3d0">
    <circle cx="600" cy="210" r="40"/>
  </g>
  <path d="M578,176 L592,170 L594,186" stroke="#333" stroke-width="2" fill="none"/>
  <text x="600" y="276" font-size="15" fill="#111" text-anchor="middle" font-weight="600">&#171;control&#187;</text>
  <text x="600" y="296" font-size="14" fill="#111" text-anchor="middle">Clase control</text>
  <text x="600" y="318" font-size="12.5" fill="#555" text-anchor="middle">Coordina el caso de uso</text>

  <!-- entity icon -->
  <g stroke="#333" stroke-width="2" fill="#e8f6ec">
    <circle cx="850" cy="205" r="40"/>
  </g>
  <path d="M806,252 L894,252" stroke="#333" stroke-width="2" fill="none"/>
  <text x="850" y="276" font-size="15" fill="#111" text-anchor="middle" font-weight="600">&#171;entity&#187;</text>
  <text x="850" y="296" font-size="14" fill="#111" text-anchor="middle">Clase entidad</text>
  <text x="850" y="318" font-size="12.5" fill="#555" text-anchor="middle">Informaci&#243;n del negocio</text>

  <!-- allowed arrows -->
  <g stroke="#333" stroke-width="1.8" fill="none">
    <path d="M132,210 L316,210" marker-end="url(#ar)"/>
    <path d="M402,210 L556,210" marker-end="url(#ar)"/>
    <path d="M642,207 L806,207" marker-end="url(#ar)"/>
  </g>

  <!-- forbidden -->
  <path d="M336,182 C420,92 780,92 862,178" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="8,5" fill="none" marker-end="url(#arr)"/>
  <text x="606" y="104" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="600">&#10007;  una clase l&#237;mite nunca toca una entidad directamente</text>

  <g font-size="13" fill="#444">
    <text x="224" y="198" text-anchor="middle">solo v&#237;a</text>
    <text x="224" y="182" text-anchor="middle">interacciona</text>
    <text x="479" y="196" text-anchor="middle">delega</text>
    <text x="724" y="193" text-anchor="middle">consulta / modifica</text>
  </g>

  <!-- rules box -->
  <rect x="120" y="428" width="780" height="100" fill="#f7f7f7" stroke="#bbb"/>
  <text x="140" y="456" font-size="14.5" fill="#111" font-weight="600">Reglas del diagrama de robustez (Rosenberg)</text>
  <g font-size="13.5" fill="#333">
    <text x="140" y="480">1. Los actores solo hablan con clases l&#237;mite.</text>
    <text x="140" y="502">2. Las clases l&#237;mite y las entidad solo hablan con clases control.</text>
    <text x="560" y="480">3. Las clases control s&#237; hablan entre s&#237;.</text>
    <text x="560" y="502">4. Las entidad no hablan entre s&#237; sin un control de por medio.</text>
  </g>
</svg>
