<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="1020" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1020" height="560" fill="#ffffff"/>
  <text x="510" y="36" font-size="19" fill="#111" text-anchor="middle" font-weight="600">Integración incremental: el orden decide qué hay que simular</text>

  <!-- ===== Descendente ===== -->
  <text x="255" y="78" font-size="17" fill="#111" text-anchor="middle" font-weight="600">Descendente (top-down)</text>
  <text x="255" y="98" font-size="12.5" fill="#555" text-anchor="middle">se empieza por la interfaz de usuario</text>

  <g stroke="#333" stroke-width="1.6" fill="none">
    <path d="M255,164 L140,224"/>
    <path d="M255,164 L370,224"/>
    <path d="M140,274 L85,334"/>
    <path d="M140,274 L195,334"/>
    <path d="M370,274 L370,334"/>
  </g>
  <g stroke="#333" stroke-width="1.5">
    <rect x="185" y="114" width="140" height="50" fill="#d6eaf8"/>
    <rect x="70" y="224" width="140" height="50" fill="#d6eaf8"/>
    <rect x="300" y="224" width="140" height="50" fill="#d6eaf8"/>
    <rect x="30" y="334" width="110" height="46" fill="#fdf3d0" stroke-dasharray="6 4"/>
    <rect x="150" y="334" width="110" height="46" fill="#fdf3d0" stroke-dasharray="6 4"/>
    <rect x="315" y="334" width="110" height="46" fill="#fdf3d0" stroke-dasharray="6 4"/>
  </g>
  <g font-size="13" fill="#111" text-anchor="middle">
    <text x="255" y="144">PantallaMatrícula</text>
    <text x="140" y="254">ServicioMatrícula</text>
    <text x="370" y="254">ServicioPagos</text>
    <text x="85" y="362">«stub» Repo</text>
    <text x="205" y="362">«stub» Correo</text>
    <text x="370" y="362">«stub» Banco</text>
  </g>
  <text x="255" y="414" font-size="13" fill="#111" text-anchor="middle">Lo que <tspan font-weight="600">falta abajo</tspan> se reemplaza por <tspan font-weight="600">stubs</tspan></text>
  <text x="255" y="434" font-size="12.5" fill="#555" text-anchor="middle">➕ hay algo que mostrar desde el principio</text>
  <text x="255" y="452" font-size="12.5" fill="#555" text-anchor="middle">➖ la lógica real se prueba tarde</text>

  <!-- separador -->
  <path d="M510,70 L510,460" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ===== Ascendente ===== -->
  <text x="765" y="78" font-size="17" fill="#111" text-anchor="middle" font-weight="600">Ascendente (bottom-up)</text>
  <text x="765" y="98" font-size="12.5" fill="#555" text-anchor="middle">se empieza por los componentes base</text>

  <g stroke="#333" stroke-width="1.6" fill="none">
    <path d="M765,164 L650,224"/>
    <path d="M765,164 L880,224"/>
    <path d="M650,274 L595,334"/>
    <path d="M650,274 L705,334"/>
    <path d="M880,274 L880,334"/>
  </g>
  <g stroke="#333" stroke-width="1.5">
    <rect x="695" y="114" width="140" height="50" fill="#e8daef" stroke-dasharray="6 4"/>
    <rect x="580" y="224" width="140" height="50" fill="#d6eaf8"/>
    <rect x="810" y="224" width="140" height="50" fill="#d6eaf8"/>
    <rect x="540" y="334" width="110" height="46" fill="#d6eaf8"/>
    <rect x="660" y="334" width="110" height="46" fill="#d6eaf8"/>
    <rect x="825" y="334" width="110" height="46" fill="#d6eaf8"/>
  </g>
  <g font-size="13" fill="#111" text-anchor="middle">
    <text x="765" y="144">«driver» prueba</text>
    <text x="650" y="254">ServicioMatrícula</text>
    <text x="880" y="254">ServicioPagos</text>
    <text x="595" y="362">Repo</text>
    <text x="715" y="362">Correo</text>
    <text x="880" y="362">Banco</text>
  </g>
  <text x="765" y="414" font-size="13" fill="#111" text-anchor="middle">Lo que <tspan font-weight="600">falta arriba</tspan> se reemplaza por <tspan font-weight="600">drivers</tspan></text>
  <text x="765" y="434" font-size="12.5" fill="#555" text-anchor="middle">➕ la base queda sólida y bien probada</text>
  <text x="765" y="452" font-size="12.5" fill="#555" text-anchor="middle">➖ no hay sistema visible hasta el final</text>

  <!-- leyenda -->
  <rect x="60" y="480" width="900" height="60" fill="#f7f7f7" stroke="#bbb"/>
  <rect x="90" y="498" width="34" height="24" fill="#d6eaf8" stroke="#333"/>
  <text x="134" y="515" font-size="13" fill="#111">componente real</text>
  <rect x="290" y="498" width="34" height="24" fill="#fdf3d0" stroke="#333" stroke-dasharray="6 4"/>
  <text x="334" y="515" font-size="13" fill="#111">stub: finge ser una dependencia</text>
  <rect x="580" y="498" width="34" height="24" fill="#e8daef" stroke="#333" stroke-dasharray="6 4"/>
  <text x="624" y="515" font-size="13" fill="#111">driver: finge ser quien llama</text>
</svg>
