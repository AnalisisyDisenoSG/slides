<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 640" width="1020" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="full" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333"/>
    </marker>
    <marker id="thin" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto">
      <path d="M1,1 L11,5 L1,9" fill="none" stroke="#333" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1020" height="640" fill="#ffffff"/>

  <!-- actor -->
  <g stroke="#333" stroke-width="1.6" fill="none">
    <circle cx="90" cy="40" r="10" fill="#fff"/>
    <path d="M90,50 L90,72 M74,58 L106,58 M90,72 L78,90 M90,72 L102,90"/>
  </g>
  <text x="90" y="108" font-size="13" fill="#111" text-anchor="middle" text-decoration="underline">e : Estudiante</text>

  <g stroke="#333" stroke-width="1.5" fill="#d6eaf8">
    <rect x="205" y="76" width="150" height="36"/>
    <rect x="395" y="76" width="150" height="36"/>
    <rect x="590" y="76" width="140" height="36"/>
    <rect x="780" y="297" width="140" height="36" fill="#fdf3d0"/>
  </g>
  <g font-size="13" fill="#111" text-anchor="middle" text-decoration="underline">
    <text x="280" y="99">: PantallaMatricula</text>
    <text x="470" y="99">: GestorMatricula</text>
    <text x="660" y="99">c : Curso</text>
    <text x="850" y="320">m : Matricula</text>
  </g>

  <g stroke="#888" stroke-width="1.2" stroke-dasharray="6,6">
    <path d="M90,116 L90,520"/>
    <path d="M280,112 L280,520"/>
    <path d="M470,112 L470,520"/>
    <path d="M660,112 L660,520"/>
    <path d="M850,333 L850,520"/>
  </g>

  <g stroke="#333" stroke-width="1.2" fill="#e8e8e8">
    <rect x="274" y="150" width="12" height="328"/>
    <rect x="464" y="190" width="12" height="248"/>
    <rect x="654" y="230" width="12" height="42"/>
    <rect x="844" y="333" width="12" height="30"/>
  </g>

  <g stroke="#333" stroke-width="1.6" fill="none">
    <path d="M90,150 L272,150" marker-end="url(#full)"/>
    <path d="M286,190 L462,190" marker-end="url(#full)"/>
    <path d="M476,230 L652,230" marker-end="url(#full)"/>
    <path d="M652,272 L478,272" stroke-dasharray="7,5" marker-end="url(#thin)"/>
    <path d="M476,315 L778,315" stroke-dasharray="7,5" marker-end="url(#thin)"/>
    <path d="M476,370 L540,370 L540,398 L478,398" marker-end="url(#full)"/>
    <path d="M462,438 L288,438" stroke-dasharray="7,5" marker-end="url(#thin)"/>
    <path d="M272,478 L92,478" stroke-dasharray="7,5" marker-end="url(#thin)"/>
  </g>

  <g font-size="13" fill="#111">
    <text x="182" y="144" text-anchor="middle">1: seleccionarCurso(cod)</text>
    <text x="374" y="184" text-anchor="middle">2: matricular(carne, cod)</text>
    <text x="564" y="224" text-anchor="middle">3: hayCupo()</text>
    <text x="564" y="266" text-anchor="middle" fill="#c0392b">4: true</text>
    <text x="620" y="309" text-anchor="middle" fill="#c0392b">5: &#171;create&#187;</text>
    <text x="548" y="366" font-size="12">6: registrarBitacora()</text>
    <text x="374" y="432" text-anchor="middle" fill="#c0392b">7: comprobante</text>
    <text x="182" y="472" text-anchor="middle" fill="#c0392b">8: mostrarComprobante()</text>
  </g>

  <g font-size="12" fill="#777">
    <text x="300" y="512">barra de activación = el objeto tiene el control</text>
  </g>

  <rect x="40" y="546" width="940" height="76" fill="#f7f7f7" stroke="#bbb"/>
  <g stroke="#333" stroke-width="1.6" fill="none">
    <path d="M60,578 L110,578" marker-end="url(#full)"/>
    <path d="M320,578 L370,578" marker-end="url(#thin)"/>
    <path d="M540,578 L590,578" stroke-dasharray="7,5" marker-end="url(#thin)"/>
    <path d="M770,570 L786,586 M786,570 L770,586" stroke="#c0392b" stroke-width="2.2"/>
  </g>
  <g font-size="13" fill="#111">
    <text x="118" y="583">síncrono (espera respuesta)</text>
    <text x="378" y="583">asíncrono (no espera)</text>
    <text x="598" y="583">retorno / respuesta</text>
    <text x="796" y="583">destrucción del objeto</text>
    <text x="56" y="608" font-size="12" fill="#666">El eje vertical es el tiempo: solo importa el orden, no la escala. El eje horizontal son los objetos participantes.</text>
  </g>
</svg>
