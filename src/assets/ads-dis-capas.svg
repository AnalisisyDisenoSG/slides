<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" width="1020" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="c-ar" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#555"/>
    </marker>
    <marker id="c-open" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto">
      <path d="M1,1 L11,5 L1,9" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1020" height="600" fill="#ffffff"/>
  <text x="510" y="38" font-size="19" fill="#111" text-anchor="middle" font-weight="600">Arquitectura en capas: la dependencia siempre apunta hacia adentro</text>

  <g stroke="#333" stroke-width="1.6">
    <rect x="120" y="72" width="560" height="92" fill="#d6eaf8"/>
    <rect x="120" y="192" width="560" height="92" fill="#dfe8f7"/>
    <rect x="120" y="312" width="560" height="92" fill="#e8f6ec"/>
    <rect x="120" y="432" width="560" height="92" fill="#f2e6f7"/>
  </g>

  <g font-size="17" fill="#111" font-weight="600">
    <text x="146" y="104">Presentaci&#243;n / UI</text>
    <text x="146" y="224">Aplicaci&#243;n</text>
    <text x="146" y="344">Dominio</text>
    <text x="146" y="464">Infraestructura</text>
  </g>
  <g font-size="13" fill="#444">
    <text x="146" y="130">Pantallas, controladores web, vistas, endpoints REST</text>
    <text x="146" y="150">Clases &#171;boundary&#187;</text>
    <text x="146" y="250">Casos de uso, servicios de aplicaci&#243;n, transacciones</text>
    <text x="146" y="270">Clases &#171;control&#187;</text>
    <text x="146" y="370">Entidades, reglas de negocio, invariantes</text>
    <text x="146" y="390">Clases &#171;entity&#187; &#8212; sin dependencias hacia afuera</text>
    <text x="146" y="490">Repositorios concretos, ORM, correo, colas, archivos</text>
    <text x="146" y="510">Adaptadores a tecnolog&#237;a</text>
  </g>

  <g stroke="#555" stroke-width="2" fill="none">
    <path d="M400,168 L400,186" marker-end="url(#c-ar)"/>
    <path d="M400,288 L400,306" marker-end="url(#c-ar)"/>
  </g>

  <path d="M662,478 C700,478 700,362 664,362" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#c-open)"/>
  <text x="400" y="556" font-size="13" fill="#c0392b" text-anchor="middle">la infraestructura depende del dominio, no al rev&#233;s</text>

  <rect x="712" y="192" width="252" height="212" fill="#f7f7f7" stroke="#bbb"/>
  <text x="730" y="222" font-size="14.5" fill="#111" font-weight="600">Inversi&#243;n de dependencias</text>
  <g font-size="13" fill="#333">
    <text x="730" y="250">El dominio declara la</text>
    <text x="730" y="270">&#171;interface&#187; RepositorioDocente</text>
    <text x="730" y="298">y la infraestructura la</text>
    <text x="730" y="318">implementa con JPA, SQL o</text>
    <text x="730" y="338">lo que toque.</text>
    <text x="730" y="368">As&#237; se puede cambiar la base</text>
    <text x="730" y="388">de datos sin tocar el negocio.</text>
  </g>

  <rect x="712" y="432" width="252" height="92" fill="#fdf3d0" stroke="#bbb"/>
  <text x="730" y="460" font-size="14" fill="#111" font-weight="600">Capa cerrada vs. abierta</text>
  <g font-size="13" fill="#333">
    <text x="730" y="484">Cerrada: hay que atravesarla.</text>
    <text x="730" y="506">Abierta: se puede saltar.</text>
  </g>
</svg>
