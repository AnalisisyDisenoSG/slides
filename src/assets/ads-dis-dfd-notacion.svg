  <text x="510" y="540" font-size="13.5" fill="#333" text-anchor="middle">Escoja una y ap&#233;guese a ella en todo el proyecto. Mezclar notaciones en un mismo juego de diagramas es el error m&#225;s com&#250;n.</text>
