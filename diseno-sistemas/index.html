</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="%C2%BFd%C3%B3nde-estamos">¿Dónde estamos?</h2>
<ul>
<li>Ya sabemos <strong>qué</strong> debe hacer el sistema: visión, requerimientos, casos de uso, modelo de dominio</li>
<li>Ya sabemos <strong>cómo dibujarlo</strong>: UML es la notación</li>
<li>Falta la pregunta cara: <strong>¿cómo se va a construir?</strong> Y esa pregunta tiene muchas respuestas correctas y muchísimas equivocadas</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%8E%AF-an%C3%A1lisis"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Análisis</h3>
<p><em>¿Qué necesita el negocio?</em><br />
Vocabulario del <strong>usuario</strong>. Sin tecnología</p>
</div>
<div>
<h3 id="%F0%9F%8F%97%EF%B8%8F-dise%C3%B1o"><img class="emoji" draggable="false" alt="🏗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3d7.svg" data-marp-twemoji=""/> Diseño</h3>
<p><em>¿Cómo lo resuelve el software?</em><br />
Vocabulario de la <strong>solución</strong>. Con restricciones reales</p>
</div>
<div>
<h3 id="%E2%8C%A8%EF%B8%8F-implementaci%C3%B3n"><img class="emoji" draggable="false" alt="⌨️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2328.svg" data-marp-twemoji=""/> Implementación</h3>
<p><em>¿Cómo se escribe?</em><br />
Vocabulario del <strong>lenguaje</strong>. Con un compilador de por medio</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> El diseño es el puente. Si el puente no se construye a conciencia, <strong>el código lo improvisa</strong> — y ese diseño improvisado también es un diseño, solo que nadie lo decidió</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-ZvO4TwIz="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="3" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="87">
<h1 id="fundamentos-del-dise%C3%B1o">Fundamentos del diseño</h1>
<h2 id="contenidos-1">Contenidos</h2>
<ul>
<li>Qué es diseñar un sistema</li>
<li>Los propósitos de la disciplina</li>
<li>Del análisis al diseño</li>
<li>Diseño lógico y diseño físico</li>
<li>Los principios que sostienen todo lo demás</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="%C2%BFqu%C3%A9-es-dise%C3%B1ar-un-sistema">¿Qué es diseñar un sistema?</h2>
<steps>
<step>
<h3 id="la-definici%C3%B3n">La definición</h3>
<blockquote>
<p>«El diseño de software es el proceso de <strong>transformar los requerimientos en una descripción</strong> de la estructura interna del software que sirva de base para su construcción»<br />
— <em>SWEBOK v3, capítulo 2</em></p>
</blockquote>
<ul>
<li>Diseñar es <strong>tomar decisiones bajo restricciones</strong>: presupuesto, plazo, personal, tecnología disponible, sistemas heredados</li>
<li>Cada decisión <strong>cierra puertas</strong>. Por eso las importantes se documentan y se justifican</li>
</ul>
</step>
<step>
<h3 id="lo-que-hace-un-dise%C3%B1ador-todo-el-d%C3%ADa">Lo que hace un diseñador todo el día</h3>
<div class="grid">
<div>
<h3 id="%E2%9C%82%EF%B8%8F-descompone"><img class="emoji" draggable="false" alt="✂️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2702.svg" data-marp-twemoji=""/> Descompone</h3>
<p>Parte el problema en piezas que <strong>quepan en una cabeza</strong></p>
</div>
<div>
<h3 id="%F0%9F%94%8C-asigna"><img class="emoji" draggable="false" alt="🔌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50c.svg" data-marp-twemoji=""/> Asigna</h3>
<p>Decide <strong>qué pieza es responsable</strong> de qué</p>
</div>
<div>
<h3 id="%F0%9F%A4%9D-conecta"><img class="emoji" draggable="false" alt="🤝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f91d.svg" data-marp-twemoji=""/> Conecta</h3>
<p>Define <strong>cómo se hablan</strong> las piezas entre sí</p>
</div>
<div>
<h3 id="%E2%9A%96%EF%B8%8F-concilia"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> Concilia</h3>
<p>Balancea <strong>atributos de calidad</strong> que se pelean entre ellos</p>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="los-prop%C3%B3sitos-de-la-disciplina">Los propósitos de la disciplina</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Propósito</th>
<th style="text-align:left">Qué significa en la práctica</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Adquirir un entendimiento profundo</strong></td>
<td style="text-align:left">Entender los requerimientos no funcionales y las restricciones del entorno de implementación</td>
</tr>
<tr>
<td style="text-align:left"><strong>Crear una entrada apropiada</strong></td>
<td style="text-align:left">Producir un punto de partida para la implementación que no obligue a adivinar</td>
</tr>
<tr>
<td style="text-align:left"><strong>Descomponer</strong></td>
<td style="text-align:left">Partir el trabajo en piezas manejables, posiblemente para equipos distintos</td>
</tr>
<tr>
<td style="text-align:left"><strong>Capturar interfaces tempranas</strong></td>
<td style="text-align:left">Definir los contratos entre subsistemas <strong>antes</strong> de construirlos, para trabajar en paralelo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Visualizar y razonar</strong></td>
<td style="text-align:left">Poder discutir el diseño con una notación común, sin leer código</td>
</tr>
<tr>
<td style="text-align:left"><strong>Crear abstracciones</strong></td>
<td style="text-align:left">Aislar lo estable de lo volátil: la tecnología cambia, el negocio menos</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Ojo con el propósito que <strong>no</strong> está en la lista: <em>«producir documentación»</em>. La documentación es un medio, nunca el fin</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="del-an%C3%A1lisis-al-dise%C3%B1o">Del análisis al diseño</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%94%8D-an%C3%A1lisis"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> Análisis</h3>
<p><strong>El espacio del problema</strong></p>
<ul>
<li>Se pregunta <strong>qué</strong> hace el sistema</li>
<li>Ignora la tecnología a propósito</li>
<li>Las clases son <strong>conceptuales</strong>: pocas operaciones, sin tipos</li>
<li>Los errores aquí son <strong>de comprensión</strong></li>
<li>El interlocutor es el <strong>usuario</strong></li>
<li>Producto: <strong>Modelo de Análisis</strong></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%9B%A0%EF%B8%8F-dise%C3%B1o"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Diseño</h3>
<p><strong>El espacio de la solución</strong></p>
<ul>
<li>Se pregunta <strong>cómo</strong> lo hace</li>
<li>La tecnología es una restricción de primera clase</li>
<li>Las clases son <strong>de software</strong>: visibilidad, tipos, firmas</li>
<li>Los errores aquí son <strong>de construcción</strong></li>
<li>El interlocutor es el <strong>programador</strong></li>
<li>Producto: <strong>Modelo de Diseño</strong></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> No es una frontera de calendario, es una frontera de <strong>preguntas</strong>. En un proyecto iterativo se cruza muchas veces al día</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="dise%C3%B1o-l%C3%B3gico-vs-dise%C3%B1o-f%C3%ADsico">Diseño lógico vs. diseño físico</h2>
<steps>
<step>
<h3 id="la-distinci%C3%B3n">La distinción</h3>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left">Diseño <strong>lógico</strong></th>
<th style="text-align:left">Diseño <strong>físico</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Pregunta</strong></td>
<td style="text-align:left">¿Qué debe pasar?</td>
<td style="text-align:left">¿Con qué se hace?</td>
</tr>
<tr>
<td style="text-align:left"><strong>Independencia</strong></td>
<td style="text-align:left">De la tecnología</td>
<td style="text-align:left">Atado a una tecnología concreta</td>
</tr>
<tr>
<td style="text-align:left"><strong>Ejemplo de dato</strong></td>
<td style="text-align:left">«Se guarda el expediente del estudiante»</td>
<td style="text-align:left">Tabla <code>ESTUDIANTE</code> en PostgreSQL 16, índice por <code>cedula</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Ejemplo de proceso</strong></td>
<td style="text-align:left">«Se valida que el cupo alcance»</td>
<td style="text-align:left">Método <code>Grupo.tieneCupo()</code> en Java, con bloqueo optimista</td>
</tr>
<tr>
<td style="text-align:left"><strong>Vida útil</strong></td>
<td style="text-align:left">Años</td>
<td style="text-align:left">Hasta la próxima migración</td>
</tr>
<tr>
<td style="text-align:left"><strong>Quién lo revisa</strong></td>
<td style="text-align:left">Analista, usuario experto</td>
<td style="text-align:left">Arquitecto, DBA, programador</td>
</tr>
</tbody>
</table>
</step>
<step>
<h3 id="por-qu%C3%A9-se-separan">Por qué se separan</h3>
<ul>
<li>El <strong>lógico</strong> sobrevive al cambio de tecnología: si mañana se migra de Oracle a PostgreSQL, el diseño lógico sigue siendo válido</li>
<li>El <strong>físico</strong> es donde vive el rendimiento: índices, cachés, particiones, tamaños de <em>pool</em></li>
<li>Mezclarlos produce el síntoma clásico: <em>«no podemos cambiar de base de datos porque las reglas del negocio están en los procedimientos almacenados»</em></li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Regla práctica: si al leer un documento de diseño aparece el nombre de un producto comercial, ya está en el terreno físico</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="los-principios-que-sostienen-todo">Los principios que sostienen todo</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%8E%AD-abstracci%C3%B3n"><img class="emoji" draggable="false" alt="🎭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ad.svg" data-marp-twemoji=""/> Abstracción</h3>
<p>Exponer <strong>qué</strong> hace algo, esconder <strong>cómo</strong>. Una interfaz es una abstracción con nombre</p>
</div>
<div>
<h3 id="%F0%9F%93%A6-ocultaci%C3%B3n-de-informaci%C3%B3n"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Ocultación de información</h3>
<p>Cada módulo guarda <strong>una decisión de diseño</strong> que puede cambiar. Si cambia, cambia un módulo</p>
</div>
<div>
<h3 id="%F0%9F%A7%A9-modularidad"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Modularidad</h3>
<p>Partes con <strong>fronteras claras</strong> que se pueden entender, probar y reemplazar por separado</p>
</div>
<div>
<h3 id="%F0%9F%AA%9C-jerarqu%C3%ADa"><img class="emoji" draggable="false" alt="🪜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1fa9c.svg" data-marp-twemoji=""/> Jerarquía</h3>
<p>Capas de abstracción: cada nivel usa el de abajo sin conocer sus tripas</p>
</div>
<div>
<h3 id="%E2%99%BB%EF%B8%8F-separaci%C3%B3n-de-asuntos"><img class="emoji" draggable="false" alt="♻️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/267b.svg" data-marp-twemoji=""/> Separación de asuntos</h3>
<p>Cada pieza atiende <strong>una preocupación</strong>: persistencia, presentación, reglas</p>
</div>
<div>
<h3 id="%F0%9F%94%81-no-repetici%C3%B3n-dry"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> No repetición (DRY)</h3>
<p>Cada conocimiento vive en <strong>un solo lugar</strong> del sistema</p>
</div>
</div>
<blockquote>
<p>«Los módulos deben diseñarse de forma que oculten las decisiones difíciles o susceptibles de cambio»<br />
— <em>D. L. Parnas, 1972</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="cohesi%C3%B3n-y-acoplamiento">Cohesión y acoplamiento</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%A7%B2-cohesi%C3%B3n--alta"><img class="emoji" draggable="false" alt="🧲" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f2.svg" data-marp-twemoji=""/> Cohesión — <strong>alta</strong></h3>
<p><em>Qué tan relacionadas están las responsabilidades <strong>dentro</strong> de un módulo</em></p>
<ul>
<li><strong>Funcional</strong> (la mejor): todo colabora para una sola tarea</li>
<li><strong>Secuencial</strong>: la salida de una parte es entrada de la siguiente</li>
<li><strong>Comunicacional</strong>: operan sobre los mismos datos</li>
<li><strong>Temporal</strong>: se ejecutan al mismo tiempo</li>
<li><strong>Coincidental</strong> (la peor): están juntas por casualidad — la clase <code>Utilidades</code></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%94%97-acoplamiento--bajo"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Acoplamiento — <strong>bajo</strong></h3>
<p><em>Cuánto depende un módulo <strong>de otro</strong></em></p>
<ul>
<li><strong>De datos</strong> (el mejor): se pasan parámetros simples</li>
<li><strong>De estampa</strong>: se pasa una estructura de la que se usa una parte</li>
<li><strong>De control</strong>: se pasa una bandera que decide qué hacer</li>
<li><strong>Común</strong>: comparten datos globales</li>
<li><strong>De contenido</strong> (el peor): un módulo toca las entrañas de otro</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> La meta es siempre la misma: <strong>alta cohesión, bajo acoplamiento</strong>. Casi todos los patrones de diseño existen para lograr eso</li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>«Una clase <code>Reporte</code> que además envía correos y calcula impuestos»</em> → <spoiler>cohesión coincidental: hay tres clases ahí adentro</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="entradas-y-salidas-del-dise%C3%B1o">Entradas y salidas del diseño</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Entra</th>
<th style="text-align:left">De dónde viene</th>
<th style="text-align:left">Sale</th>
<th style="text-align:left">Para quién</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Modelo de casos de uso</td>
<td style="text-align:left">Requerimientos</td>
<td style="text-align:left"><strong>Modelo de Análisis</strong></td>
<td style="text-align:left">El propio diseño</td>
</tr>
<tr>
<td style="text-align:left">Especificaciones suplementarias</td>
<td style="text-align:left">Requerimientos</td>
<td style="text-align:left"><strong>Documento de Arquitectura</strong></td>
<td style="text-align:left">Todo el equipo</td>
</tr>
<tr>
<td style="text-align:left">Modelo de dominio</td>
<td style="text-align:left">Análisis del negocio</td>
<td style="text-align:left"><strong>Modelo de Diseño</strong></td>
<td style="text-align:left">Implementación</td>
</tr>
<tr>
<td style="text-align:left">Glosario y reglas de negocio</td>
<td style="text-align:left">Análisis del negocio</td>
<td style="text-align:left"><strong>Modelo de Datos</strong></td>
<td style="text-align:left">DBA e implementación</td>
</tr>
<tr>
<td style="text-align:left">Restricciones del entorno</td>
<td style="text-align:left">Visión, factibilidad</td>
<td style="text-align:left"><strong>Prototipo de interfaz</strong></td>
<td style="text-align:left">Usuario y pruebas</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Si falta la entrada, el diseño la <strong>inventa</strong>. Y lo que el diseño inventa, el usuario lo descubre en la demostración</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-hcYjM4w9="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="11" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="87">
<h1 id="realizaci%C3%B3n-de-los-casos-de-uso">Realización de los casos de uso</h1>
<h2 id="contenidos-2">Contenidos</h2>
<ul>
<li>Qué es una realización y para qué sirve</li>
<li>Las entidades de negocio</li>
<li>Clases de análisis: límite, control y entidad</li>
<li>Los cuatro pasos del análisis de un caso de uso</li>
<li>El diagrama de secuencia como reparto de responsabilidades</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="el-problema-que-resuelve">El problema que resuelve</h2>
<steps>
<step>
<h3 id="la-brecha">La brecha</h3>
<ul>
<li>Un caso de uso dice: <em>«El administrador registra un docente y el sistema confirma el registro»</em></li>
<li>El programador pregunta: <strong>¿qué clases? ¿qué método? ¿quién valida? ¿dónde se guarda?</strong></li>
<li>Entre las dos frases hay un salto que alguien tiene que dar. Si no lo da el diseño, lo da el programador <strong>solo, y sin dejar rastro</strong></li>
</ul>
</step>
<step>
<h3 id="la-respuesta-la-realizaci%C3%B3n-de-caso-de-uso">La respuesta: la realización de caso de uso</h3>
<blockquote>
<p>Una <strong>realización de caso de uso</strong> es la descripción de <strong>cómo un caso de uso concreto se lleva a cabo</strong> en términos de clases que colaboran</p>
</blockquote>
<div class="grid">
<div>
<h3 id="%F0%9F%8E%AC-es-una-traducci%C3%B3n"><img class="emoji" draggable="false" alt="🎬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ac.svg" data-marp-twemoji=""/> Es una traducción</h3>
<p>Del <strong>texto</strong> del caso de uso a <strong>objetos</strong> que se envían mensajes</p>
</div>
<div>
<h3 id="%F0%9F%A7%B5-es-trazable"><img class="emoji" draggable="false" alt="🧵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f5.svg" data-marp-twemoji=""/> Es trazable</h3>
<p>Cada caso de uso tiene <strong>su</strong> realización. Si el caso de uso cambia, se sabe qué revisar</p>
</div>
<div>
<h3 id="%F0%9F%93%90-son-tres-vistas"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> Son tres vistas</h3>
<p>Un <strong>diagrama de clases</strong>, uno o varios de <strong>interacción</strong> y, a veces, uno de <strong>actividad</strong></p>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="notaci%C3%B3n-de-la-realizaci%C3%B3n">Notación de la realización</h2>
<split-slide style="--left: 46%; --right: 54%;">
<div>
<h3 id="c%C3%B3mo-se-dibuja">Cómo se dibuja</h3>
<ul>
<li>El caso de uso: elipse de línea continua</li>
<li>Su realización: elipse de <strong>línea punteada</strong></li>
<li>Entre ambos, una relación de <strong>realización</strong> (línea punteada con triángulo hueco)</li>
<li>Suelen vivir en paquetes distintos: <code>Casos de uso</code> y <code>Realizaciones</code></li>
</ul>
</div>
<div>
<h3 id="qu%C3%A9-contiene-por-dentro">Qué contiene por dentro</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Diagrama</th>
<th style="text-align:left">Qué aporta</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Clases</strong></td>
<td style="text-align:left">Las clases participantes y sus relaciones</td>
</tr>
<tr>
<td style="text-align:left"><strong>Secuencia</strong></td>
<td style="text-align:left">El orden de los mensajes, escenario por escenario</td>
</tr>
<tr>
<td style="text-align:left"><strong>Comunicación</strong></td>
<td style="text-align:left">Quién está conectado con quién</td>
</tr>
<tr>
<td style="text-align:left"><strong>Actividad</strong></td>
<td style="text-align:left">El flujo cuando hay muchas ramas</td>
</tr>
</tbody>
</table>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Un caso de uso <strong>no</strong> tiene una sola realización: puede haber una de <strong>análisis</strong> (gruesa, sin tecnología) y otra de <strong>diseño</strong> (con la arquitectura ya decidida)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="prop%C3%B3sitos-del-an%C3%A1lisis-de-casos-de-uso">Propósitos del análisis de casos de uso</h2>
<div class="grid">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-identificar"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Identificar</h3>
<p>Encontrar las <strong>clases de análisis</strong> que van a ejecutar el flujo de eventos del caso de uso</p>
</div>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-distribuir"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Distribuir</h3>
<p>Repartir el <strong>comportamiento</strong> del caso de uso entre esas clases, usando realizaciones</p>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-detallar"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Detallar</h3>
<p>Identificar <strong>atributos, responsabilidades y asociaciones</strong> de las clases de análisis</p>
</div>
</div>
<blockquote>
<p>«El análisis de casos de uso es donde el modelo de dominio deja de ser un dibujo bonito y empieza a tener operaciones»</p>
</blockquote>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Lo que <strong>no</strong> se hace todavía: elegir el framework, definir tipos de datos, diseñar la base de datos, optimizar nada</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="entidades-de-negocio">Entidades de negocio</h2>
<steps>
<step>
<h3 id="qu%C3%A9-son">Qué son</h3>
<blockquote>
<p>Cualquier elemento del <strong>dominio del problema</strong> es una entidad potencial que puede modelarse como una clase</p>
</blockquote>
<table>
<thead>
<tr>
<th style="text-align:left">Dominio</th>
<th style="text-align:left">Entidades de negocio</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Banca</td>
<td style="text-align:left">Cliente, cuenta, transacción, préstamo</td>
</tr>
<tr>
<td style="text-align:left">Educación superior</td>
<td style="text-align:left">Estudiante, curso, grupo, matrícula, docente</td>
</tr>
<tr>
<td style="text-align:left">Hospital</td>
<td style="text-align:left">Paciente, expediente, cita, tratamiento</td>
</tr>
<tr>
<td style="text-align:left">Comercio</td>
<td style="text-align:left">Producto, pedido, factura, proveedor</td>
</tr>
</tbody>
</table>
<ul>
<li>Son importantes porque <strong>a partir de ellas se identifican las clases</strong> que modelan el espacio del problema</li>
</ul>
</step>
<step>
<h3 id="de-d%C3%B3nde-salen">De dónde salen</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%93%84-especificaci%C3%B3n-de-casos-de-uso"><img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c4.svg" data-marp-twemoji=""/> Especificación de casos de uso</h3>
<p><strong>La fuente principal.</strong> Los sustantivos del flujo de eventos</p>
</div>
<div>
<h3 id="%F0%9F%93%9A-documentaci%C3%B3n-existente"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4da.svg" data-marp-twemoji=""/> Documentación existente</h3>
<p>Manuales del sistema actual, procedimientos formales e informales</p>
</div>
<div>
<h3 id="%F0%9F%97%A3%EF%B8%8F-expertos-del-dominio"><img class="emoji" draggable="false" alt="🗣️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5e3.svg" data-marp-twemoji=""/> Expertos del dominio</h3>
<p>Conversaciones con quien conoce el negocio de verdad</p>
</div>
<div>
<h3 id="%F0%9F%96%BC%EF%B8%8F-prototipos"><img class="emoji" draggable="false" alt="🖼️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5bc.svg" data-marp-twemoji=""/> Prototipos</h3>
<p>Los campos de una pantalla suelen delatar atributos y entidades</p>
</div>
<div>
<h3 id="%F0%9F%94%80-diagramas-previos"><img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f500.svg" data-marp-twemoji=""/> Diagramas previos</h3>
<p>Actividad y secuencia del modelado del negocio</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> El vocabulario es el <strong>del dominio</strong>, no el del programador: se dice <code>Matricula</code>, no <code>MatriculaDTO</code></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="recordatorio-clase-y-objeto">Recordatorio: clase y objeto</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%93%90-clase"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> Clase</h3>
<ul>
<li>Es una <strong>plantilla</strong> para crear objetos</li>
<li>Es la <strong>abstracción</strong> de varios objetos con características similares</li>
<li>Define atributos y operaciones</li>
<li>Ejemplo: <code>Vehiculo</code> con <code>marca</code> y <code>color</code></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8E%AF-objeto"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Objeto</h3>
<ul>
<li>Es una <strong>instancia</strong> de una clase</li>
<li>Tiene <strong>identidad</strong>: se distingue de los demás</li>
<li>Tiene <strong>estado</strong>: los valores de sus atributos</li>
<li>Tiene <strong>comportamiento</strong>: ejecuta tareas</li>
<li>Ejemplo: <code>v1</code> con <code>marca = &quot;Toyota&quot;</code></li>
</ul>
</div>
</split-slide>
<ul>
<li>Los objetos representan cosas <strong>concretas</strong> (perro, escritorio, bicicleta) y también <strong>abstractas</strong> (cuenta, territorio, país)</li>
<li>Un objeto de software <strong>guarda su estado en atributos</strong> y <strong>expone su comportamiento en métodos</strong> — igual que uno del mundo real esconde su interior y muestra lo que hace</li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>«<code>Estudiante</code> es…»</em> → <spoiler>una clase</spoiler> · <em>«<code>e1</code> con carné B12345 es…»</em> → <spoiler>un objeto</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="qu%C3%A9-clasifican-las-clases">Qué clasifican las clases</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Tipo de objeto</th>
<th style="text-align:left">Ejemplos</th>
<th style="text-align:left">Dónde aparece</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Del dominio del problema</strong></td>
<td style="text-align:left"><code>Estudiante</code>, <code>Profesor</code>, <code>Aula</code>, <code>Cuenta</code>, <code>Curso</code>, <code>Matricula</code></td>
<td style="text-align:left">Modelo de análisis</td>
</tr>
<tr>
<td style="text-align:left"><strong>De la tecnología empleada</strong></td>
<td style="text-align:left"><code>Label</code>, <code>Button</code>, <code>TextBox</code>, <code>HttpRequest</code></td>
<td style="text-align:left">Modelo de diseño, por extensión o composición</td>
</tr>
<tr>
<td style="text-align:left"><strong>De la solución de diseño</strong></td>
<td style="text-align:left"><code>EstudianteRestController</code>, <code>EstudianteRepository</code>, <code>EstudianteTest</code></td>
<td style="text-align:left">Modelo de diseño e implementación</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> En <strong>análisis</strong> solo interesan las de la primera fila. Las otras dos aparecen cuando ya se decidió la arquitectura</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Si en el modelo de análisis aparece <code>EstudianteController</code>, alguien se saltó una etapa</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="los-cuatro-pasos">Los cuatro pasos</h2>
<div class="grid">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-crear-la-realizaci%C3%B3n"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Crear la realización</h3>
<p>Un contenedor para el caso de uso, con sus diagramas de clase e interacción</p>
</div>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-identificar-clases-entidad"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Identificar clases entidad</h3>
<p>Buscar los sustantivos del dominio en la especificación del caso de uso</p>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-armar-el-diagrama-de-clases"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Armar el diagrama de clases</h3>
<p>Clases de análisis, atributos, asociaciones, multiplicidades y roles</p>
</div>
<div>
<h3 id="4%EF%B8%8F%E2%83%A3-armar-el-diagrama-de-secuencia"><img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/34-20e3.svg" data-marp-twemoji=""/> Armar el diagrama de secuencia</h3>
<p>Repartir el comportamiento entre las clases, escenario por escenario</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> No es una cascada: el paso 4 casi siempre <strong>obliga a volver</strong> al paso 3, porque al repartir mensajes aparecen clases y operaciones que no se habían visto</li>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> Se hace <strong>por caso de uso</strong>, no para todo el sistema de una vez</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="paso-2-identificar-las-clases-del-dominio">Paso 2: identificar las clases del dominio</h2>
<steps>
<step>
<h3 id="la-t%C3%A9cnica-base">La técnica base</h3>
<ul>
<li>Buscar <strong>sustantivos y frases sustantivas</strong> en la especificación del caso de uso</li>
<li>Considerar que algunos sustantivos serán <strong>atributos</strong>, no clases</li>
<li>Recordar la naturaleza <strong>iterativa-incremental</strong>: habrá oportunidad de refinar; no hay que acertar a la primera</li>
</ul>
</step>
<step>
<h3 id="las-categor%C3%ADas-de-tockey-2019">Las categorías de Tockey (2019)</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Categoría</th>
<th style="text-align:left">Qué buscar</th>
<th style="text-align:left">Ejemplos</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Actores</strong></td>
<td style="text-align:left">Cada actor del diagrama de casos de uso, estereotipado <code>«actor»</code></td>
<td style="text-align:left">Cliente, analista de crédito, cajero</td>
</tr>
<tr>
<td style="text-align:left"><strong>Cosas físicas</strong></td>
<td style="text-align:left">Objetos tangibles del dominio</td>
<td style="text-align:left">Persona, vehículo, fuente de poder</td>
</tr>
<tr>
<td style="text-align:left"><strong>Conceptos</strong></td>
<td style="text-align:left">No físicos pero relevantes</td>
<td style="text-align:left">Cuenta bancaria, deducción fiscal, reservación</td>
</tr>
<tr>
<td style="text-align:left"><strong>Roles</strong></td>
<td style="text-align:left">Papeles que juega alguien</td>
<td style="text-align:left">Estudiante, docente, vendedor, piloto</td>
</tr>
<tr>
<td style="text-align:left"><strong>Especificaciones</strong></td>
<td style="text-align:left">Características compartidas por colecciones similares</td>
<td style="text-align:left">Modelo de avión, tipo de habitación</td>
</tr>
<tr>
<td style="text-align:left"><strong>Eventos</strong></td>
<td style="text-align:left">Cosas donde el tiempo importa</td>
<td style="text-align:left">Orden de compra, matrícula, reservación</td>
</tr>
<tr>
<td style="text-align:left"><strong>Asociaciones</strong></td>
<td style="text-align:left">Algo que conecta dos o más cosas y tiene datos propios</td>
<td style="text-align:left">Licencia de conducir, asignación</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> El autor sugiere <strong>no categorizar</strong> cada clase que se encuentre: la lista es solo un disparador de memoria</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="paso-2-el-filtro">Paso 2: el filtro</h2>
<ul>
<li>Ninguna lista de sustantivos sobrevive intacta. Cada candidata pasa por una tabla como esta:</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Clase candidata</th>
<th style="text-align:left">Atributos posibles</th>
<th style="text-align:left">Asociaciones</th>
<th style="text-align:left">¿Es clase de análisis?</th>
<th style="text-align:left">Por qué</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Paciente</td>
<td style="text-align:left">nombre, cédula, fecha nacimiento</td>
<td style="text-align:left">Registro, Tratamiento</td>
<td style="text-align:left"><strong>Sí</strong></td>
<td style="text-align:left">Concepto central, con estado propio</td>
</tr>
<tr>
<td style="text-align:left">Nombre</td>
<td style="text-align:left">—</td>
<td style="text-align:left">—</td>
<td style="text-align:left"><strong>No</strong></td>
<td style="text-align:left">Es un <strong>atributo</strong> de Paciente</td>
</tr>
<tr>
<td style="text-align:left">Registro</td>
<td style="text-align:left">fecha, número</td>
<td style="text-align:left">Paciente</td>
<td style="text-align:left"><strong>Sí</strong></td>
<td style="text-align:left">Evento con datos propios</td>
</tr>
<tr>
<td style="text-align:left">Sistema</td>
<td style="text-align:left">—</td>
<td style="text-align:left">—</td>
<td style="text-align:left"><strong>No</strong></td>
<td style="text-align:left">Es el sistema entero, no una clase</td>
</tr>
<tr>
<td style="text-align:left">Detalles personales</td>
<td style="text-align:left">—</td>
<td style="text-align:left">—</td>
<td style="text-align:left"><strong>No</strong></td>
<td style="text-align:left">Sinónimo de los atributos de Paciente</td>
</tr>
<tr>
<td style="text-align:left">Compañía de seguros</td>
<td style="text-align:left">nombre, código</td>
<td style="text-align:left">Paciente</td>
<td style="text-align:left"><strong>Sí</strong></td>
<td style="text-align:left">Sistema externo → clase <code>«boundary»</code></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Tres preguntas para descartar: ¿tiene <strong>estado propio</strong>? ¿tiene <strong>comportamiento</strong>? ¿alguien lo <strong>necesita recordar</strong> entre casos de uso?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="ejemplo-sustantivos-del-cu-%C2%ABregistrar-paciente%C2%BB">Ejemplo: sustantivos del CU «Registrar paciente»</h2>
<split-slide style="--left: 46%; --right: 54%;">
<div>
<h3 id="lo-que-se-subray%C3%B3">Lo que se subrayó</h3>
<p><code>Paciente</code> · <code>Administrador</code> · <code>Registro</code> · <code>Sistema de salud del gobierno</code> · <code>Compañía de seguros</code> · <code>Hospital</code> · <code>Tratamiento médico</code> · <code>Detalles personales</code> · <code>Nombre</code> · <code>Dirección</code> · <code>Teléfono</code> · <code>Fecha de nacimiento</code> · <code>Contacto de emergencia</code> · <code>Sistema</code> · <code>Número de asegurado</code> · <code>Identidad</code> · <code>Registrado condicionalmente</code> · <code>Paciente que paga tarifa completa</code></p>
</div>
<div>
<h3 id="lo-que-sobrevive">Lo que sobrevive</h3>
<ul>
<li><strong>Clases</strong>: <code>Paciente</code>, <code>Registro</code>, <code>Tratamiento</code>, <code>Hospital</code></li>
<li><strong>Actores / sistemas externos</strong>: <code>Administrador</code>, <code>SistemaSaludGobierno</code>, <code>AseguradoraPrivada</code></li>
<li><strong>Atributos</strong>: nombre, dirección, teléfono, fecha de nacimiento, contacto de emergencia, número de asegurado</li>
<li><strong>Estados, no clases</strong>: <em>registrado condicionalmente</em>, <em>paga tarifa completa</em> → son valores de un atributo <code>estado</code></li>
<li><strong>Ruido</strong>: <code>Sistema</code>, <code>Identidad</code>, <code>Detalles personales</code></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Los sinónimos son la trampa principal: <code>Registro</code>, <code>Registration</code> y <code>Existing Registration</code> eran <strong>la misma clase</strong> escrita de tres formas</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="paso-3-el-diagrama-de-clases-de-an%C3%A1lisis">Paso 3: el diagrama de clases de análisis</h2>
<steps>
<step>
<h3 id="qu%C3%A9-se-agrega">Qué se agrega</h3>
<ul>
<li>Las <strong>clases de análisis</strong> identificadas en el paso 2</li>
<li>Para cada una, sus <strong>atributos</strong> probables, con nombres que signifiquen algo</li>
<li><strong>Sin preocuparse por los tipos</strong>: estamos en análisis, no en diseño</li>
</ul>
</step>
<step>
<h3 id="las-asociaciones">Las asociaciones</h3>
<ul>
<li>Establecer las asociaciones entre clases e identificar su <strong>semántica</strong>: asociación simple, agregación, composición o herencia</li>
<li>Asignar <strong>multiplicidad</strong> y <strong>roles</strong> a cada extremo</li>
<li>Nombrar la asociación con un verbo que se lea en una dirección: <code>Docente ——imparte——&gt; Curso</code></li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%8E%AF-enfoque"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Enfoque</h3>
<p>En este diagrama, concéntrese en las clases de tipo <strong>entidad</strong></p>
</div>
<div>
<h3 id="%F0%9F%93%8F-multiplicidad"><img class="emoji" draggable="false" alt="📏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cf.svg" data-marp-twemoji=""/> Multiplicidad</h3>
<p><code>1</code> · <code>0..1</code> · <code>*</code> · <code>1..*</code> · <code>2..4</code> — cada extremo responde <em>«¿cuántos?»</em></p>
</div>
<div>
<h3 id="%F0%9F%8F%B7%EF%B8%8F-roles"><img class="emoji" draggable="false" alt="🏷️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3f7.svg" data-marp-twemoji=""/> Roles</h3>
<p>El nombre con que <strong>una clase ve a la otra</strong>: <code>empleador</code>, <code>empleados</code></p>
</div>
</div>
</step>
</steps>
<ul>
<li><img class="emoji" draggable="false" alt="📎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ce.svg" data-marp-twemoji=""/> La notación completa (asociación, agregación, composición, clase asociación, generalización) está en el mazo de <strong>UML</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="las-tres-clases-del-modelo-de-an%C3%A1lisis">Las tres clases del modelo de análisis</h2>
<p><a href="../assets/ads-dis-bce.svg"><img src="../assets/ads-dis-bce.svg" alt="" style="height:440px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="clase-l%C3%ADmite--%C2%ABboundary%C2%BB">Clase límite — <code>«boundary»</code></h2>
<split-slide style="--left: 52%; --right: 48%;">
<div>
<h3 id="qu%C3%A9-modela">Qué modela</h3>
<ul>
<li>La <strong>interacción entre el entorno del sistema y sus trabajos internos</strong></li>
<li>Modela los componentes que <strong>dependen del entorno</strong>: si cambia el entorno, cambia esta clase y ninguna otra</li>
<li>Ejemplos: ventanas, protocolos de comunicación, interfaces de impresoras, sensores, terminales</li>
</ul>
</div>
<div>
<h3 id="sus-tres-fuentes">Sus tres fuentes</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Fuente</th>
<th style="text-align:left">De dónde sale</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Interfaz de usuario</strong></td>
<td style="text-align:left">Una por cada pantalla o formulario del caso de uso</td>
</tr>
<tr>
<td style="text-align:left"><strong>Interfaz de sistema</strong></td>
<td style="text-align:left">Una por cada sistema externo con el que se habla</td>
</tr>
<tr>
<td style="text-align:left"><strong>Interfaz de dispositivo</strong></td>
<td style="text-align:left">Una por cada sensor, lector o impresora</td>
</tr>
</tbody>
</table>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Regla de dedo: <strong>una clase límite por actor y por caso de uso</strong>. Si un caso de uso tiene dos actores, probablemente tiene dos clases límite</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> La clase límite <strong>no</strong> contiene reglas del negocio. Si valida algo más que el formato de un campo, la regla está en el lugar equivocado</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="clase-control--%C2%ABcontrol%C2%BB">Clase control — <code>«control»</code></h2>
<steps>
<step>
<h3 id="qu%C3%A9-modela-1">Qué modela</h3>
<ul>
<li>El <strong>comportamiento de control</strong> específico a uno o varios casos de uso</li>
<li>Cuando el sistema ejecuta el caso de uso, <strong>se crea un objeto de control</strong>; cuando termina, se destruye</li>
<li>Proporciona el <strong>comportamiento de coordinación</strong>: es quien sabe el orden de los pasos</li>
<li>La misma clase de control puede reutilizarse en sistemas con <strong>interfaces distintas</strong> y <strong>almacenes distintos</strong></li>
</ul>
</step>
<step>
<h3 id="cu%C3%A1ndo-una-responsabilidad-pertenece-al-control">Cuándo una responsabilidad pertenece al control</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%8C%90-es-independiente-del-entorno"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> Es independiente del entorno</h3>
<p>No cambia cuando cambia la pantalla o el canal</p>
</div>
<div>
<h3 id="%F0%9F%94%A2-define-la-l%C3%B3gica-de-control"><img class="emoji" draggable="false" alt="🔢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f522.svg" data-marp-twemoji=""/> Define la lógica de control</h3>
<p>El <strong>orden</strong> entre sucesos y las transacciones del guion de uso</p>
</div>
<div>
<h3 id="%F0%9F%A7%8A-es-estable"><img class="emoji" draggable="false" alt="🧊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ca.svg" data-marp-twemoji=""/> Es estable</h3>
<p>Cambia poco si cambia la estructura interna de las entidades</p>
</div>
<div>
<h3 id="%F0%9F%8E%BC-coordina-entidades"><img class="emoji" draggable="false" alt="🎼" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3bc.svg" data-marp-twemoji=""/> Coordina entidades</h3>
<p>Usa o establece el contenido de <strong>varias</strong> clases entidad</p>
</div>
<div>
<h3 id="%F0%9F%94%80-no-siempre-igual"><img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f500.svg" data-marp-twemoji=""/> No siempre igual</h3>
<p>El flujo pasa por estados distintos según el caso</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Nombre típico: <code>GestorMatricula</code>, <code>ControladorRegistroDocente</code>, <code>ProcesadorPago</code></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="clase-entidad--%C2%ABentity%C2%BB">Clase entidad — <code>«entity»</code></h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="qu%C3%A9-modela-2">Qué modela</h3>
<ul>
<li>Clases de análisis <strong>de nivel de negocio</strong></li>
<li>Guardan y administran <strong>información que persiste</strong>: usualmente sobreviven al caso de uso que las creó</li>
<li>Ejemplos: <code>Cliente</code>, <code>Cuenta</code>, <code>Transaccion</code>, <code>Docente</code>, <code>Matricula</code></li>
<li>Vienen casi directo del <strong>modelo de dominio</strong> y del glosario</li>
</ul>
</div>
<div>
<h3 id="qu%C3%A9-comportamiento-tienen">Qué comportamiento tienen</h3>
<ul>
<li>El que <strong>protege sus propios datos</strong>: <code>cuenta.debitar(monto)</code>, no <code>cuenta.saldo = saldo - monto</code></li>
<li>Las <strong>reglas invariantes</strong>: una <code>Matricula</code> no puede existir sin estudiante y sin grupo</li>
<li>Los <strong>cálculos derivados</strong> de sus atributos: <code>factura.total()</code></li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>No</strong> saben de pantallas, ni de SQL, ni del orden del caso de uso</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>«Verificar que la cédula tenga 9 dígitos»</em> → <spoiler>límite (formato) o entidad (regla de negocio), nunca control</spoiler></li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>«Decidir si primero se cobra o primero se asigna el cupo»</em> → <spoiler>control</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="paso-4-el-diagrama-de-secuencia">Paso 4: el diagrama de secuencia</h2>
<steps>
<step>
<h3 id="la-regla-de-cobertura">La regla de cobertura</h3>
<ul>
<li>De acuerdo con los <strong>escenarios</strong> que conforman el caso de uso, se desarrolla un diagrama de secuencia</li>
<li><strong>Al menos uno</strong> para el flujo básico de eventos</li>
<li><strong>Uno o más</strong> para cada flujo alterno o excepcional que valga la pena</li>
</ul>
</step>
<step>
<h3 id="repartir-responsabilidades">Repartir responsabilidades</h3>
<blockquote>
<p>Una <strong>responsabilidad</strong> es un comportamiento sobre algo que se le puede pedir a un objeto</p>
</blockquote>
<p>Puede ser:</p>
<ul>
<li>Las <strong>acciones</strong> que ejecuta el objeto</li>
<li>El <strong>conocimiento</strong> que mantiene y que proporciona a otros objetos</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%93%A8-de-mensaje-a-operaci%C3%B3n"><img class="emoji" draggable="false" alt="📨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e8.svg" data-marp-twemoji=""/> De mensaje a operación</h3>
<p>Las responsabilidades <strong>se derivan de los mensajes</strong>: todo mensaje recibido se vuelve una operación de la clase receptora</p>
</div>
<div>
<h3 id="%E2%9A%96%EF%B8%8F-el-reparto-es-la-decisi%C3%B3n"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> El reparto es la decisión</h3>
<p>Dos diseños válidos del mismo caso de uso se diferencian en <strong>quién hace qué</strong>, no en qué se hace</p>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="secuencia-de-an%C3%A1lisis-vs-secuencia-de-dise%C3%B1o">Secuencia de análisis vs. secuencia de diseño</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%94%8D-nivel-de-an%C3%A1lisis"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> Nivel de análisis</h3>
<ul>
<li>Modela el comportamiento <strong>desde el punto de vista del actor</strong></li>
<li>Es una buena técnica de <strong>pizarra</strong> para capturar los escenarios que describen los usuarios</li>
<li>Participantes: las clases límite, control y entidad</li>
<li>Mensajes con nombres del negocio, sin firmas</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%9B%A0%EF%B8%8F-nivel-de-dise%C3%B1o"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Nivel de diseño</h3>
<ul>
<li><strong>Más detallado</strong>: muestra los objetos que colaboran en una secuencia determinada</li>
<li>Mensajes con <strong>parámetros</strong>, <strong>valores de retorno</strong> y el orden exacto</li>
<li>Aparecen objetos de la arquitectura: repositorios, servicios, adaptadores</li>
<li>Es lo que el programador convierte en código casi línea por línea</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> El mismo caso de uso puede tener los dos. El de análisis se dibuja con el usuario; el de diseño, con el equipo técnico</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="ejemplo-cu-%C2%ABregistrar-docente-de-la-carrera%C2%BB">Ejemplo: CU «Registrar docente de la carrera»</h2>
<p><a href="../assets/ads-dis-secuencia-registro.svg"><img src="../assets/ads-dis-secuencia-registro.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="c%C3%B3mo-se-ley%C3%B3-ese-diagrama">Cómo se leyó ese diagrama</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Lo que se ve</th>
<th style="text-align:left">Lo que significa para el diseño</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">El actor solo toca <code>FormularioDocente</code></td>
<td style="text-align:left">La clase límite es el único punto de entrada: <strong>respeta la regla de robustez</strong></td>
</tr>
<tr>
<td style="text-align:left"><code>GestorRegistroDocente</code> recibe <code>registrar(...)</code></td>
<td style="text-align:left">Esa firma <strong>será una operación pública</strong> de la clase control</td>
</tr>
<tr>
<td style="text-align:left"><code>validarFormato</code> es un auto-mensaje</td>
<td style="text-align:left">Es una operación <strong>privada</strong>: nadie de afuera la invoca</td>
</tr>
<tr>
<td style="text-align:left">El fragmento <code>alt</code></td>
<td style="text-align:left">El caso de uso tenía un flujo alterno <em>«cédula ya registrada»</em></td>
</tr>
<tr>
<td style="text-align:left"><code>«create»</code> hacia <code>d : Docente</code></td>
<td style="text-align:left">El objeto <strong>nace dentro</strong> del caso de uso; antes no existía</td>
</tr>
<tr>
<td style="text-align:left">Los retornos punteados</td>
<td style="text-align:left">Se dibujan <strong>solo cuando dicen algo</strong>; si no, ensucian</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Cada flecha que entra a una caja se convirtió en una fila del diagrama de clases de diseño</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="un-diagrama-de-secuencia-no-es-suficiente">Un diagrama de secuencia no es suficiente</h2>
<steps>
<step>
<h3 id="cu%C3%A1ntos-hacen-falta">Cuántos hacen falta</h3>
<ul>
<li>Modele <strong>la mayoría de los flujos de eventos</strong> para asegurar que el comportamiento quede repartido entre las clases participantes</li>
<li><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> Inicie con el <strong>flujo básico</strong>: es el más importante</li>
<li><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> Continúe con las <strong>variantes</strong></li>
<li>No tiene que describir <strong>todos</strong> los flujos, siempre que se ejemplifiquen todas las operaciones de los objetos participantes</li>
<li>Los flujos <strong>triviales pueden omitirse</strong></li>
</ul>
</step>
<step>
<h3 id="los-flujos-de-excepci%C3%B3n-que-s%C3%AD-valen-la-pena">Los flujos de excepción que sí valen la pena</h3>
<div class="grid">
<div>
<h3 id="%E2%9A%A0%EF%B8%8F-manejo-de-errores"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Manejo de errores</h3>
<p>¿Qué debe hacer el sistema cuando algo falla a medio camino?</p>
</div>
<div>
<h3 id="%E2%8F%B0-tiempo-muerto"><img class="emoji" draggable="false" alt="⏰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f0.svg" data-marp-twemoji=""/> Tiempo muerto</h3>
<p>Si la persona usuaria no responde en cierto periodo, ¿qué medidas toma el caso de uso?</p>
</div>
<div>
<h3 id="%E2%8C%A8%EF%B8%8F-errores-de-entrada"><img class="emoji" draggable="false" alt="⌨️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2328.svg" data-marp-twemoji=""/> Errores de entrada</h3>
<p>Datos incorrectos de los objetos que participan en el caso de uso</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> Toda ruta alternativa <strong>regresa al flujo principal o termina</strong>. No hay terceras opciones</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="actividad-1-realiza-un-caso-de-uso">Actividad 1: realiza un caso de uso</h2>
<split-slide style="--left: 52%; --right: 48%;">
<div>
<h3 id="el-caso-de-uso">El caso de uso</h3>
<p><strong>«Prestar un libro»</strong> — Biblioteca universitaria</p>
<ol>
<li>El usuario presenta su carné al bibliotecario</li>
<li>El sistema verifica que el usuario esté activo y sin multas pendientes</li>
<li>El bibliotecario digita el código del ejemplar</li>
<li>El sistema verifica que el ejemplar esté disponible</li>
<li>El sistema registra el préstamo con la fecha de devolución según el tipo de usuario</li>
<li>El sistema imprime el comprobante</li>
</ol>
<p><strong>Alterno</strong>: si el usuario tiene multas, el sistema rechaza el préstamo y muestra el monto adeudado</p>
</div>
<div>
<h3 id="qu%C3%A9-entregar">Qué entregar</h3>
<ol>
<li>La lista de <strong>sustantivos</strong> con el filtro aplicado (candidata · atributos · ¿es clase?)</li>
<li>El <strong>diagrama de secuencia</strong> del flujo básico, con un fragmento <code>alt</code> para el flujo alterno</li>
<li>Una frase que justifique <strong>por qué</strong> el cálculo de la fecha de devolución quedó donde lo pusieron</li>
</ol>
<h3 id="preguntas-de-control">Preguntas de control</h3>
<ul>
<li>¿Cuántas clases límite hay? ¿Por qué?</li>
<li>¿<code>Multa</code> es clase o atributo?</li>
<li>¿Quién decide la fecha: el control o la entidad?</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 30 minutos · en grupos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="actividad-1-una-soluci%C3%B3n-posible">Actividad 1: una solución posible</h2>
<hidden label="Solución">
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="las-clases-que-sobreviven-al-filtro">Las clases que sobreviven al filtro</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Candidata</th>
<th style="text-align:left">¿Clase?</th>
<th style="text-align:left">Por qué</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Usuario</td>
<td style="text-align:left"><strong>Sí</strong> <code>«entity»</code></td>
<td style="text-align:left">Estado propio: activo, multas</td>
</tr>
<tr>
<td style="text-align:left">Ejemplar</td>
<td style="text-align:left"><strong>Sí</strong> <code>«entity»</code></td>
<td style="text-align:left">Es la copia física, no el título</td>
</tr>
<tr>
<td style="text-align:left">Libro</td>
<td style="text-align:left"><strong>Sí</strong> <code>«entity»</code></td>
<td style="text-align:left">Un libro tiene muchos ejemplares</td>
</tr>
<tr>
<td style="text-align:left">Prestamo</td>
<td style="text-align:left"><strong>Sí</strong> <code>«entity»</code></td>
<td style="text-align:left">Evento con fecha y estado</td>
</tr>
<tr>
<td style="text-align:left">Multa</td>
<td style="text-align:left"><strong>Sí</strong> <code>«entity»</code></td>
<td style="text-align:left">Tiene monto y fecha propios</td>
</tr>
<tr>
<td style="text-align:left">Carné</td>
<td style="text-align:left"><strong>No</strong></td>
<td style="text-align:left">Atributo de <code>Usuario</code></td>
</tr>
<tr>
<td style="text-align:left">Tipo de usuario</td>
<td style="text-align:left"><strong>Sí</strong> <code>«entity»</code></td>
<td style="text-align:left"><em>Especificación</em>: define el plazo</td>
</tr>
<tr>
<td style="text-align:left">Comprobante</td>
<td style="text-align:left"><strong>No</strong></td>
<td style="text-align:left">Salida de la clase límite</td>
</tr>
</tbody>
</table>
</div>
<div>
<h3 id="clases-de-an%C3%A1lisis">Clases de análisis</h3>
<ul>
<li><strong>Límite</strong>: <code>PantallaPrestamo</code> (una sola: un actor, un caso de uso)</li>
<li><strong>Control</strong>: <code>GestorPrestamo</code> — decide el orden: primero valida usuario, luego ejemplar, luego registra</li>
<li><strong>Entidad</strong>: <code>Usuario</code>, <code>Ejemplar</code>, <code>Prestamo</code>, <code>Multa</code>, <code>TipoUsuario</code></li>
</ul>
<h3 id="la-decisi%C3%B3n-que-se-ped%C3%ADa-justificar">La decisión que se pedía justificar</h3>
<p>El cálculo de la fecha va en <strong><code>TipoUsuario.plazoDias()</code></strong>, consumido por <code>Prestamo</code>: es una <strong>regla del negocio</strong>, no un paso del caso de uso. Si mañana los estudiantes de posgrado tienen 21 días, cambia un dato, no el control.</p>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Si el cálculo hubiera quedado en <code>GestorPrestamo</code>, cada caso de uso que preste algo tendría que repetirlo</li>
</ul>
</div>
</split-slide>
</hidden>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-scope-Bb4SfPaR="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="34" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="87">
<h1 id="arquitectura-del-software">Arquitectura del software</h1>
<h2 id="contenidos-3">Contenidos</h2>
<ul>
<li>Qué es y qué decisiones incluye</li>
<li>Arquitectura y atributos de calidad</li>
<li>Estilos arquitectónicos</li>
<li>Capas, puertos y adaptadores</li>
<li>Las vistas 4+1 y el documento de arquitectura</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="%C2%BFqu%C3%A9-es-la-arquitectura-del-software">¿Qué es la arquitectura del software?</h2>
<steps>
<step>
<h3 id="tres-definiciones-que-se-complementan">Tres definiciones que se complementan</h3>
<blockquote>
<p>«El conjunto de estructuras necesarias para razonar sobre el sistema: <strong>elementos de software, relaciones entre ellos y propiedades</strong> de ambos»<br />
— <em>Bass, Clements &amp; Kazman</em></p>
</blockquote>
<blockquote>
<p>«Las decisiones de diseño <strong>significativas</strong>, medidas por el <strong>costo de cambiarlas</strong>»<br />
— <em>Grady Booch</em></p>
</blockquote>
<blockquote>
<p>«Las cosas que a la gente le cuesta cambiar después»<br />
— <em>Martin Fowler</em></p>
</blockquote>
</step>
<step>
<h3 id="qu%C3%A9-las-tres-tienen-en-com%C3%BAn">Qué las tres tienen en común</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%B1-estructura"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> Estructura</h3>
<p>Habla de <strong>piezas y relaciones</strong>, no de algoritmos internos</p>
</div>
<div>
<h3 id="%F0%9F%92%B0-costo-de-cambio"><img class="emoji" draggable="false" alt="💰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4b0.svg" data-marp-twemoji=""/> Costo de cambio</h3>
<p>Es arquitectónico lo que <strong>duele cambiar</strong> a mitad del proyecto</p>
</div>
<div>
<h3 id="%F0%9F%8E%AF-atributos-de-calidad"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Atributos de calidad</h3>
<p>Existe para <strong>satisfacer los no funcionales</strong>, no los funcionales</p>
</div>
<div>
<h3 id="%F0%9F%97%A3%EF%B8%8F-comunicaci%C3%B3n"><img class="emoji" draggable="false" alt="🗣️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5e3.svg" data-marp-twemoji=""/> Comunicación</h3>
<p>Es el vocabulario común de <strong>todo el equipo</strong> y del cliente técnico</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Casi cualquier arquitectura puede cumplir los requerimientos funcionales. <strong>Los no funcionales son los que deciden</strong></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="qu%C3%A9-decisiones-son-arquitect%C3%B3nicas">Qué decisiones son arquitectónicas</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Decisión</th>
<th style="text-align:left">¿Arquitectónica?</th>
<th style="text-align:left">Por qué</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Separar en capas presentación, dominio e infraestructura</td>
<td style="text-align:left"><strong>Sí</strong></td>
<td style="text-align:left">Atraviesa todo el sistema; cambiarla después es reescribir</td>
</tr>
<tr>
<td style="text-align:left">Usar PostgreSQL en vez de MongoDB</td>
<td style="text-align:left"><strong>Sí</strong></td>
<td style="text-align:left">Cambia el modelo de datos, las consultas y las transacciones</td>
</tr>
<tr>
<td style="text-align:left">Comunicar los módulos por REST o por mensajería</td>
<td style="text-align:left"><strong>Sí</strong></td>
<td style="text-align:left">Define acoplamiento temporal y manejo de fallas</td>
</tr>
<tr>
<td style="text-align:left">Nombrar una variable <code>total</code> o <code>montoTotal</code></td>
<td style="text-align:left">No</td>
<td style="text-align:left">Cuesta un <em>rename</em></td>
</tr>
<tr>
<td style="text-align:left">Usar <code>for</code> o <code>stream</code> en un método</td>
<td style="text-align:left">No</td>
<td style="text-align:left">Es local, se cambia en minutos</td>
</tr>
<tr>
<td style="text-align:left">Autenticar con OAuth 2.0 contra el IdP institucional</td>
<td style="text-align:left"><strong>Sí</strong></td>
<td style="text-align:left">Afecta cada punto de entrada del sistema</td>
</tr>
<tr>
<td style="text-align:left">Ordenar una lista con <code>sort()</code> o con un índice en la BD</td>
<td style="text-align:left">Depende</td>
<td style="text-align:left">Si el volumen es de millones, sí lo es</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> La prueba: <em>«si mañana cambiamos esto, ¿cuántos archivos se tocan y cuántas conversaciones hay que tener?»</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="la-arquitectura-existe-por-los-atributos-de-calidad">La arquitectura existe por los atributos de calidad</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="el-v%C3%ADnculo">El vínculo</h3>
<ul>
<li>Un <strong>requerimiento funcional</strong> («registrar un docente») se puede cumplir con cualquier arquitectura, hasta con un solo archivo</li>
<li>Un <strong>atributo de calidad</strong> («responder en menos de 2 s con 5 000 usuarios concurrentes») <strong>decide la arquitectura</strong></li>
<li>Por eso el insumo principal del arquitecto son las <strong>especificaciones suplementarias</strong>, no los casos de uso</li>
</ul>
</div>
<div>
<h3 id="los-que-m%C3%A1s-presionan">Los que más presionan</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Atributo</th>
<th style="text-align:left">Qué fuerza a decidir</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Rendimiento</strong></td>
<td style="text-align:left">Caché, réplicas de lectura, procesamiento asíncrono</td>
</tr>
<tr>
<td style="text-align:left"><strong>Disponibilidad</strong></td>
<td style="text-align:left">Redundancia, <em>failover</em>, sin punto único de falla</td>
</tr>
<tr>
<td style="text-align:left"><strong>Seguridad</strong></td>
<td style="text-align:left">Frontera de confianza, cifrado, auditoría</td>
</tr>
<tr>
<td style="text-align:left"><strong>Modificabilidad</strong></td>
<td style="text-align:left">Capas, interfaces, inversión de dependencias</td>
</tr>
<tr>
<td style="text-align:left"><strong>Escalabilidad</strong></td>
<td style="text-align:left">Servicios sin estado, particionamiento</td>
</tr>
<tr>
<td style="text-align:left"><strong>Testeabilidad</strong></td>
<td style="text-align:left">Dependencias inyectadas, dominio puro</td>
</tr>
</tbody>
</table>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Los atributos <strong>se pelean entre ellos</strong>: más seguridad cuesta rendimiento; más disponibilidad cuesta dinero. Diseñar es escoger a quién se le da prioridad</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="estilos-arquitect%C3%B3nicos">Estilos arquitectónicos</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Estilo</th>
<th style="text-align:left">Idea central</th>
<th style="text-align:left">Va bien cuando</th>
<th style="text-align:left">Duele cuando</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Monolito en capas</strong></td>
<td style="text-align:left">Un despliegue, capas internas</td>
<td style="text-align:left">Equipo pequeño, dominio conocido</td>
<td style="text-align:left">El equipo crece y todos tocan lo mismo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Cliente-servidor</strong></td>
<td style="text-align:left">El cliente pide, el servidor responde</td>
<td style="text-align:left">Aplicaciones de escritorio y web clásicas</td>
<td style="text-align:left">El cliente necesita trabajar sin red</td>
</tr>
<tr>
<td style="text-align:left"><strong>MVC / MVVM</strong></td>
<td style="text-align:left">Separar modelo, presentación y coordinación</td>
<td style="text-align:left">Interfaces con mucha lógica de vista</td>
<td style="text-align:left">Se confunde el modelo con las entidades</td>
</tr>
<tr>
<td style="text-align:left"><strong>Hexagonal (puertos y adaptadores)</strong></td>
<td style="text-align:left">El dominio no conoce la tecnología</td>
<td style="text-align:left">Se prevén varios canales o cambio de tecnología</td>
<td style="text-align:left">El proyecto es pequeño y sobra ceremonia</td>
</tr>
<tr>
<td style="text-align:left"><strong>Microservicios</strong></td>
<td style="text-align:left">Servicios independientes, desplegados por separado</td>
<td style="text-align:left">Equipos múltiples, escalado desigual</td>
<td style="text-align:left">El dominio aún no está entendido</td>
</tr>
<tr>
<td style="text-align:left"><strong>Orientado a eventos</strong></td>
<td style="text-align:left">Los componentes reaccionan a eventos</td>
<td style="text-align:left">Integraciones asíncronas, alta carga</td>
<td style="text-align:left">Hay que depurar un flujo completo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Tubos y filtros</strong></td>
<td style="text-align:left">Datos que pasan por etapas</td>
<td style="text-align:left">ETL, procesamiento de archivos</td>
<td style="text-align:left">Se necesita interacción en tiempo real</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Un sistema real <strong>combina varios</strong>: un monolito en capas cuyo módulo de reportes es orientado a eventos es perfectamente sano</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="arquitectura-en-capas">Arquitectura en capas</h2>
<p><a href="../assets/ads-dis-capas.svg"><img src="../assets/ads-dis-capas.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="puertos-y-adaptadores">Puertos y adaptadores</h2>
<p><a href="../assets/ads-dis-hexagonal.svg"><img src="../assets/ads-dis-hexagonal.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="monolito-o-microservicios">Monolito o microservicios</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
