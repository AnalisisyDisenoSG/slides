</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="75" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="los-que-s%C3%AD-se-usan-todos-los-d%C3%ADas">Los que sí se usan todos los días</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Patrón</th>
<th style="text-align:left">Problema que resuelve</th>
<th style="text-align:left">Se reconoce por</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Strategy</strong></td>
<td style="text-align:left">Varios algoritmos intercambiables para lo mismo</td>
<td style="text-align:left">Una interfaz con varias implementaciones que se inyectan</td>
</tr>
<tr>
<td style="text-align:left"><strong>Observer</strong></td>
<td style="text-align:left">Notificar a varios interesados sin acoplarse a ellos</td>
<td style="text-align:left"><code>suscribir()</code> / <code>notificar()</code>; eventos</td>
</tr>
<tr>
<td style="text-align:left"><strong>Adapter</strong></td>
<td style="text-align:left">Usar una clase con una interfaz que no encaja</td>
<td style="text-align:left">Una clase que traduce entre dos interfaces</td>
</tr>
<tr>
<td style="text-align:left"><strong>Facade</strong></td>
<td style="text-align:left">Simplificar el acceso a un subsistema complejo</td>
<td style="text-align:left">Una clase con pocos métodos que orquesta muchas</td>
</tr>
<tr>
<td style="text-align:left"><strong>Factory Method</strong></td>
<td style="text-align:left">Crear objetos sin fijar la clase concreta</td>
<td style="text-align:left">Un método <code>crear...()</code> que devuelve una interfaz</td>
</tr>
<tr>
<td style="text-align:left"><strong>Decorator</strong></td>
<td style="text-align:left">Agregar comportamiento sin heredar</td>
<td style="text-align:left">Envolver un objeto con otro de la misma interfaz</td>
</tr>
<tr>
<td style="text-align:left"><strong>Template Method</strong></td>
<td style="text-align:left">Fijar el esqueleto y variar los pasos</td>
<td style="text-align:left">Un método <code>final</code> que llama a métodos abstractos</td>
</tr>
<tr>
<td style="text-align:left"><strong>Repository</strong></td>
<td style="text-align:left">Aislar el dominio del almacenamiento</td>
<td style="text-align:left">Una interfaz <code>guardar/buscar</code> implementada en infraestructura</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>Singleton</strong>: es el más conocido y el más abusado. Es un global disfrazado — dificulta las pruebas y esconde dependencias. Casi siempre lo correcto es <strong>inyectar</strong> una sola instancia</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="76" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="ejemplo-strategy-en-la-biblioteca">Ejemplo: Strategy en la biblioteca</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.8rem;">
<div>
<h3 id="el-problema">El problema</h3>
<pre><code class="language-java"><span class="hljs-type">int</span> plazo;
<span class="hljs-keyword">if</span> (tipo.equals(<span class="hljs-string">&quot;ESTUDIANTE&quot;</span>))     plazo = <span class="hljs-number">7</span>;
<span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (tipo.equals(<span class="hljs-string">&quot;DOCENTE&quot;</span>))   plazo = <span class="hljs-number">30</span>;
<span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (tipo.equals(<span class="hljs-string">&quot;POSGRADO&quot;</span>))  plazo = <span class="hljs-number">21</span>;
<span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (tipo.equals(<span class="hljs-string">&quot;ADMIN&quot;</span>))     plazo = <span class="hljs-number">14</span>;
</code></pre>
<ul>
<li>Cada tipo nuevo obliga a <strong>tocar este método</strong></li>
<li>La misma cadena se repite en el cálculo de la multa y en el de renovaciones</li>
<li>Es el síntoma clásico: <strong>un <code>if</code> sobre un tipo</strong></li>
</ul>
</div>
<div>
<h3 id="la-soluci%C3%B3n">La solución</h3>
<pre><code class="language-java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">PoliticaPrestamo</span> {
  <span class="hljs-type">int</span> <span class="hljs-title function_">plazoDias</span><span class="hljs-params">()</span>;
  <span class="hljs-type">Monto</span> <span class="hljs-title function_">multaPorDia</span><span class="hljs-params">()</span>;
}

<span class="hljs-keyword">class</span> <span class="hljs-title class_">PoliticaEstudiante</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">PoliticaPrestamo</span> {
  <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">plazoDias</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> <span class="hljs-number">7</span>; }
  <span class="hljs-keyword">public</span> <span class="hljs-type">Monto</span> <span class="hljs-title function_">multaPorDia</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> Monto.de(<span class="hljs-number">100</span>); }
}
</code></pre>
<ul>
<li><code>Prestamo</code> solo pide <code>politica.plazoDias()</code></li>
<li>Un tipo nuevo es una <strong>clase nueva</strong>, no un <code>if</code> más</li>
<li><img class="emoji" draggable="false" alt="➖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2796.svg" data-marp-twemoji=""/> El precio: más clases y una indirección</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>¿Y si solo hay dos tipos y nunca van a cambiar?</em> → <spoiler>el <code>if</code> está bien; el patrón sería ceremonia sin beneficio</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="77" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="antipatrones">Antipatrones</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%91%91-objeto-dios"><img class="emoji" draggable="false" alt="👑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f451.svg" data-marp-twemoji=""/> Objeto dios</h3>
<p>Una clase que lo sabe y lo hace todo. Las demás son estructuras de datos</p>
</div>
<div>
<h3 id="%F0%9F%8D%9D-c%C3%B3digo-espagueti"><img class="emoji" draggable="false" alt="🍝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f35d.svg" data-marp-twemoji=""/> Código espagueti</h3>
<p>Sin estructura reconocible: el flujo salta por todas partes</p>
</div>
<div>
<h3 id="%F0%9F%A7%8A-modelo-de-dominio-an%C3%A9mico"><img class="emoji" draggable="false" alt="🧊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ca.svg" data-marp-twemoji=""/> Modelo de dominio anémico</h3>
<p>Clases con solo <code>get</code> y <code>set</code>; la lógica vive en «servicios». Es programación estructurada con sintaxis de objetos</p>
</div>
<div>
<h3 id="%F0%9F%94%A8-martillo-de-oro"><img class="emoji" draggable="false" alt="🔨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f528.svg" data-marp-twemoji=""/> Martillo de oro</h3>
<p>Todo problema se resuelve con la única herramienta que se domina</p>
</div>
<div>
<h3 id="%F0%9F%8E%A9-sobreingenier%C3%ADa"><img class="emoji" draggable="false" alt="🎩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3a9.svg" data-marp-twemoji=""/> Sobreingeniería</h3>
<p>Cinco capas de abstracción por si algún día cambia algo que nunca cambia</p>
</div>
<div>
<h3 id="%F0%9F%AA%B5-lava-seca"><img class="emoji" draggable="false" alt="🪵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1fab5.svg" data-marp-twemoji=""/> Lava seca</h3>
<p>Código muerto que nadie borra «por si acaso» y que todos rodean con cuidado</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> El antipatrón más caro es la <strong>sobreingeniería</strong>, porque parece buen diseño. La prueba: si la abstracción tiene <strong>una sola implementación</strong> y nadie prevé la segunda, sobra</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="78" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="cu%C3%A1ndo-no-usar-un-patr%C3%B3n">Cuándo no usar un patrón</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="las-se%C3%B1ales-de-alerta">Las señales de alerta</h3>
<ul>
<li>Se aplica <strong>antes</strong> de tener el problema</li>
<li>Hay que explicar tres clases para entender lo que hacía un <code>if</code></li>
<li>El patrón se escogió porque <strong>estaba en el libro</strong>, no porque el problema lo pidiera</li>
<li>La interfaz tiene una sola implementación y ninguna en el horizonte</li>
<li>Nadie del equipo lo reconoce por el nombre</li>
</ul>
</div>
<div>
<h3 id="la-secuencia-sana">La secuencia sana</h3>
<ol>
<li>Escriba la solución <strong>directa</strong> que funciona</li>
<li>Espere el <strong>segundo</strong> caso: ahí se ve el eje de variación real</li>
<li>Refactorice <strong>hacia</strong> el patrón cuando el eje esté claro</li>
<li>Nombre las clases con el patrón para que el equipo lo reconozca</li>
</ol>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> <em>«Regla de tres»</em>: a la tercera repetición, abstraiga. Antes es adivinar</li>
</ul>
</div>
</split-slide>
<blockquote>
<p>«Los patrones son un destino al que se llega refactorizando, no un punto de partida»<br />
— <em>Joshua Kerievsky, &quot;Refactoring to Patterns&quot;</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="79" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="actividad-4-aplica-patrones">Actividad 4: aplica patrones</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="el-c%C3%B3digo-que-hay-que-arreglar">El código que hay que arreglar</h3>
<p>En el sistema de biblioteca aparecen estas cuatro situaciones:</p>
<ol>
<li>El cálculo de la multa tiene un <code>switch</code> sobre el tipo de usuario, repetido en tres clases</li>
<li>Cuando se devuelve un ejemplar hay que: liberar el cupo, avisar al siguiente de la lista de espera, registrar la estadística y notificar al usuario</li>
<li>Hay que consultar el catálogo nacional, que expone una interfaz SOAP muy distinta a la del catálogo interno</li>
<li>Registrar un préstamo obliga a llamar a seis clases en un orden preciso; tres módulos distintos lo hacen</li>
</ol>
</div>
<div>
<h3 id="qu%C3%A9-entregar-3">Qué entregar</h3>
<p>Para <strong>cada</strong> situación:</p>
<ol>
<li>El <strong>patrón</strong> que aplicaría y por qué</li>
<li>El <strong>diagrama de clases</strong> de la solución</li>
<li>Las <strong>consecuencias</strong>: qué se gana y qué se paga</li>
<li>Una situación en la que <strong>no</strong> valdría la pena aplicarlo</li>
</ol>
<h3 id="preguntas-de-control-3">Preguntas de control</h3>
<ul>
<li>¿Cuál de las cuatro <strong>no</strong> necesita patrón alguno?</li>
<li>¿Qué principio GRASP sostiene cada decisión?</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 25 minutos · en grupos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="80" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="actividad-4-una-soluci%C3%B3n-posible">Actividad 4: una solución posible</h2>
<hidden label="Solución">
<table>
<thead>
<tr>
<th style="text-align:left">#</th>
<th style="text-align:left">Patrón</th>
<th style="text-align:left">Por qué</th>
<th style="text-align:left">Qué se paga</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>1</strong></td>
<td style="text-align:left"><strong>Strategy</strong> (+ <em>Experto en información</em>)</td>
<td style="text-align:left">El <code>switch</code> sobre un tipo es el síntoma canónico. Cada política se vuelve una clase y el tipo nuevo no toca código existente</td>
<td style="text-align:left">Más clases; hay que decidir dónde se instancia la política</td>
</tr>
<tr>
<td style="text-align:left"><strong>2</strong></td>
<td style="text-align:left"><strong>Observer</strong></td>
<td style="text-align:left">Cuatro reacciones independientes al mismo evento «ejemplar devuelto». Agregar una quinta no debe tocar <code>Devolucion</code></td>
<td style="text-align:left">El flujo deja de leerse en un solo lugar; depurar cuesta más</td>
</tr>
<tr>
<td style="text-align:left"><strong>3</strong></td>
<td style="text-align:left"><strong>Adapter</strong></td>
<td style="text-align:left">La interfaz externa no encaja y <strong>no se puede modificar</strong>. El adaptador traduce y aísla el SOAP en un solo archivo</td>
<td style="text-align:left">Una capa más de traducción y de mapeo de errores</td>
</tr>
<tr>
<td style="text-align:left"><strong>4</strong></td>
<td style="text-align:left"><strong>Facade</strong></td>
<td style="text-align:left">Los tres módulos deberían llamar a <strong>una</strong> operación, no orquestar seis clases en orden</td>
<td style="text-align:left">Riesgo de que la fachada crezca hasta volverse objeto dios</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> La cuarta pregunta: si el catálogo nacional se consulta <strong>una sola vez, en un solo lugar</strong>, el adapter sobra — llame al SOAP directamente y aísle después</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> GRASP detrás de cada una: <strong>Variaciones protegidas</strong> (1 y 3), <strong>Bajo acoplamiento</strong> (2), <strong>Controlador</strong> e <strong>Indirección</strong> (4)</li>
</ul>
</hidden>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-marpit-scope-bI3X4po6="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="81" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="87">
<h1 id="artefactos-de-la-disciplina">Artefactos de la disciplina</h1>
<h2 id="contenidos-7">Contenidos</h2>
<ul>
<li>Qué entra y qué sale del diseño</li>
<li>Modelo de Análisis y Modelo de Diseño</li>
<li>Documento de Arquitectura y Modelo de Datos</li>
<li>Prototipos de interfaz gráfica</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="82" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="el-mapa-de-artefactos">El mapa de artefactos</h2>
<p><a href="../assets/ads-dis-artefactos.svg"><img src="../assets/ads-dis-artefactos.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="83" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="los-cinco-artefactos">Los cinco artefactos</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Artefacto</th>
<th style="text-align:left">Qué contiene</th>
<th style="text-align:left">Quién lo mantiene</th>
<th style="text-align:left">Quién lo consume</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Modelo de Análisis</strong></td>
<td style="text-align:left">Clases límite, control y entidad; realizaciones de casos de uso; paquetes de análisis</td>
<td style="text-align:left">Analista</td>
<td style="text-align:left">El equipo de diseño</td>
</tr>
<tr>
<td style="text-align:left"><strong>Documento de Arquitectura (SAD)</strong></td>
<td style="text-align:left">Decisiones significativas, vistas 4+1, atributos de calidad priorizados, restricciones</td>
<td style="text-align:left">Arquitecto</td>
<td style="text-align:left">Todo el equipo, el cliente técnico</td>
</tr>
<tr>
<td style="text-align:left"><strong>Modelo de Diseño</strong></td>
<td style="text-align:left">Clases de diseño con firmas, subsistemas, interfaces, diagramas de interacción, componentes</td>
<td style="text-align:left">Diseñador</td>
<td style="text-align:left">Implementación y pruebas</td>
</tr>
<tr>
<td style="text-align:left"><strong>Modelo de Datos</strong></td>
<td style="text-align:left">Modelo conceptual, lógico y físico; estrategia de mapeo; índices y restricciones</td>
<td style="text-align:left">Diseñador de datos / DBA</td>
<td style="text-align:left">Implementación, DBA, reportes</td>
</tr>
<tr>
<td style="text-align:left"><strong>Prototipo de interfaz gráfica</strong></td>
<td style="text-align:left">Pantallas navegables, flujo de navegación, guía de estilo</td>
<td style="text-align:left">Diseñador de interacción</td>
<td style="text-align:left">Usuario, pruebas, implementación</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Los cinco son <strong>modelos vivos</strong>, no entregables de una vez. Si dejan de reflejar el sistema, dejan de servir y empiezan a estorbar</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="84" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="el-modelo-de-an%C3%A1lisis">El Modelo de Análisis</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="qu%C3%A9-contiene">Qué contiene</h3>
<ul>
<li>Las <strong>clases de análisis</strong> de todos los casos de uso, con estereotipos límite, control y entidad</li>
<li>Una <strong>realización</strong> por caso de uso significativo</li>
<li>Los <strong>paquetes de análisis</strong>: agrupaciones por área del negocio</li>
<li>Un <strong>glosario</strong> consistente con el del negocio</li>
</ul>
</div>
<div>
<h3 id="para-qu%C3%A9-sirve-de-verdad">Para qué sirve de verdad</h3>
<ul>
<li>Es el <strong>borrador estructurado</strong> del diseño: barato de cambiar porque no hay código atrás</li>
<li>Sirve para <strong>negociar el alcance</strong>: se ve cuántas clases toca un caso de uso</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> En proyectos pequeños <strong>se funde con el modelo de diseño</strong>. Mantener dos modelos que dicen casi lo mismo es desperdicio</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Criterio: manténgalo separado solo si el modelo de análisis lo lee alguien que <strong>no</strong> lee el de diseño</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="85" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="prototipos-de-interfaz-gr%C3%A1fica">Prototipos de interfaz gráfica</h2>
<steps>
<step>
<h3 id="los-niveles-de-fidelidad">Los niveles de fidelidad</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Nivel</th>
<th style="text-align:left">Con qué se hace</th>
<th style="text-align:left">Para qué sirve</th>
<th style="text-align:left">Riesgo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Baja</strong> — bocetos</td>
<td style="text-align:left">Papel, pizarra</td>
<td style="text-align:left">Discutir <strong>flujo</strong> y contenido en minutos</td>
<td style="text-align:left">Ninguno: se bota sin dolor</td>
</tr>
<tr>
<td style="text-align:left"><strong>Media</strong> — <em>wireframes</em></td>
<td style="text-align:left">Figma, Balsamiq</td>
<td style="text-align:left">Acordar estructura y navegación</td>
<td style="text-align:left">Discutir colores antes de tiempo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Alta</strong> — maqueta navegable</td>
<td style="text-align:left">Figma interactivo, HTML</td>
<td style="text-align:left">Validar con el usuario, hacer pruebas de usabilidad</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Que el cliente crea que <strong>ya está hecho</strong></td>
</tr>
</tbody>
</table>
</step>
<step>
<h3 id="para-qu%C3%A9-se-hacen">Para qué se hacen</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%94%8D-elicitar"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> Elicitar</h3>
<p>Un usuario corrige una pantalla mucho mejor de lo que describe un requerimiento</p>
</div>
<div>
<h3 id="%E2%9C%85-validar"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Validar</h3>
<p>Confirmar que se entendió, <strong>antes</strong> de construir</p>
</div>
<div>
<h3 id="%F0%9F%97%BA%EF%B8%8F-dise%C3%B1ar-navegaci%C3%B3n"><img class="emoji" draggable="false" alt="🗺️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5fa.svg" data-marp-twemoji=""/> Diseñar navegación</h3>
<p>El mapa de pantallas es un artefacto de diseño por derecho propio</p>
</div>
<div>
<h3 id="%F0%9F%8E%AF-descubrir-datos"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Descubrir datos</h3>
<p>Cada campo de una pantalla delata un atributo que faltaba</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> El prototipo <strong>no es el sistema</strong>: no tiene reglas, ni persistencia, ni casos de error. Dígalo en voz alta en cada demostración</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Prototipo <strong>desechable</strong> cuando es para aprender; <strong>evolutivo</strong> solo si se construyó con la calidad del producto final</li>
</ul>
</step>
</steps>
</section>

<h2 id="c%C3%B3mo-se-conecta-todo">Cómo se conecta todo</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Artefacto de entrada</th>
<th style="text-align:left">Actividad de diseño</th>
<th style="text-align:left">Artefacto de salida</th>
<th style="text-align:left">Alimenta a</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Casos de uso + modelo de dominio</td>
<td style="text-align:left">Análisis de casos de uso</td>
<td style="text-align:left">Clases de análisis y realizaciones</td>
<td style="text-align:left">Diseño de clases</td>
</tr>
<tr>
<td style="text-align:left">Especificaciones suplementarias</td>
<td style="text-align:left">Diseño arquitectónico</td>
<td style="text-align:left">SAD, subsistemas, interfaces</td>
<td style="text-align:left">Todo el diseño</td>
</tr>
<tr>
<td style="text-align:left">Clases de análisis + arquitectura</td>
<td style="text-align:left">Diseño de clases</td>
<td style="text-align:left">Clases de diseño con firmas</td>
<td style="text-align:left">Implementación</td>
</tr>
<tr>
<td style="text-align:left">Clases de diseño</td>
<td style="text-align:left">Diseño de componentes</td>
<td style="text-align:left">Componentes y artefactos</td>
<td style="text-align:left">Despliegue</td>
</tr>
<tr>
<td style="text-align:left">Clases entidad</td>
<td style="text-align:left">Diseño de datos</td>
<td style="text-align:left">Modelo lógico y físico</td>
<td style="text-align:left">DBA e implementación</td>
</tr>
<tr>
<td style="text-align:left">Casos de uso + usuario</td>
<td style="text-align:left">Diseño de interacción</td>
<td style="text-align:left">Prototipo de interfaz</td>
<td style="text-align:left">Implementación y pruebas</td>
</tr>
</tbody>
</table>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%B5-trazabilidad"><img class="emoji" draggable="false" alt="🧵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f5.svg" data-marp-twemoji=""/> Trazabilidad</h3>
<p>Cada clase de diseño debe poder rastrearse a un <strong>caso de uso</strong>. Si no, ¿de dónde salió?</p>
</div>
<div>
<h3 id="%F0%9F%94%81-iteraci%C3%B3n"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> Iteración</h3>
<p>Nada de esto ocurre una sola vez. En cada iteración se profundiza un pedazo</p>
</div>
<div>
<h3 id="%E2%9A%96%EF%B8%8F-suficiencia"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> Suficiencia</h3>
<p>Se produce lo que alguien va a usar. <strong>Un artefacto sin lector es desperdicio</strong></p>
</div>
</div>
