<h3 id="%F0%9F%A7%B1-monolito-modular"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> Monolito modular</h3>
<ul>
<li>Un solo despliegue, módulos con fronteras claras</li>
<li>Transacciones <strong>fáciles</strong>: una base de datos</li>
<li>Depurar es leer una pila de llamadas</li>
<li>Refactorizar entre módulos es barato</li>
<li>El escalado es <strong>todo o nada</strong></li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>Es el punto de partida correcto</strong> para casi todo proyecto nuevo</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%A7%A9-microservicios"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Microservicios</h3>
<ul>
<li>Servicios desplegables por separado, cada uno con sus datos</li>
<li>Transacciones <strong>distribuidas</strong>: consistencia eventual, sagas</li>
<li>Depurar exige trazabilidad distribuida</li>
<li>Cambiar un contrato compartido cuesta coordinación</li>
<li>Se escala <strong>la parte que lo necesita</strong></li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Exige madurez en despliegue, monitoreo y equipos autónomos</li>
</ul>
</div>
</split-slide>
<blockquote>
<p>«No empiece con microservicios. Empiece con un monolito bien modularizado y sepárelo cuando el dolor lo justifique»<br />
— <em>Martin Fowler, &quot;MonolithFirst&quot;</em></p>
</blockquote>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>Proyecto de curso, 4 personas, 4 meses</em> → <spoiler>monolito en capas, sin discusión</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="las-vistas-41">Las vistas 4+1</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Vista</th>
<th style="text-align:left">Responde</th>
<th style="text-align:left">Para quién</th>
<th style="text-align:left">Diagramas UML</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Lógica</strong></td>
<td style="text-align:left">¿Qué funcionalidad ofrece?</td>
<td style="text-align:left">Usuario final, analistas</td>
<td style="text-align:left">Clases, secuencia, estados</td>
</tr>
<tr>
<td style="text-align:left"><strong>De procesos</strong></td>
<td style="text-align:left">¿Cómo se comporta en ejecución?</td>
<td style="text-align:left">Integradores</td>
<td style="text-align:left">Actividad, secuencia, componentes</td>
</tr>
<tr>
<td style="text-align:left"><strong>De desarrollo</strong></td>
<td style="text-align:left">¿Cómo se organiza el código?</td>
<td style="text-align:left">Programadores, gerente</td>
<td style="text-align:left">Paquetes, componentes</td>
</tr>
<tr>
<td style="text-align:left"><strong>Física</strong></td>
<td style="text-align:left">¿Dónde se ejecuta?</td>
<td style="text-align:left">Ingenieros de infraestructura</td>
<td style="text-align:left">Despliegue</td>
</tr>
<tr>
<td style="text-align:left"><strong>+1: Escenarios</strong></td>
<td style="text-align:left">¿Cómo encaja todo?</td>
<td style="text-align:left">Todos</td>
<td style="text-align:left">Casos de uso</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> La vista <strong>+1 amarra las otras cuatro</strong>: un puñado de casos de uso arquitectónicamente significativos se recorre en las cuatro vistas para probar que la arquitectura funciona</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> No hay que producir las cinco siempre. Se produce <strong>la vista que alguien va a leer</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="el-documento-de-arquitectura-de-software">El Documento de Arquitectura de Software</h2>
<split-slide style="--left: 48%; --right: 52%;">
<div>
<h3 id="qu%C3%A9-es">Qué es</h3>
<ul>
<li>El artefacto que <strong>captura las decisiones arquitectónicas</strong> y las justifica</li>
<li>Se organiza por las <strong>vistas 4+1</strong></li>
<li>No es un manual del sistema: es el conjunto de decisiones <strong>que costaría caro descubrir tarde</strong></li>
<li>Se escribe <strong>temprano</strong> y se actualiza cuando una decisión cambia</li>
</ul>
</div>
<div>
<h3 id="secciones-t%C3%ADpicas">Secciones típicas</h3>
<ol>
<li>Introducción, alcance y definiciones</li>
<li><strong>Representación arquitectónica</strong>: qué vistas se usan</li>
<li><strong>Metas y restricciones</strong>: los atributos de calidad priorizados</li>
<li>Vista de <strong>casos de uso</strong> (los significativos)</li>
<li>Vista <strong>lógica</strong> — paquetes y clases clave</li>
<li>Vista de <strong>procesos</strong> — hilos, concurrencia</li>
<li>Vista de <strong>despliegue</strong> — nodos y red</li>
<li>Vista de <strong>implementación</strong> — estructura del código</li>
<li>Vista de <strong>datos</strong> — modelo de la base de datos</li>
<li><strong>Tamaño y rendimiento</strong> · <strong>Calidad</strong></li>
</ol>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> El error clásico: un SAD de 80 páginas que nadie lee. Mejor 8 páginas con <strong>las decisiones y su porqué</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="registrar-las-decisiones-adr">Registrar las decisiones: ADR</h2>
<steps>
<step>
<h3 id="el-formato-m%C3%ADnimo">El formato mínimo</h3>
<ul>
<li>Un <strong>ADR</strong> (<em>Architecture Decision Record</em>) es una página por decisión, con cuatro apartados:</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Apartado</th>
<th style="text-align:left">Qué contiene</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Contexto</strong></td>
<td style="text-align:left">La situación y las fuerzas que empujan: requerimientos, restricciones, plazos</td>
</tr>
<tr>
<td style="text-align:left"><strong>Decisión</strong></td>
<td style="text-align:left">Lo que se decidió, en voz activa: <em>«Usaremos…»</em></td>
</tr>
<tr>
<td style="text-align:left"><strong>Alternativas</strong></td>
<td style="text-align:left">Qué más se consideró y por qué se descartó</td>
</tr>
<tr>
<td style="text-align:left"><strong>Consecuencias</strong></td>
<td style="text-align:left">Lo bueno y lo malo que se acepta al decidir así</td>
</tr>
</tbody>
</table>
</step>
<step>
<h3 id="un-ejemplo">Un ejemplo</h3>
<ul>
<li>
<p><strong>Contexto</strong>: el sistema debe funcionar con la red institucional caída hasta por 2 horas. La matrícula ocurre 3 veces al año con picos de 4 000 usuarios en 30 minutos</p>
</li>
<li>
<p><strong>Decisión</strong>: la validación de requisitos se resuelve contra una <strong>réplica local de solo lectura</strong>, sincronizada cada noche</p>
</li>
<li>
<p><strong>Alternativas</strong>: consultar el sistema central en línea (descartada: depende de la red); replicar en tiempo real (descartada: costo y complejidad)</p>
</li>
<li>
<p><strong>Consecuencias</strong>: <img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2795.svg" data-marp-twemoji=""/> la matrícula sobrevive a una caída de red · <img class="emoji" draggable="false" alt="➖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2796.svg" data-marp-twemoji=""/> un estudiante que aprobó ayer aparece hasta mañana; hay que documentarlo con el usuario</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> El valor está en la <strong>cuarta</strong> sección: obliga a admitir el precio de la decisión</p>
</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-marpit-scope-n7lXHcwh="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="45" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="87">
<h1 id="subsistemas-interfaces-y-componentes">Subsistemas, interfaces y componentes</h1>
<h2 id="contenidos-4">Contenidos</h2>
<ul>
<li>Qué es un subsistema y cómo se identifica</li>
<li>La interfaz como contrato</li>
<li>Diseño de componentes</li>
<li>Principios de cohesión y acoplamiento entre componentes</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="el-subsistema">El subsistema</h2>
<p><a href="../assets/ads-dis-subsistema.svg"><img src="../assets/ads-dis-subsistema.svg" alt="" style="height:440px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="c%C3%B3mo-se-identifican-los-subsistemas">Cómo se identifican los subsistemas</h2>
<steps>
<step>
<h3 id="los-criterios">Los criterios</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%8F%A2-por-%C3%A1rea-del-negocio"><img class="emoji" draggable="false" alt="🏢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3e2.svg" data-marp-twemoji=""/> Por área del negocio</h3>
<p><code>Matricula</code>, <code>Facturacion</code>, <code>Expediente</code> — la frontera sigue al dominio</p>
</div>
<div>
<h3 id="%F0%9F%91%A5-por-equipo"><img class="emoji" draggable="false" alt="👥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f465.svg" data-marp-twemoji=""/> Por equipo</h3>
<p>Un subsistema que un equipo pueda desarrollar y liberar sin pedir permiso</p>
</div>
<div>
<h3 id="%F0%9F%94%8C-por-tecnolog%C3%ADa"><img class="emoji" draggable="false" alt="🔌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50c.svg" data-marp-twemoji=""/> Por tecnología</h3>
<p>Todo lo que dependa de un sistema externo se aísla en un subsistema</p>
</div>
<div>
<h3 id="%F0%9F%94%84-por-ritmo-de-cambio"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> Por ritmo de cambio</h3>
<p>Lo que cambia todos los meses no vive junto a lo que cambia cada tres años</p>
</div>
</div>
</step>
<step>
<h3 id="las-se%C3%B1ales-de-una-mala-frontera">Las señales de una mala frontera</h3>
<ul>
<li>Casi todos los casos de uso <strong>atraviesan</strong> todos los subsistemas → la partición no sigue al dominio</li>
<li>Dos subsistemas comparten la <strong>misma tabla</strong> de la base de datos → no son dos, son uno</li>
<li>Un cambio pequeño obliga a coordinar <strong>tres equipos</strong> → el acoplamiento está en el lugar equivocado</li>
<li>Un subsistema expone <strong>20 interfaces</strong> → adentro había varios subsistemas</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> La prueba definitiva: si no se puede describir lo que hace <strong>en una frase</strong>, la frontera está mal trazada</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="la-interfaz-como-contrato">La interfaz como contrato</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="qu%C3%A9-declara-una-interfaz">Qué declara una interfaz</h3>
<ul>
<li>Las <strong>operaciones</strong>: nombre, parámetros, tipo de retorno</li>
<li>Las <strong>precondiciones</strong>: qué debe cumplirse antes de llamar</li>
<li>Las <strong>poscondiciones</strong>: qué garantiza al terminar</li>
<li>Las <strong>excepciones</strong>: qué puede salir mal y cómo se avisa</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Lo que <strong>no</strong> declara: cómo lo hace por dentro</li>
</ul>
</div>
<div>
<h3 id="interfaz-provista-y-requerida">Interfaz provista y requerida</h3>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left">Provista</th>
<th style="text-align:left">Requerida</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Símbolo</strong></td>
<td style="text-align:left">Círculo (<em>lollipop</em>)</td>
<td style="text-align:left">Semicírculo (<em>socket</em>)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Significa</strong></td>
<td style="text-align:left">«Yo ofrezco esto»</td>
<td style="text-align:left">«Necesito que alguien me dé esto»</td>
</tr>
<tr>
<td style="text-align:left"><strong>Quién la define</strong></td>
<td style="text-align:left">El proveedor</td>
<td style="text-align:left">El consumidor</td>
</tr>
<tr>
<td style="text-align:left"><strong>Ejemplo</strong></td>
<td style="text-align:left"><code>IGestionDocente</code></td>
<td style="text-align:left"><code>IAutenticacion</code></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Un componente <strong>encaja</strong> con otro cuando el círculo de uno entra en el semicírculo del otro</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> El beneficio real: definida la interfaz, <strong>dos equipos arrancan el mismo día</strong>. Uno construye el proveedor, el otro programa contra un doble de prueba</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="componente-clase-paquete-y-subsistema">Componente, clase, paquete y subsistema</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Concepto</th>
<th style="text-align:left">Qué es</th>
<th style="text-align:left">Existe en</th>
<th style="text-align:left">Se sustituye</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Clase</strong></td>
<td style="text-align:left">Unidad de diseño: atributos y operaciones</td>
<td style="text-align:left">Modelo de diseño</td>
<td style="text-align:left">Editando el código</td>
</tr>
<tr>
<td style="text-align:left"><strong>Paquete</strong></td>
<td style="text-align:left">Agrupador <strong>lógico</strong> de elementos del modelo</td>
<td style="text-align:left">Modelo de diseño</td>
<td style="text-align:left">Moviendo archivos</td>
</tr>
<tr>
<td style="text-align:left"><strong>Subsistema</strong></td>
<td style="text-align:left">Parte del sistema con <strong>interfaces propias</strong> y comportamiento</td>
<td style="text-align:left">Modelo de diseño</td>
<td style="text-align:left">Reimplementando sus interfaces</td>
</tr>
<tr>
<td style="text-align:left"><strong>Componente</strong></td>
<td style="text-align:left">Pieza <strong>modular y reemplazable</strong> con interfaces bien definidas</td>
<td style="text-align:left">Modelo de implementación</td>
<td style="text-align:left">En caliente, si el contrato se respeta</td>
</tr>
<tr>
<td style="text-align:left"><strong>Artefacto</strong></td>
<td style="text-align:left">El archivo concreto: <code>.jar</code>, <code>.dll</code>, imagen de contenedor</td>
<td style="text-align:left">Modelo de despliegue</td>
<td style="text-align:left">Copiando un archivo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Nodo</strong></td>
<td style="text-align:left">El elemento físico donde se ejecuta el artefacto</td>
<td style="text-align:left">Modelo de despliegue</td>
<td style="text-align:left">Cambiando el servidor</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> La diferencia entre subsistema y componente es sobre todo de <strong>momento</strong>: el subsistema es una decisión de diseño; el componente, una unidad de construcción y despliegue</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="dise%C3%B1o-de-componentes">Diseño de componentes</h2>
<steps>
<step>
<h3 id="los-pasos">Los pasos</h3>
<ol>
<li><strong>Agrupar</strong> las clases de diseño que colaboran fuertemente y comparten razones de cambio</li>
<li><strong>Extraer la interfaz</strong>: qué necesita el mundo exterior de ese grupo, y nada más</li>
<li><strong>Declarar lo requerido</strong>: de qué depende el componente para funcionar</li>
<li><strong>Verificar la dirección de las dependencias</strong>: ninguna debe apuntar hacia lo volátil</li>
<li><strong>Definir el artefacto</strong> que lo empaqueta y el nodo donde se despliega</li>
</ol>
</step>
<step>
<h3 id="las-tres-preguntas-de-control">Las tres preguntas de control</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%8E%AF-%C2%BFuna-raz%C3%B3n-para-cambiar"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> ¿Una razón para cambiar?</h3>
<p>Si el componente cambia por dos motivos distintos, son dos componentes</p>
</div>
<div>
<h3 id="%F0%9F%94%81-%C2%BFhay-ciclos"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> ¿Hay ciclos?</h3>
<p>Si A depende de B y B de A, no se pueden liberar por separado. Hay que romperlo con una interfaz</p>
</div>
<div>
<h3 id="%F0%9F%93%A6-%C2%BFse-puede-liberar-solo"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> ¿Se puede liberar solo?</h3>
<p>Si para publicar una versión hay que publicar otros cuatro, no es un componente</p>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="principios-de-componentes">Principios de componentes</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%A7%B2-cohesi%C3%B3n-qu%C3%A9-va-junto"><img class="emoji" draggable="false" alt="🧲" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f2.svg" data-marp-twemoji=""/> Cohesión: qué va junto</h3>
<ul>
<li>
<p><strong>REP</strong> — <em>Reuse/Release Equivalence</em>: se reutiliza lo que se libera; el componente es la unidad de versión</p>
</li>
<li>
<p><strong>CCP</strong> — <em>Common Closure</em>: las clases que <strong>cambian por la misma razón</strong> van en el mismo componente</p>
</li>
<li>
<p><strong>CRP</strong> — <em>Common Reuse</em>: las clases que <strong>se usan juntas</strong> van juntas; no obligue a depender de lo que no se usa</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> CCP y CRP <strong>se contradicen</strong>: uno agrupa, el otro separa. Se balancean según la etapa del proyecto</p>
</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%94%97-acoplamiento-c%C3%B3mo-se-conectan"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Acoplamiento: cómo se conectan</h3>
<ul>
<li>
<p><strong>ADP</strong> — <em>Acyclic Dependencies</em>: el grafo de dependencias <strong>no tiene ciclos</strong></p>
</li>
<li>
<p><strong>SDP</strong> — <em>Stable Dependencies</em>: se depende siempre <strong>hacia lo más estable</strong></p>
</li>
<li>
<p><strong>SAP</strong> — <em>Stable Abstractions</em>: lo estable debe ser <strong>abstracto</strong> — por eso el dominio se expresa con interfaces</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> De ahí sale la regla práctica: <strong>lo que más cambia depende de lo que menos cambia, nunca al revés</strong></p>
</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="📎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ce.svg" data-marp-twemoji=""/> Los mismos principios aplicados a clases son <strong>SOLID</strong>; aplicados a paquetes, esto. La idea de fondo no cambia</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="el-diagrama-de-componentes">El diagrama de componentes</h2>
<p><a href="../assets/ads-uml-componentes.svg"><img src="../assets/ads-uml-componentes.svg" alt="" style="height:430px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="actividad-2-prop%C3%B3n-una-arquitectura">Actividad 2: propón una arquitectura</h2>
<split-slide style="--left: 52%; --right: 48%;">
<div>
<h3 id="el-escenario">El escenario</h3>
<p>Sistema de <strong>matrícula</strong> de una universidad pública:</p>
<ul>
<li>38 000 estudiantes; la matrícula ocurre 3 veces al año, con picos de 4 000 usuarios concurrentes en media hora</li>
<li>El resto del año hay menos de 50 usuarios simultáneos</li>
<li>Debe integrarse con el sistema de <strong>cobros</strong> (institucional, SOAP, no se puede modificar) y con el de <strong>expediente académico</strong></li>
<li>El expediente debe consultarse aunque el sistema central esté caído</li>
<li>Un docente debe ver sus listas desde el celular</li>
</ul>
</div>
<div>
<h3 id="qu%C3%A9-entregar-1">Qué entregar</h3>
<ol>
<li>El <strong>estilo arquitectónico</strong> escogido y dos alternativas descartadas, con su razón</li>
<li>Los <strong>subsistemas</strong> con una frase que describa cada uno</li>
<li>Las <strong>interfaces</strong> entre subsistemas: provistas y requeridas</li>
<li>Un <strong>ADR</strong> completo para la decisión más cara del diseño</li>
<li>Los tres <strong>atributos de calidad</strong> priorizados, en orden</li>
</ol>
<h3 id="preguntas-de-control-1">Preguntas de control</h3>
<ul>
<li>¿Qué hace el sistema cuando cobros no responde?</li>
<li>¿Qué se escala en el pico: todo o una parte?</li>
<li>¿Dónde vive la regla «no puede matricular con deuda»?</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 30 minutos · en grupos · se presentan 3 propuestas y se comparan</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="54" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="actividad-2-una-soluci%C3%B3n-posible">Actividad 2: una solución posible</h2>
<hidden label="Solución">
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="estilo">Estilo</h3>
<p><strong>Monolito modular en capas</strong>, desplegado en varias instancias tras un balanceador, con el módulo de integración aislado.</p>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <em>Microservicios</em>: cuatro personas, un dominio conocido y una sola base de datos transaccional. El costo operativo no se paga</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <em>Cliente-servidor de escritorio</em>: el docente necesita el celular</li>
</ul>
<h3 id="subsistemas">Subsistemas</h3>
<ul>
<li><strong>Matricula</strong> — decide si un estudiante puede llevar un grupo y le reserva el cupo</li>
<li><strong>Expediente</strong> — responde qué ha aprobado un estudiante (réplica local de solo lectura)</li>
<li><strong>Cobros</strong> — traduce entre el dominio y el SOAP institucional</li>
<li><strong>Acceso</strong> — autentica y autoriza</li>
</ul>
</div>
<div>
<h3 id="interfaces">Interfaces</h3>
<ul>
<li><code>Matricula</code> <strong>requiere</strong> <code>IExpediente</code> e <code>ICobros</code>; <strong>provee</strong> <code>IMatricula</code> al portal web</li>
<li><code>Cobros</code> <strong>provee</strong> <code>ICobros</code> y adentro habla SOAP: si mañana cambia a REST, cambia un adaptador</li>
</ul>
<h3 id="la-decisi%C3%B3n-m%C3%A1s-cara">La decisión más cara</h3>
<p>Réplica local del expediente (ver el ADR de ejemplo): compra disponibilidad al precio de datos de hasta 24 horas.</p>
<h3 id="atributos-priorizados">Atributos priorizados</h3>
<ol>
<li><strong>Disponibilidad</strong> en el pico — es cuando el sistema importa</li>
<li><strong>Rendimiento</strong> — 2 s por operación con 4 000 concurrentes</li>
<li><strong>Modificabilidad</strong> — el reglamento cambia cada año</li>
</ol>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> La regla «no matricula con deuda» vive en el <strong>dominio</strong>, no en el adaptador: este solo trae el saldo</li>
</ul>
</div>
</split-slide>
</hidden>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-marpit-scope-AKyukCHF="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="55" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="87">
<h1 id="dise%C3%B1o-de-la-base-de-datos">Diseño de la base de datos</h1>
<h2 id="contenidos-5">Contenidos</h2>
<ul>
<li>Los tres modelos de datos</li>
<li>Del modelo de dominio a las tablas</li>
<li>Herencia, normalización y claves</li>
<li>Índices, transacciones y concurrencia</li>
<li>El desfase objeto-relacional</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="por-qu%C3%A9-merece-una-disciplina-aparte">Por qué merece una disciplina aparte</h2>
<div class="grid">
<div>
<h3 id="%E2%8F%B3-sobrevive-al-c%C3%B3digo"><img class="emoji" draggable="false" alt="⏳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f3.svg" data-marp-twemoji=""/> Sobrevive al código</h3>
<p>La aplicación se reescribe cada 5 años; <strong>los datos duran décadas</strong></p>
</div>
<div>
<h3 id="%F0%9F%92%B8-el-error-es-caro"><img class="emoji" draggable="false" alt="💸" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4b8.svg" data-marp-twemoji=""/> El error es caro</h3>
<p>Un error en una clase se corrige y se recompila. Un error en el modelo de datos se <strong>migra</strong>, con el sistema en producción</p>
</div>
<div>
<h3 id="%F0%9F%94%97-es-compartido"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Es compartido</h3>
<p>Otros sistemas, reportes y auditorías leen esas tablas. El esquema es una <strong>interfaz pública</strong></p>
</div>
<div>
<h3 id="%F0%9F%9A%80-ah%C3%AD-vive-el-rendimiento"><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/> Ahí vive el rendimiento</h3>
<p>La diferencia entre 40 ms y 40 s casi siempre está en un índice o en una consulta, no en el lenguaje</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> El error de arranque más común: <strong>diseñar las tablas primero</strong> y deducir las clases de ellas. El resultado es un dominio anémico, con clases que solo tienen <code>get</code> y <code>set</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="del-modelo-de-clases-al-modelo-de-datos">Del modelo de clases al modelo de datos</h2>
<p><a href="../assets/ads-dis-er.svg"><img src="../assets/ads-dis-er.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="reglas-de-mapeo">Reglas de mapeo</h2>
<table>
<thead>
<tr>
<th style="text-align:left">En el modelo de diseño</th>
<th style="text-align:left">En el modelo de datos</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Clase persistente</strong></td>
<td style="text-align:left">Una tabla; cada instancia, una fila</td>
</tr>
<tr>
<td style="text-align:left"><strong>Atributo simple</strong></td>
<td style="text-align:left">Una columna con tipo, longitud y nulabilidad</td>
</tr>
<tr>
<td style="text-align:left"><strong>Atributo derivado</strong></td>
<td style="text-align:left">No se guarda — se calcula. Solo se materializa si el rendimiento lo exige</td>
</tr>
<tr>
<td style="text-align:left"><strong>Atributo multivaluado</strong></td>
<td style="text-align:left">Tabla aparte con clave foránea. <strong>Nunca</strong> <code>telefono1</code>, <code>telefono2</code>, <code>telefono3</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Asociación 1 a muchos</strong></td>
<td style="text-align:left">Clave foránea en el lado <strong>muchos</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Asociación muchos a muchos</strong></td>
<td style="text-align:left">Tabla intermedia con las dos claves foráneas</td>
</tr>
<tr>
<td style="text-align:left"><strong>Clase asociación</strong></td>
<td style="text-align:left">La tabla intermedia, más sus atributos propios</td>
</tr>
<tr>
<td style="text-align:left"><strong>Composición</strong></td>
<td style="text-align:left">Tabla hija con FK <strong>obligatoria</strong> y borrado en cascada</td>
</tr>
<tr>
<td style="text-align:left"><strong>Agregación simple</strong></td>
<td style="text-align:left">Tabla aparte con FK <strong>opcional</strong>; la parte sobrevive al todo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Generalización</strong></td>
<td style="text-align:left">Tres estrategias posibles → siguiente lámina</td>
</tr>
<tr>
<td style="text-align:left"><strong>Operación</strong></td>
<td style="text-align:left"><strong>No se mapea</strong>: el comportamiento vive en el dominio</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> El sentido de la clave foránea es la pregunta clave: va donde está la <strong>multiplicidad muchos</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="herencia-tres-estrategias">Herencia: tres estrategias</h2>
<p><a href="../assets/ads-dis-herencia-tablas.svg"><img src="../assets/ads-dis-herencia-tablas.svg" alt="" style="height:450px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="normalizaci%C3%B3n">Normalización</h2>
<steps>
<step>
<h3 id="las-tres-primeras-formas-normales">Las tres primeras formas normales</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Forma</th>
<th style="text-align:left">Regla</th>
<th style="text-align:left">Síntoma cuando falta</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>1FN</strong></td>
<td style="text-align:left">Cada celda tiene <strong>un valor atómico</strong>; no hay grupos repetidos</td>
<td style="text-align:left">Una columna <code>telefonos</code> con <code>&quot;2511-0000, 8888-0000&quot;</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>2FN</strong></td>
<td style="text-align:left">1FN + todo atributo no clave depende de <strong>toda</strong> la clave primaria</td>
<td style="text-align:left">En <code>(cedula, cod_curso)</code> guardar <code>nombre_estudiante</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>3FN</strong></td>
<td style="text-align:left">2FN + ningún atributo no clave depende de <strong>otro no clave</strong></td>
<td style="text-align:left">En <code>MATRICULA</code> guardar <code>cod_carrera</code> y <code>nombre_carrera</code></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Regla mnemotécnica: <em>cada atributo depende de la clave, de toda la clave y de nada más que la clave</em></li>
</ul>
</step>
<step>
<h3 id="qu%C3%A9-gana-y-qu%C3%A9-cuesta">Qué gana y qué cuesta</h3>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%E2%9C%85-normalizar"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Normalizar</h3>
<ul>
<li>Elimina <strong>redundancia</strong>: un dato, un lugar</li>
<li>Elimina <strong>anomalías</strong> de inserción, actualización y borrado</li>
<li>El esquema es más fácil de entender y de mantener</li>
<li>Es la forma <strong>por defecto</strong> en un sistema transaccional</li>
</ul>
</div>
<div>
<h3 id="%E2%9A%A1-desnormalizar"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> Desnormalizar</h3>
<ul>
<li>Se hace <strong>después</strong>, con números de rendimiento en la mano</li>
<li>Se paga con <strong>redundancia controlada</strong> y la obligación de mantenerla sincronizada</li>
<li>Casos típicos: totales precalculados, tablas de reporte, vistas materializadas</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Nunca «por si acaso»</li>
</ul>
</div>
</split-slide>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="claves-e-integridad">Claves e integridad</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%94%91-clave-primaria"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Clave primaria</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Tipo</th>
<th style="text-align:left">Ejemplo</th>
<th style="text-align:left">Cuándo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Natural</strong></td>
<td style="text-align:left"><code>cedula</code>, <code>cod_curso</code></td>
<td style="text-align:left">El negocio garantiza que es único y que <strong>no cambia</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Artificial</strong></td>
<td style="text-align:left"><code>id_docente</code> autoincremental o UUID</td>
<td style="text-align:left">Casi siempre: nada del negocio es tan estable como parece</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> La cédula se digita mal, el correo cambia y el código de curso se reasigna. Por eso se prefiere la artificial y la natural se declara <code>UNIQUE</code></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%94%97-integridad-referencial"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Integridad referencial</h3>
<ul>
<li>
<p>Una <strong>clave foránea</strong> obliga a que el valor exista en la tabla referenciada</p>
</li>
<li>
<p>Qué pasa al borrar el padre:</p>
<ul>
<li><code>RESTRICT</code> — no deja borrar <em>(lo más seguro)</em></li>
<li><code>CASCADE</code> — borra los hijos <em>(solo en composición)</em></li>
<li><code>SET NULL</code> — deja al hijo huérfano <em>(agregación)</em></li>
</ul>
</li>
<li>
<p>Otras restricciones: <code>NOT NULL</code>, <code>UNIQUE</code>, <code>CHECK</code></p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> La regla que la base de datos <strong>puede</strong> verificar, que la verifique la base de datos</p>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="%C3%ADndices-y-rendimiento">Índices y rendimiento</h2>
<steps>
<step>
<h3 id="qu%C3%A9-es-un-%C3%ADndice">Qué es un índice</h3>
<ul>
<li>Una <strong>estructura auxiliar</strong> que permite encontrar filas sin recorrer toda la tabla</li>
<li>Acelera las <strong>lecturas</strong>; encarece las <strong>escrituras</strong> y ocupa espacio</li>
<li>La clave primaria trae uno; las foráneas <strong>casi siempre lo necesitan</strong> y muchos motores no lo crean solos</li>
</ul>
</step>
<step>
<h3 id="d%C3%B3nde-poner-uno">Dónde poner uno</h3>
<div class="grid">
<div>
<h3 id="%F0%9F%94%8E-columnas-del-where"><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50e.svg" data-marp-twemoji=""/> Columnas del <code>WHERE</code></h3>
<p>Las que filtran de verdad, sobre todo si son selectivas</p>
</div>
<div>
<h3 id="%F0%9F%94%97-columnas-del-join"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Columnas del <code>JOIN</code></h3>
<p>Las claves foráneas usadas para unir tablas</p>
</div>
<div>
<h3 id="%F0%9F%93%8A-columnas-del-order-by"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> Columnas del <code>ORDER BY</code></h3>
<p>Cuando se ordenan muchas filas repetidamente</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>No</strong> indexar: tablas diminutas, columnas con dos valores posibles, tablas con muchísimas escrituras y pocas lecturas</li>
<li><img class="emoji" draggable="false" alt="🔬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f52c.svg" data-marp-twemoji=""/> La decisión se toma con el <strong>plan de ejecución</strong> (<code>EXPLAIN</code>), no por intuición</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="transacciones-y-concurrencia">Transacciones y concurrencia</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="acid">ACID</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Propiedad</th>
<th style="text-align:left">Qué garantiza</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Atomicidad</strong></td>
<td style="text-align:left">Todo o nada</td>
</tr>
<tr>
<td style="text-align:left"><strong>Consistencia</strong></td>
<td style="text-align:left">Se respetan las restricciones</td>
</tr>
<tr>
<td style="text-align:left"><strong>Aislamiento</strong></td>
<td style="text-align:left">Una transacción no ve lo intermedio de otra</td>
</tr>
<tr>
<td style="text-align:left"><strong>Durabilidad</strong></td>
<td style="text-align:left">Confirmado es confirmado, aunque se caiga el servidor</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> La frontera de la transacción es una <strong>decisión de diseño</strong>: normalmente <strong>un caso de uso, una transacción</strong></li>
</ul>
</div>
<div>
<h3 id="el-problema-de-la-actualizaci%C3%B3n-perdida">El problema de la actualización perdida</h3>
<ul>
<li>Dos usuarios leen el mismo grupo con 1 cupo y ambos matriculan</li>
<li><strong>Bloqueo pesimista</strong>: se bloquea la fila al leer. Seguro, pero serializa y puede generar interbloqueos</li>
<li><strong>Bloqueo optimista</strong>: se agrega una columna <code>version</code>; al guardar se verifica que no cambió. Si cambió, se reintenta</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> En web se prefiere el <strong>optimista</strong>: el usuario piensa por minutos y no se puede bloquear una fila ese tiempo</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> En una arquitectura distribuida esta garantía <strong>se pierde</strong>: aparecen consistencia eventual, sagas y compensaciones. Es una de las razones para no repartir en servicios antes de tiempo</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="64" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="el-desfase-objeto-relacional">El desfase objeto-relacional</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="d%C3%B3nde-no-encajan">Dónde no encajan</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Objetos</th>
<th style="text-align:left">Relacional</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Herencia</td>
<td style="text-align:left">No existe</td>
</tr>
<tr>
<td style="text-align:left">Identidad por referencia</td>
<td style="text-align:left">Identidad por clave</td>
</tr>
<tr>
<td style="text-align:left">Navegación por punteros</td>
<td style="text-align:left">Reunión por <code>JOIN</code></td>
</tr>
<tr>
<td style="text-align:left">Colecciones anidadas</td>
<td style="text-align:left">Tablas planas</td>
</tr>
<tr>
<td style="text-align:left">Encapsulamiento</td>
<td style="text-align:left">Columnas públicas</td>
</tr>
<tr>
<td style="text-align:left">Tipos ricos</td>
<td style="text-align:left">Tipos del motor</td>
</tr>
</tbody>
</table>
</div>
<div>
<h3 id="qu%C3%A9-hace-un-orm-y-qu%C3%A9-cuesta">Qué hace un ORM y qué cuesta</h3>
<ul>
<li>
<p>Traduce automáticamente entre clases y tablas: Hibernate/JPA, Entity Framework, Eloquent, Prisma</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2795.svg" data-marp-twemoji=""/> Elimina el código repetitivo de mapeo</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="➖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2796.svg" data-marp-twemoji=""/> Esconde el costo: el problema <strong>N+1</strong> consultas nace de una línea inocente</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="➖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2796.svg" data-marp-twemoji=""/> Genera SQL que a veces hay que reemplazar a mano</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Un ORM <strong>no exime</strong> de entender SQL ni el modelo relacional; solo evita escribirlo cada vez</p>
</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Patrón útil: <strong>Repositorio</strong> — el dominio declara <code>RepositorioDocente</code>, la infraestructura lo implementa con el ORM. El dominio nunca sabe que existe Hibernate</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="65" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="%C2%BFrelacional-o-nosql">¿Relacional o NoSQL?</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Familia</th>
<th style="text-align:left">Modelo</th>
<th style="text-align:left">Va bien cuando</th>
<th style="text-align:left">Ejemplos</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Relacional</strong></td>
<td style="text-align:left">Tablas con esquema y transacciones</td>
<td style="text-align:left">Datos estructurados, relaciones, integridad, reportes</td>
<td style="text-align:left">PostgreSQL, Oracle, MySQL</td>
</tr>
<tr>
<td style="text-align:left"><strong>Documental</strong></td>
<td style="text-align:left">Documentos JSON</td>
<td style="text-align:left">El agregado se lee y escribe completo; esquema flexible</td>
<td style="text-align:left">MongoDB</td>
</tr>
<tr>
<td style="text-align:left"><strong>Clave-valor</strong></td>
<td style="text-align:left">Diccionario distribuido</td>
<td style="text-align:left">Caché, sesiones, lecturas masivas por clave</td>
<td style="text-align:left">Redis</td>
</tr>
<tr>
<td style="text-align:left"><strong>Columnar</strong></td>
<td style="text-align:left">Familias de columnas</td>
<td style="text-align:left">Series de tiempo, escritura masiva</td>
<td style="text-align:left">Cassandra</td>
</tr>
<tr>
<td style="text-align:left"><strong>De grafos</strong></td>
<td style="text-align:left">Nodos y aristas</td>
<td style="text-align:left">Recorrer relaciones profundas: redes, recomendaciones</td>
<td style="text-align:left">Neo4j</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Para un sistema de información administrativo típico —matrícula, planilla, inventario— la respuesta correcta <strong>casi siempre es relacional</strong></li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Combinar es legítimo: PostgreSQL como fuente de verdad y Redis como caché de sesiones es una decisión arquitectónica normal</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="66" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="errores-frecuentes-en-el-dise%C3%B1o-de-datos">Errores frecuentes en el diseño de datos</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%97%91%EF%B8%8F-tabla-bolsa"><img class="emoji" draggable="false" alt="🗑️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5d1.svg" data-marp-twemoji=""/> Tabla bolsa</h3>
<p>Una tabla <code>PARAMETROS</code> con 60 columnas que no se parecen entre sí</p>
</div>
<div>
<h3 id="%F0%9F%94%A2-columnas-numeradas"><img class="emoji" draggable="false" alt="🔢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f522.svg" data-marp-twemoji=""/> Columnas numeradas</h3>
<p><code>producto1</code>, <code>producto2</code>, <code>producto3</code> — falta una tabla hija</p>
</div>
<div>
<h3 id="%F0%9F%A7%B5-todo-texto"><img class="emoji" draggable="false" alt="🧵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f5.svg" data-marp-twemoji=""/> Todo texto</h3>
<p>Fechas y montos guardados como <code>VARCHAR</code>: adiós validaciones y comparaciones</p>
</div>
<div>
<h3 id="%F0%9F%A7%A0-l%C3%B3gica-en-la-base"><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e0.svg" data-marp-twemoji=""/> Lógica en la base</h3>
<p>Reglas de negocio enterradas en <em>triggers</em> que nadie encuentra</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-sin-restricciones"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Sin restricciones</h3>
<p>«Ya lo valida la aplicación» — hasta que otro sistema escribe en la misma tabla</p>
</div>
<div>
<h3 id="%F0%9F%97%93%EF%B8%8F-sin-historia"><img class="emoji" draggable="false" alt="🗓️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5d3.svg" data-marp-twemoji=""/> Sin historia</h3>
<p>Se sobrescribe el dato y se pierde el pasado que la auditoría iba a pedir</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> <em>«Guardamos el total de la factura como columna»</em> → <spoiler>depende: es desnormalización válida si el precio puede cambiar después, porque entonces el total ya no es derivado</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="67" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="actividad-3-dise%C3%B1a-el-modelo-de-datos">Actividad 3: diseña el modelo de datos</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="el-enunciado">El enunciado</h3>
<p>Retome la <strong>biblioteca</strong> de la Actividad 1 y agregue:</p>
<ul>
<li>Un <strong>libro</strong> tiene ISBN, título, año y uno o varios <strong>autores</strong>; un autor escribe varios libros</li>
<li>De un libro hay varios <strong>ejemplares</strong>, cada uno con un número de inventario y un estado</li>
<li>Un <strong>préstamo</strong> relaciona un ejemplar con un usuario, con fecha de salida y fecha pactada de devolución</li>
<li>Un <strong>usuario</strong> puede ser <strong>estudiante</strong> (con carné y carrera) o <strong>docente</strong> (con código y unidad académica); ambos tienen nombre, cédula y correo</li>
<li>Una <strong>multa</strong> se genera cuando el préstamo se devuelve tarde</li>
</ul>
</div>
<div>
<h3 id="qu%C3%A9-entregar-2">Qué entregar</h3>
<ol>
<li>El <strong>modelo lógico</strong>: tablas, columnas, PK y FK</li>
<li>La estrategia escogida para la <strong>herencia</strong> usuario / estudiante / docente, con su justificación</li>
<li>Verificación de <strong>3FN</strong> en cada tabla</li>
<li>Dos <strong>índices</strong> propuestos, con la consulta que cada uno acelera</li>
<li>Qué pasa al <strong>borrar</strong> un libro que tiene ejemplares prestados</li>
</ol>
<h3 id="preguntas-de-control-2">Preguntas de control</h3>
<ul>
<li>¿<code>Autor</code> es tabla o columna?</li>
<li>¿La multa es tabla propia o un atributo del préstamo?</li>
<li>¿El estado del ejemplar es dato o se deduce de los préstamos?</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 30 minutos · en grupos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="68" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="actividad-3-una-soluci%C3%B3n-posible">Actividad 3: una solución posible</h2>
<hidden label="Solución">
<split-slide style="--left: 52%; --right: 48%;">
<div>
<h3 id="tablas">Tablas</h3>
<ul>
<li><code>AUTOR</code> (<strong>id_autor</strong>, nombre)</li>
<li><code>LIBRO</code> (<strong>isbn</strong>, titulo, anio)</li>
<li><code>LIBRO_AUTOR</code> (<strong>isbn</strong>, <strong>id_autor</strong>) — resuelve el muchos a muchos</li>
<li><code>EJEMPLAR</code> (<strong>num_inventario</strong>, <em>isbn</em>, estado)</li>
<li><code>USUARIO</code> (<strong>id_usuario</strong>, cedula <code>UNIQUE</code>, nombre, correo, tipo)</li>
<li><code>ESTUDIANTE</code> (<strong>id_usuario</strong>, carne, cod_carrera)</li>
<li><code>DOCENTE</code> (<strong>id_usuario</strong>, codigo, unidad)</li>
<li><code>PRESTAMO</code> (<strong>id_prestamo</strong>, <em>num_inventario</em>, <em>id_usuario</em>, fecha_salida, fecha_pactada, fecha_real)</li>
<li><code>MULTA</code> (<strong>id_multa</strong>, <em>id_prestamo</em>, monto, pagada)</li>
</ul>
</div>
<div>
<h3 id="decisiones">Decisiones</h3>
<ul>
<li><strong>Herencia</strong>: una tabla por clase (<em>joined</em>). Estudiante y docente tienen atributos obligatorios distintos; con tabla única quedarían cuatro columnas siempre nulas</li>
<li><strong>3FN</strong>: <code>nombre_carrera</code> <strong>no</strong> se guarda en <code>ESTUDIANTE</code>; se llega por <code>cod_carrera</code></li>
<li><strong>Multa como tabla</strong>: tiene ciclo de vida propio (se genera, se paga) y podría haber más de una</li>
<li><strong>Estado del ejemplar</strong>: es <strong>dato</strong>, no derivado — un ejemplar puede estar extraviado o en reparación sin préstamo de por medio</li>
<li><strong>Índices</strong>: <code>PRESTAMO(id_usuario, fecha_real)</code> para <em>«¿tiene préstamos activos?»</em>; <code>EJEMPLAR(isbn)</code> para listar ejemplares de un libro</li>
<li><strong>Borrado</strong>: <code>RESTRICT</code>. Un libro con historial <strong>no se borra</strong>: se marca inactivo</li>
</ul>
</div>
</split-slide>
</hidden>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-marpit-scope-WBmgoMld="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="69" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="87">

<li>Antipatrones</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="70" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="%C2%BFqu%C3%A9-es-un-patr%C3%B3n">¿Qué es un patrón?</h2>
<steps>
<step>
<h3 id="la-definici%C3%B3n-original">La definición original</h3>
<blockquote>
<p>«Cada patrón describe un <strong>problema que ocurre una y otra vez</strong> en nuestro entorno, y describe el <strong>núcleo de la solución</strong> a ese problema, de tal modo que se puede usar un millón de veces sin hacerlo dos veces igual»<br />
— <em>Christopher Alexander, arquitecto, 1977</em></p>
</blockquote>
<ul>
<li>No es una biblioteca ni un componente que se copia: es una <strong>solución con nombre</strong> a un problema recurrente</li>
<li>Su mayor aporte no es el código: es el <strong>vocabulario</strong>. Decir <em>«aquí va un Observer»</em> ahorra veinte minutos de explicación</li>
</ul>
</step>
<step>
<h3 id="c%C3%B3mo-se-lee-un-patr%C3%B3n">Cómo se lee un patrón</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Sección</th>
<th style="text-align:left">Qué responde</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Nombre</strong></td>
<td style="text-align:left">Cómo se llama en la conversación del equipo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Problema / intención</strong></td>
<td style="text-align:left">Qué situación resuelve</td>
</tr>
<tr>
<td style="text-align:left"><strong>Solución</strong></td>
<td style="text-align:left">Qué clases participan y cómo colaboran</td>
</tr>
<tr>
<td style="text-align:left"><strong>Aplicabilidad</strong></td>
<td style="text-align:left">Cuándo usarlo — y cuándo no</td>
</tr>
<tr>
<td style="text-align:left"><strong>Consecuencias</strong></td>
<td style="text-align:left">Qué se gana y <strong>qué se paga</strong></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> La sección que la gente se salta es <strong>consecuencias</strong>. Todo patrón cuesta algo: casi siempre una indirección más</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="71" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="los-tres-niveles">Los tres niveles</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Nivel</th>
<th style="text-align:left">Alcance</th>
<th style="text-align:left">Ejemplos</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Patrones arquitectónicos</strong></td>
<td style="text-align:left">Todo el sistema</td>
<td style="text-align:left">Capas, MVC, puertos y adaptadores, microservicios, publicación-suscripción</td>
</tr>
<tr>
<td style="text-align:left"><strong>Patrones de diseño</strong></td>
<td style="text-align:left">Un puñado de clases</td>
<td style="text-align:left">Los 23 del GoF, GRASP, patrones de empresa (Repositorio, Unidad de trabajo)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Idiomas</strong> (<em>idioms</em>)</td>
<td style="text-align:left">Un lenguaje concreto</td>
<td style="text-align:left"><em>List comprehension</em> en Python, <code>try-with-resources</code> en Java, <em>destructuring</em> en JavaScript</td>
</tr>
</tbody>
</table>
<div class="grid">
<div>
<h3 id="%F0%9F%8F%9B%EF%B8%8F-se-escogen-temprano"><img class="emoji" draggable="false" alt="🏛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3db.svg" data-marp-twemoji=""/> Se escogen temprano</h3>
<p>Los arquitectónicos: cambiarlos después es reescribir</p>
</div>
<div>
<h3 id="%F0%9F%94%A7-se-aplican-al-vuelo"><img class="emoji" draggable="false" alt="🔧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f527.svg" data-marp-twemoji=""/> Se aplican al vuelo</h3>
<p>Los de diseño: aparecen al refactorizar, no antes</p>
</div>
<div>
<h3 id="%E2%8C%A8%EF%B8%8F-se-aprenden-con-el-lenguaje"><img class="emoji" draggable="false" alt="⌨️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2328.svg" data-marp-twemoji=""/> Se aprenden con el lenguaje</h3>
<p>Los idiomas: son parte de escribir bien en esa tecnología</p>
</div>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="72" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="grasp-%C2%BFa-qui%C3%A9n-le-toca">GRASP: ¿a quién le toca?</h2>
<steps>
<step>
<h3 id="los-primeros-cinco">Los primeros cinco</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Patrón</th>
<th style="text-align:left">La pregunta que responde</th>
<th style="text-align:left">La respuesta</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Experto en información</strong></td>
<td style="text-align:left">¿Quién debe tener esta responsabilidad?</td>
<td style="text-align:left">Quien tenga <strong>la información</strong> para cumplirla</td>
</tr>
<tr>
<td style="text-align:left"><strong>Creador</strong></td>
<td style="text-align:left">¿Quién crea el objeto <code>A</code>?</td>
<td style="text-align:left">Quien lo <strong>contiene</strong>, lo <strong>agrega</strong> o tiene sus datos</td>
</tr>
<tr>
<td style="text-align:left"><strong>Controlador</strong></td>
<td style="text-align:left">¿Quién recibe el evento del sistema?</td>
<td style="text-align:left">Una clase <strong>control</strong> del caso de uso, no la interfaz</td>
</tr>
<tr>
<td style="text-align:left"><strong>Bajo acoplamiento</strong></td>
<td style="text-align:left">¿Cuál de dos diseños es mejor?</td>
<td style="text-align:left">El que genere <strong>menos dependencias</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Alta cohesión</strong></td>
<td style="text-align:left">¿Está bien repartido?</td>
<td style="text-align:left">Sí, si cada clase tiene <strong>responsabilidades relacionadas</strong></td>
</tr>
</tbody>
</table>
</step>
<step>
<h3 id="los-otros-cuatro">Los otros cuatro</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Patrón</th>
<th style="text-align:left">La pregunta</th>
<th style="text-align:left">La respuesta</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Polimorfismo</strong></td>
<td style="text-align:left">¿Cómo manejo comportamientos que varían por tipo?</td>
<td style="text-align:left">Con <strong>operaciones polimórficas</strong>, no con <code>if</code> encadenados</td>
</tr>
<tr>
<td style="text-align:left"><strong>Fabricación pura</strong></td>
<td style="text-align:left">¿Y si ninguna clase del dominio debe cargar esto?</td>
<td style="text-align:left">Invente una clase de <strong>servicio</strong> sin equivalente en el negocio</td>
</tr>
<tr>
<td style="text-align:left"><strong>Indirección</strong></td>
<td style="text-align:left">¿Cómo desacoplo A de B?</td>
<td style="text-align:left">Meta <strong>un intermediario</strong> entre los dos</td>
</tr>
<tr>
<td style="text-align:left"><strong>Variaciones protegidas</strong></td>
<td style="text-align:left">¿Cómo aíslo lo que va a cambiar?</td>
<td style="text-align:left">Envuélvalo en una <strong>interfaz estable</strong></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> GRASP es anterior a escoger patrones GoF: primero se decide <strong>quién es responsable</strong>, después qué patrón implementa esa decisión</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="73" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">
<h2 id="experto-en-informaci%C3%B3n-en-concreto">Experto en información, en concreto</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%E2%9D%8C-sin-el-patr%C3%B3n"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Sin el patrón</h3>
<pre><code class="language-java"><span class="hljs-comment">// en GestorPrestamo</span>
<span class="hljs-type">double</span> <span class="hljs-variable">total</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>;
<span class="hljs-keyword">for</span> (Linea l : factura.getLineas()) {
  total += l.getCantidad()
         * l.getProducto().getPrecio();
}
factura.setTotal(total);
</code></pre>
<ul>
<li>El gestor tuvo que <strong>abrir tres objetos</strong> para hacer una cuenta</li>
<li>Si cambia la estructura de <code>Linea</code>, cambia el gestor</li>
<li>Ese cálculo se va a repetir en otros cinco lugares</li>
</ul>
</div>
<div>
<h3 id="%E2%9C%85-con-el-patr%C3%B3n"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Con el patrón</h3>
<pre><code class="language-java"><span class="hljs-comment">// en Factura</span>
<span class="hljs-keyword">public</span> <span class="hljs-type">Monto</span> <span class="hljs-title function_">total</span><span class="hljs-params">()</span> {
  <span class="hljs-keyword">return</span> lineas.stream()
      .map(Linea::subtotal)
      .reduce(Monto.CERO, Monto::mas);
}

<span class="hljs-comment">// en Linea</span>
<span class="hljs-keyword">public</span> <span class="hljs-type">Monto</span> <span class="hljs-title function_">subtotal</span><span class="hljs-params">()</span> {
  <span class="hljs-keyword">return</span> producto.precio()
                 .por(cantidad);
}
</code></pre>
<ul>
<li>Cada quien calcula <strong>con la información que tiene</strong></li>
<li>El gestor solo pide: <code>factura.total()</code></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> La regla es corta: <strong>no pregunte por los datos para hacer algo con ellos; pídale al dueño que lo haga</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="74" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="87">

</tr>
<tr>
<td style="text-align:left"></td>
<td style="text-align:left"></td>

</tr>
<tr>

<td style="text-align:left"></td>

</table>
<ul>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>Creacionales</strong>: cómo se crean los objetos · <strong>Estructurales</strong>: cómo se componen · <strong>De comportamiento</strong>: cómo colaboran</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> No hay que memorizar los 23. Con dominar seis se cubre la enorme mayoría de los casos reales</li>
